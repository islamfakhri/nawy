<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#18181b">
    <title>ناوي | ناوي على إيه النهاردة؟</title>
    
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./icon-192.png">
    <link rel="apple-touch-icon" href="./icon-192.png">

    <style>
        :root {
            --bg-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1000&auto=format&fit=crop');
            --card-bg: rgba(30, 30, 30, 0.85);
            --input-bg: #222225;
            --text-main: #ffffff;
            --text-sub: #a1a1aa;
            --accent: #10b981;
            --star-color: #fbbf24;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #121214 var(--bg-image) no-repeat center center fixed;
            background-size: cover;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Dark Overlay for Ultra-Clean Contrast */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            z-index: 0;
        }

        .app-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            padding: 20px 16px 0 16px;
        }

        /* Header Style */
        header {
            margin-top: 15px;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        header .date-subtitle {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.75);
            margin-top: 4px;
            font-weight: 400;
        }

        /* Tasks List Area */
        .tasks-container {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 120px;
            scrollbar-width: none;
        }

        .tasks-container::-webkit-scrollbar {
            display: none;
        }

        .task-card {
            background: rgba(30, 30, 35, 0.9);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: flex-start;
            gap: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.15s ease, background 0.2s;
        }

        .task-card:active {
            transform: scale(0.99);
        }

        .check-circle {
            width: 22px;
            height: 22px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            cursor: pointer;
            flex-shrink: 0;
            margin-top: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .task-card.completed .check-circle {
            background: #10b981;
            border-color: #10b981;
        }

        .check-circle::after {
            content: '✓';
            color: white;
            font-size: 13px;
            display: none;
            font-weight: bold;
        }

        .task-card.completed .check-circle::after {
            display: block;
        }

        .task-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .task-title {
            font-size: 1rem;
            line-height: 1.4;
            white-space: pre-wrap;
            word-break: break-word;
            color: #ffffff;
        }

        .task-card.completed .task-title {
            text-decoration: line-through;
            color: rgba(255, 255, 255, 0.4);
        }

        .task-meta {
            font-size: 0.78rem;
            color: var(--text-sub);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .star-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.3);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 2px;
            transition: color 0.2s, transform 0.1s;
        }

        .star-btn.starred {
            color: var(--star-color);
        }

        .btn-delete {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            font-size: 1rem;
            padding: 2px 4px;
        }

        .btn-delete:hover {
            color: #ef4444;
        }

        /* Bottom Fixed Input Section */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 600px;
            background: #1c1c1e;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            padding: 12px 16px;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.5);
            z-index: 10;
            border-top: 1px solid var(--border-color);
        }

        .input-row {
            display: flex;
            align-items: flex-end;
            gap: 12px;
        }

        .add-icon {
            font-size: 1.4rem;
            color: rgba(255, 255, 255, 0.5);
            padding-bottom: 6px;
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            resize: none;
            min-height: 24px;
            max-height: 100px;
            line-height: 1.4;
        }

        textarea::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .btn-submit {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1rem;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .btn-submit.active {
            background: var(--accent);
        }

        /* Quick Action Toolbar inside Input */
        .toolbar {
            display: flex;
            gap: 15px;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tool-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .tool-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>ناوي على إيه النهاردة؟ 🎯</h1>
            <div class="date-subtitle" id="currentDate">--</div>
        </header>

        <div class="tasks-container" id="tasksContainer">
            <!-- Dynamic Tasks Here -->
        </div>

        <div class="bottom-bar">
            <div class="input-row">
                <span class="add-icon">◯</span>
                <textarea id="taskInput" rows="1" placeholder="اكتب اللي ناوي عليه..."></textarea>
                <button class="btn-submit" id="submitBtn" onclick="addTask()">⬆</button>
            </div>
            <div class="toolbar">
                <button class="tool-btn" onclick="setTodayDate()">📅 النهاردة</button>
                <button class="tool-btn" onclick="alert('خاصية التذكير جاية قريباً 🔔')">🔔 فكرني</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. التاريخ العربي ---
        const dateOptions = { weekday: 'long', month: 'long', day: 'numeric' };
        const todayStr = new Date().toLocaleDateString('ar-EG', dateOptions);
        document.getElementById('currentDate').textContent = todayStr;

        // --- 2. إدارة المهمات ---
        let tasks = JSON.parse(localStorage.getItem('nawy_tasks_v3')) || [];
        const taskInput = document.getElementById('taskInput');
        const submitBtn = document.getElementById('submitBtn');

        // التعديل التلقائي لارتفاع النص عند الكتابة
        taskInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            if(this.value.trim().length > 0) {
                submitBtn.classList.add('active');
            } else {
                submitBtn.classList.remove('active');
            }
        });

        document.addEventListener('DOMContentLoaded', renderTasks);

        function addTask() {
            const text = taskInput.value.trim();
            if (!text) return;

            tasks.unshift({
                id: Date.now(),
                text: text,
                completed: false,
                starred: false,
                tag: 'ناوي'
            });

            saveAndRender();
            taskInput.value = '';
            taskInput.style.height = 'auto';
            submitBtn.classList.remove('active');
        }

        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveAndRender();
            }
        }

        function toggleStar(id, event) {
            event.stopPropagation();
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.starred = !task.starred;
                tasks.sort((a, b) => b.starred - a.starred);
                saveAndRender();
            }
        }

        function deleteTask(id, event) {
            event.stopPropagation();
            tasks = tasks.filter(t => t.id !== id);
            saveAndRender();
        }

        function setTodayDate() {
            taskInput.focus();
        }

        function saveAndRender() {
            localStorage.setItem('nawy_tasks_v3', JSON.stringify(tasks));
            renderTasks();
        }

        function renderTasks() {
            const container = document.getElementById('tasksContainer');

            if (tasks.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; color: rgba(255,255,255,0.4); margin-top: 80px; font-size: 0.95rem;">
                        مفيش نوايا لسه.. ✨<br>ابدأ ودوّن أول نية من تحت!
                    </div>
                `;
                return;
            }

            container.innerHTML = tasks.map(task => `
                <div class="task-card ${task.completed ? 'completed' : ''}" onclick="toggleTask(${task.id})">
                    <div class="check-circle"></div>
                    <div class="task-content">
                        <div class="task-title">${escapeHtml(task.text)}</div>
                        <div class="task-meta">
                            <span>ناوي</span>
                        </div>
                    </div>
                    <button class="star-btn ${task.starred ? 'starred' : ''}" onclick="toggleStar(${task.id}, event)">
                        ${task.starred ? '★' : '☆'}
                    </button>
                    <button class="btn-delete" onclick="deleteTask(${task.id}, event)">✕</button>
                </div>
            `).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').then(reg => {
                reg.addEventListener('updatefound', () => {
                    const newWorker = reg.installing;
                    newWorker.addEventListener('statechange', () => {
                        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                            window.location.reload();
                        }
                    });
                });
            });
        }
    </script>
</body>
</html>
