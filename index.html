  <style>
    :root {

    html[data-font="small"] { --fs-xs: 10px; --fs-sm: 12px; --fs-md: 13px; --fs-base: 14px; --fs-lg: 15px; --fs-hero: 19px; }
    html[data-font="medium"], html:not([data-font]) { --fs-xs: 11px; --fs-sm: 13px; --fs-md: 14px; --fs-base: 16px; --fs-lg: 18px; --fs-hero: 22px; }

    html[data-theme="dark"] {

      --text: #eef1f1; --muted: #8b9494; --border: rgba(255,255,255,.05); --border-strong: rgba(255,255,255,.08);

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {

    .app {

    .header-tab { position: relative; z-index: 2; min-height: 52px; flex: 1 1 0; padding: 0 var(--sp-sm) 6px; border-radius: 0; display: inline-flex; align-items: center; justify-content: center; gap: 5px; background: transparent; color: var(--muted); white-space: nowrap; font-size: var(--fs-base); font-weight: var(--fw-semibold); transition: color .18s ease, transform .12s ease; }
    .header-tab:active { transform: scale(.97); }
    .header-tab.active { background: transparent; color: var(--accent); box-shadow: none; }
    .header-tab-star { font-size: 20px; line-height: 1; transform: translateY(-1px); }
    .header-tab-indicator { position: absolute; z-index: 3; left: var(--tab-indicator-left); bottom: 0; width: var(--tab-indicator-width); height: 3px; border-radius: var(--radius-full); background: var(--accent); pointer-events: none; transition: left .28s cubic-bezier(.22,.75,.25,1), width .28s cubic-bezier(.22,.75,.25,1); }

    .content { margin-top: var(--sp-md); touch-action: pan-y; overscroll-behavior-x: contain; will-change: transform, opacity; }

    /* ============ Premium Cards ============ */

      flex-direction: column;
      overflow: visible;
      border-radius: 0;
      background: transparent;
      border: 0;

    }

    .task { position: relative; display: flex; align-items: center; gap: var(--sp-md); min-height: 52px; padding: var(--sp-xs) 0; background: transparent; border: 0; border-bottom: 1px solid var(--border); border-radius: 0; box-shadow: none; transition: background .15s ease, opacity .18s ease; cursor: pointer; touch-action: pan-y; }
    .task:last-child { border-bottom: 0; }
    .task.just-completed { animation: completeRow .5s ease; }
    @keyframes completeRow { 0% { background: transparent; } 42% { background: var(--accent-soft); } 100% { background: transparent; } }
    .task.completed { opacity: .55; }

    .task.drag-source {

    .drag-ghost {

    html.nawy-drag-active,

      overscroll-behavior: none;
      touch-action: none;
    }

    .task-checkbox { width: var(--touch-checkbox); height: var(--touch-checkbox); flex: 0 0 auto; display: grid; place-items: center; border-radius: var(--radius-full); border: 1.5px solid var(--muted); background: transparent; transition: background .18s ease, border-color .18s ease, transform .14s ease; }
    .task-checkbox:active { transform: scale(.9); }
    .task.completed .task-checkbox { background: var(--accent); border-color: var(--accent); }
    .check-icon { width: 12px; height: 12px; opacity: 0; transform: scale(.5); transition: opacity .16s ease, transform .16s ease; }
    .task.completed .check-icon { opacity: 1; transform: scale(1); }

    .task-main { min-width: 0; flex: 1; padding: var(--sp-xs) 0; cursor: pointer; }
    .task-text { margin: 0; color: var(--text); font-size: var(--fs-base); line-height: 1.5; font-weight: var(--fw-medium); overflow-wrap: anywhere; }
    .task.completed .task-text { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1.2px; }
    .task-meta { margin-top: 3px; display: flex; align-items: center; gap: 6px; }
    .task-meta-day { color: var(--muted); font-size: var(--fs-xs); font-weight: var(--fw-medium); }

    .task-star { width: var(--touch-star); height: var(--touch-star); flex: 0 0 auto; display: grid; place-items: center; border-radius: var(--radius-full); background: transparent; color: #b8bdbd; font-size: 24px; transition: color .16s ease, background .16s ease, transform .14s ease; }
    .task-star:active { transform: scale(.9); }
    .task-star.active { color: var(--warning); background: transparent; }

    .completed-section {
      margin-top: var(--sp-md);
      background: color-mix(in srgb, var(--surface) 60%, transparent);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .completed-toggle {

      align-items: center;
      justify-content: flex-start;
      gap: var(--sp-sm);
      background: transparent;
      border-bottom: 1px solid var(--border);
      transition: background .15s ease;
    }
    .completed-toggle:active {
      background: var(--surface-2);
    }
    .completed-toggle-title {
      color: var(--text);
      font-size: var(--fs-sm);
      font-weight: var(--fw-bold);
    }

      height: 22px;

    .task-empty { padding: 36px var(--sp-xl); text-align: center; border-radius: var(--radius-lg); background: transparent; border: 1px solid var(--border); color: var(--muted); }
    .empty-symbol { width: 44px; height: 44px; margin: 0 auto var(--sp-md); display: grid; place-items: center; border-radius: var(--radius-md); background: var(--accent-soft); color: var(--accent); font-size: 18px; font-weight: var(--fw-extrabold); }
    .empty-title { color: var(--text); font-size: var(--fs-md); font-weight: var(--fw-bold); }
    .empty-text { margin-top: var(--sp-xs); color: var(--muted); font-size: var(--fs-sm); line-height: 1.7; }

    /* ============ FAB & BOTTOM SHEET ============ */
    .composer-wrap { position: fixed; z-index: 30; left: 50%; bottom: 0; width: min(760px, 100%); transform: translateX(-50%); padding: 0 var(--sp-lg) calc(var(--sp-md) + env(safe-area-inset-bottom)); pointer-events: none; display: flex; justify-content: flex-end; align-items: flex-end; }
    .composer-fab { pointer-events: auto; width: var(--fab-size); height: var(--fab-size); border-radius: var(--radius-full); background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 300; line-height: 1; padding: 0; margin: 0; box-shadow: 0 4px 16px rgba(0,0,0,.18); transition: transform .15s ease, box-shadow .15s ease; }
    .composer-fab:active { transform: scale(.93); box-shadow: 0 2px 8px rgba(0,0,0,.12); }
    .composer-fab.hidden { display: none; }

    .composer-panel { pointer-events: auto; position: fixed; z-index: 31; left: 50%; bottom: 0; transform: translateX(-50%) translateY(100%); width: min(100%, 760px); background: var(--surface); border-radius: var(--radius-xl) var(--radius-xl) 0 0; box-shadow: var(--shadow-sheet); display: flex; flex-direction: column; border: 1px solid var(--border); transition: transform .28s cubic-bezier(.2,.8,.2,1); padding: var(--sp-lg) var(--sp-lg) calc(var(--sp-md) + env(safe-area-inset-bottom)); }
    .composer-panel.open { transform: translateX(-50%) translateY(0); }
    .composer-input-row { display: flex; align-items: center; gap: var(--sp-sm); }
    .composer-input-row textarea, .composer-input-row textarea:focus, .composer-input-row textarea:focus-visible { flex: 1; min-height: 52px; max-height: 110px; resize: none; overflow-y: auto; padding: var(--sp-md); border: none; outline: none; box-shadow: none; background: transparent; color: var(--text); font-size: var(--fs-base); line-height: 1.5; -webkit-appearance: none; appearance: none; }
    .composer-input-row textarea::placeholder { color: var(--muted); opacity: .6; }
    .composer-input-row .send-btn { width: 46px; height: 46px; flex: 0 0 auto; border-radius: var(--radius-full); background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 20px; font-weight: var(--fw-bold); transition: transform .14s ease, opacity .18s ease; }
    .composer-input-row .send-btn:active { transform: scale(.93); }
    .composer-input-row .send-btn.disabled { opacity: .4; }

    /* ============ OVERLAYS & SHEETS ============ */
    .overlay { position: fixed; inset: 0; z-index: 100; display: flex; align-items: flex-end; justify-content: center; padding: var(--sp-lg); background: rgba(0,0,0,.40); opacity: 0; visibility: hidden; transition: opacity .20s ease, visibility .20s ease; touch-action: auto; }
    .overlay.show { opacity: 1; visibility: visible; }
    .sheet { width: min(100%, 520px); max-height: min(82vh, 680px); overflow-y: auto; padding: var(--sp-lg); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl); box-shadow: var(--shadow-sheet); transform: translateY(18px); transition: transform .24s cubic-bezier(.2,.8,.2,1); position: relative; }
    .overlay.show .sheet { transform: translateY(0); }

    .sheet-close-btn { position: absolute; top: 10px; left: 10px; width: 40px; height: 40px; border-radius: var(--radius-full); background: var(--surface-2); display: grid; place-items: center; color: var(--muted); transition: background .15s ease, color .15s ease, transform .1s ease; cursor: pointer; z-index: 2; }
    .sheet-close-btn:active { transform: scale(.92); background: var(--surface-3); color: var(--text); }
    .sheet-close-btn svg { display: block; }
    .sheet-title { padding: 4px 4px 12px; font-size: var(--fs-lg); font-weight: var(--fw-bold); }
    .sheet-subtitle { padding: 0 4px 12px; color: var(--muted); font-size: var(--fs-sm); line-height: 1.6; }

    .menu-item { width: 100%; min-height: 52px; padding: 0 var(--sp-md); display: flex; align-items: center; gap: var(--sp-md); border-radius: var(--radius-md); background: transparent; text-align: start; transition: background .15s ease; }
    .menu-item:hover, .menu-item:active { background: var(--surface-2); }
    .menu-icon { width: 36px; height: 36px; flex: 0 0 auto; border-radius: var(--radius-sm); display: grid; place-items: center; background: var(--surface-2); color: var(--muted); }
    .menu-icon svg { display: block; }
    .menu-text { flex: 1; font-size: var(--fs-base); font-weight: var(--fw-medium); }

    .action-task-preview { width: 100%; margin: 4px 4px 8px; padding: var(--sp-md); border-radius: var(--radius-md); background: var(--surface-2); font-size: var(--fs-md); line-height: 1.6; display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp-sm); text-align: start; transition: background .15s ease; cursor: pointer; }

    .action-task-edit-input { width: 100%; min-height: 60px; padding: 0; border: 0; background: transparent; color: var(--text); resize: none; font-size: var(--fs-md); line-height: 1.6; font-family: inherit; }
    .action-item { width: 100%; min-height: 52px; padding: 0 var(--sp-md); display: flex; align-items: center; gap: var(--sp-md); border-radius: var(--radius-md); background: transparent; text-align: start; font-size: var(--fs-base); transition: background .15s ease; }
    .action-item:hover { background: var(--surface-2); }
    .action-item.danger { color: var(--danger); }
    .action-item .action-icon { width: 32px; height: 32px; flex: 0 0 auto; display: grid; place-items: center; color: var(--muted); }
    .action-item .action-icon svg { display: block; }

    function initSortable() {
