<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#0d0d0d">
  <meta name="color-scheme" content="dark light">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <meta name="description"
        content="ناوي — مكان بسيط لكل اللي ناوي تعمله.">

  <title>ناوي</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./favicon.ico">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <!-- Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-3612TKY0RT"></script>
  <script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
      dataLayer.push(arguments);
    }

    gtag("js", new Date());

    gtag("config", "G-3612TKY0RT", {
      anonymize_ip: true
    });
  </script>

  <style>
    :root {
      --bg: #f4f5f6;
      --surface: #ffffff;
      --surface-2: #eef0f2;
      --surface-3: #e5e8ea;

      --text: #111415;
      --muted: #7b8287;

      --border: rgba(17, 20, 21, .075);
      --border-strong: rgba(17, 20, 21, .11);

      --accent: #19a974;
      --accent-soft: rgba(25, 169, 116, .11);

      --danger: #e5484d;
      --warning: #e8a317;

      --shadow-soft:
        0 7px 22px rgba(0, 0, 0, .035);

      --shadow-card:
        0 8px 24px rgba(0, 0, 0, .055);

      --shadow-sheet:
        0 25px 70px rgba(0, 0, 0, .22);

      --radius-xl: 23px;
      --radius-lg: 18px;
      --radius-md: 14px;
      --radius-sm: 11px;

      --header-height: 116px;
      --bottom-space: 120px;

      --focus-ring: 0 0 0 3px color-mix(in srgb, var(--accent) 45%, transparent);
    }

    html[data-theme="dark"] {
      --bg: #0d0d0d;
      --surface: #181a1a;
      --surface-2: #202222;
      --surface-3: #292c2c;

      --text: #f4f5f5;
      --muted: #939999;

      --border: rgba(255, 255, 255, .065);
      --border-strong: rgba(255, 255, 255, .10);

      --shadow-soft:
        0 8px 24px rgba(0, 0, 0, .17);

      --shadow-card:
        0 10px 28px rgba(0, 0, 0, .24);

      --shadow-sheet:
        0 28px 80px rgba(0, 0, 0, .36);
    }

    html[data-accent="blue"] {
      --accent: #3685ff;
      --accent-soft: rgba(54, 133, 255, .11);
    }

    html[data-accent="purple"] {
      --accent: #8b5cf6;
      --accent-soft: rgba(139, 92, 246, .11);
    }

    html[data-accent="orange"] {
      --accent: #f59e0b;
      --accent-soft: rgba(245, 158, 11, .12);
    }

    html[data-accent="pink"] {
      --accent: #e94f9b;
      --accent-soft: rgba(233, 79, 155, .11);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      min-height: 100%;
      background: var(--bg);
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background: var(--bg);
      color: var(--text);

      font-family:
        "Cairo",
        "Segoe UI",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        Tahoma,
        Arial,
        sans-serif;

      transition:
        background .25s ease,
        color .25s ease;

      overscroll-behavior-y: none;
    }

    html[lang="en"] body {
      font-family:
        "Segoe UI",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        Arial,
        sans-serif;
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      color: inherit;
    }

    textarea,
    input {
      outline: none;
    }

    ::selection {
      background: var(--accent);
      color: #fff;
    }

    /* Focus visibility for keyboard users */
    a:focus-visible,
    button:focus-visible,
    textarea:focus-visible,
    input:focus-visible,
    [tabindex]:focus-visible {
      outline: none;
      box-shadow: var(--focus-ring);
      border-radius: 10px;
    }

    /* =========================
       APP
    ========================= */

    .app {
      width: min(100%, 760px);
      min-height: 100vh;

      margin: 0 auto;

      padding:
        env(safe-area-inset-top)
        16px
        calc(var(--bottom-space) + env(safe-area-inset-bottom))
        16px;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      min-height: var(--header-height);

      position: sticky;
      top: 0;
      z-index: 20;

      padding-top: 8px;

      background:
        linear-gradient(
          to bottom,
          var(--bg) 75%,
          rgba(0,0,0,0)
        );

      display: flex;
      flex-direction: column;
    }

    .header-main {
      min-height: 52px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;

      min-width: 0;
    }

    .brand-mark {
      width: 40px;
      height: 40px;

      flex: 0 0 auto;

      border-radius: 13px;

      display: grid;
      place-items: center;

      overflow: hidden;

      background: var(--accent);
      color: #fff;

      font-size: 22px;
      font-weight: 800;

      box-shadow:
        0 6px 16px color-mix(
          in srgb,
          var(--accent) 19%,
          transparent
        );
    }

    .brand-mark-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .brand-mark-fallback {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
    }

    .brand-name {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -.5px;
    }

    .menu-btn {
      width: 42px;
      height: 42px;

      flex: 0 0 auto;

      border-radius: 50%;

      background: var(--surface);

      border:
        1px solid var(--border);

      display: grid;
      place-items: center;

      font-size: 23px;
      line-height: 1;

      transition:
        transform .14s ease,
        background .18s ease;
    }

    .menu-btn:active {
      transform: scale(.92);
    }

    /* =========================
       PRIMARY NAV
       RTL visual order:
       نواياي | اليوم | ★
    ========================= */

    .header-nav {
      width: 100%;

      margin-top: 8px;

      padding: 3px;

      display: flex;
      align-items: center;

      gap: 3px;

      border-radius: 15px;

      background:
        color-mix(
          in srgb,
          var(--surface) 82%,
          transparent
        );

      border:
        1px solid var(--border);

      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .header-tab {
      min-height: 40px;

      flex: 1 1 0;

      padding: 0 12px;

      border-radius: 11px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      gap: 5px;

      background: transparent;

      color: var(--muted);

      white-space: nowrap;

      font-size: 12.5px;
      font-weight: 700;

      transition:
        background .18s ease,
        color .18s ease,
        transform .12s ease;
    }

    .header-tab:active {
      transform: scale(.97);
    }

    .header-tab.active {
      background: var(--accent);
      color: #fff;

      box-shadow:
        0 5px 14px color-mix(
          in srgb,
          var(--accent) 18%,
          transparent
        );
    }

    .header-tab-star {
      font-size: 19px;
      line-height: 1;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      padding:
        20px 4px 10px;
    }

    .hero-title {
      margin: 0;

      font-size:
        clamp(27px, 7vw, 38px);

      line-height: 1.18;

      letter-spacing: -.8px;

      font-weight: 800;
    }

    .hero-date {
      margin-top: 6px;

      color: var(--muted);

      font-size: 13px;
      font-weight: 500;
    }

    /* =========================
       PROGRESS
    ========================= */

    .progress-wrap {
      margin-top: 20px;

      padding:
        13px 14px;

      border-radius: 15px;

      background:
        color-mix(
          in srgb,
          var(--surface) 82%,
          transparent
        );

      border:
        1px solid var(--border);

      transition:
        opacity .2s ease,
        transform .2s ease;
    }

    .progress-top {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      margin-bottom: 8px;
    }

    .progress-label {
      color: var(--muted);

      font-size: 12px;

      font-weight: 600;
    }

    .progress-value {
      color: var(--accent);

      font-size: 12px;

      font-weight: 800;
    }

    .progress-track {
      height: 6px;

      overflow: hidden;

      border-radius: 999px;

      background: var(--surface-3);
    }

    .progress-bar {
      width: 0;

      height: 100%;

      border-radius: inherit;

      background: var(--accent);

      transition:
        width .45s cubic-bezier(.2,.8,.2,1);
    }

    /* =========================
       CONTENT
    ========================= */

    .content {
      margin-top: 16px;

      touch-action: pan-y;

      overscroll-behavior-x: contain;

      will-change:
        transform,
        opacity;
    }

    .content.view-transition-next {
      animation:
        viewSlideNext .24s cubic-bezier(.22,.75,.25,1);
    }

    .content.view-transition-previous {
      animation:
        viewSlidePrevious .24s cubic-bezier(.22,.75,.25,1);
    }

    @keyframes viewSlideNext {
      0% {
        opacity: .68;
        transform:
          translateX(18px);
      }

      100% {
        opacity: 1;
        transform:
          translateX(0);
      }
    }

    @keyframes viewSlidePrevious {
      0% {
        opacity: .68;
        transform:
          translateX(-18px);
      }

      100% {
        opacity: 1;
        transform:
          translateX(0);
      }
    }

    /* =========================
       SECTION
    ========================= */

    .section {
      margin-top: 20px;
    }

    .section:first-child {
      margin-top: 0;
    }

    .section-head {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      padding:
        0 5px;

      margin-bottom: 7px;
    }

    .section-title {
      color: var(--muted);

      font-size: 12px;

      font-weight: 700;
    }

    .section-count {
      min-width: 22px;
      height: 22px;

      padding: 0 6px;

      display: inline-flex;

      align-items: center;

      justify-content: center;

      border-radius: 999px;

      background: var(--surface-2);

      color: var(--muted);

      font-size: 10px;

      font-weight: 800;
    }

    /* =========================
       TASK LIST
       خفيف جدًا
    ========================= */

    .task-list {
      display: flex;

      flex-direction: column;

      gap: 0;

      overflow: hidden;

      border-radius: 16px;

      background:
        var(--surface);

      border:
        1px solid var(--border);
    }

    .task {
      position: relative;

      display: flex;

      align-items: center;

      gap: 10px;

      min-height: 59px;

      padding:
        7px 10px;

      background:
        var(--surface);

      border: 0;

      border-bottom:
        1px solid var(--border);

      border-radius: 0;

      box-shadow: none;

      transition:
        background .16s ease,
        opacity .18s ease;
    }

    .task:last-child {
      border-bottom: 0;
    }

    .task:hover {
      background:
        color-mix(
          in srgb,
          var(--surface-2) 42%,
          var(--surface)
        );
    }

    .task.just-completed {
      animation:
        completeRow .5s ease;
    }

    @keyframes completeRow {
      0% {
        background: var(--surface);
      }

      42% {
        background: var(--accent-soft);
      }

      100% {
        background: var(--surface);
      }
    }

    .task.completed {
      opacity: .62;
    }

    .task-checkbox {
      width: 25px;
      height: 25px;

      flex: 0 0 auto;

      display: grid;
      place-items: center;

      border-radius: 50%;

      border:
        1.8px solid var(--muted);

      background: transparent;

      transition:
        background .18s ease,
        border-color .18s ease,
        transform .14s ease;
    }

    .task-checkbox:active {
      transform: scale(.87);
    }

    .task.completed .task-checkbox {
      background: var(--accent);

      border-color: var(--accent);
    }

    .check-icon {
      width: 12px;
      height: 12px;

      opacity: 0;

      transform: scale(.5);

      transition:
        opacity .16s ease,
        transform .16s ease;
    }

    .task.completed .check-icon {
      opacity: 1;

      transform: scale(1);
    }

    .task-main {
      min-width: 0;

      flex: 1;

      padding:
        2px 0;

      cursor: pointer;
    }

    .task-text {
      margin: 0;

      color: var(--text);

      font-size: 15px;

      line-height: 1.5;

      font-weight: 600;

      overflow-wrap: anywhere;
    }

    .task.completed .task-text {
      color: var(--muted);

      text-decoration:
        line-through;

      text-decoration-thickness:
        1.4px;
    }

    .task-meta {
      margin-top: 3px;

      display: flex;

      align-items: center;

      flex-wrap: wrap;

      gap: 5px;

      color: var(--muted);

      font-size: 10px;
    }

    .task-meta-date {
      display: inline-flex;

      align-items: center;

      gap: 4px;

      padding:
        2px 5px;

      border-radius: 6px;

      background:
        var(--accent-soft);

      color:
        var(--accent);

      font-weight: 700;
    }

    .task-meta-day {
      color: var(--muted);

      font-weight: 500;
    }

    .task-star {
      width: 31px;
      height: 31px;

      flex: 0 0 auto;

      display: grid;
      place-items: center;

      border-radius: 50%;

      background: transparent;

      color: #92989c;

      font-size: 18px;

      transition:
        color .16s ease,
        background .16s ease,
        transform .14s ease;
    }

    .task-star:active {
      transform: scale(.86);
    }

    .task-star.active {
      color: var(--warning);

      background:
        rgba(232,163,23,.08);
    }

    /* =========================
       COMPLETED CARD
       أثقل بصريًا من الـTasks
    ========================= */

    .completed-section {
      margin-top: 14px;

      padding: 7px;

      border-radius:
        var(--radius-lg);

      background:
        var(--surface);

      border:
        1px solid var(--border-strong);

      box-shadow:
        var(--shadow-card);
    }

    .completed-toggle {
      width: 100%;

      min-height: 47px;

      padding:
        0 7px;

      display: flex;

      align-items: center;

      justify-content: flex-start;

      gap: 8px;

      border-radius: 12px;

      background:
        transparent;

      text-align: start;

      transition:
        background .15s ease,
        transform .12s ease;
    }

    .completed-toggle:hover {
      background:
        var(--surface-2);
    }

    .completed-toggle:active {
      transform:
        scale(.995);
    }

    /*
      المطلوب:
      المكتملة  3  ^
      كله جنب بعض.
    */

    .completed-toggle-title {
      color: var(--text);

      font-size: 12.5px;

      font-weight: 800;
    }

    .completed-toggle-count {
      min-width: 23px;
      height: 23px;

      padding: 0 6px;

      display: inline-flex;

      align-items: center;
      justify-content: center;

      border-radius:
        999px;

      background:
        var(--surface-2);

      color:
        var(--muted);

      font-size: 10px;

      font-weight: 800;
    }

    .completed-toggle-chevron {
      width: 27px;
      height: 27px;

      display: grid;

      place-items: center;

      border-radius: 9px;

      background:
        var(--surface-2);

      color:
        var(--muted);

      font-size: 17px;

      font-weight: 900;

      line-height: 1;

      transition:
        transform .20s cubic-bezier(.2,.8,.2,1),
        color .18s ease,
        background .18s ease;
    }

    .completed-toggle.open
    .completed-toggle-chevron {
      transform:
        rotate(180deg);

      color:
        var(--accent);

      background:
        var(--accent-soft);
    }

    .completed-list-wrap {
      overflow: hidden;

      max-height: 0;

      opacity: 0;

      transform:
        translateY(-3px);

      transition:
        max-height .30s cubic-bezier(.2,.8,.2,1),
        opacity .20s ease,
        transform .22s ease,
        margin-top .20s ease;
    }

    .completed-list-wrap.open {
      max-height: 4000px;

      opacity: 1;

      transform:
        translateY(0);

      margin-top: 3px;
    }

    .completed-list-wrap .task-list {
      border-radius: 12px;

      border:
        1px solid var(--border);
    }

    /* =========================
       EMPTY
    ========================= */

    .task-empty {
      padding:
        48px 20px;

      text-align: center;

      border-radius:
        var(--radius-lg);

      background:
        var(--surface);

      border:
        1px solid var(--border);

      color:
        var(--muted);
    }

    .empty-symbol {
      width: 48px;
      height: 48px;

      margin:
        0 auto 12px;

      display: grid;

      place-items: center;

      border-radius: 15px;

      background:
        var(--accent-soft);

      color:
        var(--accent);

      font-size: 21px;

      font-weight: 800;
    }

    .empty-title {
      color: var(--text);

      font-size: 15px;

      font-weight: 750;
    }

    .empty-text {
      margin-top: 4px;

      color: var(--muted);

      font-size: 12px;

      line-height: 1.7;
    }

    /* =========================
       COMPOSER
    ========================= */

    .composer-wrap {
      position: fixed;

      z-index: 30;

      left: 50%;
      bottom: 0;

      width:
        min(760px, 100%);

      transform:
        translateX(-50%);

      padding:
        9px 16px
        calc(11px + env(safe-area-inset-bottom));

      pointer-events: none;
    }

    .composer {
      pointer-events: auto;

      display: flex;

      align-items: flex-end;

      gap: 8px;

      padding:
        7px 7px 7px 9px;

      background:
        color-mix(
          in srgb,
          var(--surface) 94%,
          transparent
        );

      border:
        1px solid var(--border-strong);

      border-radius: 19px;

      box-shadow:
        0 10px 34px rgba(0,0,0,.11);

      backdrop-filter:
        blur(18px);

      -webkit-backdrop-filter:
        blur(18px);
    }

    .composer textarea {
      flex: 1;

      min-width: 0;

      min-height: 44px;
      max-height: 130px;

      resize: none;

      overflow-y: auto;

      padding:
        10px 11px 8px;

      border: 0;

      background:
        transparent;

      color:
        var(--text);

      font-size: 15px;

      line-height: 1.5;

      touch-action: auto;
    }

    .composer textarea::placeholder {
      color:
        var(--muted);

      opacity: .8;
    }

    .send-btn {
      width: 44px;
      height: 44px;

      flex: 0 0 auto;

      border-radius: 50%;

      background:
        var(--accent);

      color:
        #fff;

      display: grid;

      place-items: center;

      font-size: 21px;

      font-weight: 800;

      transition:
        transform .14s ease,
        opacity .18s ease;
    }

    .send-btn:active {
      transform:
        scale(.90);
    }

    .send-btn.disabled {
      opacity: .4;
    }

    /* =========================
       OVERLAY
    ========================= */

    .overlay {
      position: fixed;
      inset: 0;

      z-index: 100;

      display: flex;

      align-items: flex-end;

      justify-content: center;

      padding: 16px;

      background:
        rgba(0,0,0,.42);

      opacity: 0;

      visibility: hidden;

      transition:
        opacity .20s ease,
        visibility .20s ease;
    }

    .overlay.show {
      opacity: 1;

      visibility: visible;
    }

    .sheet {
      width:
        min(100%, 520px);

      max-height:
        min(82vh, 680px);

      overflow-y: auto;

      padding: 9px;

      background:
        var(--surface);

      border:
        1px solid var(--border);

      border-radius: 24px;

      box-shadow:
        var(--shadow-sheet);

      transform:
        translateY(18px);

      transition:
        transform .24s cubic-bezier(.2,.8,.2,1);
    }

    .overlay.show .sheet {
      transform:
        translateY(0);
    }

    .sheet-handle {
      width: 40px;
      height: 4px;

      margin:
        3px auto 11px;

      border-radius: 999px;

      background:
        var(--surface-3);
    }

    .sheet-title {
      padding:
        8px 9px 12px;

      font-size: 17px;

      font-weight: 800;
    }

    .sheet-subtitle {
      padding:
        0 9px 12px;

      color:
        var(--muted);

      font-size: 12px;

      line-height: 1.6;
    }

    /* =========================
       MENU
    ========================= */

    .menu-item {
      width: 100%;

      min-height: 51px;

      padding:
        0 10px;

      display: flex;

      align-items: center;

      gap: 11px;

      border-radius: 14px;

      background:
        transparent;

      text-align:
        start;

      transition:
        background .15s ease;
    }

    .menu-item:hover,

        800;

        nowrap;
