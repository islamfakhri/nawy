<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#101111">
  <meta name="color-scheme" content="dark light">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <meta name="description"
        content="ناوي — مكان بسيط لكل اللي ناوي تعمله.">

  <title>ناوي</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./favicon.ico">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-3612TKY0RT"></script>
  <script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
      dataLayer.push(arguments);
    }

    gtag('js', new Date());
    gtag('config', 'G-3612TKY0RT', {
      anonymize_ip: true
    });
  </script>

  <style>
    :root {
      --bg: #f5f6f7;
      --surface: #ffffff;
      --surface-2: #f0f2f3;
      --surface-3: #e8ebed;

      --text: #111415;
      --muted: #747b80;
      --border: rgba(17, 20, 21, .09);

      --accent: #19a974;
      --accent-soft: rgba(25, 169, 116, .12);

      --danger: #e5484d;
      --warning: #e8a317;

      --shadow:
        0 10px 30px rgba(0, 0, 0, .06);

      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 14px;

      --header-height: 76px;
      --bottom-space: 120px;
    }

    html[data-theme="dark"] {
      --bg: #101111;
      --surface: #181a1a;
      --surface-2: #202222;
      --surface-3: #292c2c;

      --text: #f4f5f5;
      --muted: #939999;
      --border: rgba(255, 255, 255, .08);

      --shadow:
        0 14px 40px rgba(0, 0, 0, .30);
    }

    html[data-accent="blue"] {
      --accent: #3685ff;
      --accent-soft: rgba(54, 133, 255, .12);
    }

    html[data-accent="purple"] {
      --accent: #8b5cf6;
      --accent-soft: rgba(139, 92, 246, .12);
    }

    html[data-accent="orange"] {
      --accent: #f59e0b;
      --accent-soft: rgba(245, 158, 11, .13);
    }

    html[data-accent="pink"] {
      --accent: #e94f9b;
      --accent-soft: rgba(233, 79, 155, .12);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      min-height: 100%;
      background: var(--bg);
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

      transition:
        background .25s ease,
        color .25s ease;

      overscroll-behavior-y: none;
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      color: inherit;
    }

    textarea,
    input {
      outline: none;
    }

    ::selection {
      background: var(--accent);
      color: #fff;
    }

    /* =========================
       APP
    ========================= */

    .app {
      width: min(100%, 760px);
      min-height: 100vh;
      margin: 0 auto;
      padding:
        env(safe-area-inset-top)
        16px
        calc(var(--bottom-space) + env(safe-area-inset-bottom))
        16px;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      min-height: var(--header-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      position: sticky;
      top: 0;
      z-index: 20;

      background:
        linear-gradient(
          to bottom,
          var(--bg) 72%,
          rgba(0,0,0,0)
        );

      padding-top: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 14px;

      display: grid;
      place-items: center;

      background: var(--accent);
      color: #fff;

      font-size: 23px;
      font-weight: 800;

      box-shadow:
        0 7px 18px color-mix(
          in srgb,
          var(--accent) 24%,
          transparent
        );

      flex: 0 0 auto;
    }

    .brand-name {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -.4px;
    }

    .menu-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;

      background: var(--surface);
      border: 1px solid var(--border);

      display: grid;
      place-items: center;

      font-size: 24px;
      line-height: 1;

      transition:
        transform .15s ease,
        background .2s ease;
    }

    .menu-btn:active {
      transform: scale(.92);
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      padding: 20px 4px 12px;
    }

    .hero-title {
      margin: 0;
      font-size: clamp(27px, 7vw, 38px);
      line-height: 1.15;
      letter-spacing: -.9px;
      font-weight: 850;
    }


    /* =========================
       CONTENT
    ========================= */

    .content {
      margin-top: 18px;
    }

    .section {
      margin-top: 26px;
    }

    .section:first-child {
      margin-top: 0;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;

      margin-bottom: 9px;
      padding: 0 4px;
    }

    .section-title {
      font-size: 13px;
      color: var(--muted);
      font-weight: 750;
    }

    .section-count {
      min-width: 24px;
      height: 24px;
      padding: 0 7px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border-radius: 999px;

      background: var(--surface-2);
      color: var(--muted);

      font-size: 11px;
      font-weight: 800;
    }

    /* =========================
       TASK
    ========================= */

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .task {
      position: relative;

      display: flex;
      align-items: center;
      gap: 12px;

      min-height: 62px;
      padding: 9px 12px;

      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);

      box-shadow: 0 4px 18px rgba(0,0,0,.025);

      transition:
        transform .18s ease,
        opacity .18s ease,
        background .2s ease,
        border-color .2s ease;
    }

    .task:hover {
      border-color:
        color-mix(
          in srgb,
          var(--accent) 22%,
          var(--border)
        );
    }

    .task.just-completed {
      animation: completePop .5s ease;
    }

    @keyframes completePop {
      0% {
        transform: scale(1);
      }

      45% {
        transform: scale(1.025);
      }

      100% {
        transform: scale(1);
      }
    }

    .task.completed {
      opacity: .65;
    }

    .task-checkbox {
      width: 27px;
      height: 27px;

      flex: 0 0 auto;

      border-radius: 50%;
      border: 2px solid var(--muted);

      background: transparent;

      display: grid;
      place-items: center;

      transition:
        background .2s ease,
        border-color .2s ease,
        transform .15s ease;
    }

    .task-checkbox:active {
      transform: scale(.88);
    }

    .task.completed .task-checkbox {
      background: var(--accent);
      border-color: var(--accent);
    }

    .check-icon {
      width: 13px;
      height: 13px;
      opacity: 0;
      transform: scale(.5);

      transition:
        opacity .18s ease,
        transform .18s ease;
    }

    .task.completed .check-icon {
      opacity: 1;
      transform: scale(1);
    }

    .task-main {
      min-width: 0;
      flex: 1;

      padding: 3px 0;
      cursor: pointer;
    }

    .task-text {
      margin: 0;

      font-size: 16px;
      line-height: 1.45;
      font-weight: 570;

      overflow-wrap: anywhere;
    }

    .task.completed .task-text {
      text-decoration: line-through;
      text-decoration-thickness: 1.5px;
      color: var(--muted);
    }

    .task-meta {
      margin-top: 3px;

      display: flex;
      align-items: center;
      gap: 5px;

      color: var(--muted);
      font-size: 11px;
    }

    .task-star {
      width: 34px;
      height: 34px;

      flex: 0 0 auto;

      border-radius: 50%;
      background: transparent;

      display: grid;
      place-items: center;

      color: var(--muted);
      font-size: 20px;

      transition:
        color .18s ease,
        background .18s ease,
        transform .15s ease;
    }

    .task-star:active {
      transform: scale(.86);
    }

    .task-star.active {
      color: var(--warning);
      background: rgba(232,163,23,.1);
    }

    .task-empty {
      padding: 42px 18px;
      text-align: center;

      border-radius: var(--radius-xl);
      background: var(--surface);
      border: 1px solid var(--border);

      color: var(--muted);
    }

    .empty-symbol {
      width: 52px;
      height: 52px;
      margin: 0 auto 13px;

      display: grid;
      place-items: center;

      border-radius: 18px;

      background: var(--accent-soft);
      color: var(--accent);

      font-size: 23px;
      font-weight: 800;
    }

    .empty-title {
      color: var(--text);
      font-size: 16px;
      font-weight: 750;
    }

    .empty-text {
      margin-top: 5px;
      font-size: 13px;
      line-height: 1.6;
    }

    /* =========================
       COMPOSER
    ========================= */

    .composer-wrap {
      position: fixed;
      z-index: 30;

      left: 50%;
      bottom: 0;

      width: min(760px, 100%);

      transform: translateX(-50%);

      padding:
        10px 16px
        calc(12px + env(safe-area-inset-bottom));

      pointer-events: none;
    }

    .composer {
      pointer-events: auto;

      display: flex;
      align-items: flex-end;
      gap: 9px;

      padding: 8px 8px 8px 9px;

      background:
        color-mix(
          in srgb,
          var(--surface) 94%,
          transparent
        );

      border: 1px solid var(--border);
      border-radius: 22px;

      box-shadow:
        0 12px 40px rgba(0,0,0,.13);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .composer textarea {
      flex: 1;
      min-width: 0;

      min-height: 45px;
      max-height: 130px;

      resize: none;
      overflow-y: auto;

      padding: 11px 12px 9px;

      border: 0;
      background: transparent;

      color: var(--text);

      font-size: 16px;
      line-height: 1.45;
    }

    .composer textarea::placeholder {
      color: var(--muted);
      opacity: .85;
    }

    .send-btn {
      width: 46px;
      height: 46px;

      flex: 0 0 auto;

      border-radius: 50%;

      background: var(--accent);
      color: #fff;

      display: grid;
      place-items: center;

      font-size: 22px;
      font-weight: 800;

      transition:
        transform .15s ease,
        opacity .2s ease;
    }

    .send-btn:active {
      transform: scale(.9);
    }

    .send-btn.disabled {
      opacity: .4;
    }

    /* =========================
       OVERLAY
    ========================= */

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 100;

      display: flex;
      align-items: flex-end;
      justify-content: center;

      padding: 16px;

      background: rgba(0,0,0,.42);

      opacity: 0;
      visibility: hidden;

      transition:
        opacity .22s ease,
        visibility .22s ease;
    }

    .overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .sheet {
      width: min(100%, 520px);
      max-height: min(82vh, 680px);

      overflow-y: auto;

      padding: 10px;

      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 27px;

      box-shadow:
        0 25px 70px rgba(0,0,0,.25);

      transform: translateY(20px);

      transition: transform .25s cubic-bezier(.2,.8,.2,1);
    }

    .overlay.show .sheet {
      transform: translateY(0);
    }

    .sheet-handle {
      width: 42px;
      height: 4px;
      margin: 3px auto 12px;

      border-radius: 99px;
      background: var(--surface-3);
    }

    .sheet-title {
      padding: 9px 10px 13px;

      font-size: 18px;
      font-weight: 800;
    }

    .sheet-subtitle {
      padding: 0 10px 12px;
      color: var(--muted);
      font-size: 13px;
    }

    /* =========================
       MENU
    ========================= */

    .menu-item {
      width: 100%;

      min-height: 54px;
      padding: 0 12px;

      display: flex;
      align-items: center;
      gap: 12px;

      border-radius: 15px;
      background: transparent;

      text-align: right;

      transition: background .15s ease;
    }

    .menu-item:hover,
    .menu-item:active {
      background: var(--surface-2);
    }

    .menu-icon {
      width: 35px;
      height: 35px;

      border-radius: 11px;

      display: grid;
      place-items: center;

      background: var(--surface-2);

      font-size: 16px;
    }

    .menu-text {
      flex: 1;
      font-weight: 650;
    }

    .menu-item.active .menu-text {
      color: var(--accent);
    }

    /* =========================
       ACTIONS
    ========================= */

    .action-task-preview {
      margin: 4px 4px 10px;
      padding: 13px;

      border-radius: 15px;
      background: var(--surface-2);

      font-size: 14px;
      line-height: 1.5;
    }

    .action-item {
      width: 100%;

      min-height: 53px;
      padding: 0 12px;

      display: flex;
      align-items: center;
      gap: 12px;

      border-radius: 15px;
      background: transparent;

      text-align: right;
    }

    .action-item:hover {
      background: var(--surface-2);
    }

    .action-item.danger {
      color: var(--danger);
    }

    /* =========================
       MODAL / INPUT
    ========================= */

    .edit-input {
      width: 100%;

      min-height: 120px;

      padding: 14px;

      border-radius: 17px;
      border: 1px solid var(--border);

      background: var(--surface-2);
      color: var(--text);

      resize: vertical;

      font-size: 16px;
      line-height: 1.6;
    }

    .edit-input:focus {
      border-color: var(--accent);
    }

    .modal-actions {
      display: flex;
      gap: 8px;

      margin-top: 10px;
    }

    .modal-btn {
      flex: 1;
      min-height: 48px;

      border-radius: 15px;

      font-weight: 750;
    }

    .modal-btn.primary {
      background: var(--accent);
      color: #fff;
    }

    .modal-btn.secondary {
      background: var(--surface-2);
    }

    /* =========================
       SETTINGS
    ========================= */

    .setting-group {
      margin-bottom: 17px;
    }

    .setting-label {
      padding: 0 9px 8px;

      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }

    .setting-box {
      overflow: hidden;

      border: 1px solid var(--border);
      border-radius: 17px;

      background: var(--surface-2);
    }

    .setting-row {
      min-height: 53px;
      padding: 0 12px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;

      border-bottom: 1px solid var(--border);
    }

    .setting-row:last-child {
      border-bottom: 0;
    }

    .setting-name {
      font-size: 14px;
      font-weight: 650;
    }

    .segmented {
      display: flex;
      gap: 3px;

      padding: 3px;

      border-radius: 11px;
      background: var(--surface);
    }

    .segment {
      min-height: 32px;
      padding: 0 10px;

      border-radius: 9px;

      background: transparent;

      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .segment.active {
      background: var(--accent);
      color: #fff;
    }

    .colors {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .color-btn {
      width: 28px;
      height: 28px;

      border-radius: 50%;

      border: 3px solid var(--surface-2);

      outline: 1px solid var(--border);

      position: relative;
    }

    .color-btn.active::after {
      content: "✓";

      position: absolute;
      inset: 0;

      display: grid;
      place-items: center;

      color: #fff;

      font-size: 13px;
      font-weight: 900;
    }

    .green { background: #19a974; }
    .blue { background: #3685ff; }
    .purple { background: #8b5cf6; }
    .orange { background: #f59e0b; }
    .pink { background: #e94f9b; }

    /* =========================
       TRASH
    ========================= */

    .trash-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .trash-item {
      padding: 13px;

      border-radius: 15px;
      background: var(--surface-2);

      display: flex;
      align-items: center;
      gap: 9px;
    }

    .trash-text {
      flex: 1;

      min-width: 0;

      font-size: 14px;
      line-height: 1.45;

      overflow-wrap: anywhere;
    }

    .small-btn {
      min-height: 36px;
      padding: 0 10px;

      border-radius: 10px;

      background: var(--surface);
      font-size: 11px;
      font-weight: 750;
    }

    .small-btn.danger {
      color: var(--danger);
    }

    /* =========================
       TOAST
    ========================= */

    .toast {
      position: fixed;
      z-index: 200;

      left: 50%;
      bottom:
        calc(92px + env(safe-area-inset-bottom));

      width: min(
        calc(100% - 32px),
        440px
      );

      transform:
        translate(-50%, 20px)
        scale(.96);

      opacity: 0;
      visibility: hidden;

      padding: 12px 14px;

      display: flex;
      align-items: center;
      gap: 10px;

      border-radius: 15px;

      background: var(--surface);
      border: 1px solid var(--border);

      box-shadow: var(--shadow);

      transition:
        opacity .2s ease,
        transform .2s ease,
        visibility .2s ease;
    }

    .toast.show {
      opacity: 1;
      visibility: visible;

      transform:
        translate(-50%, 0)
        scale(1);
    }

    .toast-message {
      flex: 1;
      font-size: 13px;
      font-weight: 650;
    }

    .toast-undo {
      padding: 7px 10px;

      border-radius: 9px;

      background: var(--accent-soft);
      color: var(--accent);

      font-size: 12px;
      font-weight: 800;
    }


    /* =========================
       INSTALL BANNER
    ========================= */
    .install-banner{position:fixed;z-index:180;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));width:min(calc(100% - 28px),560px);transform:translate(-50%,22px);opacity:0;visibility:hidden;pointer-events:none;display:flex;align-items:center;gap:12px;padding:12px;background:color-mix(in srgb,var(--surface) 96%,transparent);border:1px solid var(--border);border-radius:19px;box-shadow:0 18px 55px rgba(0,0,0,.22);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:opacity .22s ease,transform .22s ease,visibility .22s ease}
    .install-banner.show{transform:translate(-50%,0);opacity:1;visibility:visible;pointer-events:auto}
    .install-icon{width:42px;height:42px;flex:0 0 auto;display:grid;place-items:center;border-radius:14px;background:var(--accent);color:#fff;font-size:21px;font-weight:850}
    .install-copy{min-width:0;flex:1}.install-title{font-size:14px;font-weight:800}.install-text{margin-top:2px;color:var(--muted);font-size:11px;line-height:1.45}
    .install-actions{display:flex;align-items:center;gap:6px;flex:0 0 auto}.install-btn{min-height:38px;padding:0 11px;border-radius:11px;font-size:11px;font-weight:800;white-space:nowrap}.install-btn.primary{background:var(--accent);color:#fff}.install-btn.secondary{background:var(--surface-2)}
    @media(max-width:480px){.install-banner{align-items:flex-start;gap:9px;padding:10px}.install-icon{width:38px;height:38px;border-radius:12px}.install-actions{flex-direction:column;align-items:stretch}.install-btn{min-height:34px;padding:0 9px}}


    .brand-mark { overflow:hidden; padding:0; background:transparent; box-shadow:none; border-radius:13px; }
    .brand-mark img { display:block; width:100%; height:100%; object-fit:cover; border-radius:inherit; }
    .top-tabs { position:relative; display:flex; gap:28px; height:48px; align-items:flex-end; border-bottom:1px solid var(--border); margin:0 4px; }
    .top-tab { position:relative; height:48px; padding:0 2px; background:transparent; color:var(--muted); font-size:14px; font-weight:700; }
    .top-tab.active { color:var(--accent); }
    .top-tab-indicator { position:absolute; bottom:-1px; height:2px; border-radius:4px; background:var(--accent); transition:transform .24s ease,width .24s ease; }
    .section-tools { display:flex; align-items:center; gap:4px; }
    .section-tool { width:30px;height:30px;border-radius:50%;background:transparent;color:var(--muted);font-size:18px;display:grid;place-items:center; }
    .section-tool:active { background:var(--surface-2); }
    .task-ghost { opacity:.15 !important; }
    .task-chosen { box-shadow:0 7px 22px rgba(0,0,0,.08); }
    .task-drag { transform:scale(1.012); }
    body.is-dragging .task { transition:none; }
    .intention-sheet,.share-sheet { width:min(100%,520px); max-height:min(86vh,720px); overflow:auto; padding:12px; background:var(--surface); border:1px solid var(--border); border-radius:28px; box-shadow:0 25px 80px rgba(0,0,0,.25); transform:translateY(20px) scale(.98); transition:transform .25s cubic-bezier(.2,.8,.2,1); }
    .overlay.show .intention-sheet,.overlay.show .share-sheet { transform:translateY(0) scale(1); }

    <script>

    /* =========================================================
       NAWY
       Simple local-first task / intention app
       ========================================================= */

    "use strict";


    /* =========================
       STORAGE
    ========================= */

    const STORAGE_KEYS = {
      tasks: "nawy_tasks_v9",
      trash: "nawy_trash_v2",
      settings: "nawy_settings_v2"
    };


    /* =========================
       I18N
    ========================= */
    const TRANSLATIONS = {
      ar: {languageSection:"اللغة",languageName:"لغة ناوي",appearanceSection:"المظهر",modeName:"الوضع",colorSection:"اللون",dataSection:"البيانات",settings:"الإعدادات",trash:"أرشيف النوايا",trashSubtitle:"نواياك التي تراجعت عنها. يمكنك استرجاعها في أي وقت.",all:"نواياي",favorites:"مفضلاتي",current:"حالية",achieved:"متحققة",heroToday:"ناوي على إيه النهارده؟",editIntent:"تعديل النية",done:"تحققت",reopen:"إعادة فتح",revert:"تراجع",share:"مشاركة",delete:"حذف",cancel:"إلغاء",save:"حفظ",add:"إضافة",newIntent:"اكتب نية جديدة",taskPlaceholder:"أنا ناوي...",menu:"القائمة",light:"فاتح",dark:"داكن",green:"أخضر",blue:"أزرق",purple:"بنفسجي",orange:"برتقالي",pink:"وردي",nawyColor:"لون ناوي",startFirst:"ابدأ أول نية",allDone:"كل نواياك اتحققت ✨",deleted:"اتحذفت من النوايا",restored:"رجعت للنوايا",deletedForever:"اتحذفت نهائيًا",edited:"اتعدلت بنجاح",writeFirst:"اكتب النية الأول",noIntentions:"مفيش نوايا لسه",firstIntent:"اكتب أول حاجة ناوي تعملها.",noIntentionsAll:"لسه مفيش نوايا",everyThingStarts:"كل حاجة تبدأ بنية.",noAchievements:"لسه مفيش نوايا متحققة",achievementHint:"أول ما تحقق نية هتظهر هنا.",trashEmpty:"الأرشيف فاضي",noDeleted:"مفيش نوايا متراجَع عنها.",restore:"استرجاع",installTitle:"ثبّت ناوي على جهازك",installText:"خليه معاك أسرع وأسهل من المتصفح.",install:"تثبيت",continue:"متابعة",installGuideTitle:"أضف ناوي إلى الشاشة الرئيسية",installGuideText:"من قائمة المتصفح اختر إضافة إلى الشاشة الرئيسية.",updateAvailable:"تحديث جديد من ناوي متاح.",update:"تحديث",undo:"تراجع",deleteAchieved:"حذف النوايا المتحققة",sort:"ترتيب",customOrder:"ترتيبي",newest:"الأحدث أولًا",oldest:"الأقدم أولًا",notifications:"إشعار ناوي",notificationHint:"تذكير لطيف بنواياك"},
      en: {languageSection:"Language",languageName:"NAWY language",appearanceSection:"Appearance",modeName:"Mode",colorSection:"Color",dataSection:"Data",settings:"Settings",trash:"Intention archive",trashSubtitle:"Intentions you stepped back from.",all:"My intentions",favorites:"Favorites",current:"Current",achieved:"Achieved",heroToday:"What are you up to today?",editIntent:"Edit intention",done:"Achieved",reopen:"Reopen",revert:"Step back",share:"Share",delete:"Delete",cancel:"Cancel",save:"Save",add:"Add",newIntent:"Write a new intention",taskPlaceholder:"I intend to...",menu:"Menu",light:"Light",dark:"Dark",green:"Green",blue:"Blue",purple:"Purple",orange:"Orange",pink:"Pink",nawyColor:"NAWY color",startFirst:"Start your first intention",allDone:"All intentions achieved ✨",deleted:"Removed",restored:"Restored",deletedForever:"Deleted permanently",edited:"Updated successfully",writeFirst:"Write the intention first",noIntentions:"No intentions yet",firstIntent:"Write the first thing you intend to do.",noIntentionsAll:"No intentions yet",everyThingStarts:"Everything starts with an intention.",noAchievements:"No achieved intentions yet",achievementHint:"Achieved intentions will appear here.",trashEmpty:"Archive is empty",noDeleted:"No archived intentions.",restore:"Restore",installTitle:"Install NAWY",installText:"Keep it with you, faster than opening the browser.",install:"Install",continue:"Continue",installGuideTitle:"Add NAWY to your Home Screen",installGuideText:"Open your browser menu and choose Add to Home Screen.",updateAvailable:"A new NAWY update is available.",update:"Update",undo:"Undo",deleteAchieved:"Delete achieved intentions",sort:"Sort",customOrder:"Custom order",newest:"Newest first",oldest:"Oldest first",notifications:"NAWY notifications",notificationHint:"A gentle reminder for your intentions"}
    };
    function t(key,vars={}){const dict=TRANSLATIONS[settings?.language]||TRANSLATIONS.ar;let value=dict[key]??TRANSLATIONS.ar[key]??key;Object.entries(vars).forEach(([k,v])=>value=value.replaceAll(`{${k}}`,String(v)));return value;}
    function applyLanguage(){const lang=settings.language==="en"?"en":"ar";document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));document.querySelectorAll("[data-i18n-placeholder]").forEach(el=>el.placeholder=t(el.dataset.i18nPlaceholder));document.querySelectorAll("[data-i18n-aria]").forEach(el=>el.setAttribute("aria-label",t(el.dataset.i18nAria)));$$("[data-language-choice]").forEach(b=>b.classList.toggle("active",b.dataset.languageChoice===lang));}

    /* =========================
       DEFAULT SETTINGS
    ========================= */

    const DEFAULT_SETTINGS = {
      theme: "dark",
      accent: "green",
      language: "ar",
      notificationEnabled: true,
      notificationTime: "09:00"
    };


    /* =========================
       STATE
    ========================= */

    let tasks = [];
    let trash = [];

    let settings = {
      ...DEFAULT_SETTINGS
    };

    let currentView = "all";
    let selectedTaskId = null;

    let undoTimer = null;
    let undoAction = null;

    let typingAudioContext = null;
    let lastTypingSound = 0;

    let lastKnownDay = null;


    /* =========================
       DOM
    ========================= */

    const $ = (selector) =>
      document.querySelector(selector);

    const $$ = (selector) =>
      [...document.querySelectorAll(selector)];


    const content = $("#content");

    const taskInput = $("#taskInput");
    const sendBtn = $("#sendBtn");

    const heroTitle = $("#heroTitle");


    const menuOverlay = $("#menuOverlay");
    const actionOverlay = $("#actionOverlay");
    const editOverlay = $("#editOverlay");
    const settingsOverlay = $("#settingsOverlay");
    const trashOverlay = $("#trashOverlay");
    const shareOverlay = $("#shareOverlay");
    const shareCanvas = $("#shareCanvas");

    const actionTaskPreview = $("#actionTaskPreview");

    const editInput = $("#editInput");

    const trashList = $("#trashList");
    const trashCount = $("#trashCount");

    const toast = $("#toast");
    const toastMessage = $("#toastMessage");
    const toastUndo = $("#toastUndo");


    /* =========================
       NORMALIZE
    ========================= */

    function normalizeTask(task) {
      if (!task || typeof task !== "object") return null;
      const createdAt=Number(task.createdAt)||Date.now();
      return {id:String(task.id||createId()),text:String(task.text||"").trim(),completed:Boolean(task.completed),starred:Boolean(task.starred),createdAt,completedAt:task.completedAt?Number(task.completedAt):null,order:Number.isFinite(Number(task.order))?Number(task.order):createdAt};
    }


    function createId() {

      return (
        Date.now().toString(36) +
        Math.random()
          .toString(36)
          .slice(2, 9)
      );
    }


    /* =========================
       STORAGE HELPERS
    ========================= */

    function safeParse(value, fallback) {

      try {
        const parsed = JSON.parse(value);

        return parsed ?? fallback;

      } catch {
        return fallback;
      }
    }


    function loadData() {

      const savedTasks =
        safeParse(
          localStorage.getItem(
            STORAGE_KEYS.tasks
          ),
          []
        );

      const savedTrash =
        safeParse(
          localStorage.getItem(
            STORAGE_KEYS.trash
          ),
          []
        );

      const savedSettings =
        safeParse(
          localStorage.getItem(
            STORAGE_KEYS.settings
          ),
          {}
        );


      tasks = Array.isArray(savedTasks)
        ? savedTasks
            .map(normalizeTask)
            .filter(Boolean)
            .filter(task => task.text)
        : [];


      trash = Array.isArray(savedTrash)
        ? savedTrash
            .map(normalizeTask)
            .filter(Boolean)
            .filter(task => task.text)
        : [];


      settings = {...DEFAULT_SETTINGS,...(savedSettings||{})};
      settings.notificationEnabled = settings.notificationEnabled !== false;


      if (
        !["dark", "light"]
          .includes(settings.theme)
      ) {
        settings.theme = "dark";
      }


      if (
        ![
          "green",
          "blue",
          "purple",
          "orange",
          "pink"
        ].includes(settings.accent)
      ) {
        settings.accent = "green";
      }

      if (!["ar", "en"].includes(settings.language)) {
        settings.language = "ar";
      }

    }


    function saveTasks() {

      localStorage.setItem(
        STORAGE_KEYS.tasks,
        JSON.stringify(tasks)
      );
    }


    function saveTrash() {

      localStorage.setItem(
        STORAGE_KEYS.trash,
        JSON.stringify(trash)
      );
    }


    function saveSettings() {

      localStorage.setItem(
        STORAGE_KEYS.settings,
        JSON.stringify(settings)
      );
    }


    /* =========================
       SETTINGS
    ========================= */

    function applySettings() {

      document.documentElement
        .setAttribute(
          "data-theme",
          settings.theme
        );

      document.documentElement
        .setAttribute(
          "data-accent",
          settings.accent
        );


      $$("[data-theme-choice]")
        .forEach(button => {

          button.classList.toggle(
            "active",
            button.dataset.themeChoice ===
            settings.theme
          );

        });


      $$("[data-accent-choice]")
        .forEach(button => {

          button.classList.toggle(
            "active",
            button.dataset.accentChoice ===
            settings.accent
          );

        });

    }

       ADD TASK

    function addTask(text) {
      const cleanText=String(text||"").trim();
      if(!cleanText)return false;
      const minOrder=tasks.length?Math.min(...tasks.map(t=>Number(t.order)||Date.now())):Date.now();
      tasks.unshift({id:createId(),text:cleanText,completed:false,starred:false,createdAt:Date.now(),completedAt:null,order:minOrder-1});

    }


    /* =========================
       COMPLETE
    ========================= */

    function completeTask(id) {

      const task =
        tasks.find(
          item => item.id === id
        );

      if (!task) {
        return;
      }


      task.completed =
        !task.completed;


      task.completedAt =
        task.completed
          ? Date.now()
          : null;


      saveTasks();

      render();


      if (task.completed) {

        playCompleteSound();

        requestAnimationFrame(() => {

          const element =
            document.querySelector(
              `[data-task-id="${CSS.escape(task.id)}"]`
            );

          if (element) {
            element.classList.add(
              "just-completed"
            );

            setTimeout(() => {
              element.classList.remove(
                "just-completed"
              );
            }, 550);
          }

        });

      }

    }

       STAR
    ========================= */

    function toggleStar(id) {

      const task =
        tasks.find(
          item => item.id === id

      if (!task) {
        return;
      }

      task.starred =
        !task.starred;

      saveTasks();

      render();

    }


    /* =========================
       DELETE
    ========================= */

    function deleteTask(id) {

      const index =
        tasks.findIndex(
          item => item.id === id
        );

      if (index === -1) {
        return;
      }


      const [deleted] =
        tasks.splice(index, 1);


      trash.unshift({
        ...deleted,
        deletedAt: Date.now()
      });


      saveTasks();
      saveTrash();

      render();

      showToast(
        t("deleted"),
        true,
        () => {

          const trashIndex =
            trash.findIndex(
              item =>
                item.id === deleted.id
            );

          if (trashIndex !== -1) {
            trash.splice(
              trashIndex,
              1
            );
          }

          tasks.unshift(deleted);

          saveTasks();
          saveTrash();

          render();

        }
      );

    }

          0.0001,
          ctx.currentTime + duration

        gain.connect(ctx.destination);


        oscillator.start();

        oscillator.stop(
          ctx.currentTime + duration + .01
        );

      } catch {
        /* Audio should never break the app. */
      }

    }


    function playTypingSound() {

      const now =
        performance.now();


      if (
        now - lastTypingSound < 55
      ) {
        return;
      }


      lastTypingSound =
        now;


      const frequency =
        145 +
        Math.random() * 40;


      playTone(
        frequency,
        .035,
        .018,
        "sine"
      );

    }


    function playAddSound() {

      playTone(
        230,
        .055,
        .025,
        "sine"
      );

    }


    function playCompleteSound() {

      const ctx =
        getAudioContext();

      if (!ctx) {
        return;
      }


      playTone(
        520,
        .09,
        .045,
        "sine"
      );


      setTimeout(() => {

        playTone(
          700,
          .12,
          .035,
          "sine"
        );

      }, 55);

    }


    /* =========================
       SAFE HTML
    ========================= */

    function escapeHtml(value) {

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    /* =========================
       INSTALL BANNER
    ========================= */
    let deferredInstallPrompt = null;
    let installBannerDismissed = false;
    const installBanner = $("#installBanner");
    const installTitle = $("#installTitle");
    const installText = $("#installText");
    const installAction = $("#installAction");
    const installDismiss = $("#installDismiss");
    function isStandalone(){return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;}
    function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent);}
    function showInstallBanner(){
      if(isStandalone() || installBannerDismissed) return;
      if(deferredInstallPrompt){installTitle.textContent=t("installTitle");installText.textContent=t("installText");installAction.textContent=t("install");}
      else {installTitle.textContent=t("installGuideTitle");installText.textContent=t("installGuideText");installAction.textContent=t("install");}
      installDismiss.textContent=t("continue");installBanner.classList.add("show");
    }
    function hideInstallBanner(){installBanner.classList.remove("show");}
    window.addEventListener("beforeinstallprompt",event=>{event.preventDefault();deferredInstallPrompt=event;showInstallBanner();});
    window.addEventListener("appinstalled",()=>{deferredInstallPrompt=null;hideInstallBanner();});
    installAction.addEventListener("click",async()=>{if(!deferredInstallPrompt){if(isIOS())showToast(t("installGuideText"));return;}const promptEvent=deferredInstallPrompt;deferredInstallPrompt=null;hideInstallBanner();try{await promptEvent.prompt();await promptEvent.userChoice;}catch{}});
    installDismiss.addEventListener("click",()=>{installBannerDismissed=true;hideInstallBanner();});
    window.addEventListener("load",()=>setTimeout(showInstallBanner,700));



    /* =========================
       KEYBOARD
    ========================= */

    document
      .addEventListener(
        "keydown",
        event => {

          if (
            event.key === "Escape"
          ) {

            closeAllOverlays();

          }

        }
      );


    /* =========================
       INIT
    ========================= */

    function init() {

      loadData();

      applySettings();

      lastKnownDay =
        getDateKey();

      render();

      updateComposer();

      autoResizeTextarea();
      updateNotificationToggle();
      if(settings.notificationEnabled&&"Notification" in window&&Notification.permission==="granted")scheduleNotification();

    }


    init();


    /* =========================
       SERVICE WORKER
    ========================= */

    if ("serviceWorker" in navigator) {
      window.addEventListener("load",()=>{
        navigator.serviceWorker.register("./sw.js",{updateViaCache:"none"}).then(registration=>{
          registration.update().catch(()=>{});
          registration.addEventListener("updatefound",()=>{
            const worker=registration.installing; if(!worker)return;
            worker.addEventListener("statechange",()=>{
              if(worker.state==="installed" && navigator.serviceWorker.controller){
                showToast(t("updateAvailable"));
                const b=document.createElement("button"); b.type="button"; b.className="toast-undo"; b.textContent=t("update");
                b.addEventListener("click",()=>worker.postMessage({type:"SKIP_WAITING"})); toast.appendChild(b); setTimeout(()=>b.remove(),5000);
              }
            });
          });
          setInterval(()=>registration.update().catch(()=>{}),60*60*1000);
        }).catch(()=>{});
      });
      navigator.serviceWorker.addEventListener("controllerchange",()=>window.location.reload());
    }
  
window.addEventListener("resize",updateTabIndicator);

  </script>

</body>
</html>
