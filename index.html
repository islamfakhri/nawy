<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#10b981">
    
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./icon-192.png">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <title>ناوي</title>
    <style>
        :root {
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #9ca3af;
            --border: #e5e7eb;
            --primary: #10b981;
            --item-hover: #f9fafb;
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --border: #334155;
            --primary: #10b981;
            --item-hover: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            padding: 20px 15px;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            transition: background 0.2s;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: fit-content;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.5em;
            font-weight: 700;
        }

        .theme-toggle {
            background: none;
            border: none;
            font-size: 1.2em;
            cursor: pointer;
            padding: 4px;
        }

        .install-banner {
            display: none;
            background: rgba(16, 185, 129, 0.1);
            border-radius: 10px;
            padding: 10px 14px;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85em;
            color: var(--primary);
            font-weight: 600;
        }

        .btn-install {
            background: var(--primary);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85em;
            cursor: pointer;
        }

        .input-box {
            display: flex;
            gap: 8px;
            align-items: flex-end;
            background: var(--bg);
            padding: 8px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        textarea {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 0.95em;
            font-family: inherit;
            color: var(--text-main);
            resize: none;
            outline: none;
            min-height: 24px;
            max-height: 100px;
            line-height: 1.4;
        }

        .btn-add {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 14px;
            font-weight: bold;
            font-size: 0.9em;
            cursor: pointer;
        }

        .todo-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 60vh;
            overflow-y: auto;
        }

        .todo-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px;
            border-bottom: 1px solid var(--border);
            transition: background 0.2s;
        }

        .todo-item:last-child {
            border-bottom: none;
        }

        .checkbox {
            width: 20px;
            height: 20px;
            border-radius: 6px;
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-top: 2px;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .todo-item.completed .checkbox {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .checkbox::after {
            content: '✓';
            font-size: 12px;
            display: none;
        }

        .todo-item.completed .checkbox::after {
            display: block;
        }

        .todo-text {
            flex: 1;
            font-size: 0.95em;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.4;
            cursor: pointer;
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .btn-delete {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.1em;
            opacity: 0.6;
            padding: 0 4px;
        }

        .btn-delete:hover {
            opacity: 1;
            color: #ef4444;
        }

        .empty {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9em;
            padding: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>ناوي 🎯</h1>
            <button class="theme-toggle" id="themeToggle">🌙</button>
        </header>

        <div class="install-banner" id="installBanner">
            <span>تثبيت التطبيق</span>
            <button class="btn-install" id="installBtn">تثبيت</button>
        </div>

        <div class="input-box">
            <textarea id="todoInput" rows="1" placeholder="أضف مهمة جديدة..."></textarea>
            <button class="btn-add" onclick="addTodo()">إضافة</button>
        </div>

        <ul class="todo-list" id="todoList"></ul>

        <div class="empty" id="emptyState" style="display: none;">
            القائمة فارغة
        </div>
    </div>

    <script>
        // --- 1. المظهر ---
        const themeToggle = document.getElementById('themeToggle');
        const savedTheme = localStorage.getItem('nawyTheme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        themeToggle.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

        themeToggle.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('nawyTheme', newTheme);
            themeToggle.textContent = newTheme === 'dark' ? '☀️' : '🌙';
        });

        // --- 2. تثبيت والتحديث الآلي PWA ---
        let deferredPrompt;
        const installBanner = document.getElementById('installBanner');
        const installBtn = document.getElementById('installBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBanner.style.display = 'flex';
        });

        installBtn.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') installBanner.style.display = 'none';
            deferredPrompt = null;
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').then(reg => {
                reg.addEventListener('updatefound', () => {
                    const newWorker = reg.installing;
                    newWorker.addEventListener('statechange', () => {
                        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                            window.location.reload();
                        }
                    });
                });
            });

            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) {
                    window.location.reload();
                    refreshing = true;
                }
            });
        }

        // --- 3. إدارة المهام ---
        let todos = JSON.parse(localStorage.getItem('nawyTodos')) || [];
        const todoInput = document.getElementById('todoInput');

        // التعديل الآلي لارتفاع مربع الكتابة
        todoInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        document.addEventListener('DOMContentLoaded', renderTodos);

        function addTodo() {
            const text = todoInput.value.trim();
            if (text === '') return;

            todos.push({
                id: Date.now(),
                text: text,
                completed: false
            });

            saveAndRender();
            todoInput.value = '';
            todoInput.style.height = 'auto';
        }

        function toggleTodo(id) {
            const todo = todos.find(t => t.id === id);
            if (todo) {
                todo.completed = !todo.completed;
                saveAndRender();
            }
        }

        function deleteTodo(id) {
            todos = todos.filter(t => t.id !== id);
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem('nawyTodos', JSON.stringify(todos));
            renderTodos();
        }

        function renderTodos() {
            const todoList = document.getElementById('todoList');
            const emptyState = document.getElementById('emptyState');

            if (todos.length === 0) {
                todoList.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';

            todoList.innerHTML = todos.map(todo => `
                <li class="todo-item ${todo.completed ? 'completed' : ''}">
                    <div class="checkbox" onclick="toggleTodo(${todo.id})"></div>
                    <span class="todo-text" onclick="toggleTodo(${todo.id})">${escapeHtml(todo.text)}</span>
                    <button class="btn-delete" onclick="deleteTodo(${todo.id})">✕</button>
                </li>
            `).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
