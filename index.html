<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="تطبيق بسيط لتدوين النوايا والأهداف">
    <meta name="theme-color" content="#10b981">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./icon-192.png">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <title>ناوي | دوّن اللي ناوي عليه</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 0.95em;
            opacity: 0.9;
        }

        .content {
            padding: 30px 20px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #10b981;
        }

        button {
            padding: 12px 25px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .goals-list {
            list-style: none;
        }

        .goal-item {
            background: #f3f4f6;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .goal-item.completed {
            background: #d1fae5;
            text-decoration: line-through;
            opacity: 0.7;
        }

        .goal-text {
            flex: 1;
            cursor: pointer;
            padding: 5px;
            border-radius: 5px;
            transition: background 0.2s;
        }

        .goal-text:hover {
            background: rgba(16, 185, 129, 0.1);
        }

        .goal-actions {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.85em;
            background: #f59e0b;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-small:hover {
            background: #d97706;
        }

        .btn-delete {
            background: #ef4444;
        }

        .btn-delete:hover {
            background: #dc2626;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #9ca3af;
        }

        .empty-state emoji {
            font-size: 3em;
            display: block;
            margin-bottom: 10px;
        }

        footer {
            background: #f9fafb;
            padding: 20px;
            text-align: center;
            color: #6b7280;
            font-size: 0.9em;
            border-top: 1px solid #e5e7eb;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            background: #f0fdf4;
            padding: 15px;
            border-radius: 10px;
        }

        .stat {
            text-align: center;
        }

        .stat-number {
            font-size: 1.8em;
            font-weight: bold;
            color: #10b981;
        }

        .stat-label {
            font-size: 0.85em;
            color: #6b7280;
            margin-top: 5px;
        }

        @media (max-width: 480px) {
            header h1 {
                font-size: 2em;
            }

            .container {
                border-radius: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>ناوي 🎯</h1>
            <p>دوّن اللي ناوي عليه وحقق أهدافك</p>
        </header>

        <div class="content">
            <div class="stats">
                <div class="stat">
                    <div class="stat-number" id="totalGoals">0</div>
                    <div class="stat-label">إجمالي النوايا</div>
                </div>
                <div class="stat">
                    <div class="stat-number" id="completedGoals">0</div>
                    <div class="stat-label">المنجزة</div>
                </div>
                <div class="stat">
                    <div class="stat-number" id="remainingGoals">0</div>
                    <div class="stat-label">المتبقية</div>
                </div>
            </div>

            <div class="input-group">
                <input 
                    type="text" 
                    id="goalInput" 
                    placeholder="أكتب نيتك هنا..." 
                    autocomplete="off"
                >
                <button onclick="addGoal()">أضف</button>
            </div>

            <ul class="goals-list" id="goalsList"></ul>

            <div class="empty-state" id="emptyState">
                <span class="empty-state emoji">📝</span>
                <p>لا توجد نوايا حالياً<br>ابدأ بإضافة نيتك الأولى!</p>
            </div>
        </div>

        <footer>
            <p>✨ ناوي - حقق أحلامك خطوة بخطوة</p>
            <p style="font-size: 0.8em; margin-top: 8px;">يعمل بدون إنترنت 📱</p>
        </footer>
    </div>

    <script>
        // تسجيل Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(() => console.log('Service Worker registered'))
                .catch(() => console.log('Service Worker registration failed'));
        }

        // تحميل النوايا من localStorage
        let goals = JSON.parse(localStorage.getItem('nawyGoals')) || [];

        // عرض النوايا عند تحميل الصفحة
        document.addEventListener('DOMContentLoaded', () => {
            renderGoals();
            document.getElementById('goalInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    addGoal();
                }
            });
        });

        // إضافة نية جديدة
        function addGoal() {
            const input = document.getElementById('goalInput');
            const goalText = input.value.trim();

            if (goalText === '') {
                alert('الرجاء كتابة نية!');
                return;
            }

            const newGoal = {
                id: Date.now(),
                text: goalText,
                completed: false,
                createdAt: new Date().toLocaleDateString('ar-EG')
            };

            goals.push(newGoal);
            saveGoals();
            renderGoals();
            input.value = '';
            input.focus();
        }

        // حذف نية
        function deleteGoal(id) {
            if (confirm('هل أنت متأكد من حذف هذه النية؟')) {
                goals = goals.filter(goal => goal.id !== id);
                saveGoals();
                renderGoals();
            }
        }

        // تحديث حالة النية
        function toggleGoal(id) {
            const goal = goals.find(g => g.id === id);
            if (goal) {
                goal.completed = !goal.completed;
                saveGoals();
                renderGoals();
            }
        }

        // حفظ النوايا في localStorage
        function saveGoals() {
            localStorage.setItem('nawyGoals', JSON.stringify(goals));
        }

        // عرض النوايا
        function renderGoals() {
            const goalsList = document.getElementById('goalsList');
            const emptyState = document.getElementById('emptyState');

            if (goals.length === 0) {
                goalsList.innerHTML = '';
                emptyState.style.display = 'block';
                updateStats(0, 0);
                return;
            }

            emptyState.style.display = 'none';

            const completedCount = goals.filter(g => g.completed).length;
            updateStats(goals.length, completedCount);

            goalsList.innerHTML = goals.map(goal => `
                <li class="goal-item ${goal.completed ? 'completed' : ''}">
                    <span 
                        class="goal-text" 
                        onclick="toggleGoal(${goal.id})"
                        title="اضغط للتحديث"
                    >
                        ${goal.completed ? '✓ ' : ''}${escapeHtml(goal.text)}
                    </span>
                    <div class="goal-actions">
                        <button class="btn-small" onclick="editGoal(${goal.id})">تعديل</button>
                        <button class="btn-small btn-delete" onclick="deleteGoal(${goal.id})">حذف</button>
                    </div>
                </li>
            `).join('');
        }

        // تحديث الإحصائيات
        function updateStats(total, completed) {
            document.getElementById('totalGoals').textContent = total;
            document.getElementById('completedGoals').textContent = completed;
            document.getElementById('remainingGoals').textContent = total - completed;
        }

        // تعديل نية
        function editGoal(id) {
            const goal = goals.find(g => g.id === id);
            if (!goal) return;

            const newText = prompt('عدّل النية:', goal.text);
            if (newText && newText.trim() !== '') {
                goal.text = newText.trim();
                saveGoals();
                renderGoals();
            }
        }

        // حماية من XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // تحديث الإحصائيات كل ثانية
        setInterval(() => {
            renderGoals();
        }, 60000);
    </script>
</body>
</html>
