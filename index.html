<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta name="description" content="ناوي — مساحتك الخاصة لنواياك وأهدافك.">
  <title>ناوي</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon-512.png" type="image/png">
  <link rel="apple-touch-icon" href="./icon-512.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    if (typeof Sortable === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"><\/script>');

  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <!-- Toastify -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js@1.12.0/src/toastify.min.css">
  <script src="https://cdn.jsdelivr.net/npm/toastify-js@1.12.0/src/toastify.min.js"></script>

  <!-- Flatpickr Calendar -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

  <!-- Lucide Icons -->

    gtag("js", new Date());

  <style>
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --surface-2: #f4f5f5;
      --surface-3: #eceeef;
      --text: #1a1c1d;
      --muted: #6b7377;
      --border: rgba(17, 20, 21, .06);
      --border-strong: rgba(17, 20, 21, .10);
      --accent: #19a974;
      --accent-soft: rgba(25, 169, 116, .08);
      --danger: #e5484d;
      --warning: #e8a317;
      --shadow-soft: 0 1px 3px rgba(0,0,0,.03);
      --shadow-card: 0 2px 8px rgba(0,0,0,.04);
      --shadow-sheet: 0 16px 50px rgba(0,0,0,.12);
      --shadow-drag: 0 8px 24px rgba(0,0,0,.15);
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --radius-xl: 24px;
      --radius-full: 9999px;
      --header-height: 116px;
      --bottom-space: 80px;
      --tab-indicator-width: 28px;
      --tab-indicator-left: 0px;
      --fw-normal: 400;
      --fw-medium: 500;
      --fw-semibold: 600;
      --fw-bold: 700;
      --fw-extrabold: 800;
      --sp-xs: 4px;
      --sp-sm: 8px;
      --sp-md: 12px;
      --sp-lg: 16px;
      --sp-xl: 24px;
      --touch-checkbox: 32px;
      --touch-star: 46px;
      --fab-size: 56px;
      --transition-theme: .3s cubic-bezier(.4,0,.2,1);
    }

    html[data-font="small"] { --fs-xs: 10px; --fs-sm: 12px; --fs-md: 13px; --fs-base: 14px; --fs-lg: 15px; --fs-hero: 19px; }
    html[data-font="medium"], html:not([data-font]) { --fs-xs: 11px; --fs-sm: 13px; --fs-md: 14px; --fs-base: 16px; --fs-lg: 18px; --fs-hero: 22px; }
    html[data-font="large"] { --fs-xs: 12px; --fs-sm: 14px; --fs-md: 16px; --fs-base: 18px; --fs-lg: 20px; --fs-hero: 25px; }

    html[data-theme="dark"] {
      --bg: #0e1010; --surface: #1a1d1d; --surface-2: #222626; --surface-3: #2c3131;
      --text: #eef1f1; --muted: #8b9494; --border: rgba(255,255,255,.05); --border-strong: rgba(255,255,255,.08);
      --shadow-soft: 0 1px 4px rgba(0,0,0,.15); --shadow-card: 0 4px 12px rgba(0,0,0,.20); --shadow-sheet: 0 20px 60px rgba(0,0,0,.40);
      --shadow-drag: 0 12px 32px rgba(0,0,0,.40);
    }
    html[data-accent="blue"] { --accent: #3b82f6; --accent-soft: rgba(59,130,246,.08); }
    html[data-accent="purple"] { --accent: #8b5cf6; --accent-soft: rgba(139,92,246,.08); }
    html[data-accent="orange"] { --accent: #f59e0b; --accent-soft: rgba(245,158,11,.10); }
    html[data-accent="pink"] { --accent: #ec4899; --accent-soft: rgba(236,72,153,.08); }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { min-height: 100%; background: var(--bg); scroll-behavior: smooth; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: "Cairo", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, Tahoma, Arial, sans-serif;
      transition: background var(--transition-theme), color var(--transition-theme);
      overscroll-behavior-y: none; touch-action: pan-y;
      font-size: var(--fs-base); line-height: 1.6;
    }
    button, textarea, input { font: inherit; }
    button { border: 0; cursor: pointer; color: inherit; background: none; -webkit-tap-highlight-color: transparent; }
    textarea, input { outline: none; }
    ::selection { background: var(--accent); color: #fff; }
    .lucide { width: 20px; height: 20px; stroke-width: 2; }

    .app {
      width: min(100%, 760px); min-height: 100vh; margin: 0 auto;
      padding: env(safe-area-inset-top) var(--sp-lg) calc(var(--bottom-space) + env(safe-area-inset-bottom)) var(--sp-lg);
      touch-action: pan-y;
    }

    .header {
      min-height: var(--header-height); position: sticky; top: 0; z-index: 20; padding-top: var(--sp-sm);
      background: linear-gradient(to bottom, var(--bg) 82%, rgba(0,0,0,0));
      display: flex; flex-direction: column;
      transition: background var(--transition-theme);
    }
    .header-main { min-height: 52px; display: flex; align-items: center; justify-content: space-between; gap: var(--sp-md); }
    .brand { display: flex; align-items: center; gap: var(--sp-sm); min-width: 0; }
    .brand-mark { width: 36px; height: 36px; display: grid; place-items: center; overflow: hidden; border-radius: var(--radius-md); }
    .brand-mark-img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .brand-mark-fallback { display: grid; place-items: center; width: 100%; height: 100%; font-size: 18px; font-weight: 800; color: var(--accent); }
    .brand-name { font-size: var(--fs-lg); font-weight: var(--fw-extrabold); letter-spacing: -.3px; }
    .menu-btn { width: 44px; height: 44px; flex: 0 0 auto; border-radius: var(--radius-full); background: var(--surface); border: 1px solid var(--border); display: grid; place-items: center; color: var(--muted); box-shadow: var(--shadow-soft); transition: transform .14s ease; }
    .menu-btn:active { transform: scale(.93); }

    .header-nav { width: 100%; position: relative; margin-top: var(--sp-xs); display: flex; align-items: stretch; }
    .header-tab { position: relative; z-index: 2; min-height: 52px; flex: 1 1 0; padding: 0 var(--sp-sm) 6px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; color: var(--muted); font-size: var(--fs-base); font-weight: var(--fw-semibold); transition: color .18s ease; }
    .header-tab.active { color: var(--accent); }
    .header-tab-star { font-size: 20px; }
    .header-tab-indicator { position: absolute; z-index: 3; left: var(--tab-indicator-left); bottom: 0; width: var(--tab-indicator-width); height: 3px; border-radius: var(--radius-full); background: var(--accent); pointer-events: none; transition: left .28s cubic-bezier(.22,.75,.25,1), width .28s cubic-bezier(.22,.75,.25,1); }

    .hero { padding: var(--sp-lg) 2px var(--sp-md); }
    .hero-title { margin: 0; font-size: var(--fs-hero); line-height: 1.25; letter-spacing: -.3px; font-weight: var(--fw-bold); }
    .hero-date { margin-top: var(--sp-xs); color: var(--muted); font-size: var(--fs-sm); font-weight: var(--fw-medium); }

    .content { margin-top: var(--sp-md); }

    .section {
      margin-top: var(--sp-md);
      background: color-mix(in srgb, var(--surface) 60%, transparent);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: background var(--transition-theme), border-color var(--transition-theme);
    }
    .section:first-child { margin-top: 0; }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--sp-sm) var(--sp-md);
      border-bottom: 1px solid var(--border);
    }
    .section-title {
      display: flex;
      align-items: center;
      gap: var(--sp-sm);
      font-size: var(--fs-sm);
      font-weight: var(--fw-bold);
    }
    .section-count {
      min-width: 22px; height: 22px; padding: 0 5px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: var(--radius-full);
      background: var(--surface-3); color: var(--muted);
      font-size: var(--fs-xs); font-weight: var(--fw-bold);
    }
    .task-list {
      padding: 0 var(--sp-md);
      display: flex; flex-direction: column;
      position: relative; min-height: 20px;
    }

    .task { position: relative; display: flex; align-items: center; gap: var(--sp-md); min-height: 52px; padding: var(--sp-xs) 0; border-bottom: 1px solid var(--border); cursor: pointer; }
    .task:last-child { border-bottom: 0; }
    .task.completed { opacity: .55; }
    .task.drag-source { opacity: .35 !important; }
    .drag-ghost {
      opacity: .95 !important;
      background: var(--surface) !important;
      border: 1px solid var(--border-strong) !important;
      border-radius: var(--radius-md) !important;
      box-shadow: var(--shadow-drag) !important;
    }

    .task-checkbox { width: var(--touch-checkbox); height: var(--touch-checkbox); flex: 0 0 auto; display: grid; place-items: center; border-radius: var(--radius-full); border: 1.5px solid var(--muted); background: transparent; transition: all .18s ease; }
    .task.completed .task-checkbox { background: var(--accent); border-color: var(--accent); }
    .task-checkbox .lucide { width: 14px; height: 14px; color: #fff; opacity: 0; transform: scale(.5); transition: all .16s ease; }
    .task.completed .task-checkbox .lucide { opacity: 1; transform: scale(1); }

    .task-main { min-width: 0; flex: 1; padding: var(--sp-xs) 0; cursor: pointer; }
    .task-text { margin: 0; font-size: var(--fs-base); font-weight: var(--fw-medium); overflow-wrap: anywhere; }
    .task.completed .task-text { color: var(--muted); text-decoration: line-through; }

    .task-star { width: var(--touch-star); height: var(--touch-star); flex: 0 0 auto; display: grid; place-items: center; border-radius: var(--radius-full); color: #b8bdbd; transition: color .16s ease; }
    .task-star .lucide { width: 22px; height: 22px; }
    .task-star.active { color: var(--warning); }
    .task-star.active .lucide { fill: var(--warning); }

    .completed-section {
      margin-top: var(--sp-md);
      background: color-mix(in srgb, var(--surface) 60%, transparent);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .completed-toggle {
      width: 100%; min-height: 44px; padding: var(--sp-xs) var(--sp-md);
      display: flex; align-items: center; gap: var(--sp-sm);
      border-bottom: 1px solid var(--border);
    }
    .completed-toggle-title { display: flex; align-items: center; gap: var(--sp-sm); font-size: var(--fs-sm); font-weight: var(--fw-bold); }
    .completed-toggle-count {
      min-width: 22px; height: 22px; padding: 0 5px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: var(--radius-full);
      background: var(--surface-3); color: var(--muted);
      font-size: var(--fs-xs); font-weight: var(--fw-bold);
    }
    .completed-toggle-chevron { margin-right: auto; transition: transform .25s ease; }
    .completed-toggle-chevron .lucide { width: 14px; height: 14px; }
    .completed-toggle.open .completed-toggle-chevron { transform: rotate(180deg); }
    .completed-list-wrap { overflow: hidden; max-height: 0; opacity: 0; transition: max-height .30s ease, opacity .20s ease; }
    .completed-list-wrap.open { max-height: 4000px; opacity: 1; }

    .task-empty { padding: 36px var(--sp-xl); text-align: center; border-radius: var(--radius-lg); border: 1px solid var(--border); color: var(--muted); }
    .empty-symbol { width: 44px; height: 44px; margin: 0 auto var(--sp-md); display: grid; place-items: center; border-radius: var(--radius-md); background: var(--accent-soft); color: var(--accent); font-size: 18px; font-weight: var(--fw-extrabold); }
    .empty-title { color: var(--text); font-size: var(--fs-md); font-weight: var(--fw-bold); }
    .empty-text { margin-top: var(--sp-xs); color: var(--muted); font-size: var(--fs-sm); }

    .composer-wrap { position: fixed; z-index: 30; left: 50%; bottom: 0; width: min(760px, 100%); transform: translateX(-50%); padding: 0 var(--sp-lg) calc(var(--sp-md) + env(safe-area-inset-bottom)); pointer-events: none; display: flex; justify-content: flex-end; }
    .composer-fab { pointer-events: auto; width: var(--fab-size); height: var(--fab-size); border-radius: var(--radius-full); background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 4px 16px rgba(0,0,0,.18); transition: transform .15s ease; }
    .composer-fab:active { transform: scale(.93); }
    .composer-fab.hidden { display: none; }

    .composer-panel { pointer-events: auto; position: fixed; z-index: 31; left: 50%; bottom: 0; transform: translateX(-50%) translateY(100%); width: min(100%, 760px); background: var(--surface); border-radius: var(--radius-xl) var(--radius-xl) 0 0; box-shadow: var(--shadow-sheet); border: 1px solid var(--border); transition: transform .28s ease; padding: var(--sp-lg) var(--sp-lg) calc(var(--sp-md) + env(safe-area-inset-bottom)); }
    .composer-panel.open { transform: translateX(-50%) translateY(0); }
    .composer-input-row { display: flex; align-items: center; gap: var(--sp-sm); }
    .composer-input-row textarea { flex: 1; min-height: 52px; max-height: 110px; resize: none; padding: var(--sp-md); border: none; background: transparent; color: var(--text); font-size: var(--fs-base); }
    .composer-input-row textarea::placeholder { color: var(--muted); opacity: .6; }
    .send-btn { width: 46px; height: 46px; flex: 0 0 auto; border-radius: var(--radius-full); background: var(--accent); color: #fff; display: grid; place-items: center; transition: opacity .18s ease; }
    .send-btn .lucide { width: 20px; height: 20px; }
    .send-btn.disabled { opacity: .4; }

    .overlay { position: fixed; inset: 0; z-index: 100; display: flex; align-items: flex-end; justify-content: center; padding: var(--sp-lg); background: rgba(0,0,0,.40); opacity: 0; visibility: hidden; transition: opacity .20s ease, visibility .20s ease; }
    .overlay.show { opacity: 1; visibility: visible; }
    .sheet { width: min(100%, 520px); max-height: min(82vh, 680px); overflow-y: auto; padding: var(--sp-lg); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl); box-shadow: var(--shadow-sheet); transform: translateY(18px); transition: transform .24s ease; position: relative; }
    .overlay.show .sheet { transform: translateY(0); }
    .sheet-handle { width: 36px; height: 5px; margin: 2px auto 14px; border-radius: var(--radius-full); background: var(--surface-3); }
    .sheet-close-btn { position: absolute; top: 10px; left: 10px; width: 40px; height: 40px; border-radius: var(--radius-full); background: var(--surface-2); display: grid; place-items: center; color: var(--muted); z-index: 2; }
    .sheet-close-btn .lucide { width: 16px; height: 16px; }
    .sheet-title { padding: 4px 4px 12px; font-size: var(--fs-lg); font-weight: var(--fw-bold); }

    .action-task-preview {
      width: 100%; margin: 4px 4px 8px; padding: var(--sp-md);
      border-radius: var(--radius-md); background: var(--surface-2);
      display: flex; align-items: center; justify-content: space-between; gap: var(--sp-sm);
      cursor: pointer;
    }
    .action-task-preview-text { flex: 1; font-size: var(--fs-md); font-weight: var(--fw-semibold); }
    .action-task-edit-input { width: 100%; min-height: 60px; padding: var(--sp-sm); border: 0; background: transparent; color: var(--text); resize: none; font-size: var(--fs-md); }

    .action-item { width: 100%; min-height: 52px; padding: 0 var(--sp-md); display: flex; align-items: center; gap: var(--sp-md); border-radius: var(--radius-md); transition: background .15s ease; }
    .action-item:active { background: var(--surface-2); }
    .action-item.danger { color: var(--danger); }
    .action-item .lucide { width: 20px; height: 20px; color: var(--muted); }
    .action-item.danger .lucide { color: var(--danger); }
    .action-text { flex: 1; font-weight: var(--fw-medium); }

    .menu-item { width: 100%; min-height: 52px; padding: 0 var(--sp-md); display: flex; align-items: center; gap: var(--sp-md); border-radius: var(--radius-md); transition: background .15s ease; }
    .menu-item:active { background: var(--surface-2); }
    .menu-item .lucide { width: 20px; height: 20px; color: var(--muted); }
    .menu-text { flex: 1; font-weight: var(--fw-medium); }

    .setting-group { margin-bottom: var(--sp-md); }
    .setting-label { padding: 0 var(--sp-sm) var(--sp-sm); color: var(--muted); font-size: var(--fs-xs); font-weight: var(--fw-bold); }
    .setting-box { overflow: hidden; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); }
    .setting-row { min-height: 54px; padding: 0 var(--sp-md); display: flex; align-items: center; justify-content: space-between; gap: var(--sp-sm); border-bottom: 1px solid var(--border); }
    .setting-row:last-child { border-bottom: 0; }
    .setting-name { font-size: var(--fs-base); font-weight: var(--fw-medium); }
    .segmented { display: flex; gap: 2px; padding: 3px; border-radius: var(--radius-sm); background: var(--surface-2); }
    .segment { min-height: 32px; padding: 0 var(--sp-sm); border-radius: 7px; background: transparent; color: var(--muted); font-size: var(--fs-sm); font-weight: var(--fw-semibold); transition: all .16s ease; }
    .segment.active { background: var(--accent); color: #fff; }
    .colors { display: flex; align-items: center; gap: var(--sp-sm); }
    .color-btn { width: 28px; height: 28px; border-radius: var(--radius-full); border: 2px solid var(--surface); outline: 1px solid var(--border); position: relative; }
    .color-btn.active::after { content: "✓"; position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: var(--fw-bold); }
    .green { background: #19a974; } .blue { background: #3b82f6; } .purple { background: #8b5cf6; } .orange { background: #f59e0b; } .pink { background: #ec4899; }

    .time-input { width: 110px; min-height: 36px; padding: 0 var(--sp-sm); border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font-size: var(--fs-sm); font-weight: var(--fw-semibold); text-align: center; }

    .flatpickr-calendar { font-family: "Cairo", sans-serif !important; }
    .flatpickr-day.selected { background: var(--accent) !important; border-color: var(--accent) !important; }

    .hidden { display: none !important; }
    .no-scroll { overflow: hidden; }

    @media (max-width: 480px) {
      .app { padding-left: var(--sp-md); padding-right: var(--sp-md); }
      .task { min-height: 48px; gap: var(--sp-sm); }
      .task-checkbox { width: 28px; height: 28px; }
      .task-star { width: 40px; height: 40px; }
      .task-star .lucide { width: 18px; height: 18px; }
      .section-head { padding: var(--sp-xs) var(--sp-sm); }
      .task-list { padding: 0 var(--sp-sm); }
      .segment { padding: 0 var(--sp-xs); font-size: var(--fs-xs); }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-main">
        <div class="brand">
          <div class="brand-mark" id="brandMark">
            <img class="brand-mark-img" id="brandMarkImg" src="./icon-512.png" alt="ناوي" width="36" height="36" onerror="this.remove(); document.getElementById('brandMarkFallback').style.display = 'grid';">
            <span class="brand-mark-fallback" id="brandMarkFallback" style="display:none;">ن</span>
          </div>
          <div class="brand-name" id="brandName">ناوي</div>
        </div>
        <button class="menu-btn" id="menuBtn" type="button"><i data-lucide="more-horizontal"></i></button>
      </div>
      <nav class="header-nav" id="headerNav">
        <button class="header-tab" data-view="all" type="button">نواياي</button>
        <button class="header-tab active" data-view="today" type="button">اليوم</button>
        <button class="header-tab" data-view="favorites" type="button"><i data-lucide="star" style="width:18px;height:18px;"></i></button>
        <span class="header-tab-indicator" id="headerTabIndicator"></span>
      </nav>
    </header>

    <section class="hero">
      <h1 class="hero-title" id="heroTitle">ناوي على إيه النهارده؟</h1>
      <div class="hero-date" id="heroDate"></div>
    </section>

    <main class="content" id="content"></main>
  </div>

  <div class="composer-wrap" id="composerWrap">
    <button class="composer-fab" id="composerFab" type="button"><i data-lucide="plus"></i></button>
  </div>

  <div class="composer-panel" id="composerPanel">

  <div class="overlay" id="trashOverlay">
    <div class="sheet">
      <button class="sheet-close-btn" type="button" data-close-overlay="trashOverlay"><i data-lucide="x"></i></button>
      <div class="sheet-handle"></div>
      <div class="sheet-title">أرشيف النوايا</div>
      <div id="trashList"></div>
    </div>
  </div>

  <script>
    "use strict";

    const STORAGE_KEYS = { tasks: "nawy_tasks_v9", trash: "nawy_trash_v2", settings: "nawy_settings_v2" };
    const DEFAULT_SETTINGS = { theme: "system", accent: "green", language: "ar", fontSize: "medium", notificationEnabled: false, notificationTime: "09:00" };
    
    let tasks = [], trash = [], settings = { ...DEFAULT_SETTINGS };
    let currentView = "today", selectedTaskId = null, completedExpanded = false;
    let swipeStartX = 0, swipeStartY = 0, swipeTracking = false;

    const $ = s => document.querySelector(s);
    const $$ = s => [...document.querySelectorAll(s)];

    const content = $("#content"), taskInput = $("#taskInput"), sendBtn = $("#sendBtn"), composerFab = $("#composerFab"), composerPanel = $("#composerPanel");
    const heroDate = $("#heroDate"), heroTitle = $("#heroTitle");
    const headerNav = $("#headerNav"), headerTabIndicator = $("#headerTabIndicator");
    const menuOverlay = $("#menuOverlay"), actionOverlay = $("#actionOverlay"), repeatOverlay = $("#repeatOverlay"), dateOverlay = $("#dateOverlay"), settingsOverlay = $("#settingsOverlay"), trashOverlay = $("#trashOverlay");
    const taskDateInput = $("#taskDateInput"), trashList = $("#trashList");
    const notificationToggleBtn = $("#notificationToggleBtn"), notificationTimeRow = $("#notificationTimeRow"), notificationTimeInput = $("#notificationTimeInput");
    const actionPreviewContainer = $("#actionPreviewContainer");

    function pad(n) { return String(n).padStart(2, "0"); }
    function getDateKey(d = new Date()) { return [d.getFullYear(), pad(d.getMonth()+1), pad(d.getDate())].join("-"); }
    function createId() { return Date.now().toString(36) + Math.random().toString(36).slice(2,9); }
    function safeParse(v, f) { try { return JSON.parse(v) ?? f; } catch { return f; } }

    function loadData() {
      tasks = safeParse(localStorage.getItem(STORAGE_KEYS.tasks), []).filter(t => t && t.text);
      trash = safeParse(localStorage.getItem(STORAGE_KEYS.trash), []).filter(t => t && t.text);
      settings = { ...DEFAULT_SETTINGS, ...safeParse(localStorage.getItem(STORAGE_KEYS.settings), {}) };
    }
    function saveTasks() { localStorage.setItem(STORAGE_KEYS.tasks, JSON.stringify(tasks)); }
    function saveTrash() { localStorage.setItem(STORAGE_KEYS.trash, JSON.stringify(trash)); }
    function saveSettings() { localStorage.setItem(STORAGE_KEYS.settings, JSON.stringify(settings)); }

    function showToast(message, type = 'success', canUndo = false, undoCallback = null) {
      const colors = { success: '#19a974', error: '#e5484d', warning: '#e8a317', info: '#3b82f6' };
      const toast = Toastify({
        text: message,
        duration: canUndo ? 5000 : 3000,
        close: true,
        gravity: 'bottom',
        position: 'center',
        style: {
          background: colors[type] || colors.success,
          borderRadius: '14px',
          padding: '12px 20px',
          fontFamily: '"Cairo", sans-serif',
          fontWeight: '600',
          fontSize: '14px',
          boxShadow: '0 8px 24px rgba(0,0,0,.15)',
        }
      });
      if (canUndo && undoCallback) {
        toast.options.onClick = function() { undoCallback(); toast.hideToast(); };
      }
      toast.showToast();
    }

    function addTask(text) {
      const clean = String(text || "").trim();
      if (!clean) return false;
      tasks.unshift({ id: createId(), text: clean, completed: false, starred: false, createdAt: Date.now(), taskDay: getDateKey(), scheduledDate: null, completedAt: null, repeat: 'none' });
      saveTasks();
      render();
      showToast("تمت إضافة النية ✨", 'success');
      return true;
    }

    function completeTask(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      task.completed = !task.completed;
      task.completedAt = task.completed ? Date.now() : null;
      saveTasks();
      render();
      if (task.completed) {
        if (typeof confetti === 'function') {
          confetti({ particleCount: 80, spread: 60, origin: { y: 0.7 }, colors: ['#19a974', '#ffd700', '#ff6b6b', '#4ecdc4', '#45b7d1'] });
        }
        if (navigator.vibrate) navigator.vibrate([50, 30, 50]);
        showToast("تم إتمام النية 🎉", 'success');
      }
    }

    function toggleStar(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      task.starred = !task.starred;
      saveTasks();
      render();
    }

    function deleteTask(id) {
      const index = tasks.findIndex(t => t.id === id);
      if (index === -1) return;
      const [deleted] = tasks.splice(index, 1);
      trash.unshift({ ...deleted, deletedAt: Date.now() });
      saveTasks();
      saveTrash();
      render();
      showToast("تم التراجع - اضغط للاسترجاع", 'warning', true, () => {
        const ti = trash.findIndex(t => t.id === deleted.id);
        if (ti !== -1) trash.splice(ti, 1);
        tasks.unshift(deleted);
        saveTasks();
        saveTrash();
        render();
        showToast("تم الاسترجاع ✅", 'success');
      });
    }

    function render() {
      heroDate.textContent = new Intl.DateTimeFormat(settings.language === "en" ? "en-US" : "ar-EG", { weekday: "long", day: "numeric", month: "long" }).format(new Date());
      content.innerHTML = "";
      
      if (currentView === "today") {
        const active = tasks.filter(t => !t.completed && (t.scheduledDate ? t.scheduledDate === getDateKey() : t.taskDay === getDateKey()));
        const completed = tasks.filter(t => t.completed && t.completedAt && getDateKey(new Date(t.completedAt)) === getDateKey());
        if (active.length === 0 && completed.length === 0) {
          content.appendChild(createEmptyState("ن", "مفيش نوايا لسه", "اكتب أول نية ناوي تعملها النهارده."));
        } else {
          if (active.length > 0) content.appendChild(createSection("اليوم", active));
          if (completed.length > 0) content.appendChild(createCompletedSection(completed));
        }
      } else if (currentView === "all") {
        const active = tasks.filter(t => !t.completed);
        const completed = tasks.filter(t => t.completed);
        if (active.length > 0) content.appendChild(createSection("نواياي", active));
        if (completed.length > 0) content.appendChild(createCompletedSection(completed));
      } else if (currentView === "favorites") {
        const favActive = tasks.filter(t => t.starred && !t.completed);
        const favCompleted = tasks.filter(t => t.starred && t.completed);
        if (favActive.length === 0 && favCompleted.length === 0) {
          content.appendChild(createEmptyState("★", "مفيش مفضلات لسه", "علّم أي نية بنجمة وهتظهر هنا."));
        } else {
          if (favActive.length > 0) content.appendChild(createSection("المفضلة النشطة", favActive));
          if (favCompleted.length > 0) content.appendChild(createCompletedSection(favCompleted));
        }
      }
      
      updateHeaderNav();
      requestAnimationFrame(updateIndicator);
      setTimeout(initSortable, 50);
      lucide.createIcons();
    }

    function createSection(title, taskArray) {
      const section = document.createElement("section");
      section.className = "section";
      const head = document.createElement("div");
      head.className = "section-head";
      const titleEl = document.createElement("div");
      titleEl.className = "section-title";
      titleEl.textContent = title;
      const count = document.createElement("span");
      count.className = "section-count";
      count.textContent = taskArray.length;
      titleEl.appendChild(count);
      head.appendChild(titleEl);
      const list = document.createElement("div");
      list.className = "task-list";
      taskArray.forEach(task => list.appendChild(createTaskElement(task)));
      section.append(head, list);
      return section;
    }

    function createCompletedSection(taskArray) {
      const section = document.createElement("section");
      section.className = "completed-section";
      const toggle = document.createElement("button");
      toggle.type = "button";
      toggle.className = "completed-toggle" + (completedExpanded ? " open" : "");
      const title = document.createElement("span");
      title.className = "completed-toggle-title";
      title.textContent = "المكتملة";
      const count = document.createElement("span");
      count.className = "completed-toggle-count";
      count.textContent = taskArray.length;
      title.appendChild(count);
      const chevron = document.createElement("span");
      chevron.className = "completed-toggle-chevron";
      chevron.innerHTML = '<i data-lucide="chevron-down"></i>';
      toggle.append(title, chevron);
      const listWrap = document.createElement("div");
      listWrap.className = "completed-list-wrap" + (completedExpanded ? " open" : "");
      const list = document.createElement("div");
      list.className = "task-list";
      taskArray.forEach(task => list.appendChild(createTaskElement(task, true)));
      listWrap.appendChild(list);
      toggle.addEventListener("click", () => { completedExpanded = !completedExpanded; render(); });
      section.append(toggle, listWrap);
      return section;
    }

    function createTaskElement(task, isCompleted = false) {
      const article = document.createElement("article");
      article.className = "task" + (task.completed ? " completed" : "");
      article.dataset.taskId = task.id;
      article.innerHTML = `
        <button class="task-checkbox" type="button"><i data-lucide="check"></i></button>
        <div class="task-main"><p class="task-text">${task.text}</p></div>
        <button class="task-star" type="button"><i data-lucide="star"></i></button>
      `;
      article.querySelector(".task-checkbox").addEventListener("click", e => { e.stopPropagation(); completeTask(task.id); });
      article.querySelector(".task-star").addEventListener("click", e => { e.stopPropagation(); toggleStar(task.id); });
      article.querySelector(".task-main").addEventListener("click", () => openAction(task.id));
      return article;
    }

    function createEmptyState(symbol, title, message) {
      const box = document.createElement("div");
      box.className = "task-empty";
      box.innerHTML = `<div class="empty-symbol">${symbol}</div><div class="empty-title">${title}</div><div class="empty-text">${message}</div>`;
      return box;
    }

    function initSortable() {
      document.querySelectorAll(".task-list").forEach(list => {
        if (list.sortableInstance) list.sortableInstance.destroy();
        list.sortableInstance = new Sortable(list, {
          animation: 150,
          ghostClass: 'drag-ghost',
          dragClass: 'drag-source',
          delay: 200,
          delayOnTouchOnly: true,
          onEnd: function() {
            const newOrder = [...list.querySelectorAll(".task")].map(el => el.dataset.taskId);
            const activeTasks = tasks.filter(t => !t.completed);
            const completedTasks = tasks.filter(t => t.completed);
            const taskMap = new Map();
            activeTasks.forEach(t => taskMap.set(t.id, t));
            const reordered = [];
            newOrder.forEach(id => { if (taskMap.has(id)) { reordered.push(taskMap.get(id)); taskMap.delete(id); } });
            taskMap.forEach(t => reordered.push(t));
            tasks = [...reordered, ...completedTasks];
            saveTasks();
          }
        });
      });
    }

    function updateHeaderNav() {
      $$(".header-tab").forEach(btn => {
        const active = btn.dataset.view === currentView;
        btn.classList.toggle("active", active);
        if (active) btn.setAttribute("aria-current", "page"); else btn.removeAttribute("aria-current");
      });
    }

    function updateIndicator() {
      const activeTab = headerNav.querySelector(`.header-tab[data-view="${currentView}"]`);
      if (!activeTab) return;
      const navRect = headerNav.getBoundingClientRect();
      const tabRect = activeTab.getBoundingClientRect();
      const w = Math.max(22, Math.min(36, tabRect.width * .32));
      const left = (tabRect.left - navRect.left + (tabRect.width - w)/2);
      headerNav.style.setProperty("--tab-indicator-width", `${w}px`);
      headerNav.style.setProperty("--tab-indicator-left", `${left}px`);
    }

    function setView(view) {
      if (!["all", "today", "favorites"].includes(view)) return;
      currentView = view;
      closeAllOverlays();
      closeComposer();
      render();
    }

    function openAction(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      selectedTaskId = id;
      
      actionPreviewContainer.innerHTML = `
        <button class="action-task-preview" id="actionTaskPreview" type="button">
          <span class="action-task-preview-text">${task.text}</span>
          <i data-lucide="pencil"></i>
        </button>
      `;
      
      $("#actionComplete .action-text").textContent = task.completed ? "أعد فتح النية" : "أتمم النية";
      $("#actionDateText").textContent = task.scheduledDate ? `تغيير الموعد - ${task.scheduledDate}` : "تحديد موعد";
      
      $("#actionTaskPreview").addEventListener("click", () => {
        const preview = $("#actionTaskPreview");
        const editArea = document.createElement("textarea");
        editArea.className = "action-task-edit-input";
        editArea.value = task.text;
        preview.replaceWith(editArea);
        editArea.focus();
        editArea.setSelectionRange(editArea.value.length, editArea.value.length);
        
        editArea.addEventListener("blur", () => {
          const newText = editArea.value.trim();
          if (newText && newText !== task.text) {
            task.text = newText;
            saveTasks();
            render();
            showToast("تم التعديل ✏️", 'success');
          }
          closeOverlay(actionOverlay);
          selectedTaskId = null;
        });
      });
      
      openOverlay(actionOverlay);
      lucide.createIcons();
    }

    function openOverlay(overlay) { overlay.classList.add("show"); document.body.classList.add("no-scroll"); }
    function closeOverlay(overlay) { overlay.classList.remove("show"); if (!document.querySelector(".overlay.show")) document.body.classList.remove("no-scroll"); }
    function closeAllOverlays() { $$(".overlay.show").forEach(closeOverlay); selectedTaskId = null; }

    function openComposer() { composerFab.classList.add("hidden"); composerPanel.classList.add("open"); taskInput.focus(); }
    function closeComposer() { composerFab.classList.remove("hidden"); composerPanel.classList.remove("open"); taskInput.value = ""; sendBtn.classList.add("disabled"); }

    function applySettings() {
      let theme = settings.theme;
      if (theme === "system") {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", theme);
      document.documentElement.setAttribute("data-accent", settings.accent);
      document.documentElement.setAttribute("data-font", settings.fontSize);
      $$("[data-theme-choice]").forEach(btn => btn.classList.toggle("active", btn.dataset.themeChoice === settings.theme));
      $$("[data-accent-choice]").forEach(btn => btn.classList.toggle("active", btn.dataset.accentChoice === settings.accent));
      $$("[data-font-choice]").forEach(btn => btn.classList.toggle("active", btn.dataset.fontChoice === settings.fontSize));
      $$("[data-language-choice]").forEach(btn => btn.classList.toggle("active", btn.dataset.languageChoice === settings.language));
    }

    // ============ Event Listeners ============
    composerFab.addEventListener("click", openComposer);
    $("#composer").addEventListener("submit", e => { e.preventDefault(); if (addTask(taskInput.value)) closeComposer(); });
    taskInput.addEventListener("input", () => sendBtn.classList.toggle("disabled", !taskInput.value.trim().length));
    $$(".header-tab").forEach(btn => btn.addEventListener("click", () => setView(btn.dataset.view)));
    $("#menuBtn").addEventListener("click", () => openOverlay(menuOverlay));
    $("#settingsBtn").addEventListener("click", () => { closeOverlay(menuOverlay); openOverlay(settingsOverlay); });
    $("#menuTrashBtn").addEventListener("click", () => { closeOverlay(menuOverlay); renderTrash(); openOverlay(trashOverlay); });
    $$("[data-close-overlay]").forEach(btn => btn.addEventListener("click", () => closeOverlay(document.getElementById(btn.dataset.closeOverlay))));
    $$(".overlay").forEach(overlay => overlay.addEventListener("click", e => { if (e.target === overlay) closeOverlay(overlay); }));
    $("#actionComplete").addEventListener("click", () => { if (selectedTaskId) { completeTask(selectedTaskId); closeOverlay(actionOverlay); selectedTaskId = null; } });
    $("#actionDelete").addEventListener("click", () => { if (selectedTaskId) { deleteTask(selectedTaskId); closeOverlay(actionOverlay); selectedTaskId = null; } });
    $("#actionRepeat").addEventListener("click", () => { closeOverlay(actionOverlay); openOverlay(repeatOverlay); });
    $("#actionDate").addEventListener("click", () => { closeOverlay(actionOverlay); openOverlay(dateOverlay); initFlatpickr(); });

    repeatOverlay.querySelectorAll("[data-repeat]").forEach(btn => btn.addEventListener("click", () => {
      if (selectedTaskId) {
        const task = tasks.find(t => t.id === selectedTaskId);
        if (task) { task.repeat = btn.dataset.repeat; saveTasks(); }
      }
      closeOverlay(repeatOverlay); selectedTaskId = null; render();
    }));

    function initFlatpickr() {
      if (taskDateInput._flatpickr) taskDateInput._flatpickr.destroy();
      flatpickr(taskDateInput, {
        dateFormat: "Y-m-d",
        locale: settings.language === "ar" ? "ar" : "en",
        clickOpens: true,
      });
    }

    $$(".quick-date").forEach(btn => btn.addEventListener("click", () => {
      const today = new Date();
      let date = today;
      if (btn.dataset.date === "tomorrow") {
        date = new Date(today);
        date.setDate(date.getDate() + 1);
      }
      taskDateInput.value = getDateKey(date);
    }));

    $("#dateSave").addEventListener("click", () => {
      if (selectedTaskId && taskDateInput.value) {
        const task = tasks.find(t => t.id === selectedTaskId);
        if (task) { task.scheduledDate = taskDateInput.value; saveTasks(); }
      }
      closeOverlay(dateOverlay); selectedTaskId = null; render();
    });

    $("#dateClear").addEventListener("click", () => {
      if (selectedTaskId) {
        const task = tasks.find(t => t.id === selectedTaskId);
        if (task) { task.scheduledDate = null; saveTasks(); }
      }
      closeOverlay(dateOverlay); selectedTaskId = null; render();
    });

    function renderTrash() {
      trashList.innerHTML = "";
      if (trash.length === 0) {
        trashList.innerHTML = `<div class="task-empty"><div class="empty-title">الأرشيف فاضي</div></div>`;
        return;
      }
      trash.forEach(task => {
        const item = document.createElement("div");
        item.className = "trash-item";
        item.style.cssText = "padding:12px;border-radius:12px;background:var(--surface-2);display:flex;align-items:center;gap:8px;";
        const text = document.createElement("div");
        text.textContent = task.text;
        text.style.cssText = "flex:1;min-width:0;font-size:14px;";
        const restore = document.createElement("button");
        restore.textContent = "استرجاع";
        restore.style.cssText = "min-height:36px;padding:0 12px;border-radius:8px;background:var(--surface);font-size:13px;font-weight:600;";
        restore.addEventListener("click", () => {
          const index = trash.findIndex(t => t.id === task.id);
          if (index !== -1) {
            const [restored] = trash.splice(index, 1);
            delete restored.deletedAt;
            tasks.unshift(restored);
            saveTasks(); saveTrash(); renderTrash();
            showToast("تم الاسترجاع ✅", 'success');
          }
        });
        item.append(text, restore);
        trashList.appendChild(item);
      });
    }

    // ============ Swipe Navigation ============
    document.addEventListener("touchstart", function(e) {
      if (e.target.closest(".task-list, button, input, textarea, .overlay, .sheet, .composer-panel")) return;
      const touch = e.touches[0];
      swipeStartX = touch.clientX;
      swipeStartY = touch.clientY;
      swipeTracking = true;
    }, { passive: true });

    document.addEventListener("touchend", function(e) {
      if (!swipeTracking) return;
      swipeTracking = false;
      const touch = e.changedTouches[0];
      const dx = touch.clientX - swipeStartX;
      const dy = touch.clientY - swipeStartY;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        const views = ["all", "today", "favorites"];
        const currentIndex = views.indexOf(currentView);
        const isRTL = document.documentElement.dir === "rtl";
        if (isRTL) {
          if (dx < 0) setView(views[(currentIndex + 1) % views.length]);
          else setView(views[(currentIndex - 1 + views.length) % views.length]);
        } else {
          if (dx > 0) setView(views[(currentIndex + 1) % views.length]);
          else setView(views[(currentIndex - 1 + views.length) % views.length]);
        }
      }
    }, { passive: true });

    // ============ Settings ============
    $$("[data-theme-choice]").forEach(btn => btn.addEventListener("click", () => { settings.theme = btn.dataset.themeChoice; saveSettings(); applySettings(); }));
    $$("[data-accent-choice]").forEach(btn => btn.addEventListener("click", () => { settings.accent = btn.dataset.accentChoice; saveSettings(); applySettings(); }));
    $$("[data-font-choice]").forEach(btn => btn.addEventListener("click", () => { settings.fontSize = btn.dataset.fontChoice; saveSettings(); applySettings(); render(); }));
    $$("[data-language-choice]").forEach(btn => btn.addEventListener("click", () => { settings.language = btn.dataset.languageChoice; saveSettings(); applySettings(); render(); }));

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (settings.theme === "system") applySettings();
    });

    // ============ Notifications ============
    notificationToggleBtn.addEventListener("click", () => {
      if (!("Notification" in window)) { showToast("المتصفح لا يدعم الإشعارات", 'error'); return; }
      if (Notification.permission === "granted") {
        settings.notificationEnabled = !settings.notificationEnabled;
        saveSettings();
        updateNotificationUI();
      } else {
        Notification.requestPermission().then(permission => {
          if (permission === "granted") {
            settings.notificationEnabled = true;
            saveSettings();
            updateNotificationUI();
            showToast("تم تفعيل الإشعارات 🔔", 'success');
          } else {
            showToast("تم رفض الإذن", 'error');
          }
        });
      }
    });

    function updateNotificationUI() {
      notificationToggleBtn.textContent = settings.notificationEnabled ? "تعطيل" : "تفعيل";
      notificationTimeRow.classList.toggle("hidden", !settings.notificationEnabled);
      notificationTimeInput.value = settings.notificationTime;
    }

    notificationTimeInput.addEventListener("change", () => {
      settings.notificationTime = notificationTimeInput.value;
      saveSettings();
      showToast("تم تحديث وقت الإشعار", 'success');
    });

    // ============ Init ============
    function init() {
      loadData();
      applySettings();
      updateNotificationUI();
      render();
      requestAnimationFrame(updateIndicator);
      lucide.createIcons();
    }

    init();
  </script>
</body>
</html>
