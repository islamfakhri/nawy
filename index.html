<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark" data-accent="blue" data-font="medium">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3b82f6">
  <meta name="description" content="ناوي - مساحتك الشخصية لنواياك وأهدافك">
  <title>ناوي</title>
  
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="Icon-192.png">
  
  <!-- الخط -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- SortableJS -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    /* ============ المتغيرات ============ */
    :root {
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --radius-xl: 24px;
      --radius-full: 9999px;
      --fab-size: 56px;
      --bottom-space: 90px;
      --header-height: 72px;
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ============ الوضع النهاري ============ */
    html[data-theme="light"] {
      --bg: #FAF9F7;
      --surface: #FFFFFF;
      --surface-2: #F5F5F4;
      --surface-3: #E7E5E4;
      --text: #1A1A1A;
      --muted: #6B7280;
      --border: #E5E7EB;
      --border-strong: #D1D5DB;
      --shadow-soft: 0 1px 3px rgba(0,0,0,0.03);
      --shadow-card: 0 2px 8px rgba(0,0,0,0.04);
      --shadow-sheet: 0 16px 50px rgba(0,0,0,0.12);
      --shadow-drag: 0 8px 24px rgba(0,0,0,0.15);
    }

    /* ============ الوضع الداكن (افتراضي) ============ */
    html[data-theme="dark"] {
      --bg: #0F1115;
      --surface: #181B20;
      --surface-2: #1F2329;
      --surface-3: #2A2F36;
      --text: #E5E7EB;
      --muted: #9CA3AF;
      --border: #272A30;
      --border-strong: #3A3F46;
      --shadow-soft: 0 1px 4px rgba(0,0,0,0.15);
      --shadow-card: 0 4px 12px rgba(0,0,0,0.20);
      --shadow-sheet: 0 20px 60px rgba(0,0,0,0.40);
      --shadow-drag: 0 12px 32px rgba(0,0,0,0.40);
    }

    /* ============ السِمات اللونية ============ */
    html[data-accent="blue"] { --accent: #3b82f6; --accent-soft: rgba(59,130,246,0.08); }
    html[data-accent="green"] { --accent: #10b981; --accent-soft: rgba(16,185,129,0.08); }
    html[data-accent="purple"] { --accent: #8b5cf6; --accent-soft: rgba(139,92,246,0.08); }
    html[data-accent="orange"] { --accent: #f59e0b; --accent-soft: rgba(245,158,11,0.10); }
    html[data-accent="pink"] { --accent: #ec4899; --accent-soft: rgba(236,72,153,0.08); }

    /* ============ أحجام الخطوط ============ */
    html[data-font="small"] { --fs-xs: 10px; --fs-sm: 12px; --fs-md: 13px; --fs-base: 14px; --fs-lg: 15px; --fs-hero: 19px; }
    html[data-font="medium"], html:not([data-font]) { --fs-xs: 11px; --fs-sm: 13px; --fs-md: 14px; --fs-base: 16px; --fs-lg: 18px; --fs-hero: 22px; }
    html[data-font="large"] { --fs-xs: 12px; --fs-sm: 14px; --fs-md: 16px; --fs-base: 18px; --fs-lg: 20px; --fs-hero: 25px; }

    /* ============ أساسيات ============ */
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    html { min-height: 100%; background: var(--bg); }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Cairo", "Segoe UI", system-ui, sans-serif;
      font-size: var(--fs-base);
      line-height: 1.6;
      transition: background var(--transition), color var(--transition);
      overscroll-behavior-y: none;
      touch-action: pan-y;
    }
    button { border: 0; cursor: pointer; color: inherit; background: none; font: inherit; }
    input, textarea { outline: none; font: inherit; border: none; background: none; color: inherit; }
    ::selection { background: var(--accent); color: #fff; }

    /* ============ أيقونات SVG ============ */
    .icon { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

    /* ============ التطبيق ============ */
    .app {
      width: min(100%, 760px);
      min-height: 100vh;
      margin: 0 auto;
      padding: env(safe-area-inset-top) 16px calc(var(--bottom-space) + env(safe-area-inset-bottom));
    }

    /* ============ الهيدر ============ */
    .header {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 12px 0 8px;
      background: linear-gradient(to bottom, var(--bg) 85%, transparent);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand-icon { width: 36px; height: 36px; display: grid; place-items: center; border-radius: var(--radius-md); overflow: hidden; }
    .brand-icon img { width: 100%; height: 100%; object-fit: contain; }
    .brand-icon .fallback { display: none; font-weight: 800; font-size: 18px; color: var(--accent); }
    .brand-name { font-size: var(--fs-lg); font-weight: 800; letter-spacing: -0.3px; }
    .menu-btn {
      width: 44px; height: 44px;
      border-radius: var(--radius-full);
      background: var(--surface);
      border: 1px solid var(--border);
      display: grid; place-items: center;
      color: var(--muted);
      box-shadow: var(--shadow-soft);
      transition: transform 0.14s ease;
    }
    .menu-btn:active { transform: scale(0.93); }

    /* ============ التبويبات ============ */
    .tabs {
      position: relative;
      display: flex;
      margin-top: 12px;
      background: var(--surface-2);
      border-radius: var(--radius-full);
      padding: 4px;
      gap: 4px;
    }
    .tab {
      flex: 1;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: var(--radius-full);
      font-size: var(--fs-sm);
      font-weight: 700;
      color: var(--muted);
      transition: all 0.25s ease;
      position: relative;
      z-index: 2;
    }
    .tab.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow-soft);
    }
    .tab .count {
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-full);
      background: var(--accent-soft);
      color: var(--accent);
      font-size: var(--fs-xs);
      font-weight: 800;
    }

    /* ============ الترحيب ============ */
    .hero { padding: 20px 4px 12px; }
    .hero-title {
      margin: 0;
      font-size: var(--fs-hero);
      line-height: 1.3;
      letter-spacing: -0.2px;
      font-weight: 700;
    }
    .hero-sub { margin-top: 4px; color: var(--muted); font-size: var(--fs-sm); font-weight: 500; }

    /* ============ المحتوى ============ */
    .content { margin-top: 8px; }

    /* ============ الأقسام ============ */
    .section {
      margin-top: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .section:first-child { margin-top: 0; }
    .section-header {
      min-height: 48px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
    }
    .section-title { font-size: var(--fs-sm); font-weight: 700; }
    .section-count {
      min-width: 22px;
      height: 22px;
      padding: 0 5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-full);
      background: var(--surface-2);
      color: var(--muted);
      font-size: var(--fs-xs);
      font-weight: 700;
    }
    .section-chevron { margin-right: auto; transition: transform 0.25s ease; }
    .section-chevron .icon { width: 14px; height: 14px; }
    .section.collapsed .section-chevron { transform: rotate(180deg); }
    .section-body {
      max-height: 5000px;
      opacity: 1;
      transition: max-height 0.3s ease, opacity 0.2s ease;
      overflow: hidden;
    }
    .section.collapsed .section-body { max-height: 0; opacity: 0; }

    /* ============ قائمة النوايا ============ */
    .task-list { padding: 0 12px; display: flex; flex-direction: column; min-height: 20px; }
    .task {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 52px;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .task:last-child { border-bottom: 0; }
    .task.completed { opacity: 0.55; }
    .task.drag-source { opacity: 0.35 !important; }
    .drag-ghost {
      opacity: 0.95 !important;
      background: var(--surface) !important;
      border: 1px solid var(--border-strong) !important;
      border-radius: var(--radius-md) !important;
      box-shadow: var(--shadow-drag) !important;
    }

    /* دائرة التحقق */
    .task-checkbox {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: var(--radius-full);
      border: 2px solid var(--muted);
      transition: all 0.18s ease;
    }
    .task-checkbox .icon { width: 14px; height: 14px; color: #fff; opacity: 0; transform: scale(0.5); transition: all 0.16s ease; }
    .task.completed .task-checkbox { background: var(--accent); border-color: var(--accent); }
    .task.completed .task-checkbox .icon { opacity: 1; transform: scale(1); }

    .task-main { min-width: 0; flex: 1; }
    .task-text { margin: 0; font-size: var(--fs-base); font-weight: 500; overflow-wrap: anywhere; }
    .task.completed .task-text { color: var(--muted); text-decoration: line-through; }

    /* النجمة */
    .task-star {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: var(--radius-full);
      color: var(--surface-3);
      transition: color 0.16s ease;
    }
    .task-star .icon { width: 20px; height: 20px; }
    .task-star.active { color: #f59e0b; }
    .task-star.active .icon { fill: #f59e0b; stroke: #f59e0b; }

    /* ============ الحالة الفارغة ============ */
    .empty {
      padding: 36px 24px;
      text-align: center;
      border-radius: var(--radius-lg);
      border: 1px dashed var(--border-strong);
      color: var(--muted);
    }
    .empty-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 12px;
      display: grid;
      place-items: center;
      border-radius: var(--radius-md);
      background: var(--accent-soft);
      color: var(--accent);
    }
    .empty-icon .icon { width: 24px; height: 24px; }
    .empty-title { color: var(--text); font-size: var(--fs-md); font-weight: 700; }
    .empty-text { margin-top: 4px; color: var(--muted); font-size: var(--fs-sm); }

    /* ============ زر الإضافة العائم ============ */
    .fab-wrap {
      position: fixed;
      z-index: 30;
      left: 50%;
      bottom: 0;
      width: min(760px, 100%);
      transform: translateX(-50%);
      padding: 0 16px calc(16px + env(safe-area-inset-bottom));
      pointer-events: none;
      display: flex;
      justify-content: flex-end;
    }
    .fab {
      pointer-events: auto;
      width: var(--fab-size);
      height: var(--fab-size);
      border-radius: var(--radius-full);
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.18);
      transition: transform 0.15s ease;
    }
    .fab:active { transform: scale(0.93); }
    .fab.hidden { display: none; }

    /* ============ لوحة الإضافة ============ */
    .composer-panel {
      pointer-events: auto;
      position: fixed;
      z-index: 31;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%) translateY(100%);
      width: min(100%, 760px);
      background: var(--surface);
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      box-shadow: var(--shadow-sheet);
      border: 1px solid var(--border);
      transition: transform 0.28s ease;
      padding: 16px 16px calc(12px + env(safe-area-inset-bottom));
    }
    .composer-panel.open { transform: translateX(-50%) translateY(0); }
    .composer-row { display: flex; align-items: center; gap: 8px; }
    .composer-row textarea {
      flex: 1;
      min-height: 52px;
      max-height: 110px;
      resize: none;
      padding: 12px;
      font-size: var(--fs-base);
    }
    .composer-row textarea::placeholder { color: var(--muted); opacity: 0.6; }
    .send-btn {
      width: 46px;
      height: 46px;
      flex-shrink: 0;
      border-radius: var(--radius-full);
      background: var(--accent);
      color: #fff;
      display: grid;
      place-items: center;
      transition: opacity 0.18s ease;
    }
    .send-btn.disabled { opacity: 0.4; }

    /* ============ القائمة الجانبية ============ */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 16px;
      background: rgba(0,0,0,0.40);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }
    .overlay.show { opacity: 1; visibility: visible; }
    .sheet {
      width: min(100%, 520px);
      max-height: min(82vh, 680px);
      overflow-y: auto;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-sheet);
      transform: translateY(18px);
      transition: transform 0.24s ease;
      position: relative;
    }
    .overlay.show .sheet { transform: translateY(0); }
    .sheet-handle { width: 36px; height: 5px; margin: 2px auto 14px; border-radius: var(--radius-full); background: var(--surface-3); }
    .sheet-close {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 40px;
      height: 40px;
      border-radius: var(--radius-full);
      background: var(--surface-2);
      display: grid;
      place-items: center;
      color: var(--muted);
      z-index: 2;
    }
    .sheet-title { padding: 4px 4px 12px; font-size: var(--fs-lg); font-weight: 700; }

    /* عناصر القائمة */
    .menu-item {
      width: 100%;
      min-height: 52px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-radius: var(--radius-md);
      transition: background 0.15s ease;
    }
    .menu-item:active { background: var(--surface-2); }
    .menu-item .icon { color: var(--muted); }
    .menu-item.danger { color: #ef4444; }
    .menu-item.danger .icon { color: #ef4444; }
    .menu-text { flex: 1; font-weight: 500; }

    /* ============ أزرار الأفعال ============ */
    .action-item {
      width: 100%;
      min-height: 52px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-radius: var(--radius-md);
      transition: background 0.15s ease;
    }
    .action-item:active { background: var(--surface-2); }
    .action-item .icon { color: var(--muted); }
    .action-item.danger { color: #ef4444; }
    .action-item.danger .icon { color: #ef4444; }
    .action-text { flex: 1; font-weight: 500; }

    /* ============ الإعدادات ============ */
    .setting-group { margin-bottom: 16px; }
    .setting-label { padding: 0 4px 8px; color: var(--muted); font-size: var(--fs-xs); font-weight: 700; }
    .setting-box { overflow: hidden; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); }
    .setting-row {
      min-height: 54px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid var(--border);
    }
    .setting-row:last-child { border-bottom: 0; }
    .setting-name { font-size: var(--fs-base); font-weight: 500; }
    .segmented { display: flex; gap: 2px; padding: 3px; border-radius: var(--radius-sm); background: var(--surface-2); }
    .segment {
      min-height: 32px;
      padding: 0 10px;
      border-radius: 7px;
      font-size: var(--fs-sm);
      font-weight: 600;
      color: var(--muted);
      transition: all 0.16s ease;
    }
    .segment.active { background: var(--accent); color: #fff; }
    .colors { display: flex; align-items: center; gap: 8px; }
    .color-btn {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-full);
      border: 2px solid var(--surface);
      outline: 1px solid var(--border);
      position: relative;
    }
    .color-btn.active::after {
      content: "✓";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
    }
    .color-btn.green { background: #10b981; }
    .color-btn.blue { background: #3b82f6; }
    .color-btn.purple { background: #8b5cf6; }
    .color-btn.orange { background: #f59e0b; }
    .color-btn.pink { background: #ec4899; }

    /* ============ بنر التثبيت ============ */
    .install-banner {
      position: fixed;
      z-index: 180;
      left: 50%;
      bottom: 12px;
      transform: translate(-50%, 20px);
      opacity: 0;
      visibility: hidden;
      width: min(calc(100% - 28px), 420px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px;
      box-shadow: var(--shadow-sheet);
      transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s ease;
    }
    .install-banner.show { opacity: 1; visibility: visible; transform: translate(-50%, 0); }
    .install-banner-inner { display: flex; align-items: center; gap: 12px; width: 100%; }
    .install-banner-icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 14px;
      background: var(--accent-soft);
    }
    .install-banner-icon img { width: 100%; height: 100%; object-fit: contain; }
    .install-banner-text { flex: 1; }
    .install-banner-title { font-size: 16px; font-weight: 800; }
    .install-banner-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .install-banner-actions { display: flex; gap: 8px; margin-top: 12px; }
    .install-banner-actions button {
      flex: 1;
      min-height: 40px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
    }
    .install-dismiss { background: var(--surface-2); color: var(--muted); }
    .install-action { background: var(--accent); color: #fff; }

    .hidden { display: none !important; }
    .no-scroll { overflow: hidden; }

    /* ============ استجابة ============ */
    @media (max-width: 480px) {
      .app { padding-left: 12px; padding-right: 12px; }
      .task { min-height: 48px; gap: 8px; }
      .task-checkbox { width: 24px; height: 24px; }
      .task-star { width: 36px; height: 36px; }
      .task-star .icon { width: 18px; height: 18px; }
      .task-list { padding: 0 8px; }
      .segment { padding: 0 8px; font-size: var(--fs-xs); }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- الهيدر -->
    <header class="header">
      <div class="brand">
        <div class="brand-icon" id="brandIcon">
          <img src="Icon-192.png" alt="ناوي" width="36" height="36" onerror="this.remove(); document.getElementById('brandFallback').style.display = 'grid';">
          <span class="fallback" id="brandFallback" style="display:none;">ن</span>
        </div>
        <div class="brand-name" id="brandName">ناوي</div>
      </div>
      <button class="menu-btn" id="menuBtn" type="button" aria-label="القائمة">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 13C12.5523 13 13 12.5523 13 12C13 11.4477 12.5523 11 12 11C11.4477 11 11 11.4477 11 12C11 12.5523 11.4477 13 12 13Z" fill="currentColor" stroke="none"/><path d="M19 13C19.5523 13 20 12.5523 20 12C20 11.4477 19.5523 11 19 11C18.4477 11 18 11.4477 18 12C18 12.5523 18.4477 13 19 13Z" fill="currentColor" stroke="none"/><path d="M5 13C5.55228 13 6 12.5523 6 12C6 11.4477 5.55228 11 5 11C4.44772 11 4 11.4477 4 12C4 12.5523 4.44772 13 5 13Z" fill="currentColor" stroke="none"/></svg>
      </button>
    </header>

    <!-- التبويبات -->
    <nav class="tabs" id="tabsNav">
      <button class="tab active" data-view="all" type="button">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 22V12"/><path d="M12 12C12 8 14 4 20 4C20 10 16 12 12 12Z"/><path d="M12 12C12 8 10 4 4 4C4 10 8 12 12 12Z"/></svg>
        <span data-i18n="all">نواياي</span>
        <span class="count" id="allCount">0</span>
      </button>

  <script>
    "use strict";

    // ============ الثوابت ============
    const STORAGE_KEYS = {
      tasks: "nawy_tasks_v1",
      archive: "nawy_archive_v1",
      settings: "nawy_settings_v1"
    };

    const DEFAULT_SETTINGS = {
      theme: "dark",
      accent: "blue",
      language: "ar",
      fontSize: "medium",
      notificationEnabled: false,
      notificationTime: "09:00"
    };

    const TRANSLATIONS = {
      ar: {
        appName: "ناوي", all: "نواياي", favorites: "مفضلاتي",
        heroTitle: "ناوي على إيه؟", heroSub: "مساحتك الشخصية لنواياك",
        active: "نشطة", postponed: "مؤجلة", achieved: "تحققت",
        taskPlaceholder: "أنا ناوي...", addBtn: "أضف",
        achievedAction: "حققت النية", postponeAction: "أجل النية", reactivateAction: "أعد تفعيل النية",
        edit: "تعديل", retreat: "تراجع عن النية", delete: "حذف نهائي", restore: "استرجاع",
        settings: "الإعدادات", archive: "أرشيف ناوي", exportData: "تصدير البيانات", importData: "استيراد البيانات",
        language: "اللغة", languageName: "لغة ناوي", appearance: "المظهر", mode: "الوضع",
        dark: "داكن", light: "نهاري", fontSize: "حجم الخط", small: "صغير", medium: "متوسط", large: "كبير",
        color: "اللون", nawyColor: "سمة ناوي", notification: "إشعار الصباح",
        notificationEnable: "تفعيل", notificationDisable: "تعطيل", time: "الوقت",
        noIntentions: "مفيش نوايا لسه", firstIntent: "اكتب أول نية ناوي تعملها.",
        noFavorites: "مفيش مفضلات لسه", favoriteHint: "علّم أي نية بنجمة وهتظهر هنا.",
        noArchive: "الأرشيف فاضي", noPostponed: "مفيش نوايا مؤجلة",
        noAchieved: "مفيش نوايا متحققة لسه",
        addedToast: "تمت إضافة النية ✨", achievedToast: "نية اتحققت 🌱", postponedToast: "تم تأجيل النية ⏳",
        reactivatedToast: "تم إعادة تفعيل النية 🔄", editedToast: "تم التعديل ✏️",
        deletedToast: "تم التراجع - اضغط للاسترجاع", restoredToast: "تم الاسترجاع ✅",
        exported: "تم تصدير البيانات 💾", imported: "تم استيراد البيانات ✅",
        morningNotif: "ناوي على إيه النهارده؟", installTitle: "نزّل ناوي 🌱",
        installSub: "نواياك هتكون أسهل معاك 📌", installDismiss: "متابعة للموقع", installAction: "تثبيت ⚡"
      },
      en: {
        appName: "NAWY", all: "My Intentions", favorites: "Favorites",
        heroTitle: "What are you up to?", heroSub: "Your personal space for intentions",
        active: "Active", postponed: "Postponed", achieved: "Achieved",
        taskPlaceholder: "I intend to...", addBtn: "Add",
        achievedAction: "Achieved", postponeAction: "Postpone", reactivateAction: "Reactivate",
        edit: "Edit", retreat: "Retreat", delete: "Delete Forever", restore: "Restore",
        settings: "Settings", archive: "NAWY Archive", exportData: "Export Data", importData: "Import Data",
        language: "Language", languageName: "NAWY Language", appearance: "Appearance", mode: "Mode",
        dark: "Dark", light: "Light", fontSize: "Font Size", small: "Small", medium: "Medium", large: "Large",
        color: "Color", nawyColor: "NAWY Color", notification: "Morning Reminder",
        notificationEnable: "Enable", notificationDisable: "Disable", time: "Time",
        noIntentions: "No intentions yet", firstIntent: "Write your first intention.",
        noFavorites: "No favorites yet", favoriteHint: "Star an intention and it will appear here.",
        noArchive: "Archive is empty", noPostponed: "No postponed intentions",
        noAchieved: "No achieved intentions yet",
        addedToast: "Intention added ✨", achievedToast: "Intention achieved 🌱", postponedToast: "Intention postponed ⏳",
        reactivatedToast: "Intention reactivated 🔄", editedToast: "Edited ✏️",
        deletedToast: "Deleted - tap to undo", restoredToast: "Restored ✅",
        exported: "Data exported 💾", imported: "Data imported ✅",
        morningNotif: "What are you up to today?", installTitle: "Install NAWY 🌱",
        installSub: "Your intentions will be easier with you 📌", installDismiss: "Continue to site", installAction: "Install ⚡"
      }
    };

    // ============ الحالة ============
    let tasks = [];
    let archive = [];
    let settings = { ...DEFAULT_SETTINGS };
    let currentView = "all";
    let selectedTaskId = null;
    let swipeStartX = 0;
    let swipeTracking = false;

    // ============ أدوات مساعدة ============
    const $ = s => document.querySelector(s);
    const $$ = s => [...document.querySelectorAll(s)];
    function t(key) { return TRANSLATIONS[settings.language]?.[key] || TRANSLATIONS.ar[key] || key; }
    function createId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 9); }
    function safeParse(v, f) { try { return JSON.parse(v) ?? f; } catch { return f; } }

    // ============ التخزين ============
    function loadData() {
      tasks = safeParse(localStorage.getItem(STORAGE_KEYS.tasks), []).filter(x => x && x.text);
      archive = safeParse(localStorage.getItem(STORAGE_KEYS.archive), []).filter(x => x && x.text);
      settings = { ...DEFAULT_SETTINGS, ...safeParse(localStorage.getItem(STORAGE_KEYS.settings), {}) };
    }
    function saveTasks() { localStorage.setItem(STORAGE_KEYS.tasks, JSON.stringify(tasks)); }
    function saveArchive() { localStorage.setItem(STORAGE_KEYS.archive, JSON.stringify(archive)); }
    function saveSettings() { localStorage.setItem(STORAGE_KEYS.settings, JSON.stringify(settings)); }

    // ============ Toast ============
    function showToast(message, canUndo = false, undoCallback = null) {
      const existing = document.querySelector('.toastify');
      if (existing) existing.remove();
      
      const toast = document.createElement('div');
      toast.className = 'toastify';
      toast.textContent = message;
      toast.style.cssText = `
        position: fixed;
        bottom: 80px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--accent);
        color: #fff;
        padding: 12px 20px;
        border-radius: 14px;
        font-family: "Cairo", sans-serif;
        font-weight: 600;
        font-size: 14px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        z-index: 200;
        cursor: ${canUndo ? 'pointer' : 'default'};
        animation: toastIn 0.3s ease;
        max-width: calc(100% - 32px);
        text-align: center;
      `;
      
      if (canUndo && undoCallback) {
        toast.addEventListener('click', () => {
          undoCallback();
          toast.remove();
        });
      }
      
      document.body.appendChild(toast);
      setTimeout(() => { toast.remove(); }, canUndo ? 5000 : 3000);
    }

    // ============ الصوت والاحتفال ============
    let audioContext = null;
    function playAchievedSound() {
      try {
        if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const ctx = audioContext;
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = 'sine';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.15, ctx.currentTime + i * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.08 + 0.4);
          osc.start(ctx.currentTime + i * 0.08);
          osc.stop(ctx.currentTime + i * 0.08 + 0.4);
        });
      } catch(e) {}
    }

    function celebrate() {
      playAchievedSound();
      if (navigator.vibrate) navigator.vibrate([50, 30, 50]);
      if (typeof confetti === 'function') {
        confetti({ particleCount: 60, spread: 50, origin: { y: 0.7 } });
      }
    }

    // ============ عمليات النوايا ============
    function addTask(text) {
      const clean = String(text || "").trim();
      if (!clean) return false;
      tasks.unshift({
        id: createId(),
        text: clean,
        status: 'active',
        starred: false,
        createdAt: Date.now(),
        achievedAt: null,
        postponedAt: null
      });
      saveTasks();
      render();
      showToast(t("addedToast"));
      return true;
    }

    function achieveTask(id) {
      const task = tasks.find(x => x.id === id);
      if (!task) return;
      task.status = 'achieved';
      task.achievedAt = Date.now();
      saveTasks();
      render();
      celebrate();
      showToast(t("achievedToast"));
    }

    function postponeTask(id) {
      const task = tasks.find(x => x.id === id);
      if (!task) return;
      task.status = 'postponed';
      task.postponedAt = Date.now();
      saveTasks();
      render();
      showToast(t("postponedToast"));
    }

    function reactivateTask(id) {
      const task = tasks.find(x => x.id === id);
      if (!task) return;
      task.status = 'active';
      task.postponedAt = null;
      task.achievedAt = null;
      saveTasks();
      render();
      showToast(t("reactivatedToast"));
    }

    function toggleStar(id) {
      const task = tasks.find(x => x.id === id);
      if (!task) return;
      task.starred = !task.starred;
      saveTasks();
      render();
    }

    function deleteTask(id) {
      const index = tasks.findIndex(x => x.id === id);
      if (index === -1) return;
      const [deleted] = tasks.splice(index, 1);
      archive.unshift({ ...deleted, archivedAt: Date.now() });
      saveTasks();
      saveArchive();
      render();
      showToast(t("deletedToast"), true, () => {
        const ai = archive.findIndex(x => x.id === deleted.id);
        if (ai !== -1) archive.splice(ai, 1);
        tasks.unshift(deleted);
        saveTasks();
        saveArchive();
        render();
      });
    }

    function restoreFromArchive(id) {
      const index = archive.findIndex(x => x.id === id);
      if (index === -1) return;
      const [restored] = archive.splice(index, 1);
      delete restored.archivedAt;
      restored.status = 'active';
      restored.postponedAt = null;
      restored.achievedAt = null;
      tasks.unshift(restored);
      saveTasks();
      saveArchive();
      render();
      renderArchive();
      showToast(t("restoredToast"));
    }

    function deleteForever(id) {
      const index = archive.findIndex(x => x.id === id);
      if (index === -1) return;
      archive.splice(index, 1);
      saveArchive();
      renderArchive();
    }

    // ============ الرسم ============
    function render() {
      const content = $("#content");
      content.innerHTML = "";
      
      const activeTasks = tasks.filter(x => x.status === 'active');
      const postponedTasks = tasks.filter(x => x.status === 'postponed');
      const achievedTasks = tasks.filter(x => x.status === 'achieved');
      
      if (currentView === "all") {
        $("#heroTitle").style.display = "block";
        $("#heroSub").style.display = "block";
        $("#allCount").textContent = activeTasks.length;
        $("#favCount").textContent = tasks.filter(x => x.starred).length;
        
        if (activeTasks.length === 0 && postponedTasks.length === 0 && achievedTasks.length === 0) {
          content.appendChild(createEmpty("🌱", t("noIntentions"), t("firstIntent")));
        } else {
          if (activeTasks.length > 0) content.appendChild(createSection('active', t("active"), activeTasks));
          if (postponedTasks.length > 0) content.appendChild(createSection('postponed', t("postponed"), postponedTasks));
          if (achievedTasks.length > 0) content.appendChild(createSection('achieved', t("achieved"), achievedTasks));
        }
      } else if (currentView === "favorites") {
        $("#heroTitle").style.display = "block";
        $("#heroSub").style.display = "block";
        $("#heroTitle").textContent = t("favorites");
        $("#heroSub").textContent = "⭐";
        
        const favTasks = tasks.filter(x => x.starred);
        if (favTasks.length === 0) {
          content.appendChild(createEmpty("⭐", t("noFavorites"), t("favoriteHint")));
        } else {
          const favActive = favTasks.filter(x => x.status === 'active');
          const favAchieved = favTasks.filter(x => x.status === 'achieved');
          const favPostponed = favTasks.filter(x => x.status === 'postponed');
          if (favActive.length > 0) content.appendChild(createSection('active', t("active"), favActive));
          if (favPostponed.length > 0) content.appendChild(createSection('postponed', t("postponed"), favPostponed));
          if (favAchieved.length > 0) content.appendChild(createSection('achieved', t("achieved"), favAchieved));
        }
      }
      
      updateTabs();
      initSortable();
    }

    function createSection(type, title, taskArray) {
      const section = document.createElement("section");
      section.className = "section";
      
      const header = document.createElement("div");
      header.className = "section-header";
      header.innerHTML = `
        <span class="section-title">${title}</span>
        <span class="section-count">${taskArray.length}</span>
        <span class="section-chevron"><svg class="icon" viewBox="0 0 24 24"><path d="M6 9L12 15L18 9"/></svg></span>
      `;
      
      const body = document.createElement("div");
      body.className = "section-body";
      const list = document.createElement("div");
      list.className = "task-list";
      list.dataset.type = type;
      taskArray.forEach(task => list.appendChild(createTaskElement(task)));
      body.appendChild(list);
      
      header.addEventListener("click", () => {
        section.classList.toggle("collapsed");
      });
      
      section.append(header, body);
      return section;
    }

    function createTaskElement(task) {
      const article = document.createElement("article");
      article.className = "task" + (task.status === 'achieved' ? " completed" : "");
      article.dataset.taskId = task.id;
      
      const checkbox = document.createElement("button");
      checkbox.className = "task-checkbox";
      checkbox.type = "button";
      checkbox.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><path d="M8 12.5L11 15.5L16 9"/></svg>';
      checkbox.addEventListener("click", e => {
        e.stopPropagation();
        if (task.status === 'achieved') reactivateTask(task.id);
        else achieveTask(task.id);
      });
      
      const main = document.createElement("div");
      main.className = "task-main";
      const p = document.createElement("p");
      p.className = "task-text";
      p.textContent = task.text;
      main.appendChild(p);
      main.addEventListener("click", () => openAction(task.id));
      
      const star = document.createElement("button");
      star.className = "task-star" + (task.starred ? " active" : "");
      star.type = "button";
      star.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg>';
      star.addEventListener("click", e => {
        e.stopPropagation();
        toggleStar(task.id);
      });
      
      article.append(checkbox, main, star);
      return article;
    }

    function createEmpty(icon, title, text) {
      const div = document.createElement("div");
      div.className = "empty";
      div.innerHTML = `
        <div class="empty-icon">${icon}</div>
        <div class="empty-title">${title}</div>
        <div class="empty-text">${text}</div>
      `;
      return div;
    }

    function updateTabs() {
      $$(".tab").forEach(tab => {
        tab.classList.toggle("active", tab.dataset.view === currentView);
      });
    }

    // ============ الترتيب بالسحب ============
    function initSortable() {
      $$(".task-list").forEach(list => {
        if (list.sortableInstance) list.sortableInstance.destroy();
        list.sortableInstance = new Sortable(list, {
          animation: 150,
          ghostClass: 'drag-ghost',
          dragClass: 'drag-source',
          delay: 200,
          delayOnTouchOnly: true,
          onEnd: function() {
            const newOrder = [...list.querySelectorAll(".task")].map(el => el.dataset.taskId);
            const reordered = [];
            const taskMap = new Map();
            tasks.forEach(x => taskMap.set(x.id, x));
            newOrder.forEach(id => {
              if (taskMap.has(id)) {
                reordered.push(taskMap.get(id));
                taskMap.delete(id);
              }
            });
            taskMap.forEach(x => reordered.push(x));
            tasks = reordered;
            saveTasks();
          }
        });
      });
    }

    // ============ لوحة الأفعال ============
    function openAction(id) {
      const task = tasks.find(x => x.id === id);
      if (!task) return;
      selectedTaskId = id;
      
      const preview = $("#actionTaskPreview");
      preview.textContent = task.text;
      
      const completeBtn = $("#actionComplete");
      const completeText = completeBtn.querySelector(".action-text");
      if (task.status === 'achieved') {
        completeText.textContent = t("reactivateAction");
      } else {
        completeText.textContent = t("achievedAction");
      }
      
      const postponeBtn = $("#actionPostpone");
      const postponeText = postponeBtn.querySelector(".action-text");
      if (task.status === 'postponed') {
        postponeText.textContent = t("reactivateAction");
      } else if (task.status === 'achieved') {
        postponeText.textContent = t("reactivateAction");
      } else {
        postponeText.textContent = t("postponeAction");
      }
      
      openOverlay($("#actionOverlay"));
    }

    // ============ الأرشيف ============
    function renderArchive() {
      const container = $("#archiveList");
      container.innerHTML = "";
      
      if (archive.length === 0) {
        container.innerHTML = `<div class="empty"><div class="empty-title">${t("noArchive")}</div></div>`;
        return;
      }
      
      archive.forEach(task => {
        const item = document.createElement("div");
        item.style.cssText = "padding:12px;border-radius:12px;background:var(--surface-2);display:flex;align-items:center;gap:8px;margin-bottom:8px;";
        
        const text = document.createElement("div");
        text.textContent = task.text;
        text.style.cssText = "flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;";
        
        const restoreBtn = document.createElement("button");
        restoreBtn.textContent = t("restore");
        restoreBtn.style.cssText = "min-height:36px;padding:0 12px;border-radius:8px;background:var(--surface);font-size:13px;font-weight:600;";
        restoreBtn.addEventListener("click", () => restoreFromArchive(task.id));
        
        const deleteBtn = document.createElement("button");
        deleteBtn.textContent = t("delete");
        deleteBtn.style.cssText = "min-height:36px;padding:0 12px;border-radius:8px;background:rgba(239,68,68,0.1);color:#ef4444;font-size:13px;font-weight:600;";
        deleteBtn.addEventListener("click", () => deleteForever(task.id));
        
        item.append(text, restoreBtn, deleteBtn);
        container.appendChild(item);
      });
    }

    // ============ Overlays ============
    function openOverlay(overlay) { overlay.classList.add("show"); document.body.classList.add("no-scroll"); }
    function closeOverlay(overlay) { overlay.classList.remove("show"); if (!document.querySelector(".overlay.show")) document.body.classList.remove("no-scroll"); }
    function closeAllOverlays() { $$(".overlay.show").forEach(closeOverlay); selectedTaskId = null; }

    // ============ Composer ============
    function openComposer() { $("#fabBtn").classList.add("hidden"); $("#composerPanel").classList.add("open"); $("#taskInput").focus(); }
    function closeComposer() { $("#fabBtn").classList.remove("hidden"); $("#composerPanel").classList.remove("open"); $("#taskInput").value = ""; $("#sendBtn").classList.add("disabled"); }

    // ============ الإعدادات ============
    function applySettings() {
      document.documentElement.setAttribute("data-theme", settings.theme);
      document.documentElement.setAttribute("data-accent", settings.accent);
      document.documentElement.setAttribute("data-font", settings.fontSize);
      document.documentElement.lang = settings.language;
      document.documentElement.dir = settings.language === "ar" ? "rtl" : "ltr";
      
      $("#brandName").textContent = t("appName");
      $$("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
      $$("[data-i18n-placeholder]").forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
      $("#taskInput").placeholder = t("taskPlaceholder");
      
      $$("[data-theme]").forEach(btn => btn.classList.toggle("active", btn.dataset.theme === settings.theme));
      $$("[data-accent]").forEach(btn => btn.classList.toggle("active", btn.dataset.accent === settings.accent));
      $$("[data-font]").forEach(btn => btn.classList.toggle("active", btn.dataset.font === settings.fontSize));
      $$("[data-language]").forEach(btn => btn.classList.toggle("active", btn.dataset.language === settings.language));
      
      updateNotifUI();
    }

    function updateNotifUI() {
      const toggleBtn = $("#notifToggle");
      toggleBtn.textContent = settings.notificationEnabled ? t("notificationDisable") : t("notificationEnable");
      $("#notifTimeRow").classList.toggle("hidden", !settings.notificationEnabled);
      $("#notifTime").value = settings.notificationTime;
    }

    // ============ الإشعارات ============
    function requestNotificationPermission() {
      return new Promise((resolve) => {
        if (!("Notification" in window)) { resolve(false); return; }
        Notification.requestPermission().then(permission => resolve(permission === "granted"));
      });
    }

    function scheduleNotification() {
      if (!settings.notificationEnabled) return;
      if (!("Notification" in window) || Notification.permission !== "granted") return;
      if (window.nawyNotifTimeout) clearTimeout(window.nawyNotifTimeout);
      
      const now = new Date();
      const [hours, minutes] = (settings.notificationTime || "09:00").split(":").map(Number);
      let scheduledTime = new Date(now);
      scheduledTime.setHours(hours, minutes, 0, 0);
      if (scheduledTime <= now) scheduledTime.setDate(scheduledTime.getDate() + 1);
      
      const delay = scheduledTime.getTime() - now.getTime();
      window.nawyNotifTimeout = setTimeout(() => {
        showMorningNotification();
        scheduleNotification();
      }, delay);
    }

    function showMorningNotification() {
      const body = t("morningNotif");
      const options = {
        body,
        icon: "./Icon-512.png",
        badge: "./Icon-192.png",
        dir: settings.language === "en" ? "ltr" : "rtl",
        lang: settings.language,
        tag: "nawy-morning",
        requireInteraction: true,
        vibrate: [100, 50, 100]
      };
      
      if ("Notification" in window) {
        if (Notification.permission === "granted") {
          if (navigator.serviceWorker && navigator.serviceWorker.ready) {
            navigator.serviceWorker.ready.then(reg => {
              reg.showNotification("ناوي 🌱", options).catch(() => {
                new Notification("ناوي 🌱", options);
              });
            });
          } else {
            new Notification("ناوي 🌱", options);
          }
        }
      }
    }

    // ============ التصدير والاستيراد ============
    function exportData() {
      const data = JSON.stringify({ tasks, archive, settings }, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `nawy-backup-${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast(t("exported"));
    }

    function importData(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = JSON.parse(e.target.result);
          if (data.tasks && data.archive && data.settings) {
            tasks = data.tasks;
            archive = data.archive;
            settings = { ...DEFAULT_SETTINGS, ...data.settings };
            saveTasks();
            saveArchive();
            saveSettings();
            applySettings();
            render();
            showToast(t("imported"));
          }
        } catch(err) {
          showToast("Error importing data");
        }
      };
      reader.readAsText(file);
    }

    // ============ مستمعي الأحداث ============
    $("#fabBtn").addEventListener("click", openComposer);
    $("#composerForm").addEventListener("submit", e => {
      e.preventDefault();
      if (addTask($("#taskInput").value)) closeComposer();
    });
    $("#taskInput").addEventListener("input", () => {
      $("#sendBtn").classList.toggle("disabled", !$("#taskInput").value.trim().length);
    });

    $$(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        currentView = tab.dataset.view;
        closeAllOverlays();
        closeComposer();
        render();
      });
    });

    $("#menuBtn").addEventListener("click", () => openOverlay($("#menuOverlay")));
    $("#settingsBtn").addEventListener("click", () => { closeOverlay($("#menuOverlay")); openOverlay($("#settingsOverlay")); });
    $("#archiveBtn").addEventListener("click", () => { closeOverlay($("#menuOverlay")); renderArchive(); openOverlay($("#archiveOverlay")); });
    $("#exportBtn").addEventListener("click", () => { closeOverlay($("#menuOverlay")); exportData(); });
    $("#importBtn").addEventListener("click", () => { closeOverlay($("#menuOverlay")); $("#importFileInput").click(); });
    $("#importFileInput").addEventListener("change", e => { if (e.target.files[0]) importData(e.target.files[0]); });

    $$("[data-close]").forEach(btn => {
      btn.addEventListener("click", () => closeOverlay(document.getElementById(btn.dataset.close)));
    });

    $$(".overlay").forEach(overlay => {
      overlay.addEventListener("click", e => {
        if (e.target === overlay) closeOverlay(overlay);
      });
    });

    $("#actionComplete").addEventListener("click", () => {
      if (!selectedTaskId) return;
      const task = tasks.find(x => x.id === selectedTaskId);
      if (task) {
        if (task.status === 'achieved') reactivateTask(task.id);
        else achieveTask(task.id);
      }
      closeOverlay($("#actionOverlay"));
      selectedTaskId = null;
    });

    $("#actionPostpone").addEventListener("click", () => {
      if (!selectedTaskId) return;
      const task = tasks.find(x => x.id === selectedTaskId);
      if (task) {
        if (task.status === 'postponed' || task.status === 'achieved') reactivateTask(task.id);
        else postponeTask(task.id);
      }
      closeOverlay($("#actionOverlay"));
      selectedTaskId = null;
    });

    $("#actionEdit").addEventListener("click", () => {
      if (!selectedTaskId) return;
      const task = tasks.find(x => x.id === selectedTaskId);
      if (!task) return;
      
      const preview = $("#actionTaskPreview");
      const editContainer = document.createElement("div");
      editContainer.style.cssText = "display:flex;align-items:center;gap:8px;width:100%;";
      
      const editArea = document.createElement("textarea");
      editArea.value = task.text;
      editArea.style.cssText = "flex:1;min-height:50px;padding:12px;border:1px solid var(--accent);border-radius:10px;background:var(--surface);color:var(--text);resize:none;font-size:var(--fs-md);";
      
      const doneBtn = document.createElement("button");
      doneBtn.type = "button";
      doneBtn.style.cssText = "width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;";
      doneBtn.innerHTML = '<svg class="icon" viewBox="0 0 24 24" width="16" height="16"><path d="M8 12.5L11 15.5L16 9"/></svg>';
      
      editContainer.append(editArea, doneBtn);
      preview.replaceWith(editContainer);
      editArea.focus();
      
      function saveEdit() {
        const newText = editArea.value.trim();
        if (newText && newText !== task.text) {
          task.text = newText;
          saveTasks();
          render();
          showToast(t("editedToast"));
        }
        closeOverlay($("#actionOverlay"));
        selectedTaskId = null;
      }
      
      doneBtn.addEventListener("click", saveEdit);
      editArea.addEventListener("keydown", e => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          saveEdit();
        }
      });
    });

    $("#actionDelete").addEventListener("click", () => {
      if (selectedTaskId) {
        deleteTask(selectedTaskId);
        closeOverlay($("#actionOverlay"));
        selectedTaskId = null;
      }
    });

    $$("[data-theme]").forEach(btn => {
      btn.addEventListener("click", () => {
        settings.theme = btn.dataset.theme;
        saveSettings();
        applySettings();
      });
    });

    $$("[data-accent]").forEach(btn => {
      btn.addEventListener("click", () => {
        settings.accent = btn.dataset.accent;
        saveSettings();
        applySettings();
      });
    });

    $$("[data-font]").forEach(btn => {
      btn.addEventListener("click", () => {
        settings.fontSize = btn.dataset.font;
        saveSettings();
        applySettings();
        render();
      });
    });

    $$("[data-language]").forEach(btn => {
      btn.addEventListener("click", () => {
        settings.language = btn.dataset.language;
        saveSettings();
        applySettings();
        render();
      });
    });

    $("#notifToggle").addEventListener("click", async () => {
      if (settings.notificationEnabled) {
        settings.notificationEnabled = false;
        saveSettings();
        updateNotifUI();
        if (window.nawyNotifTimeout) clearTimeout(window.nawyNotifTimeout);
        return;
      }
      const granted = await requestNotificationPermission();
      if (granted) {
        settings.notificationEnabled = true;
        saveSettings();
        updateNotifUI();
        scheduleNotification();
      } else {
        showToast("Permission denied");
      }
    });

    $("#notifTime").addEventListener("change", () => {
      settings.notificationTime = $("#notifTime").value;
      saveSettings();
      if (settings.notificationEnabled) scheduleNotification();
    });

    // السحب الأفقي للتنقل
    document.addEventListener("touchstart", e => {
      if (e.target.closest(".task-list, button, input, textarea, .overlay, .sheet, .composer-panel")) return;
      const touch = e.touches[0];
      swipeStartX = touch.clientX;
      swipeTracking = true;
    }, { passive: true });

    document.addEventListener("touchend", e => {
      if (!swipeTracking) return;
      swipeTracking = false;
      const touch = e.changedTouches[0];
      const dx = touch.clientX - swipeStartX;
      const dy = touch.clientY - (swipeStartX || touch.clientY);
      
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        const isRTL = document.documentElement.dir === "rtl";
        if (isRTL) {
          if (dx < 0) currentView = currentView === "all" ? "favorites" : "all";
          else currentView = currentView === "all" ? "favorites" : "all";
        } else {
          if (dx > 0) currentView = currentView === "all" ? "favorites" : "all";
          else currentView = currentView === "all" ? "favorites" : "all";
        }
        closeAllOverlays();
        closeComposer();
        render();
      }
    }, { passive: true });

    // بنر التثبيت
    let deferredInstallPrompt = null;
    window.addEventListener("beforeinstallprompt", e => {
      e.preventDefault();
      deferredInstallPrompt = e;
      $("#installBanner").classList.add("show");
    });
    $("#installAction").addEventListener("click", async () => {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      $("#installBanner").classList.remove("show");
    });
    $("#installDismiss").addEventListener("click", () => $("#installBanner").classList.remove("show"));
    window.addEventListener("appinstalled", () => $("#installBanner").classList.remove("show"));

    // Service Worker
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }

    // ============ التهيئة ============
    function init() {
      loadData();
      applySettings();
      render();
      if (settings.notificationEnabled && "Notification" in window && Notification.permission === "granted") {
        scheduleNotification();
      }
    }

    init();
  </script>
</body>
</html>
