<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d0c">
  <meta name="description" content="ناوي — رتّب نواياك وأنجز يومك ببساطة.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ناوي — على إيه النهارده؟</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <div class="app-shell">
    <div class="app">
      <header class="header">
        <div class="brand-row">
          <div class="brand">
            <div class="brand-mark" aria-hidden="true">ن</div>
            <span>ناوي</span>
          </div>
          <div class="today-badge" id="todayBadge">اليوم</div>
        </div>

        <section class="hero">
          <p class="eyebrow">بسم الله</p>
          <h1>ناوي على إيه<br><span>النهارده؟</span></h1>
          <p class="date" id="currentDate">—</p>
        </section>

        <div class="progress-row" aria-live="polite">
          <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
          <span class="progress-text" id="progressText">ابدأ أول نية</span>
        </div>
      </header>

      <main class="content" id="tasksContainer" aria-live="polite"></main>

      <div class="composer-area">
        <form class="composer" id="composer" autocomplete="off">
          <div class="composer-inner">
            <textarea id="taskInput" rows="1" maxlength="500" enterkeyhint="send" aria-label="اكتب نيتك" placeholder="اكتب اللي ناوي عليه..."></textarea>
            <button class="submit" id="submitBtn" type="submit" aria-label="إضافة نية" disabled>
              <span aria-hidden="true">↑</span>
            </button>
          </div>
          <div class="composer-meta"><span>Enter للإضافة</span><span>Shift + Enter لسطر جديد</span></div>
        </form>
      </div>
    </div>
  </div>

  <div class="install-overlay" id="installOverlay" aria-hidden="true">
    <div class="install-sheet" role="dialog" aria-modal="true" aria-labelledby="installTitle">
      <div class="install-icon">ن</div>
      <div class="install-copy"><strong id="installTitle">ناوي؟ خليه معاك.</strong><span>ثبّت ناوي على جهازك وابدأ يومك بنية.</span></div>
      <button class="install-btn" id="installBtn" type="button">ثبّت</button>
      <button class="install-close" id="installClose" type="button" aria-label="إغلاق">×</button>
    </div>
  </div>

  <div class="guide-overlay" id="installGuide" aria-hidden="true">
    <div class="guide-box" role="dialog" aria-modal="true" aria-labelledby="guideTitle">
      <div class="guide-icon">📱</div>
      <h2 id="guideTitle">خلّي ناوي معاك</h2>
      <p id="guideText">من قائمة المتصفح اختار <b>إضافة إلى الشاشة الرئيسية</b> عشان تستخدم ناوي كتطبيق.</p>
      <button class="guide-close" id="guideClose" type="button">تمام</button>
    </div>
  </div>

  <script src="./js/app.js" defer></script>
</body>
</html>
