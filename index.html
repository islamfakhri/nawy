<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#0d1210">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="black-translucent">

<title>ناوي — على إيه النهارده؟</title>

<link rel="manifest" href="./manifest.json">

<link rel="icon"
      type="image/png"
      href="./icon-192.png">

<link rel="apple-touch-icon"
      href="./icon-192.png">

<style>

    :root {

        --bg: #0d1210;
        --surface: #151b18;
        --text: #f4f7f5;
        --muted: #87948d;
        --muted-dark: #65716b;
        --green: #19c58b;
        --yellow: #f4c84d;
        --danger: #ff6262;
        --border: rgba(255,255,255,.07);

    }


    * {

        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;

    }


    html,
    body {

        width: 100%;
        min-height: 100%;
        background: var(--bg);

    }


    body {

        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Roboto,
            "Noto Sans Arabic",
            Tahoma,
            Arial,
            sans-serif;

        color: var(--text);
        overflow: hidden;

    }


    button,
    textarea {

        font-family: inherit;

    }


    button {

        border: none;
        outline: none;
        cursor: pointer;
        -webkit-user-select: none;
        user-select: none;
        touch-action: manipulation;

    }


    /* =========================
       APP
    ========================= */

    .app {

        width: 100%;
        max-width: 620px;
        height: 100dvh;
        margin: auto;

        display: flex;
        flex-direction: column;
        position: relative;

        background:

            radial-gradient(
                circle at 85% -10%,
                rgba(25,197,139,.13),
                transparent 30%
            ),

            var(--bg);

    }


    /* =========================
       HEADER
    ========================= */

    .header {

        padding:
            28px
            20px
            15px;

        flex-shrink: 0;

    }


    .brand {

        display: flex;
        align-items: center;
        gap: 10px;

    }


    .brand-mark {

        width: 40px;
        height: 40px;

        display: grid;
        place-items: center;

        border-radius: 13px;

        background:
            rgba(25,197,139,.12);

        color:
            var(--green);

        font-size: 20px;

    }


    .brand-name {

        font-size: 24px;
        font-weight: 800;
        letter-spacing: -.8px;

    }


    /* =========================
       GREETING
    ========================= */

    .greeting {

        margin-top: 17px;

    }


    .greeting h1 {

        font-size: 27px;
        line-height: 1.25;
        font-weight: 800;
        letter-spacing: -.8px;

    }


    .greeting p {

        margin-top: 6px;
        color: var(--muted);
        font-size: 14px;

    }


    /* =========================
       PROGRESS
    ========================= */

    .progress {

        margin-top: 18px;

        display: flex;
        align-items: center;
        gap: 10px;

    }


    .progress-bar {

        height: 5px;
        flex: 1;

        background:
            rgba(255,255,255,.07);

        border-radius: 99px;
        overflow: hidden;

    }


    .progress-fill {

        height: 100%;
        width: 0%;

        background:
            var(--green);

        border-radius: 99px;

        transition:
            width .3s ease;

    }


    .progress-text {

        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;

    }


    /* =========================
       TASKS
    ========================= */

    .tasks {

        flex: 1;
        overflow-y: auto;

        padding:
            8px
            20px
            160px;

        scrollbar-width: none;

    }


    .tasks::-webkit-scrollbar {

        display: none;

    }


    .task {

        min-height: 64px;

        display: flex;
        align-items: center;
        gap: 13px;

        padding:
            11px 3px;

        border-bottom:
            1px solid var(--border);

        transition:
            opacity .2s ease,
            transform .15s ease;

    }


    .task:last-child {

        border-bottom:
            none;

    }


    .task:active {

        transform:
            scale(.99);

    }


    /* =========================
       CHECK
    ========================= */

    .check {

        width: 23px;
        height: 23px;

        flex:
            0 0 23px;

        border:
            1.8px solid #66736c;

        border-radius: 50%;

        display: grid;
        place-items: center;

        transition:
            all .2s ease;

    }


    .task.completed .check {

        background:
            var(--green);

        border-color:
            var(--green);

    }


    .check::after {

        content:
            "✓";

        color:
            #07120e;

        font-size: 14px;
        font-weight: 900;

        opacity: 0;

        transform:
            scale(.5);

        transition:
            all .2s ease;

    }


    .task.completed .check::after {

        opacity: 1;

        transform:
            scale(1);

    }


    /* =========================
       TASK TEXT
    ========================= */

    .task-main {

        min-width: 0;
        flex: 1;

    }


    .task-title {

        font-size: 16px;
        line-height: 1.45;

        color:
            #eef3f0;

        overflow-wrap:
            anywhere;

        transition:
            all .2s ease;

    }


    .task.completed .task-title {

        color:
            var(--muted-dark);

        text-decoration:
            line-through;

    }


    /* =========================
       ACTIONS
    ========================= */

    .task-actions {

        display: flex;
        align-items: center;
        gap: 2px;
        opacity: .65;

    }


    .icon-btn {

        width: 34px;
        height: 34px;

        display: grid;
        place-items: center;

        border-radius: 10px;

        background:
            transparent;

        color:
            #718078;

        font-size: 19px;

        transition:
            all .2s ease;

    }


    .icon-btn:active {

        background:
            rgba(255,255,255,.07);

    }


    .icon-btn.starred {

        color:
            var(--yellow);

    }


    .icon-btn.delete:active {

        color:
            var(--danger);

    }


    /* =========================
       EMPTY
    ========================= */

    .empty {

        text-align: center;
        padding: 80px 25px;

    }


    .empty-icon {

        width: 58px;
        height: 58px;

        margin:
            0 auto 15px;

        display: grid;
        place-items: center;

        border-radius: 18px;

        background:
            rgba(25,197,139,.09);

        color:
            var(--green);

        font-size: 25px;

    }


    .empty strong {

        display: block;

        color:
            #dfe7e3;

        font-size: 16px;

        margin-bottom: 5px;

    }


    .empty span {

        color:
            var(--muted);

        font-size: 13px;

    }


    /* =========================
       COMPOSER
    ========================= */

    .composer-wrap {

        position: absolute;

        left: 0;
        right: 0;
        bottom: 0;

        padding:
            12px
            16px
            calc(12px + env(safe-area-inset-bottom));

        background:
            linear-gradient(
                to top,
                var(--bg) 70%,
                transparent
            );

        pointer-events: none;

    }


    .composer {

        pointer-events: auto;

        display: flex;
        align-items: flex-end;
        gap: 8px;

        padding:
            7px
            8px
            7px
            7px;

        background:
            rgba(25,32,29,.96);

        border:
            1px solid var(--border);

        border-radius:
            20px;

        box-shadow:
            0 18px 45px rgba(0,0,0,.28);

        backdrop-filter:
            blur(18px);

    }


    /* =========================
       INPUT
    ========================= */

    textarea {

        flex: 1;
        min-width: 0;

        min-height: 42px;
        max-height: 110px;

        resize: none;

        border: none;
        outline: none;

        background: transparent;

        color:
            var(--text);

        padding:
            10px;

        line-height:
            1.45;

        font-size:
            15px;

    }


    textarea::placeholder {

        color:
            #718078;

    }


    /* =========================
       ADD / SEND
    ========================= */

    .submit {

        width: 42px;
        height: 42px;

        flex:
            0 0 42px;

        display: grid;
        place-items: center;

        border-radius:
            14px;

        background:
            #29332e;

        color:
            #718078;

        font-size:
            20px;

        transition:
            all .2s ease;

    }


    .submit.active {

        background:
            var(--green);

        color:
            #06140f;

        box-shadow:
            0 7px 20px
            rgba(25,197,139,.22);

    }


    .submit:active {

        transform:
            scale(.94);

    }


    .submit:disabled {

        cursor:
            default;

        pointer-events:
            none;

    }


    .hint {

        text-align:
            center;

        color:
            #56635c;

        font-size:
            10px;

        margin-top:
            7px;

    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width:380px) {

        .header {

            padding:
                22px
                16px
                12px;

        }

        .tasks {

            padding-left:
                16px;

            padding-right:
                16px;

        }

        .greeting h1 {

            font-size:
                24px;

        }

        .task-title {

            font-size:
                15px;

        }

    }

</style>

</head><body><div class="app"><!-- HEADER -->

<header class="header">

    <div class="brand">

        <div class="brand-mark">
            🎯
        </div>

        <div class="brand-name">
            ناوي
        </div>

    </div>


    <div class="greeting">

        <h1>
            ناوي على إيه النهارده؟
        </h1>

        <p id="currentDate">
            —
        </p>

    </div>


    <div class="progress">

        <div class="progress-bar">

            <div
                class="progress-fill"
                id="progressFill">
            </div>

        </div>


        <div
            class="progress-text"
            id="progressText">

            ابدأ أول نية

        </div>

    </div>

</header>


<!-- TASKS -->

<main
    class="tasks"
    id="tasksContainer">
</main>


<!-- ADD -->

<div class="composer-wrap">

    <div class="composer">

        <textarea
            id="taskInput"
            rows="1"
            maxlength="500"
            placeholder="اكتب اللي ناوي عليه..."
            enterkeyhint="send">
        </textarea>


        <button
            type="button"
            class="submit"
            id="submitBtn"
            aria-label="إضافة نية">

            ↑

        </button>

    </div>


    <div class="hint">

        اضغط Enter لإضافة نية جديدة

    </div>

</div>

</div><script>

    /* =====================================================
       NAWY
    ===================================================== */

    const STORAGE_KEY =
        "nawy_tasks_v4";


    const taskInput =
        document.getElementById(
            "taskInput"
        );


    const submitBtn =
        document.getElementById(
            "submitBtn"
        );


    const tasksContainer =
        document.getElementById(
            "tasksContainer"
        );


    const progressFill =
        document.getElementById(
            "progressFill"
        );


    const progressText =
        document.getElementById(
            "progressText"
        );


    const currentDate =
        document.getElementById(
            "currentDate"
        );


    let tasks =
        loadTasks();


    /*
     * حماية من الضغط المتكرر جدًا
     * على زر الإضافة.
     */
    let isAddingTask = false;


    /* =========================
       DATE
    ========================= */

    currentDate.textContent =
        new Intl.DateTimeFormat(
            "ar-EG",
            {
                weekday: "long",
                day: "numeric",
                month: "long"
            }
        ).format(new Date());


    /* =========================
       STORAGE
    ========================= */

    function loadTasks() {

        try {

            const saved =
                JSON.parse(
                    localStorage.getItem(
                        STORAGE_KEY
                    )
                );


            if (Array.isArray(saved)) {

                return saved;

            }


            /* توافق مع النسخة القديمة */

            const old =
                JSON.parse(
                    localStorage.getItem(
                        "nawy_tasks_v3"
                    )
                );


            return Array.isArray(old)
                ? old
                : [];


        } catch {

            return [];

        }

    }


    function save() {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(tasks)
        );

    }


    /* =========================
       INPUT
    ========================= */

    taskInput.addEventListener(
        "input",
        () => {

            autoResize();

            updateSubmitButton();

        }
    );


    /*
     * Enter = نفس أمر زر الإرسال
     */
    taskInput.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendTask();

            }

        }
    );


    /*
     * السهم الأخضر = نفس أمر Enter
     */
    submitBtn.addEventListener(
        "click",
        () => {

            sendTask();

        }
    );


    function autoResize() {

        taskInput.style.height =
            "auto";


        taskInput.style.height =
            Math.min(
                taskInput.scrollHeight,
                110
            ) + "px";

    }


    function updateSubmitButton() {

        const hasText =
            taskInput.value.trim().length > 0;


        submitBtn.classList.toggle(
            "active",
            hasText
        );


        submitBtn.disabled =
            !hasText ||
            isAddingTask;

    }


    /* =========================
       SEND / ADD TASK
    ========================= */

    function sendTask() {

        /*
         * منع أي ضغطات متزامنة
         */
        if (isAddingTask) {

            return;

        }


        const text =
            taskInput.value.trim();


        /*
         * لا ترسل نصًا فارغًا
         */
        if (!text) {

            updateSubmitButton();

            return;

        }


        isAddingTask = true;

        updateSubmitButton();


        const now =
            Date.now();


        tasks.unshift({

            id:
                now,

            text:
                text,

            completed:
                false,

            starred:
                false,

            createdAt:
                now

        });


        save();

        render();


        /*
         * تفريغ الإدخال بعد نجاح الإضافة
         */
        taskInput.value =
            "";


        taskInput.style.height =
            "42px";


        /*
         * إعادة تفعيل الزر بعد الإضافة
         */
        isAddingTask = false;

        updateSubmitButton();


        /*
         * إعادة التركيز على الكتابة
         * لتجربة أسرع على الهاتف
         */
        taskInput.focus();

    }


    /* =========================
       COMPLETE
    ========================= */

    function toggleTask(id) {

        const task =
            tasks.find(
                item =>
                    item.id === id
            );


        if (!task) {

            return;

        }


        task.completed =
            !task.completed;


        save();

        render();

    }


    /* =========================
       STAR
    ========================= */

    function toggleStar(id, event) {

        event.stopPropagation();


        const task =
            tasks.find(
                item =>
                    item.id === id
            );


        if (!task) {

            return;

        }


        task.starred =
            !task.starred;


        tasks.sort(
            (a,b) =>
                Number(b.starred) -
                Number(a.starred)
        );


        save();

        render();

    }


    /* =========================
       DELETE
    ========================= */

    function deleteTask(id, event) {

        event.stopPropagation();


        tasks =
            tasks.filter(
                task =>
                    task.id !== id
            );


        save();

        render();

    }


    /* =========================
       RENDER
    ========================= */

    function render() {

        updateProgress();


        if (!tasks.length) {

            tasksContainer.innerHTML = `

                <div class="empty">

                    <div class="empty-icon">
                        ✨
                    </div>

                    <strong>
                        لسه مفيش نوايا
                    </strong>

                    <span>
                        اكتب أول حاجة ناوي تعملها النهارده
                    </span>

                </div>

            `;

            return;

        }


        tasksContainer.innerHTML =
            tasks.map(task => `

                <article
                    class="task ${
                        task.completed
                            ? "completed"
                            : ""
                    }"
                    onclick="toggleTask(${task.id})"
                >

                    <div
                        class="check"
                        aria-hidden="true">
                    </div>


                    <div class="task-main">

                        <div class="task-title">

                            ${escapeHtml(
                                task.text
                            )}

                        </div>

                    </div>


                    <div class="task-actions">

                        <button
                            type="button"
                            class="icon-btn ${
                                task.starred
                                    ? "starred"
                                    : ""
                            }"
                            aria-label="تمييز"
                            onclick="toggleStar(
                                ${task.id},
                                event
                            )"
                        >

                            ${
                                task.starred
                                    ? "★"
                                    : "☆"
                            }

                        </button>


                        <button
                            type="button"
                            class="icon-btn delete"
                            aria-label="حذف"
                            onclick="deleteTask(
                                ${task.id},
                                event
                            )"
                        >

                            ×

                        </button>

                    </div>

                </article>

            `).join("");

    }


    /* =========================
       PROGRESS
    ========================= */

    function updateProgress() {

        const total =
            tasks.length;


        const completed =
            tasks.filter(
                task =>
                    task.completed
            ).length;


        if (!total) {

            progressFill.style.width =
                "0%";

            progressText.textContent =
                "ابدأ أول نية";

            return;

        }


        const percent =
            Math.round(
                completed /
                total *
                100
            );


        progressFill.style.width =
            percent + "%";


        if (
            completed === total
        ) {

            progressText.textContent =
                "خلصت كل نواياك 🎉";

        }

        else if (
            completed === 0
        ) {

            progressText.textContent =
                `${total} ${
                    total === 1
                        ? "نية"
                        : "نوايا"
                }`;

        }

        else {

            progressText.textContent =
                `${completed} من ${total} منجزة`;

        }

    }


    /* =========================
       ESCAPE HTML
    ========================= */

    function escapeHtml(text) {

        const div =
            document.createElement(
                "div"
            );


        div.textContent =
            text;


        return div.innerHTML;

    }


    /* =====================================================
       SERVICE WORKER — AUTO UPDATE
    ===================================================== */

    if (
        "serviceWorker" in navigator
    ) {

        window.addEventListener(
            "load",
            async () => {

                try {

                    const registration =
                        await navigator
                            .serviceWorker
                            .register(
                                "./sw.js",
                                {
                                    updateViaCache:
                                        "none"
                                }
                            );


                    /*
                     * افحص وجود نسخة جديدة
                     */

                    await registration.update();


                    /*
                     * لو SW جديد بدأ يثبت
                     */

                    registration.addEventListener(
                        "updatefound",
                        () => {

                            const newWorker =
                                registration.installing;


                            if (!newWorker) {

                                return;

                            }


                            newWorker.addEventListener(
                                "statechange",
                                () => {

                                    if (
                                        newWorker.state ===
                                        "installed" &&
                                        navigator
                                            .serviceWorker
                                            .controller
                                    ) {

                                        newWorker.postMessage(
                                            {
                                                type:
                                                    "SKIP_WAITING"
                                            }
                                        );

                                    }

                                }
                            );

                        }
                    );


                    /*
                     * عند استلام الصفحة
                     * بواسطة SW الجديد
                     */

                    navigator
                        .serviceWorker
                        .addEventListener(
                            "controllerchange",
                            () => {

                                if (
                                    window.__nawyReloaded
                                ) {

                                    return;

                                }


                                window.__nawyReloaded =
                                    true;


                                window.location.reload();

                            }
                        );


                } catch (error) {

                    console.log(
                        "Nawy SW:",
                        error
                    );

                }

            }
        );


        /*
         * كل مرة التطبيق يرجع للواجهة
         * نطلب من المتصفح فحص SW
         */

        document.addEventListener(
            "visibilitychange",
            async () => {

                if (
                    document.visibilityState ===
                    "visible"
                ) {

                    try {

                        const registrations =
                            await navigator
                                .serviceWorker
                                .getRegistrations();


                        for (
                            const registration
                            of registrations
                        ) {

                            await registration.update();

                        }

                    } catch {}

                }

            }
        );

    }


    /* =========================
       START
    ========================= */

    render();

    updateSubmitButton();

</script></body></html>
