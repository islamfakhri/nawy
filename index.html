<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#0d1210">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="black-translucent">

<title>ناوي — على إيه النهارده؟</title>

<link rel="manifest" href="./manifest.json">

<link rel="icon"
      type="image/png"
      href="./icon-192.png">

<link rel="apple-touch-icon"
      href="./icon-192.png">


<style>

    :root {
        --bg: #0d1210;
        --surface: #151b18;
        --text: #f4f7f5;
        --muted: #87948d;
        --muted-dark: #65716b;
        --green: #19c58b;
        --yellow: #f4c84d;
        --danger: #ff6262;
        --border: rgba(255,255,255,.07);
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
        width: 100%;
        min-height: 100%;
        background: var(--bg);
    }

    body {
        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Roboto,
            "Noto Sans Arabic",
            Tahoma,
            Arial,
            sans-serif;

        color: var(--text);
        overflow: hidden;
    }

    button,
    textarea {
        font-family: inherit;
    }

    button {
        border: none;
        outline: none;
        cursor: pointer;
        -webkit-user-select: none;
        user-select: none;
        touch-action: manipulation;
    }


    /* =========================
       APP
    ========================= */

    .app {
        width: 100%;
        max-width: 620px;
        height: 100dvh;
        margin: auto;

        display: flex;
        flex-direction: column;

        position: relative;

        background:
            radial-gradient(
                circle at 85% -10%,
                rgba(25,197,139,.13),
                transparent 30%
            ),
            var(--bg);
    }


    /* =========================
       HEADER
    ========================= */

    .header {
        padding: 28px 20px 15px;
        flex-shrink: 0;
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .brand-mark {
        width: 40px;
        height: 40px;

        display: grid;
        place-items: center;

        border-radius: 13px;

        background:
            rgba(25,197,139,.12);

        color:
            var(--green);

        font-size: 20px;
    }

    .brand-name {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -.8px;
    }


    /* =========================
       GREETING
    ========================= */

    .greeting {
        margin-top: 17px;
    }

    .greeting h1 {
        font-size: 27px;
        line-height: 1.25;
        font-weight: 800;
        letter-spacing: -.8px;
    }

    .greeting p {
        margin-top: 6px;
        color: var(--muted);
        font-size: 14px;
    }


    /* =========================
       PROGRESS
    ========================= */

    .progress {
        margin-top: 18px;

        display: flex;
        align-items: center;
        gap: 10px;
    }

    .progress-bar {
        height: 5px;
        flex: 1;

        background:
            rgba(255,255,255,.07);

        border-radius: 99px;
        overflow: hidden;
    }

    .progress-fill {
        height: 100%;
        width: 0%;

        background:
            var(--green);

        border-radius: 99px;

        transition:
            width .3s ease;
    }

    .progress-text {
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
    }


    /* =========================
       TASKS
    ========================= */

    .tasks {
        flex: 1;

        overflow-y: auto;

        padding:
            8px
            20px
            160px;

        scrollbar-width: none;
    }

    .tasks::-webkit-scrollbar {
        display: none;
    }

    .task {
        min-height: 64px;

        display: flex;
        align-items: center;

        gap: 13px;

        padding: 11px 3px;

        border-bottom:
            1px solid var(--border);

        transition:
            opacity .2s ease,
            transform .15s ease;
    }

    .task:last-child {
        border-bottom: none;
    }

    .completed-divider {
        display: flex;
        align-items: center;
        gap: 10px;

        margin: 22px 0 3px;

        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
    }

    .completed-divider::before,
    .completed-divider::after {
        content: "";
        height: 1px;
        flex: 1;
        background: var(--border);
    }

    .completed-divider span {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
    }

    .completed-divider span::before {
        content: "✓";
        color: var(--green);
        font-size: 13px;
    }

    .task:active {
        transform: scale(.99);
    }


    /* =========================
       CHECK
    ========================= */

    .check {
        width: 23px;
        height: 23px;

        flex: 0 0 23px;

        border:
            1.8px solid #66736c;

        border-radius: 50%;

        display: grid;
        place-items: center;

        transition:
            all .2s ease;
    }

    .task.completed .check {
        background: var(--green);
        border-color: var(--green);
    }

    .check::after {
        content: "✓";

        color: #07120e;

        font-size: 14px;
        font-weight: 900;

        opacity: 0;

        transform: scale(.5);

        transition:
            all .2s ease;
    }

    .task:not(.completed) .check {
        cursor: pointer;
    }

    .task:not(.completed) .check:hover {
        background: rgba(25,197,139,.1);
        border-color: var(--green);
    }

    .task:not(.completed) .check:hover::after {
        color: var(--green);
        opacity: .9;
        transform: scale(.82);
    }

    .task.completed .check::after {
        opacity: 1;
        transform: scale(1);
    }

    .task.just-completed .check {
        animation: check-celebrate .52s cubic-bezier(.18,.9,.3,1.35);
        box-shadow: 0 0 0 7px rgba(25,197,139,.12);
    }

    .task.just-completed .check::after {
        animation: check-reveal .36s .06s both;
    }

    @keyframes check-celebrate {
        0% { transform: scale(1); }
        45% { transform: scale(1.28); }
        100% { transform: scale(1); }
    }

    @keyframes check-reveal {
        from { transform: scale(.35) rotate(-12deg); }
        to { transform: scale(1) rotate(0); }
    }

    .completion-burst {
        position: fixed;
        width: 44px;
        height: 44px;
        pointer-events: none;
        transform: translate(-50%, -50%);
        z-index: 20;
    }

    .completion-burst::before {
        content: "";
        position: absolute;
        inset: 10px;
        border: 2px solid rgba(25,197,139,.8);
        border-radius: 50%;
        animation: completion-ring .52s ease-out forwards;
    }

    .completion-burst span {
        position: absolute;
        top: 50%;
        left: 50%;
        width: var(--size);
        height: var(--size);
        border-radius: 50%;
        background: var(--color);
        box-shadow: 0 0 8px rgba(255,255,255,.35);
        animation: completion-particle .58s cubic-bezier(.18,.7,.3,1) forwards;
    }

    @keyframes completion-ring {
        from { transform: scale(.55); opacity: .9; }
        to { transform: scale(1.8); opacity: 0; }
    }

    @keyframes completion-particle {
        from {
            transform: translate(-50%, -50%) rotate(var(--angle)) translateY(-8px) scale(.5);
            opacity: 1;
        }
        to {
            transform: translate(-50%, -50%) rotate(var(--angle)) translateY(calc(var(--distance) * -1)) scale(0);
            opacity: 0;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .task.just-completed .check,
        .task.just-completed .check::after,
        .completion-burst::before,
        .completion-burst span {
            animation: none;
        }
    }


    /* =========================
       TASK TEXT
    ========================= */

    .task-main {
        min-width: 0;
        flex: 1;
    }

    .task-title {
        font-size: 16px;
        line-height: 1.45;

        color: #eef3f0;

        overflow-wrap: anywhere;

        transition:
            all .2s ease;
    }

    .task.completed .task-title {
        color: var(--muted-dark);

        text-decoration:
            line-through;
    }


    /* =========================
       ACTIONS
    ========================= */

    .task-actions {
        display: flex;
        align-items: center;

        gap: 2px;

        opacity: .65;
    }

    .icon-btn {
        width: 34px;
        height: 34px;

        display: grid;
        place-items: center;

        border-radius: 10px;

        background: transparent;

        color: #718078;

        font-size: 19px;

        transition:
            all .2s ease;
    }

    .icon-btn:active {
        background:
            rgba(255,255,255,.07);
    }

    .icon-btn.starred {
        color: var(--yellow);
    }

    .icon-btn.delete:active {
        color: var(--danger);
    }


    /* =========================
       EMPTY
    ========================= */

    .empty {
        text-align: center;
        padding: 80px 25px;
    }

    .empty-icon {
        width: 58px;
        height: 58px;

        margin:
            0 auto 15px;

        display: grid;
        place-items: center;

        border-radius: 18px;

        background:
            rgba(25,197,139,.09);

        color:
            var(--green);

        font-size: 25px;
    }

    .empty strong {
        display: block;

        color: #dfe7e3;

        font-size: 16px;

        margin-bottom: 5px;
    }

    .empty span {
        color: var(--muted);
        font-size: 13px;
    }


    /* =========================
       INSTALL FLOAT
    ========================= */

    .install-overlay {
        position: fixed;

        inset: 0;

        display: flex;

        align-items: flex-end;
        justify-content: center;

        padding:
            18px;

        background:
            rgba(0,0,0,.22);

        backdrop-filter:
            blur(2px);

        opacity: 0;

        visibility: hidden;

        pointer-events: none;

        transition:
            opacity .25s ease,
            visibility .25s ease;

        z-index: 1000;
    }

    .install-overlay.show {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
    }

    .install-sheet {
        width: 100%;
        max-width: 620px;

        display: flex;

        align-items: center;

        gap: 12px;

        padding:
            14px;

        background:
            rgba(21,27,24,.98);

        border:
            1px solid
            rgba(25,197,139,.13);

        border-radius:
            20px;

        box-shadow:
            0 20px 55px
            rgba(0,0,0,.42);

        transform:
            translateY(25px);

        transition:
            transform .28s ease;
    }

    .install-overlay.show
    .install-sheet {
        transform:
            translateY(0);
    }

    .install-icon {
        width: 44px;
        height: 44px;

        flex: 0 0 44px;

        display: grid;
        place-items: center;

        border-radius: 14px;

        background:
            rgba(25,197,139,.11);

        font-size: 20px;
    }

    .install-copy {
        min-width: 0;
        flex: 1;
    }

    .install-title {
        font-size: 15px;
        font-weight: 800;
    }

    .install-subtitle {
        margin-top: 3px;

        color: var(--muted);

        font-size: 11px;

        line-height: 1.4;
    }

    .install-btn {
        flex-shrink: 0;

        padding:
            10px 14px;

        border-radius:
            12px;

        background:
            var(--green);

        color:
            #06140f;

        font-size:
            12px;

        font-weight:
            900;

        white-space:
            nowrap;

        box-shadow:
            0 6px 18px
            rgba(25,197,139,.18);
    }

    .install-close {
        width: 30px;
        height: 30px;

        flex: 0 0 30px;

        display: grid;
        place-items: center;

        border-radius: 50%;

        background:
            rgba(255,255,255,.04);

        color:
            #718078;

        font-size: 18px;
    }


    /* =========================
       INSTALL GUIDE
    ========================= */

    .install-guide {
        position: fixed;

        inset: 0;

        display: grid;
        place-items: center;

        padding: 22px;

        background:
            rgba(0,0,0,.55);

        backdrop-filter:
            blur(8px);

        opacity: 0;
        visibility: hidden;

        pointer-events: none;

        transition:
            all .25s ease;

        z-index: 1100;
    }

    .install-guide.show {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
    }

    .guide-box {
        width: 100%;
        max-width: 380px;

        padding: 22px;

        background:
            #151b18;

        border:
            1px solid var(--border);

        border-radius:
            22px;

        box-shadow:
            0 25px 70px
            rgba(0,0,0,.45);

        text-align:
            center;
    }

    .guide-box h2 {
        font-size: 19px;
        margin-bottom: 9px;
    }

    .guide-box p {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.7;
    }

    .guide-close {
        margin-top: 18px;

        width: 100%;

        padding: 11px;

        border-radius: 13px;

        background:
            rgba(255,255,255,.06);

        color:
            var(--text);

        font-size: 13px;
    }


    /* =========================
       COMPOSER
    ========================= */

    .composer-wrap {
        position: absolute;

        left: 0;
        right: 0;
        bottom: 0;

        padding:
            12px
            16px
            calc(12px + env(safe-area-inset-bottom));

        background:
            linear-gradient(
                to top,
                var(--bg) 70%,
                transparent
            );

        pointer-events: none;
    }

    .composer {
        pointer-events: auto;

        display: flex;

        align-items: flex-end;

        gap: 8px;

        padding:
            7px
            8px
            7px
            7px;

        background:
            rgba(25,32,29,.96);

        border:
            1px solid var(--border);

        border-radius:
            20px;

        box-shadow:
            0 18px 45px
            rgba(0,0,0,.28);

        backdrop-filter:
            blur(18px);
    }


    /* =========================
       INPUT
    ========================= */

    textarea {
        flex: 1;

        min-width: 0;

        min-height: 42px;
        max-height: 110px;

        resize: none;

        border: none;
        outline: none;

        background: transparent;

        color:
            var(--text);

        padding:
            10px;

        line-height:
            1.45;

        font-size:
            15px;
    }

    textarea::placeholder {
        color:
            #718078;
    }


    /* =========================
       SUBMIT
    ========================= */

    .submit {
        width: 42px;
        height: 42px;

        flex: 0 0 42px;

        display: grid;
        place-items: center;

        border-radius: 50%;

        background:
            #29332e;

        color:
            #718078;

        font-size:
            20px;

        transition:
            all .2s ease;
    }

    .submit.active {
        background:
            var(--green);

        color:
            #06140f;

        box-shadow:
            0 7px 20px
            rgba(25,197,139,.22);
    }

    .submit:active {
        transform:
            scale(.94);
    }

    .submit:disabled {
        pointer-events:
            none;
    }

    .hint {
        text-align: center;

        color:
            #56635c;

        font-size:
            10px;

        margin-top:
            7px;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width:380px) {

        .header {
            padding:
                22px
                16px
                12px;
        }

        .tasks {
            padding-left:
                16px;

            padding-right:
                16px;
        }

        .greeting h1 {
            font-size:
                24px;
        }

        .task-title {
            font-size:
                15px;
        }

        .install-overlay {
            padding:
                12px;
        }

        .install-sheet {
            gap:
                9px;

            padding:
                12px;
        }

        .install-subtitle {
            font-size:
                10px;
        }

    }

</style>

</div><script>

    /* =====================================================
       NAWY
    ===================================================== */

    const STORAGE_KEY =
        "nawy_tasks_v4";


    const taskInput =
        document.getElementById(
            "taskInput"
        );


    const submitBtn =
        document.getElementById(
            "submitBtn"
        );


    const tasksContainer =
        document.getElementById(
            "tasksContainer"
        );


    const progressFill =

        );

        );


    const currentDate =
        document.getElementById(

        );


    const installOverlay =
        document.getElementById(
            "installOverlay"
        );


    const installBtn =
        document.getElementById(
            "installBtn"
        );


    const installClose =
        document.getElementById(
            "installClose"
        );


    const installGuide =
        document.getElementById(
            "installGuide"
        );


    const guideText =
        document.getElementById(
            "guideText"
        );


    const guideClose =
        document.getElementById(
            "guideClose"
        );


    let tasks =
        loadTasks();


    let isAddingTask =
        false;


    let deferredInstallPrompt =
        null;


    /* =====================================================
       SOUND
    ===================================================== */

    let audioContext =
        null;


    function playAddSound() {

        try {

            const AudioContext =
                window.AudioContext ||
                window.webkitAudioContext;


            if (!AudioContext) {
                return;
            }


            if (!audioContext) {

                audioContext =
                    new AudioContext();

            }


            if (
                audioContext.state ===
                "suspended"
            ) {

                audioContext.resume();

            }


            const now =
                audioContext.currentTime;


            const oscillator =
                audioContext.createOscillator();


            const gain =
                audioContext.createGain();


            oscillator.type =
                "sine";


            oscillator.frequency.setValueAtTime(
                430,
                now
            );


            oscillator.frequency.exponentialRampToValueAtTime(
                680,
                now + 0.055
            );


            oscillator.frequency.exponentialRampToValueAtTime(
                540,
                now + 0.10
            );


            gain.gain.setValueAtTime(
                0.0001,
                now
            );


            gain.gain.exponentialRampToValueAtTime(
                0.055,
                now + 0.008
            );


            gain.gain.exponentialRampToValueAtTime(
                0.018,
                now + 0.045
            );


            gain.gain.exponentialRampToValueAtTime(
                0.0001,
                now + 0.12
            );


            oscillator.connect(gain);

            gain.connect(
                audioContext.destination
            );


            oscillator.start(now);

            oscillator.stop(
                now + 0.125
            );

        } catch (error) {

            console.log(
                "Nawy sound:",
                error
            );

        }

    }


    function playCompletionSound() {

        try {

            const AudioContext =
                window.AudioContext ||
                window.webkitAudioContext;


            if (!AudioContext) {
                return;
            }


            if (!audioContext) {
                audioContext = new AudioContext();
            }


            if (audioContext.state === "suspended") {
                audioContext.resume();
            }


            const now = audioContext.currentTime;
            const tones = [
                { frequency: 1046.5, volume: 0.065, duration: 0.34 },
                { frequency: 2093, volume: 0.012, duration: 0.22 }
            ];


            tones.forEach(({ frequency, volume, duration }) => {

                const oscillator =
                    audioContext.createOscillator();

                const gain =
                    audioContext.createGain();

                oscillator.type = "triangle";
                oscillator.frequency.setValueAtTime(
                    frequency,
                    now
                );

                gain.gain.setValueAtTime(
                    0.0001,
                    now
                );

                gain.gain.exponentialRampToValueAtTime(
                    volume,
                    now + 0.008
                );

                gain.gain.exponentialRampToValueAtTime(
                    0.0001,
                    now + duration
                );

                oscillator.connect(gain);
                gain.connect(audioContext.destination);

                oscillator.start(now);
                oscillator.stop(now + duration + 0.01);

            });

        } catch (error) {

            console.log(
                "Nawy completion sound:",
                error
            );

        }

    }


    function showCompletionFeedback(id) {

        if (
            window.matchMedia(
                "(prefers-reduced-motion: reduce)"
            ).matches
        ) {
            return;
        }


        const taskElement = document.querySelector(
            `[data-task-id="${id}"]`
        );


        if (taskElement) {

            taskElement.classList.add(
                "just-completed"
            );

            window.setTimeout(
                () => taskElement.classList.remove(
                    "just-completed"
                ),
                550
            );

        }


        const checkElement = taskElement?.querySelector(
            ".check"
        );


        if (!checkElement) {
            return;
        }


        const checkBounds = checkElement.getBoundingClientRect();
        const burst = document.createElement("div");

        burst.className = "completion-burst";
        burst.setAttribute("aria-hidden", "true");
        burst.style.left =
            checkBounds.left + checkBounds.width / 2 + "px";
        burst.style.top =
            checkBounds.top + checkBounds.height / 2 + "px";

        burst.innerHTML = Array.from(
            { length: 12 },
            (_, index) => {

                const colors = [
                    "#19c58b",
                    "#f4c84d",
                    "#f4f7f5"
                ];


                return `
                <span style="--angle: ${index * 30}deg; --color: ${colors[index % colors.length]}; --distance: ${29 + index % 3 * 7}px; --size: ${4 + index % 2}px"></span>
            `
            }
        ).join("");

        document.body.appendChild(burst);

        window.setTimeout(
            () => burst.remove(),
            560
        );

    }


    /* =========================
       DATE
    ========================= */

    currentDate.textContent =
        new Intl.DateTimeFormat(
            "ar-EG",
            {
                weekday:
                    "long",

                day:
                    "numeric",

                month:
                    "long"
            }
        ).format(
            new Date()
        );


    /* =========================
       STORAGE
    ========================= */

    function loadTasks() {

        try {

            const saved =
                JSON.parse(
                    localStorage.getItem(
                        STORAGE_KEY
                    )
                );


            if (
                Array.isArray(saved)
            ) {

                return saved;

            }


            const old =
                JSON.parse(
                    localStorage.getItem(
                        "nawy_tasks_v3"
                    )
                );


            return Array.isArray(old)
                ? old
                : [];


        } catch {

            return [];

        }

    }


    function save() {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(tasks)
        );

    }


    /* =========================
       INPUT
    ========================= */

    taskInput.addEventListener(
        "input",
        () => {

            autoResize();

            updateSubmitButton();

        }
    );


    taskInput.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                addTask();

            }

        }
    );


    submitBtn.addEventListener(
        "click",
        () => {

            addTask();

        }
    );


    function autoResize() {

        taskInput.style.height =
            "auto";


        taskInput.style.height =
            Math.min(
                taskInput.scrollHeight,
                110
            ) + "px";

    }


    function updateSubmitButton() {

        const hasText =
            taskInput.value
                .trim()
                .length > 0;


        submitBtn.classList.toggle(
            "active",
            hasText
        );


        submitBtn.disabled =
            !hasText ||
            isAddingTask;

    }


    /* =========================
       ADD TASK
    ========================= */

    function addTask() {

        if (
            isAddingTask
        ) {

            return;

        }


        const text =
            taskInput.value.trim();


        if (!text) {

            return;

        }


        isAddingTask =
            true;


        updateSubmitButton();


        const now =
            Date.now();


        tasks.unshift({

            id:
                now,

            text:
                text,

            completed:
                false,

            starred:
                false,

            createdAt:
                now

        });


        save();

        render();


        playAddSound();


        taskInput.value =
            "";


        taskInput.style.height =
            "42px";


        isAddingTask =
            false;


        updateSubmitButton();


        taskInput.focus();

    }


    /* =========================
       COMPLETE
    ========================= */

    function toggleTask(id) {

        const task =
            tasks.find(
                item =>
                    item.id === id
            );


        if (!task) {
            return;
        }


        task.completed =
            !task.completed;


        save();

        render();


        if (task.completed) {

            playCompletionSound();

            showCompletionFeedback(
                id
            );

        }

    }


    /* =========================
       STAR
    ========================= */

    function toggleStar(
        id,
        event
    ) {

        event.stopPropagation();


        const task =
            tasks.find(
                item =>
                    item.id === id
            );


        if (!task) {
            return;
        }


        task.starred =
            !task.starred;


        tasks.sort(
            (a, b) =>
                Number(b.starred) -
                Number(a.starred)
        );


        save();

        render();

    }


    /* =========================
       DELETE
    ========================= */

    function deleteTask(
        id,
        event
    ) {

        event.stopPropagation();


        tasks =
            tasks.filter(
                task =>
                    task.id !== id
            );


        save();

        render();

    }


    /* =========================
       RENDER
    ========================= */

    function render() {

        updateProgress();


        if (!tasks.length) {

            tasksContainer.innerHTML = `

                <div class="empty">

                    <div class="empty-icon">
                        ✨
                    </div>

                    <strong>
                        لسه مفيش نوايا
                    </strong>

                    <span>
                        اكتب أول حاجة ناوي تعملها النهارده
                    </span>

                </div>

            `;

            return;

        }


        const renderTask =
            task => `

                <article
                    data-task-id="${task.id}"
                    class="task ${
                        task.completed
                            ? "completed"
                            : ""
                    }"
                    onclick="toggleTask(${task.id})"
                >

                    <div
                        class="check"
                        aria-hidden="true">
                    </div>


                    <div class="task-main">

                        <div class="task-title">

                            ${escapeHtml(
                                task.text
                            )}

                        </div>

                    </div>


                    <div class="task-actions">

                        <button
                            type="button"
                            class="icon-btn ${
                                task.starred
                                    ? "starred"
                                    : ""
                            }"
                            aria-label="تمييز"
                            onclick="toggleStar(
                                ${task.id},
                                event
                            )"
                        >

                            ${
                                task.starred
                                    ? "★"
                                    : "☆"
                            }

                        </button>


                        <button
                            type="button"
                            class="icon-btn delete"
                            aria-label="حذف"
                            onclick="deleteTask(
                                ${task.id},
                                event
                            )"
                        >

                            ×

                        </button>

                    </div>

                </article>

            `;


        const pendingTasks = tasks.filter(
            task => !task.completed
        );


        const completedTasks = tasks.filter(
            task => task.completed
        );


        tasksContainer.innerHTML = [
            pendingTasks.map(renderTask).join(""),

            completedTasks.length
                ? `
                    <div class="completed-divider">
                        <span>تم الإنجاز (${completedTasks.length})</span>
                    </div>
                    ${completedTasks.map(renderTask).join("")}
                `
                : ""
        ].join("");

    }


    /* =========================
       PROGRESS
    ========================= */

    function updateProgress() {

        const total =
            tasks.length;


        const completed =
            tasks.filter(
                task =>
                    task.completed
            ).length;


        if (!total) {

            progressFill.style.width =
                "0%";

            progressText.textContent =
                "ابدأ أول نية";

            return;

        }


        const percent =
            Math.round(
                completed /
                total *
                100
            );


        progressFill.style.width =
            percent + "%";


        if (
            completed === total
        ) {

            progressText.textContent =
                "خلصت كل نواياك 🎉";

        }

        else if (
            completed === 0
        ) {

            progressText.textContent =
                `${total} ${
                    total === 1
                        ? "نية"
                        : "نوايا"
                }`;

        }

        else {

            progressText.textContent =
                `${completed} من ${total} منجزة`;

        }

    }


    /* =========================
       ESCAPE HTML
    ========================= */

    function escapeHtml(text) {

        const div =
            document.createElement(
                "div"
            );


        div.textContent =
            text;


        return div.innerHTML;

    }


    /* =====================================================
       INSTALL EXPERIENCE
    ===================================================== */

    function isInstalled() {

        return (
            window.matchMedia(
                "(display-mode: standalone)"
            ).matches
            ||
            window.navigator.standalone === true
        );

    }


    function showInstallOverlay() {

        if (isInstalled()) {
            return;
        }


        installOverlay.classList.add(
            "show"
        );

        installOverlay.setAttribute(
            "aria-hidden",
            "false"
        );

    }


    function hideInstallOverlay() {

        installOverlay.classList.remove(
            "show"
        );

        installOverlay.setAttribute(
            "aria-hidden",
            "true"
        );

    }


    function showInstallGuide() {

        installGuide.classList.add(
            "show"
        );

        installGuide.setAttribute(
            "aria-hidden",
            "false"
        );


        const isIOS =
            /iPad|iPhone|iPod/.test(
                navigator.userAgent
            )
            ||
            (
                navigator.platform ===
                "MacIntel" &&
                navigator.maxTouchPoints > 1
            );


        if (isIOS) {

            guideText.innerHTML =
                "اضغط على زر <strong>المشاركة</strong> في المتصفح، ثم اختر <strong>إضافة إلى الشاشة الرئيسية</strong>.";

        }

        else {

            guideText.innerHTML =
                "من قائمة المتصفح اختار <strong>إضافة إلى الشاشة الرئيسية</strong> أو <strong>Install app</strong> عشان تستخدم ناوي كتطبيق.";

        }

    }


    function hideInstallGuide() {

        installGuide.classList.remove(
            "show"
        );

        installGuide.setAttribute(
            "aria-hidden",
            "true"
        );

    }


    /*
     * المتصفح أعطانا أمر التثبيت الأصلي
     */

    window.addEventListener(
        "beforeinstallprompt",
        event => {

            event.preventDefault();

            deferredInstallPrompt =
                event;

        }
    );


    /*
     * زر نزّل ناوي
     */

    installBtn.addEventListener(
        "click",
        async () => {

            if (
                deferredInstallPrompt
            ) {

                deferredInstallPrompt.prompt();


                try {

                    await deferredInstallPrompt.userChoice;

                } catch {}


                deferredInstallPrompt =
                    null;


                hideInstallOverlay();

                return;

            }


            /*
             * لو المتصفح لا يدعم
             * الأمر البرمجي
             */

            showInstallGuide();

        }
    );


    installClose.addEventListener(
        "click",
        () => {

            hideInstallOverlay();

        }
    );


    guideClose.addEventListener(
        "click",
        () => {

            hideInstallGuide();

        }
    );


    installGuide.addEventListener(
        "click",
        event => {

            if (
                event.target ===
                installGuide
            ) {

                hideInstallGuide();

            }

        }
    );


    /*
     * بعد نجاح التثبيت
     */

    window.addEventListener(
        "appinstalled",
        () => {

            deferredInstallPrompt =
                null;

            hideInstallOverlay();

            hideInstallGuide();

        }
    );


    /*
     * الرسالة أساسية على الويب.
     * تأخير بسيط حتى لا تغطي الواجهة
     * قبل أن تظهر.
     */

    window.addEventListener(
        "load",
        () => {

            if (!isInstalled()) {

                setTimeout(
                    showInstallOverlay,
                    900
                );

            }

        }
    );


    /* =====================================================
       SERVICE WORKER
       ===================================================== */

    if (
        "serviceWorker" in navigator
    ) {

        window.addEventListener(
            "load",
            async () => {

                try {

                    const registration =
                        await navigator
                            .serviceWorker
                            .register(
                                "./sw.js",
                                {
                                    updateViaCache:
                                        "none"
                                }
                            );


                    await registration.update();


                    registration.addEventListener(
                        "updatefound",
                        () => {

                            const newWorker =
                                registration.installing;


                            if (!newWorker) {
                                return;
                            }


                            newWorker.addEventListener(
                                "statechange",
                                () => {

                                    if (
                                        newWorker.state ===
                                        "installed" &&
                                        navigator
                                            .serviceWorker
                                            .controller
                                    ) {

                                        newWorker.postMessage(
                                            {
                                                type:
                                                    "SKIP_WAITING"
                                            }
                                        );

                                    }

                                }
                            );

                        }
                    );


                    navigator
                        .serviceWorker
                        .addEventListener(
                            "controllerchange",
                            () => {

                                if (
                                    window.__nawyReloaded
                                ) {

                                    return;

                                }


                                window.__nawyReloaded =
                                    true;


                                window.location.reload();

                            }
                        );


                } catch (error) {

                    console.log(
                        "Nawy SW:",
                        error
                    );

                }

            }
        );


        document.addEventListener(
            "visibilitychange",
            async () => {

                if (
                    document.visibilityState ===
                    "visible"
                ) {

                    try {

                        const registrations =
                            await navigator
                                .serviceWorker
                                .getRegistrations();


                        for (
                            const registration
                            of registrations
                        ) {

                            await registration.update();

                        }

                    } catch {}

                }

            }
        );

    }


    /* =========================
       START
    ========================= */

    render();

    updateSubmitButton();

</script></body></html>
