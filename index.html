<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#0d1210">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>ناوي — على إيه النهارده؟</title>

    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./icon-192.png">
    <link rel="apple-touch-icon" href="./icon-192.png">

    <style>

        /* =====================================================
           NAWY — MODERN ARABIC TODO
           ===================================================== */

        :root {
            --bg: #0d1210;
            --surface: #151b18;
            --surface-light: #1b2420;

            --text: #f4f7f5;
            --text-soft: #c5cfca;

            --muted: #87948d;
            --muted-dark: #65716b;

            --green: #19c58b;
            --green-dark: #0f8f66;

            --yellow: #f4c84d;
            --danger: #ff6262;

            --border: rgba(255, 255, 255, 0.07);

            --radius: 18px;
        }


        /* =========================
           RESET
           ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

            -webkit-tap-highlight-color: transparent;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;

            background: var(--bg);
        }


        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                "Noto Sans Arabic",
                Tahoma,
                Arial,
                sans-serif;

            color: var(--text);

            overflow: hidden;
        }


        button,
        textarea {
            font-family: inherit;
        }


        button {
            border: none;
            outline: none;
            cursor: pointer;
        }


        /* =========================
           APP
           ========================= */

        .app {

            width: 100%;
            max-width: 620px;

            height: 100dvh;

            margin: 0 auto;

            display: flex;
            flex-direction: column;

            position: relative;

            background:
                radial-gradient(
                    circle at 85% -10%,
                    rgba(25, 197, 139, 0.13),
                    transparent 30%
                ),
                var(--bg);
        }


        /* =========================
           HEADER
           ========================= */

        .header {

            padding:
                28px
                20px
                15px;

            flex-shrink: 0;
        }


        .brand-row {

            display: flex;
            align-items: center;
            justify-content: space-between;
        }


        .brand {

            display: flex;
            align-items: center;

            gap: 10px;
        }


        .brand-mark {

            width: 40px;
            height: 40px;

            display: grid;
            place-items: center;

            border-radius: 13px;

            background:
                rgba(25, 197, 139, 0.12);

            color: var(--green);

            font-size: 20px;
        }


        .brand-name {

            font-size: 24px;

            font-weight: 800;

            letter-spacing: -0.8px;
        }


        /* =========================
           GREETING
           ========================= */

        .greeting {

            margin-top: 17px;
        }


        .greeting h1 {

            font-size: 27px;

            line-height: 1.25;

            font-weight: 800;

            letter-spacing: -0.8px;
        }


        .greeting p {

            margin-top: 6px;

            color: var(--muted);

            font-size: 14px;

            font-weight: 400;
        }


        /* =========================
           PROGRESS
           ========================= */

        .progress {

            margin-top: 18px;

            display: flex;
            align-items: center;

            gap: 10px;
        }


        .progress-bar {

            height: 5px;

            flex: 1;

            background:
                rgba(255,255,255,0.07);

            border-radius: 99px;

            overflow: hidden;
        }


        .progress-fill {

            height: 100%;

            width: 0%;

            background: var(--green);

            border-radius: 99px;

            transition:
                width 0.3s ease;
        }


        .progress-text {

            color: var(--muted);

            font-size: 12px;

            white-space: nowrap;
        }


        /* =========================
           TASKS
           ========================= */

        .tasks {

            flex: 1;

            overflow-y: auto;

            padding:
                8px
                20px
                160px;

            scrollbar-width: none;
        }


        .tasks::-webkit-scrollbar {
            display: none;
        }


        /* =========================
           TASK
           ========================= */

        .task {

            min-height: 64px;

            display: flex;
            align-items: center;

            gap: 13px;

            padding:
                11px
                3px;

            border-bottom:
                1px solid var(--border);

            transition:
                opacity 0.2s ease,
                transform 0.15s ease;
        }


        .task:last-child {
            border-bottom: none;
        }


        .task:active {

            transform:
                scale(0.99);
        }


        /* =========================
           CHECK
           ========================= */

        .check {

            width: 23px;
            height: 23px;

            flex: 0 0 23px;

            border:
                1.8px solid #66736c;

            border-radius: 50%;

            display: grid;
            place-items: center;

            transition:
                all 0.2s ease;
        }


        .task.completed .check {

            background:
                var(--green);

            border-color:
                var(--green);
        }


        .check::after {

            content: "✓";

            color: #07120e;

            font-size: 14px;

            font-weight: 900;

            opacity: 0;

            transform:
                scale(0.5);

            transition:
                all 0.2s ease;
        }


        .task.completed .check::after {

            opacity: 1;

            transform:
                scale(1);
        }


        /* =========================
           TASK CONTENT
           ========================= */

        .task-main {

            min-width: 0;

            flex: 1;
        }

            line-height:
