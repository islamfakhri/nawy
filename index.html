<style>

/* =========================================================
   NAWY
   Minimal Arabic To-Do
   ========================================================= */

:root {

    --bg: #0d0d0d;
    --surface: #191919;
    --surface-2: #222222;

    --text: #f4f4f4;
    --text-soft: #dedede;

    --muted: #858585;
    --muted-dark: #555b58;

    --green: #19c58b;
    --green-soft: rgba(25,197,139,.12);

    --yellow: #e8bf48;
    --danger: #ff6666;

    --border: rgba(255,255,255,.075);

    --content-width: 760px;
}


/* =========================================================
   RESET
   ========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html {
    width: 100%;
    min-height: 100%;
    background: var(--bg);
    color-scheme: dark;
}

body {
    width: 100%;
    min-height: 100dvh;
    margin: 0;

    background: var(--bg);
    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        "Noto Sans Arabic",
        Tahoma,
        Arial,
        sans-serif;

    overflow: hidden;

    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
}

button,
textarea {
    font: inherit;
}

button {
    border: 0;
    outline: 0;
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
}


/* =========================================================
   APP
   ========================================================= */

.app {
    width: 100%;
    height: 100dvh;
    min-height: 100dvh;

    display: flex;
    flex-direction: column;

    position: relative;

    background:
        radial-gradient(
            circle at 84% -12%,
            rgba(25,197,139,.06),
            transparent 28%
        ),
        var(--bg);
}


/* =========================================================
   HEADER
   ========================================================= */

.header {

    width: 100%;
    max-width: var(--content-width);

    margin: 0 auto;

    padding:
        calc(25px + env(safe-area-inset-top))
        22px
        12px;

    flex-shrink: 0;
}

.brand {
    display: flex;
    align-items: center;
}

.brand-logo {

    width: 30px;
    height: 30px;

    margin-left: 9px;

    display: grid;
    place-items: center;

    border-radius: 9px;

    background:
        linear-gradient(
            145deg,
            #1bd092,
            #119b6f
        );

    color: #06130e;

    font-size: 17px;
    font-weight: 950;

    box-shadow:
        0 5px 18px rgba(25,197,139,.16);
}

.brand-name {

    font-size: 25px;
    line-height: 1;

    font-weight: 900;

    letter-spacing: -.9px;

    color: #f5f5f5;
}

.greeting {
    margin-top: 20px;
}

.greeting h1 {

    font-size:
        clamp(25px, 5vw, 30px);

    line-height: 1.2;

    font-weight: 900;

    letter-spacing: -1.1px;

    color: #f3f3f3;
}

.greeting p {

    margin-top: 7px;

    color: #747a77;

    font-size: 13px;

    font-weight: 500;
}


/* =========================================================
   PROGRESS
   ========================================================= */

.progress {

    margin-top: 17px;

    display: flex;
    align-items: center;

    gap: 10px;
}

.progress-bar {

    flex: 1;

    height: 5px;

    overflow: hidden;

    border-radius: 999px;

    background:
        rgba(255,255,255,.065);
}

.progress-fill {

    width: 0;
    height: 100%;

    background: var(--green);

    border-radius: inherit;

    transition:
        width .4s cubic-bezier(.2,.8,.2,1);
}

.progress-text {

    min-width: max-content;

    color: var(--muted);

    font-size: 11px;

    white-space: nowrap;
}


/* =========================================================
   TASK LIST
   ========================================================= */

.tasks {

    width: 100%;
    max-width: var(--content-width);

    margin: 0 auto;

    flex: 1;
    min-height: 0;

    overflow-y: auto;

    padding:
        7px
        22px
        155px;

    scrollbar-width: none;

    overscroll-behavior: contain;
}

.tasks::-webkit-scrollbar {
    display: none;
}


/* =========================================================
   SECTION
   ========================================================= */

.section-label {

    display: flex;
    align-items: center;

    gap: 10px;

    margin:
        20px
        0
        4px;

    color: #777d7a;

    font-size: 11px;

    font-weight: 800;
}

.section-label:first-child {
    margin-top: 5px;
}

.section-label::before,
.section-label::after {

    content: "";

    height: 1px;

    flex: 1;

    background: var(--border);
}

.section-label span {
    white-space: nowrap;
}


/* =========================================================
   TASK
   ========================================================= */

.task {

    width: 100%;

    min-height: 64px;

    display: flex;
    align-items: center;

    gap: 13px;

    padding:
        10px
        2px;

    border-bottom:
        1px solid var(--border);

    cursor: pointer;

    position: relative;

    transition:
        opacity .2s ease,
        transform .15s ease;
}

.task:last-child {
    border-bottom-color: transparent;
}

.task:active {
    transform: scale(.995);
}


/* =========================================================
   CHECK
   ========================================================= */

.check {

    width: 25px;
    height: 25px;

    flex: 0 0 25px;

    display: grid;
    place-items: center;

    padding: 0;

    border:
        1.8px solid #68716d;

    border-radius: 50%;

    background: transparent;

    color: var(--green);

    position: relative;

    transition:
        background .18s ease,
        border-color .18s ease,
        transform .18s cubic-bezier(.18,.9,.3,1.3),
        box-shadow .18s ease;
}

.check svg {

    width: 14px;
    height: 14px;

    fill: none;

    stroke: currentColor;

    stroke-width: 2.7;

    stroke-linecap: round;
    stroke-linejoin: round;

    opacity: 0;

    transform: scale(.5);

    transition:
        opacity .16s ease,
        transform .18s cubic-bezier(.18,.9,.3,1.3);
}

.task:not(.completed):hover .check {

    background: var(--green-soft);

    border-color: var(--green);

    transform: scale(1.07);

    box-shadow:
        0 0 0 4px
        rgba(25,197,139,.05);
}

.task.completed .check {

    background: var(--green);

    border-color: var(--green);

    color: #06130e;
}

.task.completed .check svg {

    opacity: 1;

    transform: scale(1);
}


/* =========================================================
   COMPLETION CELEBRATION
   ========================================================= */

.task.just-completed .check {

    animation:
        check-celebrate
        .55s
        cubic-bezier(.18,.9,.3,1.3);
}

.task.just-completed .task-title {

    animation:
        strike-in
        .34s
        ease forwards;
}

@keyframes check-celebrate {

    0% {
        transform: scale(1);
        box-shadow:
            0 0 0 0
            rgba(25,197,139,0);
    }

    35% {
        transform: scale(1.32);
        box-shadow:
            0 0 0 8px
            rgba(25,197,139,.14);
    }

    65% {
        transform: scale(.94);
        box-shadow:
            0 0 0 13px
            rgba(25,197,139,.045);
    }

    100% {
        transform: scale(1);
        box-shadow:
            0 0 0 0
            rgba(25,197,139,0);
    }
}

@keyframes strike-in {

    0% {
        color: #ededed;
        text-decoration-color: transparent;
    }

    100% {
        color: var(--muted-dark);
        text-decoration-color: var(--muted-dark);
    }
}


/* =========================================================
   TASK CONTENT
   ========================================================= */

.task-main {

    min-width: 0;

    flex: 1;
}

.task-title {

    color: #ededed;

    font-size: 16px;

    line-height: 1.5;

    overflow-wrap: anywhere;

    transition:
        color .25s ease;
}

.task.completed .task-title {

    color: var(--muted-dark);

    text-decoration:
        line-through;

    text-decoration-thickness:
        1px;

    text-decoration-color:
        var(--muted-dark);
}

.task-carried {

    margin-top: 3px;

    color: #555d59;

    font-size: 10px;
}


/* =========================================================
   STAR
   ========================================================= */

.task-actions {

    display: flex;
    align-items: center;

    flex-shrink: 0;

    opacity: .7;
}

.icon-btn {

    width: 40px;
    height: 40px;

    display: grid;
    place-items: center;

    border-radius: 11px;

    background: transparent;

    color: #737d78;

    font-size: 25px;

    line-height: 1;

    transition:
        background .15s ease,
        color .15s ease,
        transform .15s ease;
}

.icon-btn:hover {

    background:
        rgba(255,255,255,.05);

    color: #afb7b3;
}

.icon-btn:active {
    transform: scale(.9);
}

.icon-btn.starred {
    color: var(--yellow);
}


/* =========================================================
   EMPTY
   ========================================================= */

.empty {

    padding:
        86px 20px;

    text-align: center;
}

.empty-icon {

    margin-bottom: 14px;

    font-size: 29px;
}

.empty strong {

    display: block;

    color: var(--text-soft);

    font-size: 16px;

    margin-bottom: 5px;
}

.empty span {

    color: var(--muted);

    font-size: 13px;
}


/* =========================================================
   COMPOSER
   ========================================================= */

.composer-wrap {

    position: absolute;

    left: 0;
    right: 0;

    bottom: 8px;

    z-index: 50;

    padding:
        12px
        18px
        calc(12px + env(safe-area-inset-bottom));

    pointer-events: none;

    background:
        linear-gradient(
            to top,
            var(--bg) 35%,
            rgba(13,13,13,.92) 68%,
            transparent 100%
        );
}

.composer-inner {

    width: 100%;

    max-width:
        var(--content-width);

    margin: 0 auto;

    pointer-events: auto;
}

.composer {

    width: 100%;

    min-height: 56px;

    display: flex;
    align-items: flex-end;

    gap: 8px;

    padding:
        7px
        7px
        7px
        15px;

    background:
        #1a1a1a;

    border:
        1px solid
        rgba(255,255,255,.085);

    border-radius:
        28px;

    box-shadow:
        0 9px 32px
        rgba(0,0,0,.30);

    transition:
        border-color .18s ease,
        box-shadow .18s ease;
}

.composer:focus-within {

    border-color:
        rgba(255,255,255,.13);

    box-shadow:
        0 10px 38px
        rgba(0,0,0,.36);
}


/* =========================================================
   INPUT
   ========================================================= */

#taskInput {

    flex: 1;

    min-width: 0;

    width: 100%;

    min-height: 42px;
    max-height: 120px;

    margin: 0;

    padding:
        10px
        0;

    resize: none;

    overflow-y: auto;

    border: 0 !important;
    outline: 0 !important;

    background:
        transparent !important;

    color: var(--text);

    font-size: 16px;

    line-height: 1.45;

    box-shadow:
        none !important;

    scrollbar-width: none;
}

#taskInput::-webkit-scrollbar {
    display: none;
}

#taskInput::placeholder {
    color: #747a77;
}


/* =========================================================
   SEND
   ========================================================= */

.submit {

    width: 42px;
    height: 42px;

    flex: 0 0 42px;

    display: grid;
    place-items: center;

    border-radius: 50%;

    background:
        #2d302f;

    color:
        #737977;

    transition:
        background .18s ease,
        color .18s ease,
        transform .15s ease,
        box-shadow .18s ease;
}

.submit.active {

    background:
        #f2f2f2;

    color:
        #111;

    box-shadow:
        0 4px 15px
        rgba(0,0,0,.2);
}

.submit:active {
    transform: scale(.92);
}

.send-arrow {

    display: block;

    font-size: 22px;

    line-height: 1;

    font-weight: 700;

    transform:
        translateY(-1px);

    pointer-events: none;
}


/* =========================================================
   CONTEXT MENU
   ========================================================= */

.context-menu {

    position: fixed;

    z-index: 900;

    width: 170px;

    padding: 6px;

    background:
        rgba(27,27,27,.97);

    border:
        1px solid
        rgba(255,255,255,.09);

    border-radius: 15px;

    box-shadow:
        0 18px 50px
        rgba(0,0,0,.5);

    backdrop-filter:
        blur(16px);

    opacity: 0;

    visibility: hidden;

    transform:
        scale(.94)
        translateY(4px);

    transform-origin:
        top right;

    transition:
        opacity .14s ease,
        transform .14s ease,
        visibility .14s ease;
}

.context-menu.show {

    opacity: 1;

    visibility: visible;

    transform:
        scale(1)
        translateY(0);
}

.context-option {

    width: 100%;

    min-height: 48px;

    display: flex;

    align-items: center;

    gap: 11px;

    padding:
        0
        13px;

    border-radius: 11px;

    background: transparent;

    color: #eeeeee;

    font-size: 15px;

    font-weight: 700;

    text-align: right;
}

.context-option:hover {

    background:
        rgba(255,255,255,.06);
}

.context-option.delete {

    color: var(--danger);
}


/* =========================================================
   EDIT MODAL
   ========================================================= */

.edit-overlay {

    position: fixed;

    inset: 0;

    z-index: 1000;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 18px;

    background:
        rgba(0,0,0,.5);

    backdrop-filter:
        blur(7px);

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transition:
        opacity .18s ease,
        visibility .18s ease;
}

.edit-overlay.show {

    opacity: 1;

    visibility: visible;

    pointer-events: auto;
}

.edit-box {

    width: 100%;

    max-width: 430px;

    padding: 18px;

    background:
        #181818;

    border:
        1px solid var(--border);

    border-radius: 20px;

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.5);

    transform:
        translateY(8px)
        scale(.98);

    transition:
        transform .18s ease;
}

.edit-overlay.show .edit-box {

    transform:
        translateY(0)
        scale(1);
}

.edit-title {

    margin-bottom: 13px;

    font-size: 17px;

    font-weight: 900;
}

.edit-input {

    width: 100%;

    min-height: 105px;

    padding: 13px;

    resize: vertical;

    border:
        1px solid
        rgba(255,255,255,.09);

    outline: 0;

    border-radius: 13px;

    background:
        #101010;

    color:
        #f2f2f2;

    font-size: 15px;

    line-height: 1.6;
}

.edit-input:focus {

    border-color:
        rgba(25,197,139,.4);
}

.edit-actions {

    display: flex;

    gap: 8px;

    margin-top: 11px;
}

.edit-action {

    flex: 1;

    min-height: 46px;

    border-radius: 12px;

    font-size: 14px;

    font-weight: 800;
}

.edit-save {

    background:
        var(--green);

    color:
        #06130e;
}

.edit-cancel {

    background:
        rgba(255,255,255,.06);

    color:
        #ddd;
}


/* =========================================================
   INSTALL
   ========================================================= */

.install-overlay {

    position: fixed;

    inset: 0;

    z-index: 1100;

    display: flex;

    align-items: flex-end;

    justify-content: center;

    padding: 16px;

    background:
        rgba(0,0,0,.28);

    backdrop-filter:
        blur(4px);

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transition:
        opacity .22s ease,
        visibility .22s ease;
}

.install-overlay.show {

    opacity: 1;

    visibility: visible;

    pointer-events: auto;
}

.install-sheet {

    width: 100%;

    max-width: 620px;

    display: flex;

    align-items: center;

    gap: 11px;

    padding: 13px;

    background:
        #181818;

    border:
        1px solid var(--border);

    border-radius: 19px;

    box-shadow:
        0 22px 60px
        rgba(0,0,0,.42);
}

.install-icon {

    width: 43px;
    height: 43px;

    flex: 0 0 43px;

    display: grid;
    place-items: center;

    border-radius: 13px;

    background:
        rgba(25,197,139,.10);
}

.install-copy {

    min-width: 0;

    flex: 1;
}

.install-title {

    font-size: 14px;

    font-weight: 800;
}

.install-subtitle {

    margin-top: 3px;

    color: var(--muted);

    font-size: 10px;
}

.install-btn {

    flex-shrink: 0;

    padding:
        9px
        13px;

    border-radius: 11px;

    background:
        var(--green);

    color:
        #06130e;

    font-size: 11px;

    font-weight: 900;
}

.install-close {

    width: 30px;
    height: 30px;

    flex: 0 0 30px;

    display: grid;
    place-items: center;

    border-radius: 50%;

    background:
        rgba(255,255,255,.05);

    color: #777;

    font-size: 18px;
}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width: 600px) {

    .header {
        padding-left: 17px;
        padding-right: 17px;
    }

    .tasks {
        padding-left: 17px;
        padding-right: 17px;
        padding-bottom: 145px;
    }

    .greeting h1 {
        font-size: 24px;
    }

    .task-title {
        font-size: 15px;
    }

    .composer-wrap {
        bottom: 10px;
        padding-left: 11px;
        padding-right: 11px;
    }

    .context-menu {
        width: min(190px, calc(100vw - 28px));
    }

    .context-option {
        min-height: 52px;
        font-size: 16px;
    }
}

@media (max-width: 380px) {

    .header {
        padding-left: 14px;
        padding-right: 14px;
    }

    .tasks {
        padding-left: 14px;
        padding-right: 14px;
    }

    .brand-name {
        font-size: 23px;
    }

    .greeting h1 {
        font-size: 22px;
    }

    .task {
        gap: 10px;
    }

    .task-title {
        font-size: 14px;
    }

    .icon-btn {
        width: 38px;
        height: 38px;
        font-size: 23px;
    }

    .composer-wrap {
        left: 0;
        right: 0;
        bottom: 8px;
        padding-left: 8px;
        padding-right: 8px;
    }
}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        animation-duration:
            .01ms !important;

        animation-iteration-count:
            1 !important;

        transition-duration:
            .01ms !important;
    }
}

</style>
</head>


<body>

<div class="app">

    <!-- HEADER -->

    <header class="header">

        <div class="brand">

            <div class="brand-logo" aria-hidden="true">
                ن
            </div>

            <div class="brand-name">
                ناوي
            </div>

        </div>


        <div class="greeting">

            <h1>
                ناوي على إيه النهارده؟
            </h1>

            <p id="currentDate">—</p>

        </div>


        <div
            class="progress"
            aria-label="نسبة إنجاز نوايا اليوم"
        >

            <div
                class="progress-bar"
                role="progressbar"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="0"
                aria-label="نسبة الإنجاز"
            >

                <div
                    class="progress-fill"
                    id="progressFill"
                ></div>

            </div>

            <div
                class="progress-text"
                id="progressText"
            >
                ابدأ أول نية
            </div>

        </div>

    </header>


    <!-- TASKS -->

    <main
        class="tasks"
        id="tasksContainer"
        aria-live="polite"
        aria-label="قائمة النوايا"
    ></main>


    <!-- COMPOSER -->

    <div class="composer-wrap">

        <div class="composer-inner">

            <div class="composer">

                <textarea
                    id="taskInput"
                    rows="1"
                    maxlength="500"
                    placeholder="اكتب اللي ناوي عليه..."
                    enterkeyhint="send"
                    autocomplete="off"
                    aria-label="نية جديدة"
                ></textarea>

                <button
                    type="button"
                    class="submit"
                    id="submitBtn"
                    aria-label="إضافة نية"
                    disabled
                >
                    <span
                        class="send-arrow"
                        aria-hidden="true"
                    >
                        ↑
                    </span>
                </button>

            </div>

        </div>

    </div>

</div>


<!-- CONTEXT MENU -->

<div
    class="context-menu"
    id="contextMenu"
    role="menu"
    aria-hidden="true"
>

    <button
        type="button"
        class="context-option"
        id="editOption"
        role="menuitem"
    >
        تعديل
    </button>

    <button
        type="button"
        class="context-option delete"
        id="deleteOption"
        role="menuitem"
    >
        حذف
    </button>

</div>


<!-- EDIT -->

<div
    class="edit-overlay"
    id="editOverlay"
    aria-hidden="true"
>

    <div class="edit-box">

        <div class="edit-title">
            تعديل النية
        </div>

        <textarea
            class="edit-input"
            id="editInput"
            maxlength="500"
        ></textarea>

        <div class="edit-actions">

            <button
                type="button"
                class="edit-action edit-save"
                id="editSave"
            >
                حفظ
            </button>

            <button
                type="button"
                class="edit-action edit-cancel"
                id="editCancel"
            >
                إلغاء
            </button>

        </div>

    </div>

</div>


<!-- INSTALL -->

<div
    class="install-overlay"
    id="installOverlay"
    aria-hidden="true"
>

    <div class="install-sheet">

        <div class="install-icon">
            📱
        </div>

        <div class="install-copy">

            <div class="install-title">
                خلّي ناوي معاك
            </div>

            <div class="install-subtitle">
                ثبّت ناوي ووصل لنواياك بسرعة.
            </div>

        </div>

        <button
            type="button"
            class="install-btn"
            id="installBtn"
        >
            تثبيت
        </button>

        <button
            type="button"
            class="install-close"
            id="installClose"
            aria-label="إغلاق"
        >
            ×
        </button>

    </div>

</div>


<script>

(() => {

"use strict";


/* =========================================================
   STORAGE
   ========================================================= */

const STORAGE_KEY = "nawy_tasks_v8";

const LEGACY_KEYS = [
    "nawy_tasks_v7",
    "nawy_tasks_v6",
    "nawy_tasks_v5",
    "nawy_tasks_v4",
    "nawy_tasks_v3"
];


/* =========================================================
   DOM
   ========================================================= */

const taskInput =
    document.getElementById("taskInput");

const submitBtn =
    document.getElementById("submitBtn");

const tasksContainer =
    document.getElementById("tasksContainer");

const progressFill =
    document.getElementById("progressFill");

const progressText =
    document.getElementById("progressText");

const progressBar =
    document.querySelector(".progress-bar");

const currentDate =
    document.getElementById("currentDate");

const contextMenu =
    document.getElementById("contextMenu");

const editOption =
    document.getElementById("editOption");

const deleteOption =
    document.getElementById("deleteOption");

const editOverlay =
    document.getElementById("editOverlay");

const editInput =
    document.getElementById("editInput");

const editSave =
    document.getElementById("editSave");

const editCancel =
    document.getElementById("editCancel");

const installOverlay =
    document.getElementById("installOverlay");

const installBtn =
    document.getElementById("installBtn");

const installClose =
    document.getElementById("installClose");


/* =========================================================
   STATE
   ========================================================= */

let tasks = loadTasks();

let contextTaskId = null;

let longPressTimer = null;

let longPressTriggered = false;

let deferredInstallPrompt = null;


/* =========================================================
   DATE
   ========================================================= */

function getDateKey(date = new Date()) {

    const year =
        date.getFullYear();

    const month =
        String(date.getMonth() + 1)
        .padStart(2, "0");

    const day =
        String(date.getDate())
        .padStart(2, "0");

    return `${year}-${month}-${day}`;
}


function formatDate(date = new Date()) {

    return new Intl.DateTimeFormat(
        "ar-EG",
        {
            weekday: "long",
            day: "numeric",
            month: "long"
        }
    ).format(date);
}


function updateDate() {

    currentDate.textContent =
        formatDate();

}


/* =========================================================
   STORAGE
   ========================================================= */

function normalizeTask(raw) {

    if (
        !raw ||
        typeof raw !== "object"
    ) {
        return null;
    }

    const text =
        String(raw.text || "")
        .trim();

    if (!text) {
        return null;
    }

    const createdAt =
        raw.createdAt ||
        new Date().toISOString();

    return {

        id:
            String(
                raw.id ||
                `${Date.now()}-${Math.random()}`
            ),

        text:
            text.slice(0, 500),

        completed:
            Boolean(raw.completed),

        starred:
            Boolean(raw.starred),

        createdAt,

        taskDay:
            raw.taskDay ||
            getDateKey(
                new Date(createdAt)
            ),

        completedAt:
            raw.completedAt || null

    };
}


function normalizeTasks(list) {

    return Array.isArray(list)
        ? list
            .map(normalizeTask)
            .filter(Boolean)
        : [];
}


function readTasks(key) {

    try {

        const value =
            JSON.parse(
                localStorage.getItem(key)
            );

        return Array.isArray(value)
            ? normalizeTasks(value)
            : null;

    } catch {

        return null;

    }
}


function loadTasks() {

    const current =
        readTasks(STORAGE_KEY);

    if (current) {
        return current;
    }

    for (
        const key of LEGACY_KEYS
    ) {

        const old =
            readTasks(key);

        if (old) {

            try {

                localStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify(old)
                );

            } catch {}

            return old;
        }
    }

    return [];
}


function saveTasks() {

    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(tasks)
        );

    } catch (error) {

        console.warn(
            "NAWY storage error:",
            error
        );

    }
}


/* =========================================================
   ANALYTICS
   ========================================================= */

function trackEvent(name, params = {}) {

    if (
        typeof window.gtag ===
        "function"
    ) {

        window.gtag(
            "event",
            name,
            params
        );

    }

}


/* =========================================================
   ADD TASK
   ========================================================= */

function addTask(text) {

    const clean =
        String(text || "")
        .trim();

    if (!clean) {
        return false;
    }

    const task = {

        id:
            `${Date.now()}-${Math.random()
                .toString(36)
                .slice(2, 8)}`,

        text:
            clean.slice(0, 500),

        completed: false,

        starred: false,

        createdAt:
            new Date().toISOString(),

        taskDay:
            getDateKey(),

        completedAt:
            null
    };

    tasks.unshift(task);

    saveTasks();

    render();

    trackEvent(
        "add_task",
        {
            task_length:
                clean.length
        }
    );

    return true;
}


/* =========================================================
   TOGGLE
   ========================================================= */

function toggleTask(id) {

    const task =
        tasks.find(
            item =>
                String(item.id) ===
                String(id)
        );

    if (!task) {
        return;
    }

    task.completed =
        !task.completed;

    if (task.completed) {

        task.completedAt =
            new Date().toISOString();

        saveTasks();

        render();

        const element =
            document.querySelector(
                `.task[data-task-id="${CSS.escape(String(id))}"]`
            );

        if (element) {

            element.classList.add(
                "just-completed"
            );

            setTimeout(
                () => {
                    element.classList.remove(
                        "just-completed"
                    );
                },
                650
            );

        }

        trackEvent(
            "complete_task"
        );

        return;
    }

    task.completedAt =
        null;

    saveTasks();

    render();

    trackEvent(
        "uncomplete_task"
    );
}


/* =========================================================
   STAR
   ========================================================= */

function toggleStar(id) {

    const task =
        tasks.find(
            item =>
                String(item.id) ===
                String(id)
        );

    if (!task) {
        return;
    }

    task.starred =
        !task.starred;

    saveTasks();

    render();

    trackEvent(
        task.starred
            ? "star_task"
            : "unstar_task"
    );
}


/* =========================================================
   DELETE
   ========================================================= */

function deleteTask(id) {

    const index =
        tasks.findIndex(
            item =>
                String(item.id) ===
                String(id)
        );

    if (index === -1) {
        return;
    }

    tasks.splice(
        index,
        1
    );

    saveTasks();

    render();

    closeContextMenu();

    trackEvent(
        "delete_task"
    );
}


/* =========================================================
   EDIT
   ========================================================= */

function openEdit(id) {

    const task =
        tasks.find(
            item =>
                String(item.id) ===
                String(id)
        );

    if (!task) {
        return;
    }

    contextTaskId =
        String(id);

    editInput.value =
        task.text;

    closeContextMenu();

    editOverlay.classList.add(
        "show"
    );

    editOverlay.setAttribute(
        "aria-hidden",
        "false"
    );

    requestAnimationFrame(
        () => {

            editInput.focus();

            editInput.setSelectionRange(
                editInput.value.length,
                editInput.value.length
            );

        }
    );
}


function saveEdit() {

    if (!contextTaskId) {
        return;
    }

    const task =
        tasks.find(
            item =>
                String(item.id) ===
                String(contextTaskId)
        );

    if (!task) {
        closeEdit();
        return;
    }

    const text =
        editInput.value.trim();

    if (!text) {
        editInput.focus();
        return;
    }

    task.text =
        text.slice(0, 500);

    saveTasks();

    render();

    closeEdit();

    trackEvent(
        "edit_task"
    );
}


function closeEdit() {

    editOverlay.classList.remove(
        "show"
    );

    editOverlay.setAttribute(
        "aria-hidden",
        "true"
    );

    contextTaskId = null;
}


/* =========================================================
   PROGRESS
   ========================================================= */

function updateProgress() {

    const today =
        getDateKey();

    const todayTasks =
        tasks.filter(
            task =>
                task.taskDay ===
                today
        );

    const total =
        todayTasks.length;

    const done =
        todayTasks.filter(
            task =>
                task.completed
        ).length;

    if (!total) {

        progressFill.style.width =
            "0%";

        progressText.textContent =
            "ابدأ أول نية";

        progressBar.setAttribute(
            "aria-valuenow",
            "0"
        );

        return;
    }

    const percentage =
        Math.round(
            (done / total) * 100
        );

    progressFill.style.width =
        `${percentage}%`;

    progressBar.setAttribute(
        "aria-valuenow",
        String(percentage)
    );

    progressText.textContent =
        `${done} من ${total} · ${percentage}%`;
}


/* =========================================================
   SORT
   ========================================================= */

function sortActive(a, b) {

    if (
        a.starred !==
        b.starred
    ) {

        return (
            Number(b.starred) -
            Number(a.starred)
        );
    }

    return (
        new Date(b.createdAt) -
        new Date(a.createdAt)
    );
}


function sortCompleted(a, b) {

    return (
        new Date(
            b.completedAt ||
            b.createdAt
        ) -
        new Date(
            a.completedAt ||
            a.createdAt
        )
    );
}


/* =========================================================
   RENDER
   ========================================================= */

function render() {

    updateProgress();

    tasksContainer.innerHTML =
        "";

    const today =
        getDateKey();

    const todayTasks =
        tasks
            .filter(
                task =>
                    !task.completed &&
                    task.taskDay === today
            )
            .sort(sortActive);

    const carriedTasks =
        tasks
            .filter(
                task =>
                    !task.completed &&
                    task.taskDay !== today
            )
            .sort(sortActive);

    const completedTasks =
        tasks
            .filter(
                task =>
                    task.completed
            )
            .sort(sortCompleted);

    let hasContent =
        false;


    if (todayTasks.length) {

        appendSection(
            "نوايا اليوم"
        );

        todayTasks.forEach(
            task => {

                tasksContainer.appendChild(
                    createTaskElement(
                        task
                    )
                );

            }
        );

        hasContent = true;
    }


    if (carriedTasks.length) {

        appendSection(
            "مستمرة من قبل"
        );

        carriedTasks.forEach(
            task => {

                tasksContainer.appendChild(
                    createTaskElement(
                        task,
                        true
                    )
                );

            }
        );

        hasContent = true;
    }


    if (completedTasks.length) {

        appendSection(
            "النوايا المحققة"
        );

        completedTasks.forEach(
            task => {

                tasksContainer.appendChild(
                    createTaskElement(
                        task
                    )
                );

            }
        );

        hasContent = true;
    }


    if (!hasContent) {

        tasksContainer.innerHTML = `

            <div class="empty">

                <div
                    class="empty-icon"
                    aria-hidden="true"
                >
                    🌱
                </div>

                <strong>
                    مفيش نوايا هنا
                </strong>

                <span>
                    اكتب أول حاجة ناوي تعملها النهارده.
                </span>

            </div>

        `;
    }
}


/* =========================================================
   SECTION
   ========================================================= */

function appendSection(label) {

    const section =
        document.createElement(
            "div"
        );

    section.className =
        "section-label";

    const span =
        document.createElement(
            "span"
        );

    span.textContent =
        label;

    section.appendChild(
        span
    );

    tasksContainer.appendChild(
        section
    );
}


/* =========================================================
   TASK ELEMENT
   ========================================================= */

function createTaskElement(
    task,
    carried = false
) {

    const article =
        document.createElement(
            "article"
        );

    article.className =
        `task ${
            task.completed
                ? "completed"
                : ""
        }`;

    article.dataset.taskId =
        task.id;


    const check =
        document.createElement(
            "button"
        );

    check.type =
        "button";

    check.className =
        "check";

    check.dataset.action =
        "toggle";

    check.setAttribute(
        "aria-label",
        task.completed
            ? "إلغاء إنجاز النية"
            : "إنجاز النية"
    );

    check.innerHTML = `
        <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
        >
            <path d="M5 12.5l4.2 4.2L19 7"></path>
        </svg>
    `;


    const main =
        document.createElement(
            "div"
        );

    main.className =
        "task-main";


    const title =
        document.createElement(
            "div"
        );

    title.className =
        "task-title";

    title.textContent =
        task.text;

    main.appendChild(
        title
    );


    if (
        carried &&
        !task.completed
    ) {

        const label =
            document.createElement(
                "div"
            );

        label.className =
            "task-carried";

        label.textContent =
            "من يوم سابق";

        main.appendChild(
            label
        );
    }


    const actions =
        document.createElement(
            "div"
        );

    actions.className =
        "task-actions";


    const star =
        document.createElement(
            "button"
        );

    star.type =
        "button";

    star.className =
        `icon-btn ${
            task.starred
                ? "starred"
                : ""
        }`;

    star.dataset.action =
        "star";

    star.setAttribute(
        "aria-label",
        task.starred
            ? "إلغاء تمييز النية"
            : "تمييز النية"
    );

    star.setAttribute(
        "aria-pressed",
        String(task.starred)
    );

    star.textContent =
        task.starred
            ? "★"
            : "☆";

    actions.appendChild(
        star
    );


    article.append(
        check,
        main,
        actions
    );


    return article;
}


/* =========================================================
   CONTEXT MENU
   ========================================================= */

function openContextMenu(
    taskId,
    x,
    y
) {

    contextTaskId =
        String(taskId);

    contextMenu.classList.add(
        "show"
    );

    contextMenu.setAttribute(
        "aria-hidden",
        "false"
    );


    const width =
        170;

    const height =
        112;

    const padding =
        10;

    let left =
        x;

    let top =
        y;


    if (
        left + width >
        window.innerWidth - padding
    ) {

        left =
            window.innerWidth -
            width -
            padding;
    }

    if (
        top + height >
        window.innerHeight - padding
    ) {

        top =
            window.innerHeight -
            height -
            padding;
    }

    contextMenu.style.left =
        `${Math.max(
            padding,
            left
        )}px`;

    contextMenu.style.top =
        `${Math.max(
            padding,
            top
        )}px`;
}


function closeContextMenu() {

    contextMenu.classList.remove(
        "show"
    );

    contextMenu.setAttribute(
        "aria-hidden",
        "true"
    );
}


/* =========================================================
   TASK CLICK
   ========================================================= */

tasksContainer.addEventListener(
    "click",
    event => {

        if (longPressTriggered) {

            longPressTriggered =
                false;

            return;
        }


        const actionButton =
            event.target.closest(
                "[data-action]"
            );

        const taskElement =
            event.target.closest(
                ".task"
            );

        if (!taskElement) {
            return;
        }

        const id =
            taskElement.dataset.taskId;

        if (!id) {
            return;
        }


        if (actionButton) {

            const action =
                actionButton.dataset.action;

            if (
                action ===
                "toggle"
            ) {

                toggleTask(id);

                return;
            }

            if (
                action ===
                "star"
            ) {

                toggleStar(id);

                return;
            }
        }


        toggleTask(id);
    }
);


/* =========================================================
   LONG PRESS
   ========================================================= */

tasksContainer.addEventListener(
    "pointerdown",
    event => {

        const taskElement =
            event.target.closest(
                ".task"
            );

        if (!taskElement) {
            return;
        }

        if (
            event.target.closest(
                "button"
            )
        ) {
            return;
        }

        if (
            event.pointerType ===
            "mouse"
        ) {
            return;
        }

        const id =
            taskElement.dataset.taskId;

        longPressTriggered =
            false;

        clearTimeout(
            longPressTimer
        );

        longPressTimer =
            setTimeout(
                () => {

                    longPressTriggered =
                        true;

                    openContextMenu(
                        id,
                        event.clientX,
                        event.clientY
                    );

                },
                520
            );

    },
    {
        passive: true
    }
);


tasksContainer.addEventListener(
    "pointerup",
    () => {

        clearTimeout(
            longPressTimer
        );

    }
);


tasksContainer.addEventListener(
    "pointercancel",
    () => {

        clearTimeout(
            longPressTimer
        );

    }
);


/* =========================================================
   RIGHT CLICK
   ========================================================= */

tasksContainer.addEventListener(
    "contextmenu",
    event => {

        const taskElement =
            event.target.closest(
                ".task"
            );

        if (!taskElement) {
            return;
        }

        event.preventDefault();

        openContextMenu(
            taskElement.dataset.taskId,
            event.clientX,
            event.clientY
        );
    }
);


/* =========================================================
   CONTEXT ACTIONS
   ========================================================= */

editOption.addEventListener(
    "click",
    () => {

        if (contextTaskId) {
            openEdit(
                contextTaskId
            );
        }
    }
);


deleteOption.addEventListener(
    "click",
    () => {

        if (contextTaskId) {

            const id =
                contextTaskId;

            contextTaskId =
                null;

            deleteTask(id);
        }
    }
);


document.addEventListener(
    "pointerdown",
    event => {

        if (
            !contextMenu.contains(
                event.target
            )
        ) {

            closeContextMenu();
        }
    }
);


/* =========================================================
   EDIT EVENTS
   ========================================================= */

editSave.addEventListener(
    "click",
    saveEdit
);

editCancel.addEventListener(
    "click",
    closeEdit
);


editOverlay.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            editOverlay
        ) {

            closeEdit();
        }
    }
);


document.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Escape"
        ) {

            closeContextMenu();

            if (
                editOverlay.classList.contains(
                    "show"
                )
            ) {

                closeEdit();
            }
        }

    }
);


/* =========================================================
   INPUT
   ========================================================= */

function resizeInput() {

    taskInput.style.height =
        "auto";

    taskInput.style.height =
        `${Math.min(
            taskInput.scrollHeight,
            120
        )}px`;
}


function updateSubmitButton() {

    const hasText =
        taskInput.value
        .trim()
        .length > 0;

    submitBtn.disabled =
        !hasText;

    submitBtn.classList.toggle(
        "active",
        hasText
    );
}


taskInput.addEventListener(
    "input",
    () => {

        resizeInput();

        updateSubmitButton();

    }
);


/* =========================================================
   SEND
   ========================================================= */

function handleSend() {

    const text =
        taskInput.value.trim();

    if (!text) {
        return;
    }

    if (
        addTask(text)
    ) {

        taskInput.value =
            "";

        taskInput.style.height =
            "42px";

        updateSubmitButton();

        taskInput.focus();

        tasksContainer.scrollTop =
            0;
    }
}


submitBtn.addEventListener(
    "click",
    handleSend
);


taskInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            handleSend();
        }

    }
);


/* =========================================================
   INSTALL
   ========================================================= */

window.addEventListener(
    "beforeinstallprompt",
    event => {

        event.preventDefault();

        deferredInstallPrompt =
            event;

        setTimeout(
            () => {

                if (
                    deferredInstallPrompt &&
                    !isStandalone()
                ) {

                    installOverlay.classList.add(
                        "show"
                    );

                    installOverlay.setAttribute(
                        "aria-hidden",
                        "false"
                    );
                }

            },
            8000
        );
    }
);


installBtn.addEventListener(
    "click",
    async () => {

        if (
            deferredInstallPrompt
        ) {

            try {

                deferredInstallPrompt.prompt();

                await deferredInstallPrompt.userChoice;

            } catch {}

            deferredInstallPrompt =
                null;

            closeInstall();

            trackEvent(
                "install_prompt"
            );

            return;
        }

        closeInstall();
    }
);


function closeInstall() {

    installOverlay.classList.remove(
        "show"
    );

    installOverlay.setAttribute(
        "aria-hidden",
        "true"
    );
}


installClose.addEventListener(
    "click",
    closeInstall
);


/* =========================================================
   STANDALONE
   ========================================================= */

function isStandalone() {

    return (
        window.matchMedia(
            "(display-mode: standalone)"
        ).matches ||

        window.navigator.standalone === true
    );
}


/* =========================================================
   DAY CHANGE
   ========================================================= */

document.addEventListener(
    "visibilitychange",
    () => {

        if (
            !document.hidden
        ) {

            updateDate();

            render();
        }
    }
);


/* =========================================================
   SERVICE WORKER
   ========================================================= */

if (
