/* =========================================================

const completeSound =

function playCompleteSound() {

        const playPromise =

            playPromise &&
            typeof playPromise.catch === "function"
        ) {

/* =========================================================
   SAFE JSON STORAGE
========================================================= */

function loadJSON(key, fallback) {

    try {

        const raw =
            localStorage.getItem(key);

        if (!raw) {
            return fallback;
        }

        const parsed =
            JSON.parse(raw);

        return parsed ?? fallback;

    } catch {

        return fallback;

    }

}


function saveJSON(key, value) {

    try {

        localStorage.setItem(
            key,
            JSON.stringify(value)
        );

        return true;

    } catch (error) {

        console.warn(
            "NAWY storage error:",
            error
        );

        return false;

    }

}


/* =========================================================
   LOAD TASKS
========================================================= */

/*
   الأولوية:

   1. التخزين الأساسي
   2. النسخة الاحتياطية

   لا يوجد أي حذف تلقائي هنا.
*/

function loadTasks() {

    const primary =
        loadJSON(
            STORAGE_KEY,
            null
        );

    if (
        Array.isArray(primary)
    ) {

        return primary;

    }

    const backup =
        loadJSON(
            BACKUP_STORAGE_KEY,
            []
        );

    if (
        Array.isArray(backup)
    ) {

        /*
         * لو اضطرينا للـ backup،
         * نرجعه فورًا للتخزين الأساسي.
         */

        saveJSON(
            STORAGE_KEY,
            backup
        );

        return backup;

    }

    return [];

}


let tasks =
    loadTasks();


let trash =
    loadJSON(
        TRASH_KEY,
        []
    );

if (!Array.isArray(trash)) {
    trash = [];
}

    loadJSON(
        SETTINGS_KEY,
        {
            language: "ar",
            theme: "dark",
            accent: "green"

/* =========================================================

let currentView =

/*
   هذا المتغير مهم جدًا.

   نخزن اليوم الذي تم عرضه آخر مرة.
   لو اليوم تغير، نعيد render فقط.

   لا نحذف أي task.
*/

let lastKnownDay =
    getDateKey();


/* =========================================================
   DATE
========================================================= */

function getDateKey(
    date = new Date()
) {

    const y =
        date.getFullYear();

    const m =
        String(
            date.getMonth() + 1
        ).padStart(
            2,
            "0"
        );

    const d =
        String(
            date.getDate()
        ).padStart(
            2,
            "0"
        );

    return `${y}-${m}-${d}`;

}


function formatDate(
    date = new Date()
) {

    const locale =
        settings.language === "en"
            ? "en-US"
            : "ar-EG";

    return new Intl.DateTimeFormat(
        locale,
        {
            weekday: "long",
            day: "numeric",
            month: "long"
        }
    ).format(date);

}


function updateDate() {

    currentDate.textContent =
        formatDate();

}


/* =========================================================
   NORMALIZE TASKS
========================================================= */

function normalizeTask(task) {

    if (
        !task ||
        typeof task !== "object"
    ) {

        return null;

    }

    const text =
        String(
            task.text || ""
        )
        .trim()
        .slice(
            0,
            500
        );

    if (!text) {
        return null;
    }

    const createdAt =
        task.createdAt ||
        new Date().toISOString();

    let taskDay =
        task.taskDay;

    /*
       لو عندنا بيانات قديمة بدون taskDay،
       نستخرج التاريخ من createdAt.
    */

    if (!taskDay) {

        taskDay =
            getDateKey(
                new Date(createdAt)
            );

    }

    return {

        id:
            String(
                task.id ||
                `${Date.now()}-${Math.random()}`
            ),

        text,

        completed:
            Boolean(
                task.completed
            ),

        starred:
            Boolean(
                task.starred
            ),

        createdAt,

        taskDay,

        completedAt:
            task.completedAt ||
            null

    };

}


/* =========================================================
   NORMALIZE + SAVE
========================================================= */

function normalizeAllTasks() {

    const originalLength =
        Array.isArray(tasks)
            ? tasks.length
            : 0;

    tasks =
        (Array.isArray(tasks)
            ? tasks
            : []
        )
        .map(
            normalizeTask
        )
        .filter(Boolean);

    /*
       نحفظ النسخة النظيفة فقط.
       لا نقوم بحذف المهام الصحيحة.
    */

    persistTasks();

}


function persistTasks() {

    /*
       نكتب الأساسي والـ backup.

       مهم:
       الـ backup ليس يوميًا.
       هو نسخة كاملة من كل النوايا.
    */

    saveJSON(
        STORAGE_KEY,
        tasks
    );

    saveJSON(
        BACKUP_STORAGE_KEY,
        tasks
    );

}


/* =========================================================
   ANALYTICS
========================================================= */

function analytics(
    event,
    params = {}
) {

    try {

        if (
            typeof gtag === "function"
        ) {

            gtag(
                "event",
                event,
                params
            );

        }

    } catch {}

}


/* =========================================================
   ADD TASK
========================================================= */

function addTask(text) {

    const clean =
        String(text || "")
        .trim()
        .slice(
            0,
            500
        );

    if (!clean) {
        return false;
    }

    const now =
        new Date();

    const task = {

        id:
            `${Date.now()}-${Math.random()
                .toString(36)
                .slice(2, 9)}`,

        text:
            clean,

        completed:
            false,

        starred:
            false,

        createdAt:
            now.toISOString(),

        /*
           تاريخ الإنشاء فقط.
           لا يتم تغييره بعد ذلك.
        */

        taskDay:
            getDateKey(now),

        completedAt:
            null

    };

    tasks.unshift(
        task
    );

    /*
       حفظ فوري في مكانين.
    */

    persistTasks();

    analytics(
        "add_task"
    );

    currentView =
        "today";

    render();

    return true;

}


/* =========================================================
   FIND TASK
========================================================= */

function findTask(id) {

    return tasks.find(
        task =>
            String(task.id) ===
            String(id)
    );

}


/* =========================================================
   COMPLETE
========================================================= */

function completeTask(id) {

    const task =
        findTask(id);

    if (!task) {
        return;
    }

    if (task.completed) {

        task.completed =
            false;

        task.completedAt =
            null;

    } else {

        task.completed =
            true;

        task.completedAt =
            new Date().toISOString();

        analytics(
            "complete_task"
        );

        playCompleteSound();

    }

    /*
       لا نغير taskDay عند الإنجاز.
    */

    persistTasks();

    render();

    if (task.completed) {

        requestAnimationFrame(() => {

            const element =
                document.querySelector(
                    `[data-task-id="${CSS.escape(
                        String(id)
                    )}"]`
                );

            if (element) {

                element.classList.add(
                    "just-completed"
                );

                setTimeout(() => {

                    element.classList.remove(
                        "just-completed"
                    );

                }, 650);

            }

        });

    }

}


/* =========================================================
   STAR
========================================================= */

function toggleStar(id) {

    const task =
        findTask(id);

    if (!task) {
        return;
    }

    task.starred =
        !task.starred;

    persistTasks();

    analytics(
        "star_task",
        {
            starred:
                task.starred
        }
    );

    render();

}


/* =========================================================
   DELETE
========================================================= */

function deleteTask(id) {

    const index =
        tasks.findIndex(
            task =>
                String(task.id) ===
                String(id)
        );

    if (index === -1) {
        return;
    }

    const task =
        tasks[index];

    /*
       الحذف هنا فقط عندما المستخدم
       يضغط "حذف" صراحة.
    */

    tasks.splice(
        index,
        1
    );

    trash.unshift({
        ...task,
        deletedAt:
            new Date().toISOString()
    });

    deletedTask = {
        task,
        index
    };

    persistTasks();

    saveJSON(
        TRASH_KEY,
        trash
    );

    analytics(
        "delete_task"
    );

    render();

    showToast(
        settings.language === "en"
            ? "Task deleted"
            : "تم حذف النية"
    );

    clearTimeout(
        deleteTimer
    );

    deleteTimer =
        setTimeout(
            () => {

                deletedTask =
                    null;

                hideToast();

            },
            5000
        );

}


/* =========================================================
   UNDO DELETE
========================================================= */

function undoDelete() {

    if (!deletedTask) {
        return;
    }

    const {
        task,
        index
    } = deletedTask;

    const trashIndex =
        trash.findIndex(
            item =>
                String(item.id) ===
                String(task.id)
        );

    if (trashIndex !== -1) {

        trash.splice(
            trashIndex,
            1
        );

    }

    tasks.splice(
        Math.min(
            index,
            tasks.length
        ),
        0,
        task
    );

    deletedTask =
        null;

    clearTimeout(
        deleteTimer
    );

    persistTasks();

    saveJSON(
        TRASH_KEY,
        trash
    );

    hideToast();

    render();

}

/* =========================================================
   SORT
========================================================= */

function sortActive(a, b) {

    if (
        a.starred !==
        b.starred
    ) {

        return (
            Number(b.starred) -
            Number(a.starred)
        );

    }

    return (
        new Date(b.createdAt) -
        new Date(a.createdAt)
    );

}


function sortCompleted(a, b) {

    return (
        new Date(
            b.completedAt ||
            b.createdAt
        ) -
        new Date(
            a.completedAt ||
            a.createdAt
        )
    );

}

        "aria-label",

    const check =
        document.createElement(
            "span"
        );

    check.className =

    check.innerHTML = `
        <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
        >
            <path d="M5 12.5l4.2 4.2L19 7"></path>
        </svg>
    `;

    checkHit.appendChild(
        check
    );


    /* MAIN */

    const main =
        document.createElement(

        );

    main.className =
        "task-main";

    main.dataset.action =
        "menu";


    const title =
        document.createElement(
            "div"
        );

    title.className =
        "task-title";

    title.textContent =
        task.text;

    main.appendChild(
        title
    );


    /*
       لو النية غير مكتملة ومن يوم سابق،
       تظهر في "اليوم" مع هذا التوضيح.
    */

    if (
        carried &&
        !task.completed
    ) {

        const carriedLabel =
            document.createElement(
                "div"
            );

        carriedLabel.className =
            "task-carried";

        carriedLabel.textContent =
            settings.language === "en"
                ? "From an earlier day"
                : "من يوم سابق";

        main.appendChild(
            carriedLabel
        );

    }


    /* STAR */

    const star =
        document.createElement(
            "button"
        );

    star.type =
        "button";

    star.className =
        "star-btn";

    if (task.starred) {

        star.classList.add(
            "starred"
        );

    }

    star.dataset.action =
        "star";

    star.setAttribute(
        "aria-label",
        task.starred
            ? (
                settings.language === "en"
                    ? "Remove star"
                    : "إلغاء التمييز"
            )
            : (
                settings.language === "en"
                    ? "Star task"
                    : "تمييز النية"
            )
    );

    star.setAttribute(
        "aria-pressed",
        String(
            task.starred
        )
    );

    star.textContent =
        task.starred
            ? "★"
            : "☆";


    article.append(
        checkHit,
        main,
        star
    );

    return article;

}


/* =========================================================
   TODAY TASKS
========================================================= */

/*
   هذه هي أهم نقطة في الإصلاح.

   "اليوم" لا يعني:
   taskDay === today

   بل يعني:

   - كل نوايا اليوم
   +
   - كل النوايا القديمة غير المكتملة

   أما المكتملة القديمة فتظل محفوظة
   وتظهر في "المكتملة" و"كل النوايا".
*/

function getTodayTasks() {

    const today =
        getDateKey();

    return tasks
        .filter(
            task => {

                if (
                    task.taskDay === today
                ) {

                    return true;

                }

                /*
                   النية القديمة تظهر في اليوم
                   طالما لم يتم إنجازها.
                */

                if (
                    !task.completed
                ) {

                    return true;

                }

                return false;

            }
        )
        .sort(
            (a, b) => {

                if (
                    a.completed !==
                    b.completed
                ) {

                    return (
                        Number(a.completed) -
                        Number(b.completed)
                    );

                }

                if (
                    a.starred !==
                    b.starred
                ) {

                    return (
                        Number(b.starred) -
                        Number(a.starred)
                    );

                }

                return (
                    new Date(b.createdAt) -
                    new Date(a.createdAt)
                );

            }
        );

}

    tasksContainer.innerHTML =
        "";

    const today =
        getDateKey();

    let visibleTasks = [];


    /* =====================================================
       TODAY
    ===================================================== */

    if (
        currentView === "today"
    ) {

        visibleTasks =
            getTodayTasks();


    /* =====================================================
       COMPLETED
    ===================================================== */

    } else if (
        currentView === "completed"
    ) {

        visibleTasks =
            tasks
                .filter(
                    task =>
                        task.completed
                )
                .sort(
                    sortCompleted
                );


    /* =====================================================
       ALL
    ===================================================== */

    } else {

        visibleTasks =
            tasks
                .slice()
                .sort(
                    (a, b) => {

                        if (
                            a.completed !==
                            b.completed
                        ) {

                            return (
                                Number(a.completed) -
                                Number(b.completed)
                            );

                        }

                        return sortActive(
                            a,
                            b
                        );

                    }
                );

    }


    /* =====================================================
       EMPTY
    ===================================================== */

    if (
        !visibleTasks.length
    ) {

        const emptyText =
            getEmptyText();

        tasksContainer.innerHTML = `

            <div class="empty">

                <div
                    class="empty-icon"
                    aria-hidden="true"
                >
                    🌱
                </div>

                <strong>
                    ${emptyText[0]}
                </strong>

                <span>
                    ${emptyText[1]}
                </span>

            </div>

        `;

        updateMenuState();

        return;

    }


    /* =====================================================
       TODAY VIEW
    ===================================================== */

    if (
        currentView === "today"
    ) {

        const active =
            visibleTasks.filter(
                task =>
                    !task.completed
            );

        const completed =
            visibleTasks.filter(
                task =>
                    task.completed
            );


        if (active.length) {

            appendSection(
                settings.language === "en"
                    ? "Today"
                    : "نوايا اليوم"
            );

            active.forEach(
                task => {

                    const carried =
                        task.taskDay !== today;

                    tasksContainer.appendChild(
                        createTaskElement(
                            task,
                            carried
                        )
                    );

                }
            );

        }


        /*
           المكتملة من اليوم فقط تظهر أسفل اليوم.
           القديمة لا تختفي من الذاكرة،
           وإنما تظهر في "المكتملة".
        */

        const completedToday =
            completed.filter(
                task =>
                    task.taskDay === today
            );

        if (
            completedToday.length
        ) {

            appendSection(
                settings.language === "en"
                    ? "Completed today"
                    : "النوايا المحققة اليوم"
            );

            completedToday.forEach(
                task => {

                    tasksContainer.appendChild(
                        createTaskElement(
                            task
                        )
                    );

                }
            );

        }


    /* =====================================================
       ALL VIEW
    ===================================================== */

    } else if (
        currentView === "all"
    ) {

        const active =
            visibleTasks.filter(
                task =>
                    !task.completed
            );

        const completed =
            visibleTasks.filter(
                task =>
                    task.completed
            );


        if (active.length) {

            appendSection(
                settings.language === "en"
                    ? "All intentions"
                    : "كل النوايا"
            );

            active.forEach(
                task => {

                    const carried =
                        task.taskDay !== today;

                    tasksContainer.appendChild(
                        createTaskElement(
                            task,
                            carried
                        )
                    );

                }
            );

        }


        if (completed.length) {

            appendSection(
                settings.language === "en"
                    ? "Completed"
                    : "النوايا المحققة"
            );

            completed.forEach(
                task => {

                    tasksContainer.appendChild(
                        createTaskElement(
                            task
                        )
                    );

                }
            );

        }


    /* =====================================================
       COMPLETED VIEW
    ===================================================== */

    } else {

        appendSection(
            settings.language === "en"
                ? "Completed"
                : "النوايا المحققة"
        );

        visibleTasks.forEach(
            task => {

                tasksContainer.appendChild(
                    createTaskElement(
                        task
                    )
                );

            }
        );

    }


    updateMenuState();

}

/* =========================================================
   TASK EVENTS
========================================================= */

tasksContainer.addEventListener(
    "click",
    event => {

        if (
            longPressTriggered
        ) {

            longPressTriggered =
                false;

            return;

        }

        const target =
            event.target;

        const taskElement =
            target.closest(
                ".task"
            );

        if (!taskElement) {
            return;
        }

        const id =
            taskElement.dataset.taskId;

        const actionElement =
            target.closest(
                "[data-action]"
            );

        if (!actionElement) {
            return;
        }

        const action =
            actionElement.dataset.action;


        if (
            action === "complete"
        ) {

            completeTask(id);

            return;

        }


        if (
            action === "star"
        ) {

            toggleStar(id);

            return;

        }


        if (
            action === "menu"
        ) {

            openAction(id);

        }

    }
);


/* =========================================================
   LONG PRESS
========================================================= */

tasksContainer.addEventListener(
    "pointerdown",
    event => {

        const main =
            event.target.closest(
                ".task-main"
            );

        if (!main) {
            return;
        }

        if (
            event.pointerType ===
            "mouse"
        ) {

            return;

        }

        const task =
            main.closest(
                ".task"
            );

        if (!task) {
            return;
        }

        const id =
            task.dataset.taskId;

        longPressTriggered =
            false;

        clearTimeout(
            longPressTimer
        );

        longPressTimer =
            setTimeout(
                () => {

                    longPressTriggered =
                        true;

                    openAction(id);

                },
                550
            );

    }
);


[
    "pointerup",
    "pointercancel",
    "pointerleave"
].forEach(
    type => {

        tasksContainer.addEventListener(
            type,
            () => {

                clearTimeout(
                    longPressTimer
                );

            }
        );

    }
);

        taskInput.style.height =

        updateSubmitButton();

        taskInput.focus();

        tasksContainer.scrollTop =

);


/* =========================================================
   PROGRESS
========================================================= */

function updateProgress() {

    const today =
        getDateKey();

    /*
       نسبة الإنجاز تخص ما يظهر في "اليوم":

       اليوم +
       النوايا القديمة غير المكتملة.

       لكن لا نحسب النوايا القديمة المكتملة.
    */

    const todayTasks =
        tasks.filter(
            task =>
                task.taskDay === today ||
                !task.completed
        );

    const total =
        todayTasks.length;

    const done =
        todayTasks.filter(
            task =>
                task.completed &&
                task.taskDay === today
        ).length;


    if (!total) {

        progressFill.style.width =
            "0%";

        progressText.textContent =
            settings.language === "en"
                ? "Start your first task"
                : "ابدأ أول نية";

        progressBar.setAttribute(
            "aria-valuenow",
            "0"
        );

        return;

    }


    const percentage =
        Math.round(
            done /
            total *
            100
        );


    progressFill.style.width =
        `${percentage}%`;

    progressBar.setAttribute(
        "aria-valuenow",
        String(percentage)
    );


    progressText.textContent =
        settings.language === "en"
            ? `${done} of ${total} · ${percentage}%`
            : `${done} من ${total} · ${percentage}%`;

}

/* =========================================================
   RENDER TRASH
========================================================= */

function renderTrash() {

    trashContainer.innerHTML =
        "";


    if (!trash.length) {

        trashContainer.innerHTML = `

            <div class="trash-empty">
                ${
                    settings.language === "en"
                        ? "Trash is empty."
                        : "سلة المحذوفات فارغة."
                }
            </div>

        `;

        return;

    }


    trash.forEach(
        item => {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "trash-item";


            const text =
                document.createElement(
                    "div"
                );

            text.className =
                "trash-text";

            text.textContent =
                item.text;


            const actions =
                document.createElement(
                    "div"
                );

            actions.className =
                "trash-actions";


            const restore =
                document.createElement(
                    "button"
                );

            restore.type =
                "button";

            restore.textContent =
                settings.language === "en"
                    ? "Restore"
                    : "استعادة";


            restore.addEventListener(
                "click",
                () => {

                    restoreTrashItem(
                        item.id
                    );

                }
            );


            const permanent =
                document.createElement(
                    "button"
                );

            permanent.type =
                "button";

            permanent.className =
                "permanent";

            permanent.textContent =
                settings.language === "en"
                    ? "Delete forever"
                    : "حذف نهائي";


            permanent.addEventListener(
                "click",
                () => {

                    permanentlyDelete(
                        item.id
                    );

                }
            );


            actions.append(
                restore,
                permanent
            );


            row.append(
                text,
                actions
            );


            trashContainer.appendChild(
                row
            );

        }
    );

}


/* =========================================================
   RESTORE
========================================================= */

function restoreTrashItem(id) {

    const index =
        trash.findIndex(
            item =>
                String(item.id) ===
                String(id)
        );

    if (index === -1) {
        return;
    }


    const task =
        {
            ...trash[index]
        };


    delete task.deletedAt;


    /*
       استرجاع النية لا يغير
       تاريخها الأصلي.
    */

    tasks.unshift(
        task
    );


    trash.splice(
        index,
        1
    );


    persistTasks();

    saveJSON(
        TRASH_KEY,
        trash
    );


    analytics(
        "restore_task"
    );


    renderTrash();

    render();

}


/* =========================================================
   PERMANENT DELETE
========================================================= */

function permanentlyDelete(id) {

    trash =
        trash.filter(
            item =>
                String(item.id) !==
                String(id)
        );


    saveJSON(
        TRASH_KEY,
        trash
    );


    analytics(
        "permanent_delete_task"
    );


    renderTrash();

}

/* =========================================================
   DAY CHANGE WATCHER
========================================================= */

/*
   مهم جدًا:

   التطبيق يراقب تغيير اليوم.

   عند الانتقال مثلًا:

   2026-09-01
          ↓
   2026-09-02

   لا يتم حذف أي شيء.

   فقط:
   - يتحدث التاريخ
   - يعاد عرض "اليوم"
   - النوايا القديمة غير المكتملة تستمر
*/

function checkDayChange() {

    const currentDay =
        getDateKey();

    if (
        currentDay !==
        lastKnownDay
    ) {

        lastKnownDay =
            currentDay;

        updateDate();

        render();

    }

}


/*
   فحص كل 30 ثانية.
*/

setInterval(
    checkDayChange,
    30000
);


/* =========================================================
   VISIBILITY
========================================================= */

document.addEventListener(
    "visibilitychange",
    () => {

        if (
            !document.hidden
        ) {

            checkDayChange();

            updateDate();

            render();

        }

    }
);


/* =========================================================
   STORAGE EVENT
========================================================= */

/*
   لو المستخدم فتح ناوي في تابين،
   أي تغيير في واحدة ينعكس في الأخرى.
*/

window.addEventListener(
    "storage",
    event => {

        if (
            event.key ===
                STORAGE_KEY ||
            event.key ===
                BACKUP_STORAGE_KEY
        ) {

            const updated =
                loadTasks();

            if (
                Array.isArray(updated)
            ) {

                tasks =
                    updated
                        .map(
                            normalizeTask
                        )
                        .filter(Boolean);

                render();

            }

        }

    }
);
