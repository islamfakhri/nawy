<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Permissions-Policy" content="interest-cohort=()">
  <meta name="theme-color" content="#3b82f6">
  <meta name="color-scheme" content="dark light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="ناوي — مساحتك الخاصة لنواياك وأهدافك.">
  <title>ناوي</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- SortableJS -->
  <script src="./Sortable.min.js"></script>
  <script>
    if (typeof Sortable === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"><\/script>');
    }
  </script>

  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <!-- Toastify -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js@1.12.0/src/toastify.min.css">
  <script src="https://cdn.jsdelivr.net/npm/toastify-js@1.12.0/src/toastify.min.js"></script>

  <!-- Flatpickr -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ar.js"></script>

  <!-- Lucide Icons -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- Tone.js -->
  <script src="https://cdn.jsdelivr.net/npm/tone@14.7.77/build/Tone.js"></script>

  <!-- Fuse.js -->
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>

  <style>
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --surface-2: #f4f5f5;
      --surface-3: #eceeef;
      --text: #1a1c1d;
      --muted: #6b7377;
      --border: rgba(17, 20, 21, .06);
      --border-strong: rgba(17, 20, 21, .10);
      --accent: #3b82f6;
      --accent-soft: rgba(59, 130, 246, .08);
      --danger: #e5484d;
      --warning: #e8a317;
      --shadow-soft: 0 1px 3px rgba(0,0,0,.03);
      --shadow-card: 0 2px 8px rgba(0,0,0,.04);
      --shadow-sheet: 0 16px 50px rgba(0,0,0,.12);
      --shadow-drag: 0 8px 24px rgba(0,0,0,.15);
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --radius-xl: 24px;
      --radius-full: 9999px;
      --header-height: 116px;
      --bottom-space: 80px;
      --tab-indicator-width: 28px;
      --tab-indicator-left: 0px;
      --fw-normal: 400;
      --fw-medium: 500;
      --fw-semibold: 600;
      --fw-bold: 700;
      --fw-extrabold: 800;
      --sp-xs: 4px;
      --sp-sm: 8px;
      --sp-md: 12px;
      --sp-lg: 16px;
      --sp-xl: 24px;
      --touch-checkbox: 32px;
      --touch-star: 46px;
      --fab-size: 56px;
      --transition-theme: .3s cubic-bezier(.4,0,.2,1);
    }

    html[data-font="small"] { --fs-xs: 10px; --fs-sm: 12px; --fs-md: 13px; --fs-base: 14px; --fs-lg: 15px; --fs-hero: 19px; }
    html[data-font="medium"], html:not([data-font]) { --fs-xs: 11px; --fs-sm: 13px; --fs-md: 14px; --fs-base: 16px; --fs-lg: 18px; --fs-hero: 22px; }
    html[data-font="large"] { --fs-xs: 12px; --fs-sm: 14px; --fs-md: 16px; --fs-base: 18px; --fs-lg: 20px; --fs-hero: 25px; }

    html[data-theme="dark"] {
      --bg: #0e1010; --surface: #1a1d1d; --surface-2: #222626; --surface-3: #2c3131;
      --text: #eef1f1; --muted: #8b9494; --border: rgba(255,255,255,.05); --border-strong: rgba(255,255,255,.08);
      --shadow-soft: 0 1px 4px rgba(0,0,0,.15); --shadow-card: 0 4px 12px rgba(0,0,0,.20); --shadow-sheet: 0 20px 60px rgba(0,0,0,.40);
      --shadow-drag: 0 12px 32px rgba(0,0,0,.40);
    }
    html[data-accent="green"] { --accent: #19a974; --accent-soft: rgba(25, 169, 116, .08); }
    html[data-accent="blue"] { --accent: #3b82f6; --accent-soft: rgba(59, 130, 246, .08); }
    html[data-accent="purple"] { --accent: #8b5cf6; --accent-soft: rgba(139, 92, 246, .08); }
    html[data-accent="orange"] { --accent: #f59e0b; --accent-soft: rgba(245, 158, 11, .10); }
    html[data-accent="pink"] { --accent: #ec4899; --accent-soft: rgba(236, 72, 153, .08); }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { min-height: 100%; background: var(--bg); scroll-behavior: smooth; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: "Cairo", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, Tahoma, Arial, sans-serif;
      transition: background var(--transition-theme), color var(--transition-theme);
      overscroll-behavior-y: none; touch-action: pan-y;
      font-size: var(--fs-base); line-height: 1.6;
    }
    button, textarea, input { font: inherit; }
    button { border: 0; cursor: pointer; color: inherit; background: none; -webkit-tap-highlight-color: transparent; }
    textarea, input { outline: none; }
    ::selection { background: var(--accent); color: #fff; }
    .lucide { width: 20px; height: 20px; stroke-width: 2; }

    .app {
      width: min(100%, 760px); min-height: 100vh; margin: 0 auto;
      padding: env(safe-area-inset-top) var(--sp-lg) calc(var(--bottom-space) + env(safe-area-inset-bottom)) var(--sp-lg);
      touch-action: pan-y;
    }

    .header {
      min-height: var(--header-height); position: sticky; top: 0; z-index: 20; padding-top: var(--sp-sm);
      background: linear-gradient(to bottom, var(--bg) 82%, rgba(0,0,0,0));
      display: flex; flex-direction: column;
      transition: background var(--transition-theme);
    }
    .header-main { min-height: 52px; display: flex; align-items: center; justify-content: space-between; gap: var(--sp-md); }
    .brand { display: flex; align-items: center; gap: var(--sp-sm); min-width: 0; }
    .brand-mark { width: 36px; height: 36px; display: grid; place-items: center; overflow: hidden; border-radius: var(--radius-md); }
    .brand-mark-img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .brand-name { font-size: var(--fs-lg); font-weight: var(--fw-extrabold); letter-spacing: -.3px; }
    .menu-btn { width: 44px; height: 44px; flex: 0 0 auto; border-radius: var(--radius-full); background: var(--surface); border: 1px solid var(--border); display: grid; place-items: center; color: var(--muted); box-shadow: var(--shadow-soft); transition: transform .14s ease; }
    .menu-btn:active { transform: scale(.93); }

    .header-nav { width: 100%; position: relative; margin-top: var(--sp-xs); display: flex; align-items: stretch; }
    .header-tab { position: relative; z-index: 2; min-height: 52px; flex: 1 1 0; padding: 0 var(--sp-sm) 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--muted); font-size: var(--fs-sm); font-weight: var(--fw-semibold); transition: color .18s ease; }
    .header-tab .lucide { width: 20px; height: 20px; }
    .header-tab.active { color: var(--accent); }
    .header-tab-indicator { position: absolute; z-index: 3; left: var(--tab-indicator-left); bottom: 0; width: var(--tab-indicator-width); height: 3px; border-radius: var(--radius-full); background: var(--accent); pointer-events: none; transition: left .28s cubic-bezier(.22,.75,.25,1), width .28s cubic-bezier(.22,.75,.25,1); }

    .hero { padding: var(--sp-sm) 2px var(--sp-sm); }
    .hero-title { margin: 0; font-size: var(--fs-lg); line-height: 1.3; letter-spacing: -.2px; font-weight: var(--fw-semibold); }
    .hero-date { margin-top: var(--sp-xs); color: var(--muted); font-size: var(--fs-sm); font-weight: var(--fw-medium); }

    .content { margin-top: var(--sp-sm); }

    .section {
      margin-top: var(--sp-md);
      background: color-mix(in srgb, var(--surface) 60%, transparent);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .section:first-child { margin-top: 0; }
    .task-list {
      padding: 0 var(--sp-md);
      display: flex; flex-direction: column;
      position: relative; min-height: 20px;
    }

    .task { position: relative; display: flex; align-items: center; gap: var(--sp-md); min-height: 52px; padding: var(--sp-xs) 0; border-bottom: 1px solid var(--border); cursor: pointer; }
    .task:last-child { border-bottom: 0; }
    .task.completed { opacity: .55; }
    .task.drag-source { opacity: .35 !important; }
    .drag-ghost {
      opacity: .95 !important;
      background: var(--surface) !important;
      border: 1px solid var(--border-strong) !important;
      border-radius: var(--radius-md) !important;
      box-shadow: var(--shadow-drag) !important;
    }

    .task-checkbox { width: var(--touch-checkbox); height: var(--touch-checkbox); flex: 0 0 auto; display: grid; place-items: center; border-radius: var(--radius-full); border: 1.5px solid var(--muted); background: transparent; transition: all .18s ease; }
    .task.completed .task-checkbox { background: var(--accent); border-color: var(--accent); }
    .task-checkbox .lucide { width: 14px; height: 14px; color: #fff; opacity: 0; transform: scale(.5); transition: all .16s ease; }
    .task.completed .task-checkbox .lucide { opacity: 1; transform: scale(1); }

    .task-main { min-width: 0; flex: 1; padding: var(--sp-xs) 0; cursor: pointer; }
    .task-text { margin: 0; font-size: var(--fs-base); font-weight: var(--fw-medium); overflow-wrap: anywhere; }
    .task.completed .task-text { color: var(--muted); text-decoration: line-through; }

    .task-star { width: var(--touch-star); height: var(--touch-star); flex: 0 0 auto; display: grid; place-items: center; border-radius: var(--radius-full); color: #b8bdbd; transition: color .16s ease; }
    .task-star .lucide { width: 22px; height: 22px; }
    .task-star.active { color: var(--warning); }
    .task-star.active .lucide { fill: var(--warning); stroke: var(--warning); }

    .completed-section {
      margin-top: var(--sp-md);
      background: color-mix(in srgb, var(--surface) 60%, transparent);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .completed-toggle {
      width: 100%; min-height: 44px; padding: var(--sp-xs) var(--sp-md);
      display: flex; align-items: center; gap: var(--sp-sm);
      border-bottom: 1px solid var(--border);
    }
    .completed-toggle-title { display: flex; align-items: center; gap: var(--sp-sm); font-size: var(--fs-sm); font-weight: var(--fw-bold); }
    .completed-toggle-count {
      min-width: 22px; height: 22px; padding: 0 5px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: var(--radius-full);
      background: var(--surface-3); color: var(--muted);
      font-size: var(--fs-xs); font-weight: var(--fw-bold);
    }
    .completed-toggle-chevron { margin-right: auto; transition: transform .25s ease; }
    .completed-toggle-chevron .lucide { width: 14px; height: 14px; }
    .completed-toggle.open .completed-toggle-chevron { transform: rotate(180deg); }
    .completed-list-wrap { overflow: hidden; max-height: 0; opacity: 0; transition: max-height .30s ease, opacity .20s ease; }
    .completed-list-wrap.open { max-height: 4000px; opacity: 1; }

    .task-empty { padding: 36px var(--sp-xl); text-align: center; border-radius: var(--radius-lg); border: 1px solid var(--border); color: var(--muted); }
    .empty-symbol { width: 44px; height: 44px; margin: 0 auto var(--sp-md); display: grid; place-items: center; border-radius: var(--radius-md); background: var(--accent-soft); color: var(--accent); font-size: 18px; font-weight: var(--fw-extrabold); }
    .empty-title { color: var(--text); font-size: var(--fs-md); font-weight: var(--fw-bold); }
    .empty-text { margin-top: var(--sp-xs); color: var(--muted); font-size: var(--fs-sm); }

    .composer-wrap { position: fixed; z-index: 30; left: 50%; bottom: 0; width: min(760px, 100%); transform: translateX(-50%); padding: 0 var(--sp-lg) calc(var(--sp-md) + env(safe-area-inset-bottom)); pointer-events: none; display: flex; justify-content: flex-end; }
    .composer-fab { pointer-events: auto; width: var(--fab-size); height: var(--fab-size); border-radius: var(--radius-full); background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 16px rgba(0,0,0,.18); transition: transform .15s ease; }
    .composer-fab:active { transform: scale(.93); }
    .composer-fab.hidden { display: none; }

    .composer-panel { pointer-events: auto; position: fixed; z-index: 31; left: 50%; bottom: 0; transform: translateX(-50%) translateY(100%); width: min(100%, 760px); background: var(--surface); border-radius: var(--radius-xl) var(--radius-xl) 0 0; box-shadow: var(--shadow-sheet); border: 1px solid var(--border); transition: transform .28s ease; padding: var(--sp-lg) var(--sp-lg) calc(var(--sp-md) + env(safe-area-inset-bottom)); }
    .composer-panel.open { transform: translateX(-50%) translateY(0); }
    .composer-input-row { display: flex; align-items: center; gap: var(--sp-sm); }
    .composer-input-row textarea { flex: 1; min-height: 52px; max-height: 110px; resize: none; padding: var(--sp-md); border: none; background: transparent; color: var(--text); font-size: var(--fs-base); }
    .composer-input-row textarea::placeholder { color: var(--muted); opacity: .6; }
    .send-btn { width: 46px; height: 46px; flex: 0 0 auto; border-radius: var(--radius-full); background: var(--accent); color: #fff; display: grid; place-items: center; transition: opacity .18s ease; }
    .send-btn.disabled { opacity: .4; }

    .overlay { position: fixed; inset: 0; z-index: 100; display: flex; align-items: flex-end; justify-content: center; padding: var(--sp-lg); background: rgba(0,0,0,.40); opacity: 0; visibility: hidden; transition: opacity .20s ease, visibility .20s ease; }
    .overlay.show { opacity: 1; visibility: visible; }
    .sheet { width: min(100%, 520px); max-height: min(82vh, 680px); overflow-y: auto; padding: var(--sp-lg); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl); box-shadow: var(--shadow-sheet); transform: translateY(18px); transition: transform .24s ease; position: relative; }
    .overlay.show .sheet { transform: translateY(0); }
    .sheet-handle { width: 36px; height: 5px; margin: 2px auto 14px; border-radius: var(--radius-full); background: var(--surface-3); }
    .sheet-close-btn { position: absolute; top: 10px; left: 10px; width: 40px; height: 40px; border-radius: var(--radius-full); background: var(--surface-2); display: grid; place-items: center; color: var(--muted); z-index: 2; }
    .sheet-title { padding: 4px 4px 12px; font-size: var(--fs-lg); font-weight: var(--fw-bold); }

    .action-task-preview {
      width: 100%; margin: 4px 4px 8px; padding: var(--sp-md);
      border-radius: var(--radius-md); background: var(--surface-2);
      display: flex; align-items: center; justify-content: space-between; gap: var(--sp-sm);
      cursor: pointer;
    }
    .action-task-preview-text { flex: 1; font-size: var(--fs-md); font-weight: var(--fw-semibold); }
    .action-task-edit-input { width: 100%; min-height: 50px; padding: var(--sp-sm); border: 1px solid var(--accent); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); resize: none; font-size: var(--fs-md); }

    .action-item { width: 100%; min-height: 52px; padding: 0 var(--sp-md); display: flex; align-items: center; gap: var(--sp-md); border-radius: var(--radius-md); transition: background .15s ease; }
    .action-item:active { background: var(--surface-2); }
    .action-item.danger { color: var(--danger); }
    .action-item .lucide { width: 20px; height: 20px; color: var(--muted); }
    .action-item.danger .lucide { color: var(--danger); }
    .action-text { flex: 1; font-weight: var(--fw-medium); }

    .menu-item { width: 100%; min-height: 52px; padding: 0 var(--sp-md); display: flex; align-items: center; gap: var(--sp-md); border-radius: var(--radius-md); transition: background .15s ease; }
    .menu-item:active { background: var(--surface-2); }
    .menu-item .lucide { width: 20px; height: 20px; color: var(--muted); }
    .menu-text { flex: 1; font-weight: var(--fw-medium); }

    .setting-group { margin-bottom: var(--sp-md); }
    .setting-label { padding: 0 var(--sp-sm) var(--sp-sm); color: var(--muted); font-size: var(--fs-xs); font-weight: var(--fw-bold); }
    .setting-box { overflow: hidden; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); }
    .setting-row { min-height: 54px; padding: 0 var(--sp-md); display: flex; align-items: center; justify-content: space-between; gap: var(--sp-sm); border-bottom: 1px solid var(--border); }
    .setting-row:last-child { border-bottom: 0; }
    .setting-name { font-size: var(--fs-base); font-weight: var(--fw-medium); }
    .segmented { display: flex; gap: 2px; padding: 3px; border-radius: var(--radius-sm); background: var(--surface-2); }
    .segment { min-height: 32px; padding: 0 var(--sp-sm); border-radius: 7px; background: transparent; color: var(--muted); font-size: var(--fs-sm); font-weight: var(--fw-semibold); transition: all .16s ease; }
    .segment.active { background: var(--accent); color: #fff; }
    .colors { display: flex; align-items: center; gap: var(--sp-sm); }
    .color-btn { width: 28px; height: 28px; border-radius: var(--radius-full); border: 2px solid var(--surface); outline: 1px solid var(--border); position: relative; }
    .color-btn.active::after { content: "✓"; position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: var(--fw-bold); }
    .green { background: #19a974; } .blue { background: #3b82f6; } .purple { background: #8b5cf6; } .orange { background: #f59e0b; } .pink { background: #ec4899; }

    .time-input { width: 110px; min-height: 36px; padding: 0 var(--sp-sm); border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font-size: var(--fs-sm); font-weight: var(--fw-semibold); text-align: center; }

    .flatpickr-calendar { font-family: "Cairo", sans-serif !important; }
    .flatpickr-day.selected { background: var(--accent) !important; border-color: var(--accent) !important; }

    .search-input { width: 100%; min-height: 50px; padding: 0 var(--sp-md); border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font-size: var(--fs-base); }

    .hidden { display: none !important; }
    .no-scroll { overflow: hidden; }

    .streak-badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px; border-radius: var(--radius-full);
      background: var(--accent-soft); color: var(--accent);
      font-size: var(--fs-xs); font-weight: var(--fw-bold);
    }

    .install-banner {
      position: fixed; z-index: 180; left: 50%; bottom: 12px;
      transform: translate(-50%, 20px); opacity: 0; visibility: hidden;
      width: min(calc(100% - 28px), 420px);
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: var(--sp-md);
      box-shadow: var(--shadow-sheet);
      transition: opacity .25s ease, transform .25s ease, visibility .25s ease;
    }
    .install-banner.show { opacity: 1; visibility: visible; transform: translate(-50%, 0); }

    @media (max-width: 480px) {
      .app { padding-left: var(--sp-md); padding-right: var(--sp-md); }
      .task { min-height: 48px; gap: var(--sp-sm); }
      .task-checkbox { width: 28px; height: 28px; }
      .task-star { width: 40px; height: 40px; }
      .task-star .lucide { width: 18px; height: 18px; }
      .task-list { padding: 0 var(--sp-sm); }
      .segment { padding: 0 var(--sp-xs); font-size: var(--fs-xs); }
      .header-tab { font-size: 11px; }
      .header-tab .lucide { width: 18px; height: 18px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-main">
        <div class="brand">
          <div class="brand-mark" id="brandMark">
            <img class="brand-mark-img" id="brandMarkImg" src="./icon-512.png" alt="ناوي" width="36" height="36" onerror="this.remove(); document.getElementById('brandMarkFallback').style.display = 'grid';">
            <span class="brand-mark-fallback" id="brandMarkFallback" style="display:none;">ن</span>
          </div>
          <div class="brand-name" id="brandName">ناوي</div>
        </div>
        <button class="menu-btn" id="menuBtn" type="button"><i data-lucide="more-horizontal"></i></button>
      </div>
      <nav class="header-nav" id="headerNav">
        <button class="header-tab" data-view="all" type="button">
          <i data-lucide="sprout"></i>
          <span data-i18n="all">نواياي</span>
        </button>
        <button class="header-tab active" data-view="today" type="button">
          <i data-lucide="sun"></i>
          <span data-i18n="today">اليوم</span>
        </button>
        <button class="header-tab" data-view="favorites" type="button">
          <i data-lucide="star"></i>
          <span data-i18n="favorites">مفضلاتي</span>
        </button>
        <span class="header-tab-indicator" id="headerTabIndicator"></span>
      </nav>

  <script>
    "use strict";

    const STORAGE_KEYS = { tasks: "nawy_tasks_v9", trash: "nawy_trash_v2", settings: "nawy_settings_v2" };
    const DEFAULT_SETTINGS = { theme: "system", accent: "blue", language: "ar", fontSize: "medium", notificationEnabled: true, notificationTime: "09:00" };

    const TRANSLATIONS = {
      ar: {
        appName: "ناوي", all: "نواياي", today: "اليوم", favorites: "مفضلاتي", completed: "المكتملة",
        heroToday: "ناوي على إيه النهارده؟", settings: "الإعدادات", trash: "أرشيف النوايا", search: "بحث", searchPlaceholder: "ابحث في نواياك...",
        done: "أتمم النية", cancelDone: "أعد فتح النية", repeat: "تكرار", setDate: "تحديد موعد", delete: "تراجع عن النية",
        language: "اللغة", languageName: "لغة ناوي", appearance: "المظهر", mode: "الوضع", light: "فاتح", dark: "داكن", system: "النظام",
        fontSize: "حجم الخط", small: "صغير", medium: "متوسط", large: "كبير", color: "اللون", nawyColor: "لون ناوي",
        notification: "إشعار الصباح", notificationEnable: "تفعيل", notificationDisable: "تعطيل", time: "الوقت",
        noIntentions: "مفيش نوايا لسه", firstIntent: "اكتب أول نية ناوي تعملها النهارده.",
        noFavorites: "مفيش مفضلات لسه", favoriteHint: "علّم أي نية بنجمة وهتظهر هنا.",
        archiveEmpty: "الأرشيف فاضي", restore: "استرجاع", taskPlaceholder: "اكتب النية اللي في بالك...",
        repeatNone: "بدون تكرار", repeatDaily: "يوميًا", repeatWeekly: "أسبوعيًا", repeatMonthly: "شهريًا",
        removeDate: "إزالة", save: "حفظ", optionalTime: "الوقت (اختياري)",
        addedToast: "تمت إضافة النية ✨", completedToast: "تم إتمام النية 🎉", deletedToast: "تم التراجع - اضغط للاسترجاع",
        restoredToast: "تم الاسترجاع ✅", editedToast: "تم التعديل ✏️",
        exportData: "تصدير البيانات", importData: "استيراد البيانات", exported: "تم تصدير البيانات 💾", imported: "تم استيراد البيانات ✅", noResults: "مفيش نتائج"
      },
      en: {
        appName: "NAWY", all: "My Intentions", today: "Today", favorites: "Favorites", completed: "Completed",
        heroToday: "What are you up to today?", settings: "Settings", trash: "Archive", search: "Search", searchPlaceholder: "Search your intentions...",
        done: "Complete", cancelDone: "Reopen", repeat: "Repeat", setDate: "Set Date", delete: "Delete",
        language: "Language", languageName: "NAWY Language", appearance: "Appearance", mode: "Mode", light: "Light", dark: "Dark", system: "System",
        fontSize: "Font Size", small: "Small", medium: "Medium", large: "Large", color: "Color", nawyColor: "NAWY Color",
        notification: "Morning Notification", notificationEnable: "Enable", notificationDisable: "Disable", time: "Time",
        noIntentions: "No intentions yet", firstIntent: "Write your first intention for today.",
        noFavorites: "No favorites yet", favoriteHint: "Star an intention and it will appear here.",
        archiveEmpty: "Archive is empty", restore: "Restore", taskPlaceholder: "Write the intention on your mind...",
        repeatNone: "No Repeat", repeatDaily: "Daily", repeatWeekly: "Weekly", repeatMonthly: "Monthly",
        removeDate: "Remove", save: "Save", optionalTime: "Time (optional)",
        addedToast: "Intention added ✨", completedToast: "Intention completed 🎉", deletedToast: "Deleted - tap to undo",
        restoredToast: "Restored ✅", editedToast: "Edited ✏️",
        exportData: "Export Data", importData: "Import Data", exported: "Data exported 💾", imported: "Data imported ✅", noResults: "No results"
      }
    };

    let tasks = [], trash = [], settings = { ...DEFAULT_SETTINGS };
    let currentView = "today", selectedTaskId = null, completedExpanded = false;
    let swipeStartX = 0, swipeStartY = 0, swipeTracking = false;
    let completeSynth = null;

    const $ = s => document.querySelector(s);
    const $$ = s => [...document.querySelectorAll(s)];

    function t(key) { return TRANSLATIONS[settings.language]?.[key] || TRANSLATIONS.ar[key] || key; }
    function pad(n) { return String(n).padStart(2, "0"); }
    function getDateKey(d = new Date()) { return [d.getFullYear(), pad(d.getMonth()+1), pad(d.getDate())].join("-"); }
    function createId() { return Date.now().toString(36) + Math.random().toString(36).slice(2,9); }
    function safeParse(v, f) { try { return JSON.parse(v) ?? f; } catch { return f; } }

    function loadData() {
      tasks = safeParse(localStorage.getItem(STORAGE_KEYS.tasks), []).filter(x => x && x.text);
      trash = safeParse(localStorage.getItem(STORAGE_KEYS.trash), []).filter(x => x && x.text);
      settings = { ...DEFAULT_SETTINGS, ...safeParse(localStorage.getItem(STORAGE_KEYS.settings), {}) };
    }
    function saveTasks() { localStorage.setItem(STORAGE_KEYS.tasks, JSON.stringify(tasks)); }
    function saveTrash() { localStorage.setItem(STORAGE_KEYS.trash, JSON.stringify(trash)); }
    function saveSettings() { localStorage.setItem(STORAGE_KEYS.settings, JSON.stringify(settings)); }

    function showToast(message, type = 'success', canUndo = false, undoCallback = null) {
      const colors = { success: '#19a974', error: '#e5484d', warning: '#e8a317', info: '#3b82f6' };
      const toast = Toastify({
        text: message, duration: canUndo ? 5000 : 3000, close: true, gravity: 'bottom', position: 'center',
        style: { background: colors[type] || colors.success, borderRadius: '14px', padding: '12px 20px', fontFamily: '"Cairo", sans-serif', fontWeight: '600', fontSize: '14px', boxShadow: '0 8px 24px rgba(0,0,0,.15)' }
      });
      if (canUndo && undoCallback) { toast.options.onClick = function() { undoCallback(); toast.hideToast(); }; }
      toast.showToast();
    }

    function initCompleteSound() {
      if (completeSynth) return;
      completeSynth = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: "sine" },
        envelope: { attack: 0.005, decay: 0.1, sustain: 0.3, release: 0.4 }
      }).toDestination();
      completeSynth.volume.value = -12;
    }

    function playCompleteSound() {
      try {
        initCompleteSound();
        const now = Tone.now();
        completeSynth.triggerAttackRelease("C5", "16n", now);
        completeSynth.triggerAttackRelease("E5", "16n", now + 0.04);
        completeSynth.triggerAttackRelease("G5", "8n", now + 0.08);
        completeSynth.triggerAttackRelease("C6", "4n", now + 0.12);
      } catch(e) {}
    }

    function addTask(text) {
      const clean = String(text || "").trim();
      if (!clean) return false;
      tasks.unshift({ id: createId(), text: clean, completed: false, starred: false, createdAt: Date.now(), taskDay: getDateKey(), scheduledDate: null, completedAt: null, repeat: 'none' });
      saveTasks();
      render();
      showToast(t("addedToast"));
      return true;
    }

    function completeTask(id) {
      const task = tasks.find(x => x.id === id);
      if (!task) return;
      task.completed = !task.completed;
      task.completedAt = task.completed ? Date.now() : null;
      if (task.completed) {
        playCompleteSound();
        if (navigator.vibrate) navigator.vibrate([50, 30, 50]);
        if (typeof confetti === 'function') confetti({ particleCount: 80, spread: 60, origin: { y: 0.7 } });
      }
      saveTasks(); render();
      if (task.completed) showToast(t("completedToast"));
    }

    function toggleStar(id) {
      const task = tasks.find(x => x.id === id);
      if (!task) return;
      task.starred = !task.starred;
      if (task.starred) {
        const index = tasks.indexOf(task);
        tasks.splice(index, 1);
        tasks.unshift(task);
      }
      saveTasks(); render();
    }

    function deleteTask(id) {
      const index = tasks.findIndex(x => x.id === id);
      if (index === -1) return;
      const [deleted] = tasks.splice(index, 1);
      trash.unshift({ ...deleted, deletedAt: Date.now() });
      saveTasks(); saveTrash(); render();
      showToast(t("deletedToast"), 'warning', true, () => {
        const ti = trash.findIndex(x => x.id === deleted.id);
        if (ti !== -1) trash.splice(ti, 1);
        tasks.unshift(deleted);
        saveTasks(); saveTrash(); render();
      });
    }

    function getStreak() {
      let streak = 0;
      const today = new Date();
      for (let i = 0; i < 365; i++) {
        const date = new Date(today);
        date.setDate(date.getDate() - i);
        const key = getDateKey(date);
        const hasCompleted = tasks.some(x => x.completed && x.completedAt && getDateKey(new Date(x.completedAt)) === key);
        if (hasCompleted) streak++;
        else if (i > 0) break;
      }
      return streak;
    }

    function render() {
      const streak = getStreak();
      const streakBadge = streak > 0 ? `<span class="streak-badge"><i data-lucide="flame" style="width:14px;height:14px;"></i> ${streak} ${settings.language === 'ar' ? 'يوم' : 'days'}</span>` : '';
      
      $("#content").innerHTML = "";
      
      if (currentView === "today") {
        $("#heroTitle").style.display = "block";
        $("#heroDate").style.display = "block";
        $("#heroTitle").innerHTML = `${t("heroToday")} ${streakBadge}`;
        $("#heroDate").textContent = new Intl.DateTimeFormat(settings.language === "en" ? "en-US" : "ar-EG", { weekday: "long", day: "numeric", month: "long" }).format(new Date());
        const active = tasks.filter(x => !x.completed && (x.scheduledDate ? x.scheduledDate === getDateKey() : x.taskDay === getDateKey()));
        const completed = tasks.filter(x => x.completed && x.completedAt && getDateKey(new Date(x.completedAt)) === getDateKey());
        if (active.length === 0 && completed.length === 0) { $("#content").appendChild(createEmptyState("🌱", t("noIntentions"), t("firstIntent"))); }
        else { if (active.length > 0) $("#content").appendChild(createSection(active)); if (completed.length > 0) $("#content").appendChild(createCompletedSection(completed)); }
      } else if (currentView === "all") {
        $("#heroTitle").style.display = "none";
        $("#heroDate").style.display = "none";
        const active = tasks.filter(x => !x.completed);
        const completed = tasks.filter(x => x.completed);
        if (active.length > 0) $("#content").appendChild(createSection(active));
        if (completed.length > 0) $("#content").appendChild(createCompletedSection(completed));
      } else if (currentView === "favorites") {
        $("#heroTitle").style.display = "none";
        $("#heroDate").style.display = "none";
        const favActive = tasks.filter(x => x.starred && !x.completed);
        const favCompleted = tasks.filter(x => x.starred && x.completed);
        if (favActive.length === 0 && favCompleted.length === 0) { $("#content").appendChild(createEmptyState("⭐", t("noFavorites"), t("favoriteHint"))); }
        else { if (favActive.length > 0) $("#content").appendChild(createSection(favActive)); if (favCompleted.length > 0) $("#content").appendChild(createCompletedSection(favCompleted)); }
      }
      updateHeaderNav();
      requestAnimationFrame(updateIndicator);
      setTimeout(initSortable, 50);
      lucide.createIcons();
    }

    function createSection(taskArray) {
      const section = document.createElement("section");
      section.className = "section";
      const list = document.createElement("div");
      list.className = "task-list";
      taskArray.forEach(task => list.appendChild(createTaskElement(task)));
      section.appendChild(list);
      return section;
    }

    function createCompletedSection(taskArray) {
      const section = document.createElement("section");
      section.className = "completed-section";
      const toggle = document.createElement("button");
      toggle.type = "button";
      toggle.className = "completed-toggle" + (completedExpanded ? " open" : "");
      const title = document.createElement("span");
      title.className = "completed-toggle-title";
      title.textContent = t("completed");
      const count = document.createElement("span");
      count.className = "completed-toggle-count";
      count.textContent = taskArray.length;
      title.appendChild(count);
      const chevron = document.createElement("span");
      chevron.className = "completed-toggle-chevron";
      chevron.innerHTML = '<i data-lucide="chevron-down"></i>';
      toggle.append(title, chevron);
      const listWrap = document.createElement("div");
      listWrap.className = "completed-list-wrap" + (completedExpanded ? " open" : "");
      const list = document.createElement("div");
      list.className = "task-list";
      taskArray.forEach(task => list.appendChild(createTaskElement(task, true)));
      listWrap.appendChild(list);
      toggle.addEventListener("click", () => { completedExpanded = !completedExpanded; render(); });
      section.append(toggle, listWrap);
      return section;
    }

    function createTaskElement(task) {
      const article = document.createElement("article");
      article.className = "task" + (task.completed ? " completed" : "");
      article.dataset.taskId = task.id;
      article.innerHTML = `
        <button class="task-checkbox" type="button"><i data-lucide="check"></i></button>
        <div class="task-main"><p class="task-text">${task.text}</p></div>
        <button class="task-star ${task.starred ? 'active' : ''}" type="button"><i data-lucide="star"></i></button>
      `;
      article.querySelector(".task-checkbox").onclick = (e) => { e.stopPropagation(); completeTask(task.id); };
      article.querySelector(".task-star").onclick = (e) => { e.stopPropagation(); toggleStar(task.id); };
      article.querySelector(".task-main").onclick = (e) => { e.stopPropagation(); openAction(task.id); };
      return article;
    }

    function createEmptyState(symbol, title, message) {
      const box = document.createElement("div");
      box.className = "task-empty";
      box.innerHTML = `<div class="empty-symbol">${symbol}</div><div class="empty-title">${title}</div><div class="empty-text">${message}</div>`;
      return box;
    }

    function initSortable() {
      document.querySelectorAll(".task-list").forEach(list => {
        if (list.sortableInstance) list.sortableInstance.destroy();
        list.sortableInstance = new Sortable(list, {
          animation: 150, 
          ghostClass: 'drag-ghost', 
          dragClass: 'drag-source', 
          delay: 300,
          delayOnTouchOnly: true,
          touchStartThreshold: 5,
          onEnd: function() {
            const newOrder = [...list.querySelectorAll(".task")].map(el => el.dataset.taskId);
            const activeTasks = tasks.filter(x => !x.completed);
            const completedTasks = tasks.filter(x => x.completed);
            const taskMap = new Map();
            activeTasks.forEach(x => taskMap.set(x.id, x));
            const reordered = [];
            newOrder.forEach(id => { if (taskMap.has(id)) { reordered.push(taskMap.get(id)); taskMap.delete(id); } });
            taskMap.forEach(x => reordered.push(x));
            tasks = [...reordered, ...completedTasks];
            saveTasks();
          }
        });
      });
    }

    function updateHeaderNav() {
      $$(".header-tab").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.view === currentView);
      });
    }

    function updateIndicator() {
      const activeTab = document.querySelector(`.header-tab[data-view="${currentView}"]`);
      if (!activeTab) return;
      const navRect = $("#headerNav").getBoundingClientRect();
      const tabRect = activeTab.getBoundingClientRect();
      const w = Math.max(22, Math.min(36, tabRect.width * .32));
      const left = (tabRect.left - navRect.left + (tabRect.width - w)/2);
      $("#headerNav").style.setProperty("--tab-indicator-width", `${w}px`);
      $("#headerNav").style.setProperty("--tab-indicator-left", `${left}px`);
    }

    function setView(view) {
      if (!["all", "today", "favorites"].includes(view)) return;
      currentView = view;
      closeAllOverlays();
      closeComposer();
      render();
    }

    function openAction(id) {
      const task = tasks.find(x => x.id === id);
      if (!task) return;
      selectedTaskId = id;
      $("#actionPreviewContainer").innerHTML = `
        <button class="action-task-preview" id="actionTaskPreview" type="button">
          <span class="action-task-preview-text">${task.text}</span>
          <i data-lucide="pencil"></i>
        </button>
      `;
      $("#actionComplete .action-text").textContent = task.completed ? t("cancelDone") : t("done");
      $("#actionDateText").textContent = task.scheduledDate || t("setDate");
      $("#actionTaskPreview").onclick = () => {
        const preview = $("#actionTaskPreview");
        const editContainer = document.createElement("div");
        editContainer.style.cssText = "display:flex;align-items:center;gap:8px;width:100%;";
        const editArea = document.createElement("textarea");
        editArea.className = "action-task-edit-input";
        editArea.value = task.text;
        const doneBtn = document.createElement("button");
        doneBtn.type = "button";
        doneBtn.style.cssText = "width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;";
        doneBtn.innerHTML = '<i data-lucide="check" style="width:16px;height:16px;"></i>';
        editContainer.append(editArea, doneBtn);
        preview.replaceWith(editContainer);
        editArea.focus();
        lucide.createIcons();
        function saveEdit() {
          const newText = editArea.value.trim();
          if (newText && newText !== task.text) { task.text = newText; saveTasks(); render(); showToast(t("editedToast")); }
          closeOverlay($("#actionOverlay")); selectedTaskId = null;
        }
        doneBtn.onclick = saveEdit;
        editArea.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); saveEdit(); } });
      };
      openOverlay($("#actionOverlay"));
      lucide.createIcons();
    }

    function openOverlay(overlay) { overlay.classList.add("show"); document.body.classList.add("no-scroll"); }
    function closeOverlay(overlay) { overlay.classList.remove("show"); if (!document.querySelector(".overlay.show")) document.body.classList.remove("no-scroll"); }
    function closeAllOverlays() { $$(".overlay.show").forEach(closeOverlay); selectedTaskId = null; }

    function openComposer() { $("#composerFab").classList.add("hidden"); $("#composerPanel").classList.add("open"); $("#taskInput").focus(); }
    function closeComposer() { $("#composerFab").classList.remove("hidden"); $("#composerPanel").classList.remove("open"); $("#taskInput").value = ""; $("#sendBtn").classList.add("disabled"); }

    function applySettings() {
      let theme = settings.theme;
      if (theme === "system") theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", theme);
      document.documentElement.setAttribute("data-accent", settings.accent);
      document.documentElement.setAttribute("data-font", settings.fontSize);
      document.documentElement.lang = settings.language;
      document.documentElement.dir = settings.language === "ar" ? "rtl" : "ltr";
      $("#brandName").textContent = t("appName");
      $$("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
      $$("[data-i18n-placeholder]").forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
      $$("[data-theme-choice]").forEach(btn => btn.classList.toggle("active", btn.dataset.themeChoice === settings.theme));
      $$("[data-accent-choice]").forEach(btn => btn.classList.toggle("active", btn.dataset.accentChoice === settings.accent));
      $$("[data-font-choice]").forEach(btn => btn.classList.toggle("active", btn.dataset.fontChoice === settings.fontSize));
      $$("[data-language-choice]").forEach(btn => btn.classList.toggle("active", btn.dataset.languageChoice === settings.language));
      updateTabLabels();
    }

    function updateTabLabels() {
      $$(".header-tab").forEach(tab => {
        const view = tab.dataset.view;
        const label = tab.querySelector("span");
        if (label) label.textContent = view === "all" ? t("all") : view === "today" ? t("today") : t("favorites");
      });
      $("#taskInput").placeholder = t("taskPlaceholder");
    }

    function exportData() {
      const data = JSON.stringify({ tasks, trash, settings }, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `nawy-backup-${getDateKey()}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast(t("exported"));
    }

    function importData(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = JSON.parse(e.target.result);
          if (data.tasks && data.trash && data.settings) {
            tasks = data.tasks; trash = data.trash; settings = { ...DEFAULT_SETTINGS, ...data.settings };
            saveTasks(); saveTrash(); saveSettings();
            applySettings(); render();
            showToast(t("imported"));
          }
        } catch(err) { showToast(t("noResults"), 'error'); }
      };
      reader.readAsText(file);
    }

    function renderTrash() {
      const container = $("#trashList");
      container.innerHTML = "";
      if (trash.length === 0) { container.innerHTML = `<div class="task-empty"><div class="empty-title">${t("archiveEmpty")}</div></div>`; return; }
      trash.forEach(task => {
        const item = document.createElement("div");
        item.style.cssText = "padding:12px;border-radius:12px;background:var(--surface-2);display:flex;align-items:center;gap:8px;";
        const text = document.createElement("div");
        text.textContent = task.text;
        text.style.cssText = "flex:1;min-width:0;font-size:14px;";
        const restore = document.createElement("button");
        restore.textContent = t("restore");
        restore.style.cssText = "min-height:36px;padding:0 12px;border-radius:8px;background:var(--surface);font-size:13px;font-weight:600;";
        restore.onclick = () => {
          const index = trash.findIndex(x => x.id === task.id);
          if (index !== -1) {
            const [restored] = trash.splice(index, 1);
            delete restored.deletedAt;
            tasks.unshift(restored);
            saveTasks(); saveTrash(); renderTrash();
            showToast(t("restoredToast"));
          }
        };
        item.append(text, restore);
        container.appendChild(item);
      });
    }

    function requestNotificationPermission() {
      return new Promise((resolve) => {
        if (!("Notification" in window)) { showToast("المتصفح لا يدعم الإشعارات", 'error'); resolve(false); return; }
        Notification.requestPermission().then(permission => resolve(permission === "granted"));
      });
    }

    function scheduleNotification() {
      if (!settings.notificationEnabled) return;
      if (!("Notification" in window) || Notification.permission !== "granted") return;
      if (window.nawyNotificationTimeout) clearTimeout(window.nawyNotificationTimeout);
      const now = new Date();
      const [hours, minutes] = (settings.notificationTime || "09:00").split(":").map(Number);
      let scheduledTime = new Date(now);
      scheduledTime.setHours(hours, minutes, 0, 0);
      if (scheduledTime <= now) scheduledTime.setDate(scheduledTime.getDate() + 1);
      const delay = scheduledTime.getTime() - now.getTime();
      window.nawyNotificationTimeout = setTimeout(() => { showMorningNotification(); scheduleNotification(); }, delay);
    }

    function showMorningNotification() {
      const body = settings.language === "en" ? "What are you up to today?" : "ناوي على إيه النهارده؟";
      const options = { body, icon: "./icon-512.png", badge: "./icon-512.png", dir: settings.language === "en" ? "ltr" : "rtl", lang: settings.language, tag: "nawy-morning", requireInteraction: true, vibrate: [100, 50, 100] };
      if (navigator.serviceWorker && navigator.serviceWorker.ready) {
        navigator.serviceWorker.ready.then(reg => reg.showNotification("ناوي 🌱", options)).catch(() => { if ("Notification" in window) { const n = new Notification("ناوي 🌱", options); n.onclick = () => { window.focus(); n.close(); }; } });
      } else if ("Notification" in window) {
        const n = new Notification("ناوي 🌱", options);
        n.onclick = () => { window.focus(); n.close(); };
      }
    }

    function updateNotificationUI() {
      $("#notificationToggleBtn").textContent = settings.notificationEnabled ? t("notificationDisable") : t("notificationEnable");
      $("#notificationTimeRow").classList.toggle("hidden", !settings.notificationEnabled);
      $("#notificationTimeInput").value = settings.notificationTime;
    }

    $("#composerFab").onclick = openComposer;
    $("#composer").addEventListener("submit", e => { e.preventDefault(); if (addTask($("#taskInput").value)) closeComposer(); });
    $("#taskInput").addEventListener("input", () => $("#sendBtn").classList.toggle("disabled", !$("#taskInput").value.trim().length));
    $$(".header-tab").forEach(btn => btn.onclick = () => setView(btn.dataset.view));
    $("#menuBtn").onclick = () => openOverlay($("#menuOverlay"));
    $("#settingsBtn").onclick = () => { closeOverlay($("#menuOverlay")); openOverlay($("#settingsOverlay")); };
    $("#searchBtn").onclick = () => { closeOverlay($("#menuOverlay")); openOverlay($("#searchOverlay")); setTimeout(() => $("#searchInput").focus(), 100); };
    $("#menuTrashBtn").onclick = () => { closeOverlay($("#menuOverlay")); renderTrash(); openOverlay($("#trashOverlay")); };
    $("#exportBtn").onclick = () => { closeOverlay($("#menuOverlay")); exportData(); };
    $("#importBtn").onclick = () => { closeOverlay($("#menuOverlay")); $("#importFileInput").click(); };
    $("#importFileInput").addEventListener("change", e => { if (e.target.files[0]) importData(e.target.files[0]); });
    $$("[data-close-overlay]").forEach(btn => btn.onclick = () => closeOverlay(document.getElementById(btn.dataset.closeOverlay)));
    $$(".overlay").forEach(overlay => overlay.addEventListener("click", e => { if (e.target === overlay) closeOverlay(overlay); }));
    $("#actionComplete").onclick = () => { if (selectedTaskId) { completeTask(selectedTaskId); closeOverlay($("#actionOverlay")); selectedTaskId = null; } };
    $("#actionDelete").onclick = () => { if (selectedTaskId) { deleteTask(selectedTaskId); closeOverlay($("#actionOverlay")); selectedTaskId = null; } };
    $("#actionRepeat").onclick = () => { closeOverlay($("#actionOverlay")); openOverlay($("#repeatOverlay")); };
    $("#actionDate").onclick = () => { closeOverlay($("#actionOverlay")); openOverlay($("#dateOverlay")); setTimeout(() => { if ($("#taskDateInput")._flatpickr) $("#taskDateInput")._flatpickr.destroy(); flatpickr("#taskDateInput", { dateFormat: "Y-m-d", locale: settings.language === "ar" ? "ar" : "en", clickOpens: true }); $("#taskDateInput")._flatpickr.open(); }, 100); };
    $$("#repeatOverlay [data-repeat]").forEach(btn => btn.onclick = () => { if (selectedTaskId) { const task = tasks.find(x => x.id === selectedTaskId); if (task) { task.repeat = btn.dataset.repeat; saveTasks(); } } closeOverlay($("#repeatOverlay")); selectedTaskId = null; render(); });
    $("#dateSave").onclick = () => { if (selectedTaskId && $("#taskDateInput").value) { const task = tasks.find(x => x.id === selectedTaskId); if (task) { task.scheduledDate = $("#taskDateInput").value; if ($("#taskTimeInput").value) task.scheduledDate += `T${$("#taskTimeInput").value}`; saveTasks(); showToast("تم تحديد الموعد 📅"); } } closeOverlay($("#dateOverlay")); selectedTaskId = null; render(); };
    $("#dateClear").onclick = () => { if (selectedTaskId) { const task = tasks.find(x => x.id === selectedTaskId); if (task) { task.scheduledDate = null; saveTasks(); } } closeOverlay($("#dateOverlay")); selectedTaskId = null; render(); };
    $$("[data-theme-choice]").forEach(btn => btn.onclick = () => { settings.theme = btn.dataset.themeChoice; saveSettings(); applySettings(); });
    $$("[data-accent-choice]").forEach(btn => btn.onclick = () => { settings.accent = btn.dataset.accentChoice; saveSettings(); applySettings(); });
    $$("[data-font-choice]").forEach(btn => btn.onclick = () => { settings.fontSize = btn.dataset.fontChoice; saveSettings(); applySettings(); render(); });
    $$("[data-language-choice]").forEach(btn => btn.onclick = () => { settings.language = btn.dataset.languageChoice; saveSettings(); applySettings(); render(); });

    document.addEventListener("touchstart", e => {
      if (e.target.closest(".task-list, button, input, textarea, .overlay, .sheet, .composer-panel")) return;
      const touch = e.touches[0];
      swipeStartX = touch.clientX; swipeStartY = touch.clientY; swipeTracking = true;
    }, { passive: true });

    document.addEventListener("touchend", e => {
      if (!swipeTracking) return;
      swipeTracking = false;
      const touch = e.changedTouches[0];
      const dx = touch.clientX - swipeStartX;
      const dy = touch.clientY - swipeStartY;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        const views = ["all", "today", "favorites"];
        const idx = views.indexOf(currentView);
        const isRTL = document.documentElement.dir === "rtl";
        if (isRTL) { if (dx < 0) setView(views[(idx+1)%views.length]); else setView(views[(idx-1+views.length)%views.length]); }
        else { if (dx > 0) setView(views[(idx+1)%views.length]); else setView(views[(idx-1+views.length)%views.length]); }
      }
    }, { passive: true });

    $("#notificationToggleBtn").onclick = async () => {
      if (settings.notificationEnabled) {
        settings.notificationEnabled = false;
        saveSettings(); updateNotificationUI();
        showToast("تم تعطيل الإشعارات", 'info');
        return;
      }
      const granted = await requestNotificationPermission();
      if (granted) {
        settings.notificationEnabled = true;
        saveSettings(); updateNotificationUI(); scheduleNotification();
        showToast("تم تفعيل الإشعارات 🔔");
      } else {
        showToast("تم رفض الإذن", 'error');
      }
    };

    $("#notificationTimeInput").addEventListener("change", () => { settings.notificationTime = $("#notificationTimeInput").value; saveSettings(); if (settings.notificationEnabled) scheduleNotification(); });

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (settings.theme === "system") applySettings(); });

    const fuse = new Fuse([], { keys: ['text'], threshold: 0.3 });
    $("#searchInput").addEventListener("input", () => {
      const query = $("#searchInput").value.trim();
      const results = $("#searchResults");
      results.innerHTML = "";
      if (!query) return;
      fuse.setCollection(tasks);
      const found = fuse.search(query).map(r => r.item);
      if (found.length === 0) { results.innerHTML = `<div class="task-empty"><div class="empty-title">${t("noResults")}</div></div>`; return; }
      found.forEach(task => {
        const item = document.createElement("div");
        item.style.cssText = "padding:12px;border-radius:12px;background:var(--surface-2);display:flex;align-items:center;gap:8px;margin-bottom:8px;cursor:pointer;";
        item.textContent = task.text;
        if (task.completed) item.style.textDecoration = "line-through";
        item.onclick = () => { closeOverlay($("#searchOverlay")); openAction(task.id); };
        results.appendChild(item);
      });
    });

    let deferredInstallPrompt = null;
    window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredInstallPrompt = e; $("#installBanner").classList.add("show"); });
    $("#installAction").onclick = async () => { if (!deferredInstallPrompt) return; deferredInstallPrompt.prompt(); await deferredInstallPrompt.userChoice; deferredInstallPrompt = null; $("#installBanner").classList.remove("show"); };
    $("#installDismiss").onclick = () => $("#installBanner").classList.remove("show");
    window.addEventListener("appinstalled", () => $("#installBanner").classList.remove("show"));

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => { navigator.serviceWorker.register("./sw.js").catch(() => {}); });
    }

    function init() {
      loadData();
      applySettings();
      updateNotificationUI();
      if (settings.notificationEnabled && "Notification" in window && Notification.permission === "granted") scheduleNotification();
      if (settings.notificationEnabled && "Notification" in window && Notification.permission === "default") {
        Notification.requestPermission().then(p => { if (p !== "granted") { settings.notificationEnabled = false; saveSettings(); updateNotificationUI(); } });
      }
      render();
      requestAnimationFrame(updateIndicator);
      lucide.createIcons();
    }

    init();
  </script>
</body>
</html>
