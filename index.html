  <style>
    :root {
      --bg: #f5f6f7;
      --surface: #ffffff;
      --surface-2: #f0f2f3;
      --surface-3: #e8ebed;

      --text: #111415;
      --muted: #747b80;
      --border: rgba(17, 20, 21, .09);

      --accent: #19a974;
      --accent-soft: rgba(25, 169, 116, .12);

      --danger: #e5484d;
      --warning: #e8a317;

      --shadow:
        0 10px 30px rgba(0, 0, 0, .06);

      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 14px;

      --header-height: 76px;
      --bottom-space: 120px;
    }

    html[data-theme="dark"] {
      --bg: #101111;
      --surface: #181a1a;
      --surface-2: #202222;
      --surface-3: #292c2c;

      --text: #f4f5f5;
      --muted: #939999;
      --border: rgba(255, 255, 255, .08);

      --shadow:
        0 14px 40px rgba(0, 0, 0, .30);
    }

    html[data-accent="blue"] {
      --accent: #3685ff;
      --accent-soft: rgba(54, 133, 255, .12);
    }

    html[data-accent="purple"] {
      --accent: #8b5cf6;
      --accent-soft: rgba(139, 92, 246, .12);
    }

    html[data-accent="orange"] {
      --accent: #f59e0b;
      --accent-soft: rgba(245, 158, 11, .13);
    }

    html[data-accent="pink"] {
      --accent: #e94f9b;
      --accent-soft: rgba(233, 79, 155, .12);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      min-height: 100%;
      background: var(--bg);
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

      transition:
        background .25s ease,
        color .25s ease;

      overscroll-behavior-y: none;
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      color: inherit;
    }

    textarea,
    input {
      outline: none;
    }

    ::selection {
      background: var(--accent);
      color: #fff;
    }

    /* =========================
       APP
    ========================= */

    .app {
      width: min(100%, 760px);
      min-height: 100vh;
      margin: 0 auto;
      padding:
        env(safe-area-inset-top)
        16px
        calc(var(--bottom-space) + env(safe-area-inset-bottom))
        16px;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      min-height: var(--header-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      position: sticky;
      top: 0;
      z-index: 20;

      background:
        linear-gradient(
          to bottom,
          var(--bg) 72%,
          rgba(0,0,0,0)
        );

      padding-top: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 14px;

      display: grid;
      place-items: center;

      background: var(--accent);
      color: #fff;

      font-size: 23px;
      font-weight: 800;

      box-shadow:
        0 7px 18px color-mix(
          in srgb,
          var(--accent) 24%,
          transparent
        );

      flex: 0 0 auto;
    }

    .brand-name {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -.4px;
    }

    .menu-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;

      background: var(--surface);
      border: 1px solid var(--border);

      display: grid;
      place-items: center;

      font-size: 24px;
      line-height: 1;

      transition:
        transform .15s ease,
        background .2s ease;
    }

    .menu-btn:active {
      transform: scale(.92);
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      padding: 20px 4px 12px;
    }

    .hero-title {
      margin: 0;
      font-size: clamp(27px, 7vw, 38px);
      line-height: 1.15;
      letter-spacing: -.9px;
      font-weight: 850;
    }

    .hero-date {
      margin-top: 7px;
      color: var(--muted);
      font-size: 14px;
    }

    /* =========================
       PROGRESS
    ========================= */

    .progress-wrap {
      margin-top: 22px;
      padding: 15px 16px;
      border-radius: var(--radius-lg);
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .progress-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;

      margin-bottom: 9px;
    }

    .progress-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }

    .progress-value {
      font-size: 13px;
      font-weight: 800;
      color: var(--accent);
    }

    .progress-track {
      height: 7px;
      background: var(--surface-3);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: var(--accent);
      transition: width .45s cubic-bezier(.2,.8,.2,1);
    }

    /* =========================
       CONTENT
    ========================= */

    .content {
      margin-top: 18px;
    }

    .section {
      margin-top: 26px;
    }

    .section:first-child {
      margin-top: 0;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;

      margin-bottom: 9px;
      padding: 0 4px;
    }

    .section-title {
      font-size: 13px;
      color: var(--muted);
      font-weight: 750;
    }

    .section-count {
      min-width: 24px;
      height: 24px;
      padding: 0 7px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border-radius: 999px;

      background: var(--surface-2);
      color: var(--muted);

      font-size: 11px;
      font-weight: 800;
    }

    /* =========================
       TASK
    ========================= */

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .task {
      position: relative;

      display: flex;
      align-items: center;
      gap: 12px;

      min-height: 62px;
      padding: 9px 12px;

      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);

      box-shadow: 0 4px 18px rgba(0,0,0,.025);

      transition:
        transform .18s ease,
        opacity .18s ease,
        background .2s ease,
        border-color .2s ease;
    }

    .task:hover {
      border-color:
        color-mix(
          in srgb,
          var(--accent) 22%,
          var(--border)
        );
    }

    .task.just-completed {
      animation: completePop .5s ease;
    }

    @keyframes completePop {
      0% {
        transform: scale(1);
      }

      45% {
        transform: scale(1.025);
      }

      100% {
        transform: scale(1);
      }
    }

    .task.completed {
      opacity: .65;
    }

    .task-checkbox {
      width: 27px;
      height: 27px;

      flex: 0 0 auto;

      border-radius: 50%;
      border: 2px solid var(--muted);

      background: transparent;

      display: grid;
      place-items: center;

      transition:
        background .2s ease,
        border-color .2s ease,
        transform .15s ease;
    }

    .task-checkbox:active {
      transform: scale(.88);
    }

    .task.completed .task-checkbox {
      background: var(--accent);
      border-color: var(--accent);
    }

    .check-icon {
      width: 13px;
      height: 13px;
      opacity: 0;
      transform: scale(.5);

      transition:
        opacity .18s ease,
        transform .18s ease;
    }

    .task.completed .check-icon {
      opacity: 1;
      transform: scale(1);
    }

    .task-main {
      min-width: 0;
      flex: 1;

      padding: 3px 0;
      cursor: pointer;
    }

    .task-text {
      margin: 0;

      font-size: 16px;
      line-height: 1.45;
      font-weight: 570;

      overflow-wrap: anywhere;
    }

    .task.completed .task-text {
      text-decoration: line-through;
      text-decoration-thickness: 1.5px;
      color: var(--muted);
    }

    .task-meta {
      margin-top: 3px;

      display: flex;
      align-items: center;
      gap: 5px;

      color: var(--muted);
      font-size: 11px;
    }

    .task-star {
      width: 34px;
      height: 34px;

      flex: 0 0 auto;

      border-radius: 50%;
      background: transparent;

      display: grid;
      place-items: center;

      color: var(--muted);
      font-size: 20px;

      transition:
        color .18s ease,
        background .18s ease,
        transform .15s ease;
    }

    .task-star:active {
      transform: scale(.86);
    }

    .task-star.active {
      color: var(--warning);
      background: rgba(232,163,23,.1);
    }

    .task-empty {
      padding: 42px 18px;
      text-align: center;

      border-radius: var(--radius-xl);
      background: var(--surface);
      border: 1px solid var(--border);

      color: var(--muted);
    }

    .empty-symbol {
      width: 52px;
      height: 52px;
      margin: 0 auto 13px;

      display: grid;
      place-items: center;

      border-radius: 18px;

      background: var(--accent-soft);
      color: var(--accent);

      font-size: 23px;
      font-weight: 800;
    }

    .empty-title {
      color: var(--text);
      font-size: 16px;
      font-weight: 750;
    }

    .empty-text {
      margin-top: 5px;
      font-size: 13px;
      line-height: 1.6;
    }

    /* =========================
       COMPOSER
    ========================= */

    .composer-wrap {
      position: fixed;
      z-index: 30;

      left: 50%;
      bottom: 0;

      width: min(760px, 100%);

      transform: translateX(-50%);

      padding:
        10px 16px
        calc(12px + env(safe-area-inset-bottom));

      pointer-events: none;
    }

    .composer {
      pointer-events: auto;

      display: flex;
      align-items: flex-end;
      gap: 9px;

      padding: 8px 8px 8px 9px;

      background:
        color-mix(
          in srgb,
          var(--surface) 94%,
          transparent
        );

      border: 1px solid var(--border);
      border-radius: 22px;

      box-shadow:
        0 12px 40px rgba(0,0,0,.13);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .composer textarea {
      flex: 1;
      min-width: 0;

      min-height: 45px;
      max-height: 130px;

      resize: none;
      overflow-y: auto;

      padding: 11px 12px 9px;

      border: 0;
      background: transparent;

      color: var(--text);

      font-size: 16px;
      line-height: 1.45;
    }

    .composer textarea::placeholder {
      color: var(--muted);
      opacity: .85;
    }

    .send-btn {
      width: 46px;
      height: 46px;

      flex: 0 0 auto;

      border-radius: 50%;

      background: var(--accent);
      color: #fff;

      display: grid;
      place-items: center;

      font-size: 22px;
      font-weight: 800;

      transition:
        transform .15s ease,
        opacity .2s ease;
    }

    .send-btn:active {
      transform: scale(.9);
    }

    .send-btn.disabled {
      opacity: .4;
    }

    /* =========================
       OVERLAY
    ========================= */

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 100;

      display: flex;
      align-items: flex-end;
      justify-content: center;

      padding: 16px;

      background: rgba(0,0,0,.42);

      opacity: 0;
      visibility: hidden;

      transition:
        opacity .22s ease,
        visibility .22s ease;
    }

    .overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .sheet {
      width: min(100%, 520px);
      max-height: min(82vh, 680px);

      overflow-y: auto;

      padding: 10px;

      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 27px;

      box-shadow:
        0 25px 70px rgba(0,0,0,.25);

      transform: translateY(20px);

      transition: transform .25s cubic-bezier(.2,.8,.2,1);
    }

    .overlay.show .sheet {
      transform: translateY(0);
    }

    .sheet-handle {
      width: 42px;
      height: 4px;
      margin: 3px auto 12px;

      border-radius: 99px;
      background: var(--surface-3);
    }

    .sheet-title {
      padding: 9px 10px 13px;

      font-size: 18px;
      font-weight: 800;
    }

    .sheet-subtitle {
      padding: 0 10px 12px;
      color: var(--muted);
      font-size: 13px;
    }

    /* =========================
       MENU
    ========================= */

    .menu-item {
      width: 100%;

      min-height: 54px;
      padding: 0 12px;

      display: flex;
      align-items: center;
      gap: 12px;

      border-radius: 15px;
      background: transparent;

      text-align: start;

      transition: background .15s ease;
    }

    .menu-item:hover,
    .menu-item:active {
      background: var(--surface-2);
    }

    .menu-icon {
      width: 35px;
      height: 35px;

      border-radius: 11px;

      display: grid;
      place-items: center;

      background: var(--surface-2);

      font-size: 16px;
    }

    .menu-text {
      flex: 1;
      font-weight: 650;
    }

    .menu-item.active .menu-text {
      color: var(--accent);
    }

    /* =========================
       ACTIONS
    ========================= */

    .action-task-preview {
      margin: 4px 4px 10px;
      padding: 13px;

      border-radius: 15px;
      background: var(--surface-2);

      font-size: 14px;
      line-height: 1.5;
    }

    .action-item {
      width: 100%;

      min-height: 53px;
      padding: 0 12px;

      display: flex;
      align-items: center;
      gap: 12px;

      border-radius: 15px;
      background: transparent;

      text-align: start;
    }

    .action-item:hover {
      background: var(--surface-2);
    }

    .action-item.danger {
      color: var(--danger);
    }

    /* =========================
       MODAL / INPUT
    ========================= */

    .edit-input {
      width: 100%;

      min-height: 120px;

      padding: 14px;

      border-radius: 17px;
      border: 1px solid var(--border);

      background: var(--surface-2);
      color: var(--text);

      resize: vertical;

      font-size: 16px;
      line-height: 1.6;
    }

    .edit-input:focus {
      border-color: var(--accent);
    }

    .modal-actions {
      display: flex;
      gap: 8px;

      margin-top: 10px;
    }

    .modal-btn {
      flex: 1;
      min-height: 48px;

      border-radius: 15px;

      font-weight: 750;
    }

    .modal-btn.primary {
      background: var(--accent);
      color: #fff;
    }

    .modal-btn.secondary {
      background: var(--surface-2);
    }

    /* =========================
       SETTINGS
    ========================= */

    .setting-group {
      margin-bottom: 17px;
    }

    .setting-label {
      padding: 0 9px 8px;

      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }

    .setting-box {
      overflow: hidden;

      border: 1px solid var(--border);
      border-radius: 17px;

      background: var(--surface-2);
    }

    .setting-row {
      min-height: 53px;
      padding: 0 12px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;

      border-bottom: 1px solid var(--border);
    }

    .setting-row:last-child {
      border-bottom: 0;
    }

    .setting-name {
      font-size: 14px;
      font-weight: 650;
    }

    .segmented {
      display: flex;
      gap: 3px;

      padding: 3px;

      border-radius: 11px;
      background: var(--surface);
    }

    .segment {
      min-height: 32px;
      padding: 0 10px;

      border-radius: 9px;

      background: transparent;

      color: var(--muted);
      font-size: 12px;
      font-weight: 700;

      transition:
        background .18s ease,
        color .18s ease,
        transform .12s ease;
    }

    .segment:active {
      transform: scale(.96);
    }

    .segment.active {
      background: var(--accent);
      color: #fff;
    }

    .colors {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .color-btn {
      width: 28px;
      height: 28px;

      border-radius: 50%;

      border: 3px solid var(--surface-2);

      outline: 1px solid var(--border);

      position: relative;
    }

    .color-btn.active::after {
      content: "✓";

      position: absolute;
      inset: 0;

      display: grid;
      place-items: center;

      color: #fff;

      font-size: 13px;
      font-weight: 900;
    }

    .green { background: #19a974; }
    .blue { background: #3685ff; }
    .purple { background: #8b5cf6; }
    .orange { background: #f59e0b; }
    .pink { background: #e94f9b; }

    /* =========================
       TRASH
    ========================= */

    .trash-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .trash-item {
      padding: 13px;

      border-radius: 15px;
      background: var(--surface-2);

      display: flex;
      align-items: center;
      gap: 9px;
    }

    .trash-text {
      flex: 1;

      min-width: 0;

      font-size: 14px;
      line-height: 1.45;

      overflow-wrap: anywhere;
    }

    .small-btn {
      min-height: 36px;
      padding: 0 10px;

      border-radius: 10px;

      background: var(--surface);
      font-size: 11px;
      font-weight: 750;
    }

    .small-btn.danger {
      color: var(--danger);
    }

    /* =========================
       TOAST
    ========================= */

    .toast {
      position: fixed;
      z-index: 200;

      left: 50%;
      bottom:
        calc(92px + env(safe-area-inset-bottom));

      width: min(
        calc(100% - 32px),
        440px
      );

      transform:
        translate(-50%, 20px)
        scale(.96);

      opacity: 0;
      visibility: hidden;

      padding: 12px 14px;

      display: flex;
      align-items: center;
      gap: 10px;

      border-radius: 15px;

      background: var(--surface);
      border: 1px solid var(--border);

      box-shadow: var(--shadow);

      transition:
        opacity .2s ease,
        transform .2s ease,
        visibility .2s ease;
    }

    .toast.show {
      opacity: 1;
      visibility: visible;

      transform:
        translate(-50%, 0)
        scale(1);
    }

    .toast-message {
      flex: 1;
      font-size: 13px;
      font-weight: 650;
    }

    .toast-undo {
      padding: 7px 10px;

      border-radius: 9px;

      background: var(--accent-soft);
      color: var(--accent);

      font-size: 12px;
      font-weight: 800;
    }

    /* =========================
       INSTALL BANNER
    ========================= */

    .install-banner {
      position: fixed;
      z-index: 180;
      left: 50%;
      bottom: calc(14px + env(safe-area-inset-bottom));
      width: min(calc(100% - 28px), 560px);
      transform: translate(-50%, 22px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: color-mix(in srgb, var(--surface) 96%, transparent);
      border: 1px solid var(--border);
      border-radius: 19px;
      box-shadow: 0 18px 55px rgba(0,0,0,.22);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      transition: opacity .22s ease, transform .22s ease, visibility .22s ease;
    }

    .install-banner.show {
      transform: translate(-50%, 0);
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .install-icon {
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: var(--accent);
      color: #fff;
      font-size: 21px;
      font-weight: 850;
    }

    .install-copy {
      min-width: 0;
      flex: 1;
    }

    .install-title {
      font-size: 14px;
      font-weight: 800;
    }

    .install-text {
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
    }

    .install-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
    }

    .install-btn {
      min-height: 38px;
      padding: 0 11px;
      border-radius: 11px;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .install-btn.primary {
      background: var(--accent);
      color: #fff;
    }

    .install-btn.secondary {
      background: var(--surface-2);

    };


    function t(key, vars = {}) {

      const language =
        settings &&
        settings.language === "en"
          ? "en"
          : "ar";

      const dict =
        TRANSLATIONS[language];

      let value =
        dict[key] ??
        TRANSLATIONS.ar[key] ??
        key;

      Object.entries(vars).forEach(
        ([keyName, valueToReplace]) => {

          value =
            value.replaceAll(
              `{${keyName}}`,
              String(valueToReplace)
            );

        }
      );

      return value;
    }


    /*
      تطبيق اللغة بالكامل:
      - lang
      - dir
      - النصوص
      - placeholders
      - aria labels
      - مؤشر اللغة النشط
    */

    function applyLanguage() {

      const lang =
        settings.language === "en"
          ? "en"
          : "ar";

      document.documentElement.lang =
        lang;

      document.documentElement.dir =
        lang === "ar"
          ? "rtl"
          : "ltr";


      document.documentElement
        .setAttribute(
          "data-language",
          lang
        );


      $$("[data-i18n]")
        .forEach(element => {

          element.textContent =
            t(element.dataset.i18n);

        });


      $$("[data-i18n-placeholder]")
        .forEach(element => {

          element.placeholder =
            t(
              element.dataset.i18nPlaceholder
            );

        });


      $$("[data-i18n-aria]")
        .forEach(element => {

          element.setAttribute(
            "aria-label",
            t(element.dataset.i18nAria)
          );

        });


      $$("[data-language-choice]")
        .forEach(button => {

          const active =
            button.dataset.languageChoice ===
            lang;

          button.classList.toggle(
            "active",
            active
          );

          button.setAttribute(
            "aria-pressed",
            active
          );

        });


      updateDynamicLanguageText();

    }


    function updateDynamicLanguageText() {

      /*
        نص زر إجراء المهمة
      */

      if (selectedTaskId) {

        const task =
          tasks.find(
            item =>
              item.id === selectedTaskId
          );

        if (task) {

          const label =
            task.completed
              ? t("cancelDone")
              : t("done");

          const actionButton =
            $("#actionComplete");

          if (actionButton) {

            const text =
              actionButton.querySelector(
                "span:last-child"
              );

            if (text) {
              text.textContent = label;
            }

          }

        }

      }


      /*
        النص الخاص بالتقدم
      */

      if (typeof updateProgress === "function") {
        updateProgress();
      }


      /*
        زر الحذف النهائي في السلة
      */

      $$(".trash-delete-button")
        .forEach(button => {

          button.textContent =
            t("delete");

        });


      /*
        Accessibility للـ install banner
      */

      if (installTitle) {

        if (deferredInstallPrompt) {

          installTitle.textContent =
            t("installTitle");

          installText.textContent =
            t("installText");

        } else {

          installTitle.textContent =
            t("installGuideTitle");

          installText.textContent =
            t("installGuideText");

        }

        installAction.textContent =
          t("install");

        installDismiss.textContent =
          t("continue");

      }

    }


    /* =========================
       DEFAULT SETTINGS
    ========================= */

    const DEFAULT_SETTINGS = {
      theme: "dark",
      accent: "green",
      language: "ar"
    };


    /* =========================
       STATE
    ========================= */

    let tasks = [];
    let trash = [];

    let settings = {
      ...DEFAULT_SETTINGS
    };

    let currentView = "today";
    let selectedTaskId = null;

    let undoTimer = null;
    let undoAction = null;

    let typingAudioContext = null;
    let lastTypingSound = 0;

    let lastKnownDay = null;


    /* =========================
       DOM
    ========================= */

    const $ = selector =>
      document.querySelector(selector);

    const $$ = selector =>
      [...document.querySelectorAll(selector)];


    const content = $("#content");

    const taskInput = $("#taskInput");
    const sendBtn = $("#sendBtn");

    const heroDate = $("#heroDate");
    const heroTitle = $("#heroTitle");

    const progressBar = $("#progressBar");
    const progressValue = $("#progressValue");
    const progressLabel = $("#progressLabel");

    const menuOverlay = $("#menuOverlay");
    const actionOverlay = $("#actionOverlay");
    const editOverlay = $("#editOverlay");
    const settingsOverlay = $("#settingsOverlay");
    const trashOverlay = $("#trashOverlay");

    const actionTaskPreview =
      $("#actionTaskPreview");

    const editInput =
      $("#editInput");

    const trashList =
      $("#trashList");

    const trashCount =
      $("#trashCount");

    const toast =
      $("#toast");

    const toastMessage =
      $("#toastMessage");

    const toastUndo =
      $("#toastUndo");


    /* =========================
       INSTALL DOM
    ========================= */

    let deferredInstallPrompt = null;
    let installBannerDismissed = false;

    const installBanner =
      $("#installBanner");

    const installTitle =
      $("#installTitle");

    const installText =
      $("#installText");

    const installAction =
      $("#installAction");

    const installDismiss =
      $("#installDismiss");


    /* =========================
       DATE
    ========================= */

    function pad(number) {
      return String(number)
        .padStart(2, "0");
    }


    function getDateKey(
      date = new Date()
    ) {

      return [
        date.getFullYear(),
        pad(date.getMonth() + 1),
        pad(date.getDate())
      ].join("-");

    }


    function formatDate(
      date = new Date()
    ) {

      return new Intl.DateTimeFormat(
        settings.language === "en"
          ? "en-US"
          : "ar-EG",
        {
          weekday: "long",
          day: "numeric",
          month: "long"
        }
      ).format(date);

    }


    function getRelativeDayText(task) {

      if (!task.taskDay) {
        return "";
      }

      const today =
        getDateKey();

      if (task.taskDay === today) {
        return t("today");
      }

      const taskDate =
        new Date(
          `${task.taskDay}T12:00:00`
        );

      const currentDate =
        new Date();

      currentDate.setHours(
        12,
        0,
        0,
        0
      );

      const diff =
        Math.round(
          (currentDate - taskDate) /
          86400000
        );

      if (diff === 1) {
        return t("yesterday");
      }

      if (diff > 1 && diff < 7) {
        return t(
          "daysAgo",
          { n: diff }
        );
      }

      return new Intl.DateTimeFormat(
        settings.language === "en"
          ? "en-US"
          : "ar-EG",
        {
          day: "numeric",
          month: "short"
        }
      ).format(taskDate);

    }


    /* =========================
       NORMALIZE
    ========================= */

    function normalizeTask(task) {

      if (
        !task ||
        typeof task !== "object"
      ) {
        return null;
      }

      const createdAt =
        Number(task.createdAt) ||
        Date.now();

      return {

        id:
          String(
            task.id ||
            createId()
          ),

        text:
          String(
            task.text || ""
          ).trim(),

        completed:
          Boolean(task.completed),

        starred:
          Boolean(task.starred),

        createdAt,

        taskDay:
          task.taskDay ||
          getDateKey(
            new Date(createdAt)
          ),

        completedAt:
          task.completedAt
            ? Number(task.completedAt)
            : null

      };

    }


    function createId() {

      return (
        Date.now().toString(36) +
        Math.random()
          .toString(36)
          .slice(2, 9)
      );

    }


    /* =========================
       STORAGE
    ========================= */

    function safeParse(
      value,
      fallback
    ) {

      try {

        const parsed =
          JSON.parse(value);

        return parsed ?? fallback;

      } catch {

        return fallback;

      }

    }


    function loadData() {

      const savedTasks =
        safeParse(
          localStorage.getItem(
            STORAGE_KEYS.tasks
          ),
          []
        );

      const savedTrash =
        safeParse(
          localStorage.getItem(
            STORAGE_KEYS.trash
          ),
          []
        );

      const savedSettings =
        safeParse(
          localStorage.getItem(
            STORAGE_KEYS.settings
          ),
          {}
        );


      tasks =
        Array.isArray(savedTasks)
          ? savedTasks
              .map(normalizeTask)
              .filter(Boolean)
              .filter(
                task => task.text
              )
          : [];


      trash =
        Array.isArray(savedTrash)
          ? savedTrash
              .map(normalizeTask)
              .filter(Boolean)
              .filter(
                task => task.text
              )
          : [];


      settings = {
        ...DEFAULT_SETTINGS,
        ...(savedSettings || {})
      };


      if (
        !["dark", "light"]
          .includes(settings.theme)
      ) {

        settings.theme =
          "dark";

      }


      if (
        ![
          "green",
          "blue",
          "purple",
          "orange",
          "pink"
        ].includes(settings.accent)
      ) {

        settings.accent =
          "green";

      }


      if (
        !["ar", "en"]
          .includes(settings.language)
      ) {

        settings.language =
          "ar";

      }

    }


    function saveTasks() {

      localStorage.setItem(
        STORAGE_KEYS.tasks,
        JSON.stringify(tasks)
      );

    }


    function saveTrash() {

      localStorage.setItem(
        STORAGE_KEYS.trash,
        JSON.stringify(trash)
      );

    }


    function saveSettings() {

      localStorage.setItem(
        STORAGE_KEYS.settings,
        JSON.stringify(settings)
      );

    }


    /* =========================
       SETTINGS
    ========================= */

    function applySettings() {

      document.documentElement
        .setAttribute(
          "data-theme",
          settings.theme
        );

      document.documentElement
        .setAttribute(
          "data-accent",
          settings.accent
        );


      $$("[data-theme-choice]")
        .forEach(button => {

          const active =
            button.dataset.themeChoice ===
            settings.theme;

          button.classList.toggle(
            "active",
            active
          );

          button.setAttribute(
            "aria-pressed",
            active
          );

        });


      $$("[data-accent-choice]")
        .forEach(button => {

          const active =
            button.dataset.accentChoice ===
            settings.accent;

          button.classList.toggle(
            "active",
            active
          );

        });


      applyLanguage();

    }


    /* =========================
       ADD TASK
       Keep function name: addTask
    ========================= */

    function addTask(text) {

      const cleanText =
        String(text || "")
          .trim();

      if (!cleanText) {
        return false;
      }


      const task = {

        id: createId(),

        text: cleanText,

        completed: false,

        starred: false,

        createdAt: Date.now(),

        taskDay:
          getDateKey(),

        completedAt: null

      };


      tasks.unshift(task);

      saveTasks();

      currentView = "today";

      render();

      playAddSound();

      return true;

    }


    /* =========================
       COMPLETE
    ========================= */

    function completeTask(id) {

      const task =
        tasks.find(
          item => item.id === id
        );

      if (!task) {
        return;
      }


      task.completed =
        !task.completed;


      task.completedAt =
        task.completed
          ? Date.now()
          : null;


      saveTasks();

      render();


      if (task.completed) {

        playCompleteSound();

        requestAnimationFrame(() => {

          const element =
            document.querySelector(
              `[data-task-id="${CSS.escape(task.id)}"]`
            );

          if (element) {

            element.classList.add(
              "just-completed"
            );

            setTimeout(() => {

              element.classList.remove(
                "just-completed"
              );

            }, 550);

          }

        });

      }

    }


    /* =========================
       STAR
    ========================= */

    function toggleStar(id) {

      const task =
        tasks.find(
          item => item.id === id
        );

      if (!task) {
        return;
      }

      task.starred =
        !task.starred;

      saveTasks();

      render();

    }


    /* =========================
       DELETE
    ========================= */

    function deleteTask(id) {

      const index =
        tasks.findIndex(
          item => item.id === id
        );

      if (index === -1) {
        return;
      }


      const [deleted] =
        tasks.splice(
          index,
          1
        );


      trash.unshift({
        ...deleted,
        deletedAt: Date.now()
      });


      saveTasks();
      saveTrash();

      render();


      showToast(
        t("deleted"),
        true,
        () => {

          const trashIndex =
            trash.findIndex(
              item =>
                item.id === deleted.id
            );

          if (trashIndex !== -1) {

            trash.splice(
              trashIndex,
              1
            );

          }

          tasks.unshift(deleted);

          saveTasks();
          saveTrash();

          render();

        }
      );

    }


    /* =========================
       EDIT
    ========================= */

    function openEdit(id) {

      const task =
        tasks.find(
          item => item.id === id
        );

      if (!task) {
        return;
      }

      selectedTaskId = id;

      editInput.value =
        task.text;

      closeOverlay(
        actionOverlay
      );

      openOverlay(
        editOverlay
      );


      setTimeout(() => {

        editInput.focus();

        editInput.setSelectionRange(
          editInput.value.length,
          editInput.value.length
        );

      }, 100);

    }


    function saveEdit() {

      if (!selectedTaskId) {
        return;
      }


      const text =
        editInput.value.trim();

      if (!text) {

        showToast(
          t("writeFirst")
        );

        return;
      }


      const task =
        tasks.find(
          item =>
            item.id ===
            selectedTaskId
        );


      if (!task) {
        return;
      }


      task.text =
        text;

      saveTasks();

      closeOverlay(
        editOverlay
      );

      render();

      showToast(
        t("edited")
      );

      selectedTaskId =
        null;

    }


    /* =========================
       TRASH
    ========================= */

    function restoreTask(id) {

      const index =
        trash.findIndex(
          item =>
            item.id === id
        );

      if (index === -1) {
        return;
      }


      const [task] =
        trash.splice(
          index,
          1
        );


      delete task.deletedAt;

      tasks.unshift(task);

      saveTasks();
      saveTrash();

      renderTrash();

      showToast(
        t("restored")
      );

    }


    function deleteForever(id) {

      trash =
        trash.filter(
          item =>
            item.id !== id
        );

      saveTrash();

      renderTrash();

      showToast(
        t("deletedForever")
      );

    }


    /* =========================
       VIEWS
    ========================= */

    function setView(view) {

      currentView =
        view;

      closeAllOverlays();

      render();

    }


    function getTodayTasks() {

      const today =
        getDateKey();

      return tasks.filter(
        task =>
          task.taskDay === today
      );

    }


    function getPreviousActiveTasks() {

      const today =
        getDateKey();

      return tasks.filter(
        task =>
          task.taskDay !== today &&
          !task.completed
      );

    }


    function getCompletedToday() {

      const today =
        getDateKey();

      return tasks.filter(
        task =>
          task.completed &&
          task.completedAt &&
          getDateKey(
            new Date(
              task.completedAt
            )
          ) === today
      );

    }


    function getAllActive() {

      return tasks.filter(
        task =>
          !task.completed
      );

    }


    function getAllCompleted() {

      return tasks.filter(
        task =>
          task.completed
      );

    }


    /* =========================
       RENDER
    ========================= */

    function render() {

      heroDate.textContent =
        formatDate();

      updateHero();

      updateProgress();

      content.innerHTML = "";


      if (
        currentView === "today"
      ) {

        renderToday();

      } else if (
        currentView === "all"
      ) {

        renderAll();

      } else if (
        currentView === "completed"
      ) {

        renderCompleted();

      }


      updateMenuState();

      updateDynamicLanguageText();

    }


    function updateHero() {

      const titles = {

        today:
          t("heroToday"),

        all:
          t("all"),

        completed:
          t("completed")

      };


      heroTitle.textContent =
        titles[currentView] ||
        titles.today;

    }


    /* =========================
       TODAY
    ========================= */

    function renderToday() {

      const today =
        getTodayTasks();

      const previous =
        getPreviousActiveTasks();

      const completed =
        getCompletedToday();


      if (
        today.length === 0 &&
        previous.length === 0 &&
        completed.length === 0
      ) {

        content.appendChild(
          createEmptyState(
            "ن",
            t("noIntentions"),
            t("firstIntent")
          )
        );

        return;
      }


      if (today.length > 0) {

        content.appendChild(
          createSection(
            t("today"),
            today
          )
        );

      }


      if (previous.length > 0) {

        content.appendChild(
          createSection(
            t("previousDays"),
            previous,
            true
          )
        );

      }


      if (completed.length > 0) {

        content.appendChild(
          createSection(
            t("doneToday"),
            completed,
            false,
            true
          )
        );

      }

    }


    /* =========================
       ALL
    ========================= */

    function renderAll() {

      const active =
        getAllActive();

      const completed =
        getAllCompleted();


      if (
        active.length === 0 &&
        completed.length === 0
      ) {

        content.appendChild(
          createEmptyState(
            "✓",
            t("noIntentionsAll"),
            t("everyThingStarts")
          )
        );

        return;
      }


      if (active.length > 0) {

        content.appendChild(
          createSection(
            t("currentIntentions"),
            active
          )
        );

      }


      if (completed.length > 0) {

        content.appendChild(
          createSection(
            t("completed"),
            completed
          )
        );

      }

    }


    /* =========================
       COMPLETED
    ========================= */

    function renderCompleted() {

      const completed =
        getAllCompleted();


      if (
        completed.length === 0
      ) {

        content.appendChild(
          createEmptyState(
            "✓",
            t("noAchievements"),
            t("achievementHint")
          )
        );

        return;
      }


      content.appendChild(
        createSection(
          t("allDoneSection"),
          completed
        )
      );

    }


    /* =========================
       SECTION
    ========================= */

    function createSection(
      title,
      taskArray,
      showMeta = false,
      completedSection = false
    ) {

      const section =
        document.createElement(
          "section"
        );

      section.className =
        "section";


      const head =
        document.createElement(
          "div"
        );

      head.className =
        "section-head";


      const titleEl =
        document.createElement(
          "div"
        );

      titleEl.className =
        "section-title";

      titleEl.textContent =
        title;


      const count =
        document.createElement(
          "span"
        );

      count.className =
        "section-count";

      count.textContent =
        taskArray.length;


      head.append(
        titleEl,
        count
      );


      const list =
        document.createElement(
          "div"
        );

      list.className =
        "task-list";


      taskArray.forEach(
        task => {

          list.appendChild(
            createTaskElement(
              task,
              showMeta,
              completedSection
            )
          );

        }
      );


      section.append(
        head,
        list
      );


      return section;

    }


    /* =========================
       TASK ELEMENT
    ========================= */

    function createTaskElement(
      task,
      showMeta = false,
      completedSection = false
    ) {

      const article =
        document.createElement(
          "article"
        );

      article.className =
        "task" +
        (
          task.completed
            ? " completed"
            : ""
        );

      article.dataset.taskId =
        task.id;


      const checkbox =
        document.createElement(
          "button"
        );

      checkbox.type =
        "button";

      checkbox.className =
        "task-checkbox";


      checkbox.setAttribute(
        "aria-label",
        task.completed
          ? t("cancelDone")
          : t("done")
      );


      checkbox.innerHTML = `
        <svg
          class="check-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="white"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M5 12.5l4 4L19 7"></path>
        </svg>
      `;


      checkbox.addEventListener(
        "click",
        event => {

          event.stopPropagation();

          completeTask(
            task.id
          );

        }
      );


      const main =
        document.createElement(
          "div"
        );

      main.className =
        "task-main";


      const text =
        document.createElement(
          "p"
        );

      text.className =
        "task-text";

      text.textContent =
        task.text;


      main.appendChild(text);


      if (
        showMeta ||
        task.taskDay !==
        getDateKey()
      ) {

        const meta =
          document.createElement(
            "div"
          );

        meta.className =
          "task-meta";

        meta.textContent =
          getRelativeDayText(task);

        main.appendChild(meta);

      }


      main.addEventListener(
        "click",
        () =>
          openAction(task.id)
      );


      const star =
        document.createElement(
          "button"
        );

      star.type =
        "button";

      star.className =
        "task-star" +
        (
          task.starred
            ? " active"
            : ""
        );

      star.innerHTML =
        task.starred
          ? "★"
          : "☆";


      star.setAttribute(
        "aria-label",
        task.starred
          ? (
              settings.language === "en"
                ? "Remove favorite"
                : "إزالة المفضلة"
            )
          : (
              settings.language === "en"
                ? "Favorite"
                : "تمييز"
            )
      );


      star.addEventListener(
        "click",
        event => {

          event.stopPropagation();

          toggleStar(
            task.id
          );

        }
      );


      article.append(
        checkbox,
        main,
        star
      );


      let pressTimer =
        null;


      article.addEventListener(
        "pointerdown",
        event => {

          if (
            event.target.closest(
              "button"
            )
          ) {
            return;
          }


          pressTimer =
            setTimeout(
              () => {

                openAction(
                  task.id
                );

              },
              550
            );

        }
      );


      [
        "pointerup",
        "pointercancel",
        "pointerleave"
      ].forEach(
        type => {

          article.addEventListener(
            type,
            () => {

              clearTimeout(
                pressTimer
              );

            }
          );

        }
      );


      return article;

    }


    /* =========================
       EMPTY
    ========================= */

    function createEmptyState(
      symbol,
      title,
      message
    ) {

      const box =
        document.createElement(
          "div"
        );

      box.className =
        "task-empty";


      box.innerHTML = `
        <div class="empty-symbol">
          ${escapeHtml(symbol)}
        </div>

        <div class="empty-title">
          ${escapeHtml(title)}
        </div>

        <div class="empty-text">
          ${escapeHtml(message)}
        </div>
      `;


      return box;

    }


    /* =========================
       PROGRESS
    ========================= */

    function updateProgress() {

      const today =
        getTodayTasks();

      const total =
        today.length;

      const completed =
        today.filter(
          task =>
            task.completed
        ).length;


      let percentage =
        0;


      if (total > 0) {

        percentage =
          Math.round(
            (completed / total) *
            100
          );

      }


      progressBar.style.width =
        `${percentage}%`;

      progressValue.textContent =
        `${percentage}%`;


      if (total === 0) {

        progressLabel.textContent =
          t("startFirst");

      } else if (
        percentage === 100
      ) {

        progressLabel.textContent =
          t("allDone");

      } else {

        progressLabel.textContent =
          t("progressToday");

      }

    }


    /* =========================
       MENU
    ========================= */

    function updateMenuState() {

      $$("[data-view]")
        .forEach(button => {

          button.classList.toggle(
            "active",
            button.dataset.view ===
            currentView
          );

        });

    }


    /* =========================
       ACTION SHEET
    ========================= */

    function openAction(id) {

      const task =
        tasks.find(
          item =>
            item.id === id
        );

      if (!task) {
        return;
      }


      selectedTaskId =
        id;

      actionTaskPreview.textContent =
        task.text;


      const actionButton =
        $("#actionComplete");


      actionButton
        .querySelector(
          "span:last-child"
        )
        .textContent =
          task.completed
            ? t("cancelDone")
            : t("done");


      openOverlay(
        actionOverlay
      );

    }


    $("#actionComplete")
      .addEventListener(
        "click",
        () => {

          if (!selectedTaskId) {
            return;
          }

          completeTask(
            selectedTaskId
          );

          closeOverlay(
            actionOverlay
          );

          selectedTaskId =
            null;

        }
      );


    $("#actionEdit")
      .addEventListener(
        "click",
        () => {

          if (!selectedTaskId) {
            return;
          }

          openEdit(
            selectedTaskId
          );

        }
      );


    $("#actionDelete")
      .addEventListener(
        "click",
        () => {

          if (!selectedTaskId) {
            return;
          }

          const id =
            selectedTaskId;

          closeOverlay(
            actionOverlay
          );

          selectedTaskId =
            null;

          deleteTask(id);

        }
      );


    /* =========================
       OVERLAYS
    ========================= */

    function openOverlay(
      overlay
    ) {

      overlay.classList.add(
        "show"
      );

      overlay.setAttribute(
        "aria-hidden",
        "false"
      );

      document.body.classList.add(
        "no-scroll"
      );

    }


    function closeOverlay(
      overlay
    ) {

      overlay.classList.remove(
        "show"
      );

      overlay.setAttribute(
        "aria-hidden",
        "true"
      );


      if (
        !document.querySelector(
          ".overlay.show"
        )
      ) {

        document.body.classList.remove(
          "no-scroll"
        );

      }

    }


    function closeAllOverlays() {

      $$(".overlay.show")
        .forEach(
          closeOverlay
        );

      selectedTaskId =
        null;

    }


    $$(".overlay")
      .forEach(
        overlay => {

          overlay.addEventListener(
            "click",
            event => {

              if (
                event.target ===
                overlay
              ) {

                closeOverlay(
                  overlay
                );

              }

            }
          );

        }
      );


    /* =========================
       MENU
    ========================= */

    $("#menuBtn")
      .addEventListener(
        "click",
        () => {

          openOverlay(
            menuOverlay
          );

        }
      );


    $$("[data-view]")
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              setView(
                button.dataset.view
              );

            }
          );

        }
      );


    $("#settingsBtn")
      .addEventListener(
        "click",
        () => {

          closeOverlay(
            menuOverlay
          );

          renderSettings();

          openOverlay(
            settingsOverlay
          );

        }
      );


    /* =========================
       THEME
    ========================= */

    $$("[data-theme-choice]")
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              settings.theme =
                button.dataset.themeChoice;

              saveSettings();

              applySettings();

            }
          );

        }
      );


    /* =========================
       ACCENT
    ========================= */

    $$("[data-accent-choice]")
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              settings.accent =
                button.dataset.accentChoice;

              saveSettings();

              applySettings();

            }
          );

        }
      );


    /* =========================
       LANGUAGE
    ========================= */

    $$("[data-language-choice]")
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              const newLanguage =
                button.dataset.languageChoice === "en"
                  ? "en"
                  : "ar";


              if (
                settings.language ===
                newLanguage
              ) {

                applyLanguage();

                return;

              }


              settings.language =
                newLanguage;


              saveSettings();


              /*
                التغيير الفوري:
                RTL <-> LTR
              */

              applyLanguage();


              /*
                إعادة رسم كل المحتوى
                باللغة الجديدة.
              */

              render();


              /*
                تحديث حالة زر اللغة
                بعد إعادة الرسم.
              */

              applyLanguage();

              renderSettings();

              renderTrash();

            }
          );

        }
      );


    function renderSettings() {

      trashCount.textContent =
        trash.length;

      applySettings();

    }


    $("#trashBtn")
      .addEventListener(
        "click",
        () => {

          renderTrash();

          closeOverlay(
            settingsOverlay
          );

          openOverlay(
            trashOverlay
          );

        }
      );


    /* =========================
       TRASH RENDER
    ========================= */

    function renderTrash() {

      trashCount.textContent =
        trash.length;

      trashList.innerHTML =
        "";


      if (
        trash.length === 0
      ) {

        trashList.appendChild(
          createEmptyState(
            "⌫",
            t("trashEmpty"),
            t("noDeleted")
          )
        );

        return;

      }


      trash.forEach(
        task => {

          const item =
            document.createElement(
              "div"
            );

          item.className =
            "trash-item";


          const text =
            document.createElement(
              "div"
            );

          text.className =
            "trash-text";

          text.textContent =
            task.text;


          const restore =
            document.createElement(
              "button"
            );

          restore.type =
            "button";

          restore.className =
            "small-btn";

          restore.textContent =
            t("restore");


          restore.addEventListener(
            "click",
            () => {

              restoreTask(
                task.id
              );

            }
          );


          const forever =
            document.createElement(
              "button"
            );

          forever.type =
            "button";

          forever.className =
            "small-btn danger trash-delete-button";

          forever.textContent =
            t("delete");


          forever.addEventListener(
            "click",
            () => {

              deleteForever(
                task.id
              );

            }
          );


          item.append(
            text,
            restore,
            forever
          );


          trashList.appendChild(
            item
          );

        }
      );

    }


    /* =========================
       EDIT
    ========================= */

    $("#editSave")
      .addEventListener(
        "click",
        saveEdit
      );


    $("#editCancel")
      .addEventListener(
        "click",
        () => {

          closeOverlay(
            editOverlay
          );

          selectedTaskId =
            null;

        }
      );


    editInput
      .addEventListener(
        "keydown",
        event => {

          if (
            event.key === "Enter" &&
            !event.shiftKey
          ) {

            event.preventDefault();

            saveEdit();

          }

        }
      );


    /* =========================
       COMPOSER
    ========================= */

    function updateComposer() {

      const hasText =
        taskInput.value
          .trim()
          .length > 0;


      sendBtn.classList.toggle(
        "disabled",
        !hasText
      );

    }


    taskInput
      .addEventListener(
        "input",
        () => {

          autoResizeTextarea();

          updateComposer();

          playTypingSound();

        }
      );


    taskInput
      .addEventListener(
        "keydown",
        event => {

          if (
            event.key === "Enter" &&
            !event.shiftKey
          ) {

            event.preventDefault();

            document
              .getElementById(
                "composer"
              )
              .requestSubmit();

          }

        }
      );


    $("#composer")
      .addEventListener(
        "submit",
        event => {

          event.preventDefault();


          const text =
            taskInput.value.trim();


          if (!text) {
            return;
          }


          if (
            addTask(text)
          ) {

            taskInput.value =
              "";

            autoResizeTextarea();

            updateComposer();

            taskInput.focus();

          }

        }
      );


    function autoResizeTextarea() {

      taskInput.style.height =
        "auto";

      taskInput.style.height =
        Math.min(
          taskInput.scrollHeight,
          130
        ) + "px";

    }


    /* =========================
       TOAST
    ========================= */

    function showToast(
      message,
      canUndo = false,
      undoCallback = null
    ) {

      clearTimeout(
        undoTimer
      );


      undoAction =
        canUndo
          ? undoCallback
          : null;


      toastMessage.textContent =
        message;


      toastUndo.classList.toggle(
        "hidden",
        !canUndo
      );


      toast.classList.add(
        "show"
      );


      undoTimer =
        setTimeout(
          hideToast,
          4500
        );

    }


    function hideToast() {

      toast.classList.remove(
        "show"
      );

      undoAction =
        null;

    }


    toastUndo
      .addEventListener(
        "click",
        () => {

          if (
            typeof undoAction ===
            "function"
          ) {

            undoAction();

          }

          hideToast();

        }
      );


    /* =========================
       SOUND
    ========================= */

    function getAudioContext() {

      if (
        !typingAudioContext
      ) {

        const AudioContext =
          window.AudioContext ||
          window.webkitAudioContext;

        if (!AudioContext) {
          return null;
        }

        typingAudioContext =
          new AudioContext();

      }


      if (
        typingAudioContext.state ===
        "suspended"
      ) {

        typingAudioContext
          .resume()
          .catch(() => {});

      }


      return typingAudioContext;

    }


    function playTone(
      frequency,
      duration,
      volume,
      type = "sine"
    ) {

      const ctx =
        getAudioContext();

      if (!ctx) {
        return;
      }


      try {

        const oscillator =
          ctx.createOscillator();

        const gain =
          ctx.createGain();


        oscillator.type =
          type;

        oscillator.frequency.value =
          frequency;


        gain.gain.setValueAtTime(
          0.0001,
          ctx.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
          Math.max(
            volume,
            0.0002
          ),
          ctx.currentTime + .008
        );


        gain.gain.exponentialRampToValueAtTime(
          0.0001,
          ctx.currentTime + duration
        );


        oscillator.connect(gain);

        gain.connect(
          ctx.destination
        );


        oscillator.start();

        oscillator.stop(
          ctx.currentTime +
          duration +
          .01
        );

      } catch {
        /* Audio should never break the app. */
      }

    }


    function playTypingSound() {

      const now =
        performance.now();


      if (
        now - lastTypingSound <
        55
      ) {
        return;
      }


      lastTypingSound =
        now;


      const frequency =
        145 +
        Math.random() * 40;


      playTone(
        frequency,
        .035,
        .018,
        "sine"
      );

    }


    function playAddSound() {

      playTone(
        230,
        .055,
        .025,
        "sine"
      );

    }


    function playCompleteSound() {

      const ctx =
        getAudioContext();

      if (!ctx) {
        return;
      }


      playTone(
        520,
        .09,
        .045,
        "sine"
      );


      setTimeout(
        () => {

          playTone(
            700,
            .12,
            .035,
            "sine"
          );

        },
        55
      );

    }


    /* =========================
       SAFE HTML
    ========================= */

    function escapeHtml(value) {

      return String(value)
        .replaceAll(
          "&",
          "&amp;"
        )
        .replaceAll(
          "<",
          "&lt;"
        )
        .replaceAll(
          ">",
          "&gt;"
        )
        .replaceAll(
          '"',
          "&quot;"
        )
        .replaceAll(
          "'",
          "&#039;"
        );

    }


    /* =========================
       INSTALL
    ========================= */

    function isStandalone() {

      return (
        window.matchMedia(
          "(display-mode: standalone)"
        ).matches ||
        window.navigator.standalone === true
      );

    }


    function isIOS() {

      return /iphone|ipad|ipod/i
        .test(
          navigator.userAgent
        );

    }


    function showInstallBanner() {

      if (
        isStandalone() ||
        installBannerDismissed
      ) {
        return;
      }


      if (deferredInstallPrompt) {

        installTitle.textContent =
          t("installTitle");

        installText.textContent =
          t("installText");

        installAction.textContent =
          t("install");

      } else {

        installTitle.textContent =
          t("installGuideTitle");

        installText.textContent =
          t("installGuideText");

        installAction.textContent =
          t("install");

      }


      installDismiss.textContent =
        t("continue");


      installBanner.classList.add(
        "show"
      );

    }


    function hideInstallBanner() {

      installBanner.classList.remove(
        "show"
      );

    }


    window.addEventListener(
      "beforeinstallprompt",
      event => {

        event.preventDefault();

        deferredInstallPrompt =
          event;

        showInstallBanner();

      }
    );


    window.addEventListener(
      "appinstalled",
      () => {

        deferredInstallPrompt =
          null;

        hideInstallBanner();

      }
    );


    installAction.addEventListener(
      "click",
      async () => {

        if (!deferredInstallPrompt) {

          if (isIOS()) {

            showToast(
              t("installGuideText")
            );

          }

          return;

        }


        const promptEvent =
          deferredInstallPrompt;

        deferredInstallPrompt =
          null;

        hideInstallBanner();


        try {

          await promptEvent.prompt();

          await promptEvent.userChoice;

        } catch {}

      }
    );


    installDismiss.addEventListener(
      "click",
      () => {

        installBannerDismissed =
          true;

        hideInstallBanner();

      }
    );


    window.addEventListener(
      "load",
      () => {

        setTimeout(
          showInstallBanner,
          700
        );

      }
    );


    /* =========================
       DAY CHANGE
    ========================= */

    function checkDayChange() {

      const today =
        getDateKey();


      if (
        lastKnownDay === null
      ) {

        lastKnownDay =
          today;

        return;

      }


      if (
        today !==
        lastKnownDay
      ) {

        lastKnownDay =
          today;

        render();

      }

    }


    setInterval(
      checkDayChange,
      30000
    );


    /* =========================
       KEYBOARD
    ========================= */

    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key ===
          "Escape"
        ) {

          closeAllOverlays();

        }

      }
    );


    /* =========================
       INIT
    ========================= */

    function init() {

      loadData();

      /*
        مهم:
        applySettings() الآن تطبق
        Theme + Accent + Language
        معًا.
      */

      applySettings();

      lastKnownDay =
        getDateKey();

      render();

      updateComposer();

      autoResizeTextarea();

    }


    init();


    /* =========================
       SERVICE WORKER
    ========================= */

    if (
      "serviceWorker" in navigator
    ) {

      window.addEventListener(
        "load",
        () => {

          navigator.serviceWorker
            .register(
              "./sw.js",
              {
                updateViaCache:
                  "none"
              }
            )
            .then(
              registration => {

                registration
                  .update()
                  .catch(
                    () => {}
                  );


                registration
                  .addEventListener(
                    "updatefound",
                    () => {

                      const worker =
                        registration.installing;

                      if (!worker) {
                        return;
                      }


                      worker
                        .addEventListener(
                          "statechange",
                          () => {

                            if (
                              worker.state ===
                              "installed" &&
                              navigator
                                .serviceWorker
                                .controller
                            ) {

                              showToast(
                                t(
                                  "updateAvailable"
                                )
                              );


                              const button =
                                document.createElement(
                                  "button"
                                );

                              button.type =
                                "button";

                              button.className =
                                "toast-undo";

                              button.textContent =
                                t("update");


                              button.addEventListener(
                                "click",
                                () => {

                                  worker.postMessage(
                                    {
                                      type:
                                        "SKIP_WAITING"
                                    }
                                  );

                                }
                              );


                              toast.appendChild(
                                button
                              );


                              setTimeout(
                                () => {

                                  button.remove();

                                },
                                5000
                              );

                            }

                          }
                        );

                    }
                  );


                setInterval(
                  () =>
                    registration
                      .update()
                      .catch(
                        () => {}
                      ),
                  60 * 60 * 1000
                );

              }
            )
            .catch(
              () => {}
            );

        }
      );


      navigator.serviceWorker
        .addEventListener(
          "controllerchange",
          () => {

            window.location.reload();

          }
        );

    }

  </script>
