    /* =========================
       PROGRESS
    ========================= */

    function updateProgress() {

      const isToday =
        currentView ===
        "today";


      progressWrap.classList.toggle(
        "hidden",
        !isToday
      );


      if (!isToday) {
        return;
      }


      const today =
        tasks.filter(
          task =>
            (
              task.scheduledDate
                ? task.scheduledDate ===
                  getDateKey()
                : task.taskDay ===
                  getDateKey()
            )
        );


      const total =
        today.length;


      const completed =
        today.filter(
          task =>
            task.completed
        ).length;


      let percentage =
        0;


      if (
        total > 0
      ) {

        percentage =
          Math.round(
            (
              completed /
              total
            ) *
            100
          );

      }


      progressBar.style.width =
        `${percentage}%`;


      progressValue.textContent =
        `${percentage}%`;


      if (
        total === 0
      ) {

        progressLabel.textContent =
          t("startFirst");

      } else if (
        percentage ===
        100
      ) {

        progressLabel.textContent =
          t("allDone");

      } else {

        progressLabel.textContent =
          t("progressToday");

      }

    }


    /* =========================
       HEADER NAV STATE
    ========================= */

    function updateHeaderNavState() {

      $$(".header-tab")
        .forEach(
          button => {

            const active =
              button.dataset.view ===
              currentView;


            button.classList.toggle(
              "active",
              active
            );


            if (
              active
            ) {

              button.setAttribute(
                "aria-current",
                "page"
              );

            } else {

              button.removeAttribute(
                "aria-current"
              );

            }

          }
        );

    }


    /* =========================
       SWIPE
    ========================= */

    function navigateBySwipe(
      direction
    ) {

      const currentIndex =
        SWIPE_VIEWS.indexOf(
          currentView
        );


      if (
        currentIndex === -1
      ) {

        return;

      }


      let nextIndex;


      if (
        direction ===
        "next"
      ) {

        nextIndex =
          (
            currentIndex +
            1
          ) %
          SWIPE_VIEWS.length;

      } else {

        nextIndex =
          (
            currentIndex -
            1 +
            SWIPE_VIEWS.length
          ) %
          SWIPE_VIEWS.length;

      }


      setView(
        SWIPE_VIEWS[nextIndex],
        direction
      );

    }


    function getSwipeDirection(
      dx
    ) {

      const isRTL =
        document.documentElement.dir ===
        "rtl";


      if (
        isRTL
      ) {

        return dx < 0
          ? "next"
          : "previous";

      }


      return dx > 0
        ? "next"
        : "previous";

    }


    function isSwipeBlockedTarget(
      target
    ) {

      return Boolean(
        target?.closest(
          "textarea, input, button, .overlay"
        )
      );

    }


    /* =========================
       TOUCH
    ========================= */

    function handleSwipeStart(
      event
    ) {

      if (
        isSwipeBlockedTarget(
          event.target
        )
      ) {

        swipeTracking =
          false;

        return;

      }


      if (
        event.touches &&
        event.touches.length !== 1
      ) {

        swipeTracking =
          false;

        return;

      }


      const touch =
        event.touches[0];


      swipeStartX =
        touch.clientX;


      swipeStartY =
        touch.clientY;


      swipeTracking =
        true;

    }


    function handleSwipeEnd(
      event
    ) {

      if (
        !swipeTracking
      ) {

        return;

      }


      swipeTracking =
        false;


      if (
        event.changedTouches &&
        event.changedTouches.length !== 1
      ) {

        return;

      }


      const touch =
        event.changedTouches[0];


      const dx =
        touch.clientX -
        swipeStartX;


      const dy =
        touch.clientY -
        swipeStartY;


      const absX =
        Math.abs(dx);


      const absY =
        Math.abs(dy);


      if (
        absX < 55 ||
        absX <=
          absY * 1.2
      ) {

        return;

      }


      swipeSuppressClick =
        true;


      navigateBySwipe(
        getSwipeDirection(
          dx
        )
      );


      setTimeout(
        () => {

          swipeSuppressClick =
            false;

        },
        500
      );

    }


    content.addEventListener(
      "touchstart",
      handleSwipeStart,
      {
        passive: true
      }
    );


    content.addEventListener(
      "touchend",
      handleSwipeEnd,
      {
        passive: true
      }
    );


    content.addEventListener(
      "touchcancel",
      () => {

        swipeTracking =
          false;

      },
      {
        passive: true
      }
    );


    /* =========================
       MOUSE DRAG
    ========================= */

    function handleMouseDown(
      event
    ) {

      if (
        event.button !== 0 ||
        isSwipeBlockedTarget(
          event.target
        )
      ) {

        swipeTracking =
          false;

        return;

      }


      swipeStartX =
        event.clientX;


      swipeStartY =
        event.clientY;


      swipeTracking =
        true;

    }


    function handleMouseUp(
      event
    ) {

      if (
        !swipeTracking
      ) {

        return;

      }


      swipeTracking =
        false;


      const dx =
        event.clientX -
        swipeStartX;


      const dy =
        event.clientY -
        swipeStartY;


      const absX =
        Math.abs(dx);


      const absY =
        Math.abs(dy);


      if (
        absX < 65 ||
        absX <=
          absY * 1.2
      ) {

        return;

      }


      swipeSuppressClick =
        true;


      navigateBySwipe(
        getSwipeDirection(
          dx
        )
      );


      setTimeout(
        () => {

          swipeSuppressClick =
            false;

        },
        500
      );

    }


    function handleMouseLeave() {

      swipeTracking =
        false;

    }


    content.addEventListener(
      "mousedown",
      handleMouseDown
    );


    content.addEventListener(
      "mouseup",
      handleMouseUp
    );


    content.addEventListener(
      "mouseleave",
      handleMouseLeave
    );


    content.addEventListener(
      "click",
      event => {

        if (
          !swipeSuppressClick
        ) {

          return;

        }


        event.preventDefault();


        event.stopPropagation();


        swipeSuppressClick =
          false;

      },
      true
    );


    /* =========================
       ACTION SHEET
    ========================= */

    function openAction(
      id
    ) {

      const task =
        tasks.find(
          item =>
            item.id === id
        );


      if (!task) {
        return;
      }


      selectedTaskId =
        id;


      actionTaskPreview.textContent =
        task.text;


      const actionButton =
        $("#actionComplete");


      const actionText =
        actionButton.querySelector(
          "span:last-child"
        );


      if (actionText) {

        actionText.textContent =
          task.completed
            ? t("cancelDone")
            : t("done");

      }


      updateActionDateText(
        task
      );


      openOverlay(
        actionOverlay
      );

    }


    $("#actionComplete")
      .addEventListener(
        "click",
        () => {

          if (!selectedTaskId) {
            return;
          }


          const id =
            selectedTaskId;


          completeTask(
            id
          );


          closeOverlay(
            actionOverlay
          );


          selectedTaskId =
            null;

        }
      );


    $("#actionDate")
      .addEventListener(
        "click",
        () => {

          if (!selectedTaskId) {
            return;
          }


          openTaskDate(
            selectedTaskId
          );

        }
      );


    $("#actionEdit")
      .addEventListener(
        "click",
        () => {

          if (!selectedTaskId) {
            return;
          }


          openEdit(
            selectedTaskId
          );

        }
      );


    $("#actionDelete")
      .addEventListener(
        "click",
        () => {

          if (!selectedTaskId) {
            return;
          }


          const id =
            selectedTaskId;


          closeOverlay(
            actionOverlay
          );


          selectedTaskId =
            null;


          deleteTask(
            id
          );

        }
      );


    /* =========================
       DATE ACTIONS
    ========================= */

    $("#dateSave")
      .addEventListener(
        "click",
        saveTaskDate
      );


    $("#dateClear")
      .addEventListener(
        "click",
        clearTaskDate
      );


    $("#dateCancel")
      .addEventListener(
        "click",

            dateOverlay
          );

    /* =========================
       OVERLAYS
    ========================= */

    function openOverlay(
      overlay
    ) {

      overlay.classList.add(
        "show"
      );


      overlay.setAttribute(
        "aria-hidden",
        "false"
      );


      document.body.classList.add(
        "no-scroll"
      );

    }


    function closeOverlay(
      overlay
    ) {

      overlay.classList.remove(
        "show"
      );


      overlay.setAttribute(
        "aria-hidden",
        "true"
      );


      if (
        !document.querySelector(
          ".overlay.show"
        )
      ) {

        document.body.classList.remove(
          "no-scroll"
        );

      }

    }


    function closeAllOverlays() {

      $$(".overlay.show")
        .forEach(
          closeOverlay
        );


      selectedTaskId =
        null;

    }


    $$(".overlay")
      .forEach(
        overlay => {

          overlay.addEventListener(
            "click",
            event => {

              if (
                event.target ===
                overlay
              ) {

                closeOverlay(
                  overlay
                );


                selectedTaskId =
                  null;

              }

            }
          );

        }
      );


    /* =========================
       MENU
    ========================= */

    $("#menuBtn")
      .addEventListener(
        "click",
        () => {

          openOverlay(
            menuOverlay
          );

        }
      );


    /* =========================
       HEADER NAV
    ========================= */

    $$(".header-tab")
      .forEach(

    /* =========================
       SETTINGS
    ========================= */

    $("#settingsBtn")

          );

            settingsOverlay

    /* =========================
       TRASH FROM MENU

    /* =========================
       LANGUAGE
    ========================= */

    $$("[data-language-choice]")
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              const newLanguage =
                button.dataset.languageChoice ===

                  : "ar";


              if (
                settings.language ===
                newLanguage

                applyLanguage();

                return;

              }


              settings.language =
                newLanguage;


              saveSettings();


              applyLanguage();


              render();


              applyLanguage();


              renderSettings();


              renderTrash();

            }
          );

        }
      );


    function renderSettings() {

      trashCount.textContent =
        trash.length;


      applySettings();

    }


    $("#trashBtn")
      .addEventListener(
        "click",
        () => {

          renderTrash();


          closeOverlay(
            settingsOverlay
          );


          openOverlay(
            trashOverlay
          );

        }
      );


    /* =========================
       TRASH RENDER
    ========================= */

    function renderTrash() {

      trashCount.textContent =
        trash.length;


      trashList.innerHTML =
        "";


      if (
        trash.length ===
        0
      ) {

        trashList.appendChild(
          createEmptyState(
            "⌫",
            t("trashEmpty"),
            t("noDeleted")
          )
        );


        return;

      }


      trash.forEach(
        task => {

          const item =
            document.createElement(
              "div"
            );


          item.className =
            "trash-item";


          const text =
            document.createElement(
              "div"
            );


          text.className =
            "trash-text";


          text.textContent =
            task.text;


          const restore =
            document.createElement(
              "button"
            );


          restore.type =
            "button";


          restore.className =
            "small-btn";


          restore.textContent =
            t("restore");


          restore.addEventListener(
            "click",
            () => {

              restoreTask(
                task.id
              );

            }
          );


          const forever =
            document.createElement(
              "button"
            );


          forever.type =
            "button";


          forever.className =
            "small-btn danger trash-delete-button";


          forever.textContent =
            t("delete");


          forever.addEventListener(
            "click",
            () => {

              deleteForever(
                task.id
              );

            }
          );


          item.append(
            text,
            restore,
            forever
          );


          trashList.appendChild(
            item
          );

        }
      );

    }


    /* =========================
       EDIT ACTIONS
    ========================= */

    $("#editSave")
      .addEventListener(
        "click",
        saveEdit
      );


    $("#editCancel")
      .addEventListener(
        "click",
        () => {

          closeOverlay(
            editOverlay
          );


          selectedTaskId =
            null;

        }
      );


    editInput
      .addEventListener(
        "keydown",
        event => {

          if (
            event.key ===
              "Enter" &&
            !event.shiftKey
          ) {

            event.preventDefault();


            saveEdit();

          }

        }
      );


    /* =========================
       COMPOSER
    ========================= */

    function updateComposer() {

      const hasText =
        taskInput.value
          .trim()
          .length > 0;


      sendBtn.classList.toggle(
        "disabled",
        !hasText
      );

    }


    taskInput
      .addEventListener(
        "input",
        () => {

          autoResizeTextarea();


          updateComposer();


          playTypingSound();

        }
      );


    taskInput
      .addEventListener(
        "keydown",
        event => {

          if (
            event.key ===
              "Enter" &&
            !event.shiftKey
          ) {

            event.preventDefault();


            $("#composer")
              .requestSubmit();

          }

        }
      );


    $("#composer")
      .addEventListener(
        "submit",
        event => {

          event.preventDefault();


          const text =
            taskInput.value.trim();


          if (!text) {
            return;
          }


          if (
            addTask(
              text
            )
          ) {

            taskInput.value =
              "";


            autoResizeTextarea();


            updateComposer();


            taskInput.focus();

          }

        }
      );


    function autoResizeTextarea() {

      taskInput.style.height =
        "auto";


      taskInput.style.height =
        Math.min(
          taskInput.scrollHeight,
          130
        ) + "px";

    }


    /* =========================
       TOAST
    ========================= */

    function showToast(
      message,
      canUndo = false,
      undoCallback = null
    ) {

      clearTimeout(
        undoTimer
      );


      undoAction =
        canUndo
          ? undoCallback
          : null;


      toastMessage.textContent =
        message;


      toastUndo.classList.toggle(
        "hidden",
        !canUndo
      );


      toastUpdate.classList.add(
        "hidden"
      );


      toast.classList.add(
        "show"
      );


      undoTimer =
        setTimeout(
          hideToast,
          4500
        );

    }


    function showUpdateToast() {

      clearTimeout(
        undoTimer
      );


      undoAction =
        null;


      toastMessage.textContent =
        t("updateAvailable");


      toastUndo.classList.add(
        "hidden"
      );


      toastUpdate.classList.remove(
        "hidden"
      );


      toastUpdate.textContent =
        t("update");


      toast.classList.add(
        "show"
      );

    }


    function hideToast() {

      toast.classList.remove(
        "show"
      );


      undoAction =
        null;


      toastUpdate.classList.add(
        "hidden"
      );

    }


    toastUndo
      .addEventListener(
        "click",
        () => {

          if (
            typeof undoAction ===
            "function"
          ) {

            undoAction();

          }


          hideToast();

        }
      );


    /* =========================
       SOUND
    ========================= */

    function getAudioContext() {

      if (
        !typingAudioContext
      ) {

        const AudioContext =
          window.AudioContext ||
          window.webkitAudioContext;


        if (
          !AudioContext
        ) {

          return null;

        }


        typingAudioContext =
          new AudioContext();

      }


      if (
        typingAudioContext.state ===
        "suspended"
      ) {

        typingAudioContext
          .resume()
          .catch(
            () => {}
          );

      }


      return typingAudioContext;

    }


    function playTone(
      frequency,
      duration,
      volume,
      type = "sine"
    ) {

      const ctx =
        getAudioContext();


      if (!ctx) {
        return;
      }


      try {

        const oscillator =
          ctx.createOscillator();


        const gain =
          ctx.createGain();


        oscillator.type =
          type;


        oscillator.frequency.value =
          frequency;


        gain.gain.setValueAtTime(
          0.0001,
          ctx.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
          Math.max(
            volume,
            0.0002
          ),
          ctx.currentTime +
            .008
        );


        gain.gain.exponentialRampToValueAtTime(
          0.0001,
          ctx.currentTime +
            duration
        );


        oscillator.connect(
          gain
        );


        gain.connect(
          ctx.destination
        );


        oscillator.start();


        oscillator.stop(
          ctx.currentTime +
          duration +
          .01
        );

      } catch {
        /* Audio must never break NAWY. */
      }

    }


    function playTypingSound() {

      const now =
        performance.now();


      if (
        now -
        lastTypingSound <
        55
      ) {

        return;

      }


      lastTypingSound =
        now;


      const frequency =
        145 +
        Math.random() *
        40;


      playTone(
        frequency,
        .035,
        .018,
        "sine"
      );

    }


    function playAddSound() {

      playTone(
        230,
        .055,
        .025,
        "sine"
      );

    }


    function playCompleteSound() {

      const ctx =
        getAudioContext();


      if (!ctx) {
        return;
      }


      playTone(
        520,
        .09,
        .045,
        "sine"
      );


      setTimeout(
        () => {

          playTone(
            700,
            .12,
            .035,
            "sine"
          );

        },
        55
      );

    }


    /* =========================
       SAFE HTML
    ========================= */

    function escapeHtml(
      value
    ) {

      return String(
        value
      )
        .replaceAll(
          "&",
          "&amp;"
        )
        .replaceAll(
          "<",
          "&lt;"
        )
        .replaceAll(
          ">",
          "&gt;"
        )
        .replaceAll(
          '"',
          "&quot;"
        )
        .replaceAll(
          "'",
          "&#039;"
        );

    }


    /* =========================
       INSTALL
    ========================= */

    function isStandalone() {

      return (
        window.matchMedia(
          "(display-mode: standalone)"
        ).matches ||
        window.navigator.standalone ===
          true
      );

    }


    function isIOS() {

      return /iphone|ipad|ipod/i
        .test(
          navigator.userAgent
        );

    }


    function showInstallBanner() {

      if (
        isStandalone() ||
        installBannerDismissed
      ) {

        return;

      }


      if (
        deferredInstallPrompt
      ) {

        installTitle.textContent =
          t("installTitle");

        installText.textContent =
          t("installText");

      } else {

        installTitle.textContent =
          t("installGuideTitle");

        installText.textContent =
          t("installGuideText");

      }


      installAction.textContent =
        t("install");


      installDismiss.textContent =
        t("continue");


      installBanner.classList.add(
        "show"
      );

    }


    function hideInstallBanner() {

      installBanner.classList.remove(
        "show"
      );

    }


    window.addEventListener(
      "beforeinstallprompt",
      event => {

        event.preventDefault();


        deferredInstallPrompt =
          event;


        showInstallBanner();

      }
    );


    window.addEventListener(
      "appinstalled",
      () => {

        deferredInstallPrompt =
          null;


        hideInstallBanner();

      }
    );


    installAction.addEventListener(
      "click",
      async () => {

        if (
          !deferredInstallPrompt
        ) {

          if (
            isIOS()
          ) {

            showToast(
              t("installGuideText")
            );

          }

          return;

        }


        const promptEvent =
          deferredInstallPrompt;


        deferredInstallPrompt =
          null;


        hideInstallBanner();


        try {

          await promptEvent.prompt();


          await promptEvent.userChoice;

        } catch {}

      }
    );


    installDismiss.addEventListener(
      "click",
      () => {

        installBannerDismissed =
          true;


        hideInstallBanner();

      }
    );


    window.addEventListener(
      "load",
      () => {

        setTimeout(
          showInstallBanner,
          700
        );

      }
    );


    /* =========================
       DAY CHANGE
    ========================= */

    function checkDayChange() {

      const today =
        getDateKey();


      if (
        lastKnownDay ===
        null
      ) {

        lastKnownDay =
          today;

        return;

      }


      if (
        today !==
        lastKnownDay
      ) {

        lastKnownDay =
          today;


        completedExpanded =
          false;


        render();

      }

    }


    setInterval(
      checkDayChange,
      30000
    );


    /* =========================
       KEYBOARD
    ========================= */

    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key ===
          "Escape"
        ) {

          closeAllOverlays();

        }

      }
    );


    /* =========================
       INIT
    ========================= */

    function init() {

      loadData();


      applySettings();


      lastKnownDay =
        getDateKey();


      render();


      updateComposer();


      autoResizeTextarea();

    }


    init();


    /* =========================================================
       SERVICE WORKER
       Compatible with NAWY sw.js v7
       ========================================================= */

    let swReloading =
      false;

    let swUpdatePending =
      false;


    function requestServiceWorkerUpdate(
      registration
    ) {

      if (!registration) {
        return;
      }


      registration
        .update()
        .catch(
          () => {}
        );

    }


    if (
      "serviceWorker" in
      navigator
    ) {

      window.addEventListener(
        "load",
        async () => {

          try {

            const registration =
              await navigator.serviceWorker.register(
                "./sw.js",
                {
                  updateViaCache:
                    "none"
                }
              );


            requestServiceWorkerUpdate(
              registration
            );


            registration.addEventListener(
              "updatefound",
              () => {

                const worker =
                  registration.installing;


                if (!worker) {
                  return;
                }


                worker.addEventListener(
                  "statechange",
                  () => {

                    if (
                      worker.state ===
                        "installed" &&
                      navigator
                        .serviceWorker
                        .controller
                    ) {

                      if (
                        swUpdatePending
                      ) {

                        return;

                      }


                      swUpdatePending =
                        true;


                      showUpdateToast();

                    }

                  }
                );

              }
            );


            toastUpdate.addEventListener(
              "click",
              () => {

                const waiting =
                  registration.waiting;


                if (!waiting) {

                  requestServiceWorkerUpdate(
                    registration
                  );

                  return;

                }


                toastUpdate.disabled =
                  true;


                toastUpdate.textContent =
                  t("update");


                waiting.postMessage({
                  type:
                    "SKIP_WAITING"
                });

              }
            );


            setInterval(
              () => {

                requestServiceWorkerUpdate(
                  registration
                );

              },
              60 *
              60 *
              1000
            );


            document.addEventListener(
              "visibilitychange",
              () => {

                if (
                  document.visibilityState ===
                  "visible"
                ) {

                  requestServiceWorkerUpdate(
                    registration
                  );

                }

              }
            );

          } catch (
            error
          ) {

            console.warn(
              "NAWY SW registration failed:",
              error
            );

          }

        }
      );


      navigator.serviceWorker
        .addEventListener(
          "controllerchange",
          () => {

            if (
              swReloading
            ) {

              return;

            }


            swReloading =
              true;


            window.location.reload();

          }
        );

    }

  </script>
