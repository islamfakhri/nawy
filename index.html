<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ناوي | دوّن اللي ناوي عليه</title>
    <!-- خطوط عصرية -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --accent: #10b981;
            --accent-dark: #059669;
            --accent-light: #d1fae5;
            --accent-gold: #f59e0b;
            --danger: #ef4444;
            --radius: 16px;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -2px rgba(0,0,0,0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -4px rgba(0,0,0,0.05);
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --gradient: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
            --gradient-hover: linear-gradient(135deg, #059669 0%, #0891b2 100%);
        }

        .dark {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #334155;
            --accent: #34d399;
            --accent-dark: #10b981;
            --accent-light: #064e3b;
            --accent-gold: #fbbf24;
            --danger: #f87171;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.3), 0 2px 4px -2px rgba(0,0,0,0.3);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.4), 0 4px 6px -4px rgba(0,0,0,0.4);
            --gradient: linear-gradient(135deg, #34d399 0%, #06b6d4 100%);
            --gradient-hover: linear-gradient(135deg, #10b981 0%, #0891b2 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: background var(--transition), color var(--transition);
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            overflow-x: hidden;
        }

        /* خلفية زخرفية ناعمة */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(16,185,129,0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(6,182,212,0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .app {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* ========== الرأس ========== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-family: 'Amiri', serif;
            font-size: 36px;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-icon {
            font-size: 32px;
            animation: glow 2s infinite;
        }

        @keyframes glow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .logo span { color: var(--accent); }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .theme-btn {
            background: var(--card);
            border: 1px solid var(--border);
            font-size: 20px;
            cursor: pointer;
            padding: 8px 15px;
            border-radius: 50px;
            transition: all var(--transition);
            color: var(--text);
            box-shadow: var(--shadow);
        }

        .theme-btn:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        /* ========== صندوق الإدخال ========== */
        .input-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: var(--shadow);
            transition: all var(--transition);
        }

        .input-box:focus-within {
            border-color: var(--accent);
            box-shadow: var(--shadow-lg);
        }

        .input-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-row input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg);
            color: var(--text);
            font-size: 16px;
            font-family: 'Cairo', sans-serif;
            outline: none;
            transition: border var(--transition);
        }

        .input-row input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(16,185,129,0.1);
        }

        .add-btn {
            padding: 12px 20px;
            background: var(--gradient);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            transition: all var(--transition);
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(16,185,129,0.3);
        }

        .add-btn:hover {
            background: var(--gradient-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(16,185,129,0.4);
        }

        .extra-options {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .category-select {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            color: var(--text);
            font-family: 'Cairo', sans-serif;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }

        .datetime-input {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            color: var(--text);
            font-family: 'Cairo', sans-serif;
            font-size: 13px;
            outline: none;
        }

        /* ========== شريط البحث والفلترة ========== */
        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-input {
            flex: 1;
            min-width: 200px;
            padding: 10px 15px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--card);
            color: var(--text);
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border var(--transition);
            box-shadow: var(--shadow);
        }

        .search-input:focus {
            border-color: var(--accent);
        }

        .filter-buttons {
            display: flex;
            gap: 5px;
            background: var(--card);
            padding: 4px;
            border-radius: 50px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .filter-btn {
            padding: 8px 16px;
            border: none;
            background: transparent;
            border-radius: 50px;
            color: var(--text-secondary);
            font-family: 'Cairo', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            white-space: nowrap;
        }

        .filter-btn.active {
            background: var(--accent);
            color: white;
            box-shadow: 0 2px 8px rgba(16,185,129,0.3);
        }

        .filter-btn:hover:not(.active) {
            background: var(--accent-light);
            color: var(--accent-dark);
        }

        /* ========== قائمة الكروت ========== */
        .notes-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
        }

        .note-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 15px;
            box-shadow: var(--shadow);
            transition: all var(--transition);
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 10px;
            animation: fadeInUp 0.3s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .note-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
            box-shadow: var(--shadow-lg);
        }

        .note-card.completed {
            opacity: 0.75;
            border-left: 4px solid var(--accent);
        }

        .note-card .note-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
        }

        .note-card .category-badge {
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 20px;
            background: var(--accent-light);
            color: var(--accent-dark);
            font-weight: 600;
        }

        .note-card .note-text {
            font-size: 15px;
            line-height: 1.6;
            word-wrap: break-word;
            flex: 1;
        }

        .note-card .note-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .note-card .note-date {
            font-size: 11px;
        }

        .note-card .reminder-badge {
            font-size: 11px;
            background: var(--accent-gold);
            color: #fff;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .note-card .actions {
            display: flex;
            gap: 5px;
        }

        .note-card .complete-btn,
        .note-card .delete-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            transition: all var(--transition);
            color: var(--text-secondary);
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .note-card .complete-btn:hover {
            background: var(--accent);
            color: white;
        }

        .note-card .complete-btn.completed {
            background: var(--accent);
            color: white;
        }

        .note-card .delete-btn:hover {
            background: var(--danger);
            color: white;
        }

        .empty-message {
            text-align: center;
            color: var(--text-secondary);
            font-size: 16px;
            padding: 40px;
            grid-column: 1 / -1;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* ========== استجابة الموبايل ========== */
        @media (max-width: 600px) {
            .app { padding: 10px; }
            .logo { font-size: 28px; }
            .input-row { flex-direction: column; }
            .add-btn { width: 100%; }
            .notes-container { grid-template-columns: 1fr; }
            .filter-buttons { overflow-x: auto; width: 100%; }
            .filter-btn { font-size: 12px; padding: 6px 12px; }
            .toolbar { flex-direction: column; }
            .search-input { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- الرأس -->
        <div class="header">
            <h1 class="logo">
                <span class="logo-icon">✦</span>
                ناوي<span>.</span>
            </h1>
            <div class="header-actions">
                <button class="theme-btn" id="themeToggle" title="تبديل الوضع">🌙</button>
            </div>
        </div>

        <!-- صندوق إضافة نية جديدة -->
        <div class="input-box">
            <div class="input-row">
                <input type="text" id="noteInput" placeholder="ناوي على إيه؟ اكتب هنا..." />
                <button class="add-btn" id="addBtn">+ أضف</button>
            </div>
            <div class="extra-options">
                <select class="category-select" id="categorySelect">
                    <option value="">بدون تصنيف</option>
                    <option value="شغل">💼 شغل</option>
                    <option value="دراسة">📚 دراسة</option>
                    <option value="رياضة">🏃 رياضة</option>
                    <option value="صحة">🥗 صحة</option>
                    <option value="سفر">✈️ سفر</option>
                    <option value="علاقات">💞 علاقات</option>
                    <option value="هواية">🎨 هواية</option>
                    <option value="مشروع">🚀 مشروع</option>
                    <option value="تطوير ذات">🌱 تطوير ذات</option>
                    <option value="قراءة">📖 قراءة</option>
                    <option value="تعلم">🧠 تعلم</option>
                    <option value="زيارة">🏡 زيارة</option>
                    <option value="تواصل">📞 تواصل</option>
                    <option value="مالي">💰 مالي</option>
                    <option value="إبداع">🎵 إبداع</option>
                    <option value="مساعدة">🤝 مساعدة</option>
                </select>
                <input type="datetime-local" class="datetime-input" id="reminderInput" />
            </div>
        </div>

        <!-- شريط البحث والفلترة -->
        <div class="toolbar">
            <input type="text" class="search-input" id="searchInput" placeholder="ابحث في نواياك..." />
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">الكل</button>
                <button class="filter-btn" data-filter="active">نشطة 🌱</button>
                <button class="filter-btn" data-filter="completed">مكتملة 🌟</button>
            </div>
        </div>

        <!-- قائمة النوايا -->
        <div class="notes-container" id="notesContainer"></div>
    </div>

    <script>
        // ========== إدارة البيانات ==========
        let notes = JSON.parse(localStorage.getItem('nawy_notes')) || [];
        let currentFilter = 'all';
        let searchTerm = '';

        // عناصر DOM
        const noteInput = document.getElementById('noteInput');
        const addBtn = document.getElementById('addBtn');
        const categorySelect = document.getElementById('categorySelect');
        const reminderInput = document.getElementById('reminderInput');
        const notesContainer = document.getElementById('notesContainer');
        const themeToggle = document.getElementById('themeToggle');
        const searchInput = document.getElementById('searchInput');

        // ========== حفظ واسترجاع ==========
        function saveNotes() {
            localStorage.setItem('nawy_notes', JSON.stringify(notes));
        }

        // ========== عرض الملاحظات ==========
        function renderNotes() {
            let filtered = notes.filter(note => {
                // فلترة حسب الحالة
                if (currentFilter === 'active' && note.completed) return false;
                if (currentFilter === 'completed' && !note.completed) return false;
                // فلترة حسب البحث
                if (searchTerm) {
                    const term = searchTerm.toLowerCase();
                    const matchText = note.text.toLowerCase().includes(term);
                    const matchCategory = note.category && note.category.toLowerCase().includes(term);
                    if (!matchText && !matchCategory) return false;
                }
                return true;
            });

            if (filtered.length === 0) {
                notesContainer.innerHTML = '<div class="empty-message">مفيش حاجة هنا، ابدأ بأول نية 🌱</div>';
                return;
            }

            notesContainer.innerHTML = filtered.map(note => `
                <div class="note-card ${note.completed ? 'completed' : ''}" data-id="${note.id}">
                    <div class="note-header">
                        ${note.category ? `<span class="category-badge">${escapeHTML(note.category)}</span>` : ''}
                        <div class="actions">
                            <button class="complete-btn ${note.completed ? 'completed' : ''}" data-action="toggle" title="${note.completed ? 'إلغاء الإكمال' : 'تحديد كمكتملة'}">
                                ${note.completed ? '🌟' : '✓'}
                            </button>
                            <button class="delete-btn" data-action="delete" title="حذف">×</button>
                        </div>
                    </div>
                    <div class="note-text">${escapeHTML(note.text)}</div>
                    <div class="note-meta">
                        <span class="note-date">${new Date(note.date).toLocaleString('ar-EG', { dateStyle: 'short', timeStyle: 'short' })}</span>
                        ${note.reminder ? `<span class="reminder-badge">⏰ ${new Date(note.reminder).toLocaleString('ar-EG', { dateStyle: 'short', timeStyle: 'short' })}</span>` : ''}
                    </div>
                </div>
            `).join('');
        }

        // ========== إضافة نية جديدة ==========
        function addNote() {
            const text = noteInput.value.trim();
            if (!text) {
                alert('اكتب النية الأول 😊');
                return;
            }

            const newNote = {
                id: Date.now(),
                text: text,
                category: categorySelect.value,
                reminder: reminderInput.value,
                date: new Date().toISOString(),
                completed: false
            };

            notes.unshift(newNote);
            noteInput.value = '';
            categorySelect.value = '';
            reminderInput.value = '';
            saveNotes();
            renderNotes();
            noteInput.focus();
        }

        // ========== حذف نية ==========
        function deleteNote(id) {
            notes = notes.filter(n => n.id !== id);
            saveNotes();
            renderNotes();
        }

        // ========== تبديل حالة الإكمال ==========
        function toggleComplete(id) {
            const note = notes.find(n => n.id === id);
            if (note) {
                note.completed = !note.completed;
                saveNotes();
                renderNotes();
            }
        }

        // ========== حماية من XSS ==========
        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ========== الثيم (الوضع الليلي) ==========
        function applyTheme(isDark) {
            if (isDark) {
                document.body.classList.add('dark');
                themeToggle.textContent = '☀️';
            } else {
                document.body.classList.remove('dark');
                themeToggle.textContent = '🌙';
            }
            localStorage.setItem('nawy_theme', isDark ? 'dark' : 'light');
        }

        themeToggle.addEventListener('click', () => {
            const isDark = document.body.classList.contains('dark');
            applyTheme(!isDark);
        });

        // ========== معالجة الأحداث ==========
        addBtn.addEventListener('click', addNote);
        noteInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addNote();
        });

        // تفويض الأحداث لحذف وتعديل من داخل القائمة
        notesContainer.addEventListener('click', (e) => {
            const card = e.target.closest('.note-card');
            if (!card) return;
            const id = Number(card.dataset.id);
            const action = e.target.dataset.action;

            if (action === 'delete') {
                if (confirm('متأكد إنك عايز تحذف دي؟')) {
                    deleteNote(id);
                }
            } else if (action === 'toggle') {
                toggleComplete(id);
            }
        });

        // فلترة
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                renderNotes();
            });
        });

        // بحث
        searchInput.addEventListener('input', (e) => {
            searchTerm = e.target.value.trim().toLowerCase();
            renderNotes();
        });

        // ========== التهيئة ==========
        function init() {
            const savedTheme = localStorage.getItem('nawy_theme');
            applyTheme(savedTheme === 'dark');
            renderNotes();
        }

        init();
    </script>
</body>
</html>
