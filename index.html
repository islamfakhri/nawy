<style>

:root {
    --bg: #101111;
    --surface: #181a19;
    --surface-2: #202321;
    --surface-3: #292c2a;

    --text: #f4f5f4;
    --text-soft: #d8dbd9;

    --muted: #8b918e;
    --muted-dark: #5d6460;

    --accent: #19c58b;
    --accent-soft: rgba(25,197,139,.12);

    --yellow: #e8c34f;
    --danger: #ff6868;

    --border: rgba(255,255,255,.075);

    --task-font: 16px;

    --radius: 18px;
}

body[data-accent="blue"] {
    --accent: #5b9cff;
    --accent-soft: rgba(91,156,255,.12);
    --accent-glow: rgba(91,156,255,.22);
}

body[data-accent="purple"] {
    --accent: #a879ff;
    --accent-soft: rgba(168,121,255,.12);
    --accent-glow: rgba(168,121,255,.22);
}

body[data-accent="orange"] {
    --accent: #ff9b52;
    --accent-soft: rgba(255,155,82,.12);
    --accent-glow: rgba(255,155,82,.22);
}

body[data-accent="pink"] {
    --accent: #f278b4;
    --accent-soft: rgba(242,120,180,.12);
    --accent-glow: rgba(242,120,180,.22);
}

body.light {
    --bg: #f5f6f5;
    --surface: #ffffff;
    --surface-2: #f0f2f1;
    --surface-3: #e8ebe9;

    --text: #171918;
    --text-soft: #343937;

    --muted: #737a76;
    --muted-dark: #a0a6a3;

    --border: rgba(0,0,0,.08);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html {
    width: 100%;
    min-height: 100%;
    background: var(--bg);
}

body {
    width: 100%;
    min-height: 100dvh;
    overflow: hidden;

    background: var(--bg);
    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans Arabic",
        "Noto Sans",
        Tahoma,
        Arial,
        sans-serif;

    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
}

button,
textarea,
input {
    font: inherit;
}

button {
    border: 0;
    outline: 0;
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
}

.app {
    width: 100%;
    height: 100dvh;
    min-height: 100dvh;

    display: flex;
    flex-direction: column;

    position: relative;

    background:
        radial-gradient(
            circle at 85% -15%,
            var(--accent-soft),
            transparent 28%
        ),
        var(--bg);
}

.header {
    width: 100%;
    max-width: var(--content-width);

    margin: 0 auto;

    padding:
        calc(20px + env(safe-area-inset-top))
        22px
        10px;

    flex-shrink: 0;
}

.header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.brand {
    display: flex;
    align-items: center;
    gap: 9px;
}

.logo {
    width: 32px;
    height: 32px;

    display: grid;
    place-items: center;

    border-radius: 10px;

    background: var(--accent);
    color: #07130e;

    font-size: 16px;
    font-weight: 900;

    box-shadow:
        0 5px 18px var(--accent-glow);
}

.brand-name {
    font-size: 24px;
    line-height: 1;
    font-weight: 850;
    letter-spacing: -.8px;
}

.settings-btn {
    width: 42px;
    height: 42px;

    display: grid;
    place-items: center;

    border-radius: 13px;

    background: transparent;
    color: var(--muted);

    font-size: 25px;
    font-weight: 800;

    line-height: 1;

    transition:
        background .18s ease,
        color .18s ease,
        transform .15s ease;
}

.settings-btn:hover {
    background: var(--surface-2);
    color: var(--text);
}

.settings-btn:active {
    transform: scale(.9);
}

.greeting {
    margin-top: 21px;
}

.greeting h1 {
    font-size: clamp(24px, 5vw, 29px);
    line-height: 1.25;
    font-weight: 850;
    letter-spacing: -.8px;
}

.greeting p {
    margin-top: 6px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
}

.progress {
    margin-top: 17px;

    display: flex;
    align-items: center;
    gap: 10px;
}

.progress-bar {
    flex: 1;
    height: 5px;

    overflow: hidden;
    border-radius: 999px;

    background: rgba(127,127,127,.16);
}

.progress-fill {
    width: 0;
    height: 100%;

    border-radius: inherit;
    background: var(--accent);

    transition:
        width .35s cubic-bezier(.2,.8,.2,1);
}

.progress-text {
    min-width: max-content;

    color: var(--muted);

    font-size: 11px;
    white-space: nowrap;
}

.tasks {
    width: 100%;
    max-width: var(--content-width);

    margin: 0 auto;

    flex: 1;
    min-height: 0;

    overflow-y: auto;

    padding:
        6px
        22px
        155px;

    scrollbar-width: none;
    overscroll-behavior: contain;
}

.tasks::-webkit-scrollbar {
    display: none;
}

.section-label {
    display: flex;
    align-items: center;
    gap: 10px;

    margin:
        21px
        0
        4px;

    color: var(--muted);

    font-size: 11px;
    font-weight: 750;
}

.section-label:first-child {
    margin-top: 5px;
}

.section-label::before,
.section-label::after {
    content: "";

    height: 1px;
    flex: 1;

    background: var(--border);
}

.task {
    position: relative;

    width: 100%;
    min-height: 66px;

    display: flex;
    align-items: center;

    gap: 11px;

    padding:
        8px
        0;

    border-bottom:
        1px solid var(--border);

    user-select: none;
}

.task:last-child {
    border-bottom-color: transparent;
}

.task-main {
    flex: 1;
    min-width: 0;

    cursor: pointer;

    padding: 8px 2px;

    border-radius: 8px;
}

.task-title {
    color: var(--text);

    font-size: var(--task-font);
    line-height: 1.5;

    font-weight: 500;

    overflow-wrap: anywhere;

    transition:
        color .25s ease,
        opacity .25s ease;
}

.task.completed .task-title {
    color: var(--muted-dark);

    text-decoration-line: line-through;
    text-decoration-color: var(--muted-dark);
    text-decoration-thickness: 1px;
}

.task-carried {
    margin-top: 3px;

    color: var(--muted-dark);

    font-size: 10px;
}

.check-hit {
    width: 46px;
    height: 46px;

    flex: 0 0 46px;

    display: grid;
    place-items: center;

    background: transparent;

    cursor: pointer;
}

.check {
    width: 27px;
    height: 27px;

    display: grid;
    place-items: center;

    border:
        2px solid #66706b;

    border-radius: 50%;

    background: transparent;
    color: #07130e;

    transition:
        background .2s ease,
        border-color .2s ease,
        transform .2s cubic-bezier(.18,.9,.3,1.3),
        box-shadow .2s ease;
}

.check svg {
    width: 15px;
    height: 15px;

    fill: none;

    stroke: currentColor;
    stroke-width: 2.8;

    stroke-linecap: round;
    stroke-linejoin: round;

    opacity: 0;

    transform: scale(.45);

    transition:
        opacity .18s ease,
        transform .2s cubic-bezier(.18,.9,.3,1.3);
}

.check-hit:hover .check {
    border-color: var(--accent);
    background: var(--accent-soft);
}

.task.completed .check {
    background: var(--accent);
    border-color: var(--accent);
}

.task.completed .check svg {
    opacity: 1;
    transform: scale(1);
}

.task.just-completed .check {
    animation:
        complete-pop .55s cubic-bezier(.18,.9,.3,1.3);
}

@keyframes complete-pop {

    0% {
        transform: scale(1);
        box-shadow: 0 0 0 0 transparent;
    }

    35% {
        transform: scale(1.32);
        box-shadow:
            0 0 0 8px
            var(--accent-soft);
    }

    70% {
        transform: scale(.94);
    }

    100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 transparent;
    }
}

.star-btn {
    width: 46px;
    height: 46px;

    flex: 0 0 46px;

    display: grid;
    place-items: center;

    background: transparent;

    color: var(--muted-dark);

    font-size: 26px;
    line-height: 1;

    border-radius: 12px;

    transition:
        color .18s ease,
        transform .18s ease,
        background .18s ease;
}

.star-btn:hover {
    background: var(--surface-2);
    color: var(--yellow);
}

.star-btn:active {
    transform: scale(.84);
}

.star-btn.starred {
    color: var(--yellow);
}

.empty {
    padding: 82px 20px;

}

.empty-icon {

    font-size: 31px;
}

}

.empty span {

    margin-top: 5px;

    color: var(--muted);

    font-size: 13px;
}

.composer-wrap {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    z-index: 50;

    padding:
        10px
        18px
        calc(17px + env(safe-area-inset-bottom));

    pointer-events: none;

    background:
        linear-gradient(
            to top,
            var(--bg) 38%,
            color-mix(
                in srgb,
                var(--bg) 88%,
                transparent
            ) 72%,
            transparent 100%

}

.composer-inner {

    max-width: var(--content-width);

    margin: 0 auto;

    pointer-events: auto;
}

.composer {
    width: 100%;

    min-height: 58px;

        16px;

    border:
        1px solid var(--border);

    border-radius: 29px;

    box-shadow:
        0 10px 34px rgba(0,0,0,.28);
}

#taskInput {
    flex: 1;
    min-width: 0;
    width: 100%;

    min-height: 42px;
    max-height: 115px;

    resize: none;

    overflow-y: auto;

    padding:
        10px
        0;

    border: 0;
    outline: 0;

    background: transparent;
    color: var(--text);

    font-size: 16px;
    line-height: 1.45;

    scrollbar-width: none;
}

#taskInput::-webkit-scrollbar {
    display: none;
}

#taskInput::placeholder {
    color: var(--muted);
}

.submit {
    width: 44px;
    height: 44px;

    flex: 0 0 44px;

    display: grid;
    place-items: center;

    border-radius: 50%;

    background: var(--surface-3);
    color: var(--muted-dark);

    transition:
        background .18s ease,
        color .18s ease,
        transform .15s ease;
}

.submit.active {
    background: var(--accent);
    color: #07130e;

    box-shadow:
        0 5px 18px var(--accent-glow);
}

.submit:active {
    transform: scale(.91);
}

.send-arrow {
    font-size: 23px;
    line-height: 1;
    font-weight: 850;

    transform: translateY(-1px);
}

.action-overlay {
    position: fixed;
    inset: 0;

    z-index: 500;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 18px;

    background: rgba(0,0,0,.42);

    backdrop-filter: blur(7px);

    opacity: 0;
    visibility: hidden;

    pointer-events: none;

    transition:
        opacity .18s ease,
        visibility .18s ease;
}

.action-overlay.show {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
}

.action-card {

        transform .2s cubic-bezier(.18,.9,.3,1.1);
}

.action-overlay.show .action-card {
    transform:
        translateY(0)
        scale(1);
}

.action-title {
    padding:
        13px
        13px
        10px;

    color: var(--muted);

    font-size: 11px;
    font-weight: 750;

    overflow-wrap: anywhere;
}

.action-button {
    width: 100%;

    min-height: 53px;

    display: flex;
    align-items: center;

    gap: 13px;

    padding:
        10px
        13px;

    border-radius: 14px;

    background: transparent;
    color: var(--text);

    text-align: start;

    font-size: 15px;
    font-weight: 650;

    transition:
        background .15s ease;
}

.action-button:hover {

}

.action-icon {
    width: 34px;
    height: 34px;

    flex: 0 0 34px;

    border-radius: 10px;

    font-size: 17px;
}

}

}

    color: var(--danger);
}

.menu-overlay {
    position: fixed;
    inset: 0;

    z-index: 550;

    display: flex;
    align-items: flex-start;
    justify-content: flex-end;

    padding:

}

.menu-overlay.show {

}

}

    min-height: 48px;

    display: flex;
    align-items: center;

    gap: 11px;

    padding:

.modal-overlay {
    position: fixed;
    inset: 0;

    z-index: 600;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 18px;

    background: rgba(0,0,0,.48);

    backdrop-filter: blur(8px);

    opacity: 0;
    visibility: hidden;

    pointer-events: none;

    transition:
        opacity .18s ease,
        visibility .18s ease;
}

.modal-overlay.show {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
}

.modal {
    width: min(430px, 100%);

    padding: 18px;

    background: var(--surface);

    border:

    border-radius: 21px;

    box-shadow:
        0 25px 80px rgba(0,0,0,.45);
}

.modal h2 {
    font-size: 19px;

}

}

.settings-panel.show {

    pointer-events: auto;

.dot-orange {

.dot-pink {

    padding: 18px;

    background: rgba(0,0,0,.45);

    opacity: 0;

.trash-panel.show {

    display: flex;

<script>

(() => {

"use strict";

/* =========================================================
   STORAGE
========================================================= */

const STORAGE_KEY = "nawy_tasks_v8";
const TRASH_KEY = "nawy_trash_v1";
const SETTINGS_KEY = "nawy_settings_v1";

/* =========================================================
   DOM
========================================================= */

const taskInput =
    document.getElementById("taskInput");

const submitBtn =
    document.getElementById("submitBtn");

const tasksContainer =
    document.getElementById("tasksContainer");

const progressFill =
    document.getElementById("progressFill");

const progressText =
    document.getElementById("progressText");

const progressBar =
    document.querySelector(".progress-bar");

const currentDate =
    document.getElementById("currentDate");

const brandName =
    document.getElementById("brandName");

const greetingTitle =
    document.getElementById("greetingTitle");

const menuBtn =
    document.getElementById("menuBtn");

const menuOverlay =
    document.getElementById("menuOverlay");

const menuToday =
    document.getElementById("menuToday");

const menuAll =
    document.getElementById("menuAll");

const menuCompleted =
    document.getElementById("menuCompleted");

const menuSettings =
    document.getElementById("menuSettings");

const actionOverlay =
    document.getElementById("actionOverlay");

const actionTaskTitle =
    document.getElementById("actionTaskTitle");

const actionComplete =
    document.getElementById("actionComplete");

const actionEdit =
    document.getElementById("actionEdit");

const actionDelete =
    document.getElementById("actionDelete");

const editOverlay =
    document.getElementById("editOverlay");

const editInput =
    document.getElementById("editInput");

const editSave =
    document.getElementById("editSave");

const editCancel =
    document.getElementById("editCancel");

const settingsPanel =
    document.getElementById("settingsPanel");

const settingsClose =
    document.getElementById("settingsClose");

const openTrash =
    document.getElementById("openTrash");

const trashPanel =
    document.getElementById("trashPanel");

const trashClose =
    document.getElementById("trashClose");

const trashContainer =
    document.getElementById("trashContainer");

const toast =
    document.getElementById("toast");

const toastMessage =
    document.getElementById("toastMessage");

const toastUndo =
    document.getElementById("toastUndo");

const settingsTitle =
    document.getElementById("settingsTitle");

const languageLabel =
    document.getElementById("languageLabel");

const themeLabel =
    document.getElementById("themeLabel");

const accentLabel =
    document.getElementById("accentLabel");

const trashLabel =
    document.getElementById("trashLabel");

const completeLabel =
    document.getElementById("completeLabel");

const editLabel =
    document.getElementById("editLabel");

const deleteLabel =
    document.getElementById("deleteLabel");

const editTitle =
    document.getElementById("editTitle");

const trashTitle =
    document.getElementById("trashTitle");

const menuTodayLabel =
    document.getElementById("menuTodayLabel");

const menuAllLabel =
    document.getElementById("menuAllLabel");

const menuCompletedLabel =
    document.getElementById("menuCompletedLabel");

const menuSettingsLabel =
    document.getElementById("menuSettingsLabel");

/* =========================================================
   COMPLETION SOUND
========================================================= */

const completeSound =
    new Audio("./sounds/ding.mp3");

completeSound.preload = "auto";

function playCompleteSound() {

    try {

        completeSound.currentTime = 0;

        const playPromise =
            completeSound.play();

        if (
            playPromise &&
            typeof playPromise.catch === "function"
        ) {

            playPromise.catch(() => {});

        }

    } catch {}

}

/* =========================================================
   TYPING SOUND
   صوت خفيف أثناء الكتابة
========================================================= */

let typingAudioContext = null;
let lastTypingSound = 0;

function playTypingSound() {

    const now = performance.now();

    /*
     * منع الصوت من التكرار بسرعة شديدة
     * حتى يظل خفيفًا ولا يتحول لإزعاج.
     */
    if (
        now - lastTypingSound < 45
    ) {
        return;
    }

    lastTypingSound = now;

    try {

        if (!typingAudioContext) {

            const AudioContext =
                window.AudioContext ||
                window.webkitAudioContext;

            if (!AudioContext) {
                return;
            }

            typingAudioContext =
                new AudioContext();

        }

        if (
            typingAudioContext.state ===
            "suspended"
        ) {

            typingAudioContext.resume()
                .catch(() => {});

        }

        const oscillator =
            typingAudioContext.createOscillator();

        const gain =
            typingAudioContext.createGain();

        oscillator.type =
            "sine";

        /*
         * نغمة قصيرة جدًا وهادية.
         */
        oscillator.frequency.value =
            145 + Math.random() * 35;

        gain.gain.setValueAtTime(
            0.0001,
            typingAudioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.018,
            typingAudioContext.currentTime + 0.004
        );

        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            typingAudioContext.currentTime + 0.035
        );

        oscillator.connect(gain);
        gain.connect(
            typingAudioContext.destination
        );

        oscillator.start();

        oscillator.stop(
            typingAudioContext.currentTime + 0.04
        );

    } catch {}

}

/* =========================================================
   STATE
========================================================= */

let tasks = loadJSON(
    STORAGE_KEY,
    []
);

let trash = loadJSON(
    TRASH_KEY,
    []
);

let settings = loadJSON(
    SETTINGS_KEY,
    {
        language: "ar",
        theme: "dark",
        accent: "green"
    }
);

let currentView = "today";

let selectedTaskId = null;

let deletedTask = null;

let deleteTimer = null;

let longPressTimer = null;

let longPressTriggered = false;

/*
 * مهم:
 * نحتفظ بتاريخ آخر يوم ظهر فيه التطبيق.
 * لا نستخدمه أبدًا لحذف البيانات.
 */
let lastKnownDay =
    getDateKey();

/* =========================================================
   STORAGE
========================================================= */

function loadJSON(key, fallback) {

    try {

        const raw =
            localStorage.getItem(key);

        if (!raw) {
            return fallback;
        }

        const value =
            JSON.parse(raw);

        return value ?? fallback;

    } catch {

        return fallback;

    }

}

function saveJSON(key, value) {

    try {

        localStorage.setItem(
            key,
            JSON.stringify(value)
        );

        return true;

    } catch {

        console.warn(
            "NAWY storage unavailable"
        );

        return false;

    }

}

/* =========================================================
   DATE
========================================================= */

function getDateKey(date = new Date()) {

    const y =
        date.getFullYear();

    const m =
        String(
            date.getMonth() + 1
        ).padStart(2, "0");

    const d =
        String(
            date.getDate()
        ).padStart(2, "0");

    return `${y}-${m}-${d}`;

}

function formatDate(date = new Date()) {

    const locale =
        settings.language === "en"
            ? "en-US"
            : "ar-EG";

    return new Intl.DateTimeFormat(
        locale,
        {
            weekday: "long",
            day: "numeric",
            month: "long"
        }
    ).format(date);

}

function updateDate() {

    currentDate.textContent =
        formatDate();

}

/* =========================================================
   MIDNIGHT / DAY CHANGE
========================================================= */

/*
 * تغيير اليوم لا يعني حذف النوايا.
 *
 * الوظيفة الوحيدة هنا:
 * تحديث التاريخ والواجهة.
 */

function checkForNewDay() {

    const today =
        getDateKey();

    if (
        today !== lastKnownDay
    ) {

        lastKnownDay =
            today;

        updateDate();

        render();

    }

}

/*
 * فحص دوري خفيف جدًا.
 * لا يلمس localStorage ولا tasks.
 */
setInterval(
    checkForNewDay,
    30 * 1000
);

/* =========================================================
   NORMALIZE
========================================================= */

function normalizeTask(task) {

    if (
        !task ||
        typeof task !== "object"
    ) {
        return null;
    }

    const text =
        String(task.text || "")
            .trim()
            .slice(0, 500);

    if (!text) {
        return null;
    }

    const createdAt =
        task.createdAt ||
        new Date().toISOString();

    let taskDay =
        task.taskDay;

    /*
     * حماية للبيانات القديمة:
     * لو taskDay غير موجود، نستخرجه
     * من تاريخ إنشاء النية.
     */
    if (!taskDay) {

        taskDay =
            getDateKey(
                new Date(createdAt)
            );

    }

    return {

        id:
            String(
                task.id ||
                `${Date.now()}-${Math.random()}`
            ),

        text,

        completed:
            Boolean(task.completed),

        starred:
            Boolean(task.starred),

        createdAt,

        taskDay,

        completedAt:
            task.completedAt || null

    };

}

tasks =
    tasks
        .map(normalizeTask)
        .filter(Boolean);

/*
 * نحفظ البيانات بعد التطبيع مرة واحدة.
 * لا يوجد أي حذف حسب التاريخ.
 */
saveJSON(
    STORAGE_KEY,
    tasks
);

/* =========================================================
   ANALYTICS
========================================================= */

function analytics(event, params = {}) {

    try {

        if (
            typeof gtag === "function"
        ) {

            gtag(
                "event",
                event,
                params
            );

        }

    } catch {}

}

/* =========================================================
   ADD
========================================================= */

function addTask(text) {

    const clean =
        String(text || "")
            .trim()
            .slice(0, 500);

    if (!clean) {
        return false;
    }

    const task = {

        id:
            `${Date.now()}-${Math.random()
                .toString(36)
                .slice(2, 9)}`,

        text: clean,

        completed: false,

        starred: false,

        createdAt:
            new Date().toISOString(),

        taskDay:
            getDateKey(),

        completedAt: null

    };

    tasks.unshift(task);

    saveJSON(
        STORAGE_KEY,
        tasks
    );

    analytics("add_task");

    currentView = "today";

    render();

    return true;

}

/* =========================================================
   FIND
========================================================= */

function findTask(id) {

    return tasks.find(
        task =>
            String(task.id) ===
            String(id)
    );

}

/* =========================================================
   COMPLETE
========================================================= */

function completeTask(id) {

    const task =
        findTask(id);

    if (!task) {
        return;
    }

    if (task.completed) {

        task.completed = false;
        task.completedAt = null;

    } else {

        task.completed = true;

        task.completedAt =
            new Date().toISOString();

        analytics("complete_task");

        playCompleteSound();

    }

    saveJSON(
        STORAGE_KEY,
        tasks
    );

    render();

    if (task.completed) {

        requestAnimationFrame(() => {

            const element =
                document.querySelector(
                    `[data-task-id="${CSS.escape(String(id))}"]`
                );

            if (element) {

                element.classList.add(
                    "just-completed"
                );

                setTimeout(() => {

                    element.classList.remove(
                        "just-completed"
                    );

                }, 650);

            }

        });

    }

}

/* =========================================================
   STAR
========================================================= */

function toggleStar(id) {

    const task =
        findTask(id);

    if (!task) {
        return;
    }

    task.starred =
        !task.starred;

    saveJSON(
        STORAGE_KEY,
        tasks
    );

    analytics(
        "star_task",
        {
            starred:
                task.starred
        }
    );

    render();

}

/* =========================================================
   DELETE
========================================================= */

function deleteTask(id) {

    const index =
        tasks.findIndex(
            task =>
                String(task.id) ===
                String(id)
        );

    if (index === -1) {
        return;
    }

    const task =
        tasks[index];

    tasks.splice(
        index,
        1
    );

    trash.unshift({
        ...task,
        deletedAt:
            new Date().toISOString()
    });

    deletedTask = {
        task,
        index
    };

    saveJSON(
        STORAGE_KEY,
        tasks
    );

    saveJSON(
        TRASH_KEY,
        trash
    );

    analytics("delete_task");

    render();

    showToast(
        settings.language === "en"
            ? "Task deleted"
            : "تم حذف النية"
    );

    clearTimeout(deleteTimer);

    deleteTimer =
        setTimeout(() => {

            deletedTask = null;

            hideToast();

        }, 5000);

}

/* =========================================================
   UNDO
========================================================= */

function undoDelete() {

    if (!deletedTask) {
        return;
    }

    const {
        task,
        index
    } = deletedTask;

    const trashIndex =
        trash.findIndex(
            item =>
                String(item.id) ===
                String(task.id)
        );

    if (trashIndex !== -1) {

        trash.splice(
            trashIndex,
            1
        );

    }

    tasks.splice(
        Math.min(
            index,
            tasks.length
        ),
        0,
        task
    );

    deletedTask = null;

    clearTimeout(
        deleteTimer
    );

    saveJSON(
        STORAGE_KEY,
        tasks
    );

    saveJSON(
        TRASH_KEY,
        trash
    );

    hideToast();

    render();

}

/* =========================================================
   SORT
========================================================= */

function sortActive(a, b) {

    if (
        a.starred !==
        b.starred
    ) {

        return (
            Number(b.starred) -
            Number(a.starred)
        );

    }

    return (
        new Date(b.createdAt) -
        new Date(a.createdAt)
    );

}

function sortCompleted(a, b) {

    return (
        new Date(
            b.completedAt ||
            b.createdAt
        ) -
        new Date(
            a.completedAt ||
            a.createdAt
        )
    );

}

/* =========================================================
   SECTION
========================================================= */

function appendSection(label) {

    const section =
        document.createElement(
            "div"
        );

    section.className =
        "section-label";

    const span =
        document.createElement(
            "span"

    span.textContent =
        label;

    section.appendChild(

    tasksContainer.appendChild(

}

/* =========================================================
   TASK ELEMENT
========================================================= */

function createTaskElement(
    task,
    carried = false
) {

    const article =
        document.createElement(
            "article"
        );

    article.className =
        "task";

    if (task.completed) {

        article.classList.add(
            "completed"
        );

    }

    article.dataset.taskId =
        String(task.id);

    const checkHit =
        document.createElement(
            "button"
        );

    checkHit.type =
        "button";

    checkHit.className =
        "check-hit";

    checkHit.dataset.action =
        "complete";

    checkHit.setAttribute(
        "aria-label",
        task.completed
            ? (
                settings.language === "en"
                    ? "Mark incomplete"
                    : "إلغاء الإنجاز"
            )
            : (
                settings.language === "en"
                    ? "Complete task"
                    : "إنجاز النية"
            )
    );

    const check =
        document.createElement(
            "span"
        );

    check.className =
        "check";

    check.innerHTML = `
        <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
        >
            <path d="M5 12.5l4.2 4.2L19 7"></path>
        </svg>
    `;

    checkHit.appendChild(
        check
    );

    const main =
        document.createElement(
            "div"
        );

    main.className =
        "task-main";

    main.dataset.action =
        "menu";

    const title =
        document.createElement(
            "div"
        );

    title.className =
        "task-title";

    title.textContent =
        task.text;

    main.appendChild(
        title
    );

    if (
        carried &&
        !task.completed
    ) {

        const carriedLabel =
            document.createElement(
                "div"
            );

        carriedLabel.className =
            "task-carried";

        carriedLabel.textContent =
            settings.language === "en"
                ? "From an earlier day"
                : "من يوم سابق";

        main.appendChild(
            carriedLabel
        );

    }

    const star =
        document.createElement(
            "button"
        );

    star.type =
        "button";

    star.className =
        "star-btn";

    if (task.starred) {

        star.classList.add(
            "starred"
        );

    }

    star.dataset.action =
        "star";

    star.setAttribute(
        "aria-label",
        task.starred
            ? (
                settings.language === "en"
                    ? "Remove star"
                    : "إلغاء التمييز"
            )
            : (
                settings.language === "en"
                    ? "Star task"
                    : "تمييز النية"
            )
    );

    star.setAttribute(
        "aria-pressed",
        String(task.starred)
    );

    star.textContent =
        task.starred
            ? "★"
            : "☆";

    article.append(
        checkHit,
        main,
        star
    );

    return article;

}

/* =========================================================
   RENDER
========================================================= */

function render() {

    updateProgress();

    tasksContainer.innerHTML =
        "";

    const today =
        getDateKey();

    let visibleTasks = [];

    if (currentView === "today") {

        /*
         * IMPORTANT:
         *
         * اليوم = نوايا اليوم
         * + أي نية قديمة غير مكتملة.
         *
         * لا نحذف ولا ننقل النية.
         * فقط نعرضها.
         */
        visibleTasks =
            tasks
                .filter(
                    task =>
                        task.taskDay === today ||
                        !task.completed
                )
                .sort(
                    (a, b) => {

                        if (
                            a.completed !==
                            b.completed
                        ) {

                            return (
                                Number(a.completed) -
                                Number(b.completed)
                            );

                        }

                        if (
                            a.starred !==
                            b.starred
                        ) {

                            return (
                                Number(b.starred) -
                                Number(a.starred)
                            );

                        }

                        return (
                            new Date(b.createdAt) -
                            new Date(a.createdAt)
                        );

                    }
                );

    } else if (currentView === "completed") {

        visibleTasks =
            tasks
                .filter(
                    task =>
                        task.completed
                )
                .sort(sortCompleted);

    } else {

        visibleTasks =
            tasks
                .slice()
                .sort(
                    (a, b) => {

                        if (
                            a.completed !==
                            b.completed
                        ) {

                            return (
                                Number(a.completed) -
                                Number(b.completed)
                            );

                        }

                        return sortActive(a, b);

                    }
                );

    }

    if (!visibleTasks.length) {

        const emptyText =
            getEmptyText();

        tasksContainer.innerHTML = `

            <div class="empty">

                <div
                    class="empty-icon"
                    aria-hidden="true"
                >
                    🌱
                </div>

                <strong>
                    ${emptyText[0]}
                </strong>

                <span>
                    ${emptyText[1]}
                </span>

            </div>

        `;

        updateMenuState();

        return;

    }

    if (currentView === "today") {

        const active =
            visibleTasks.filter(
                task =>
                    !task.completed
            );

        const completed =
            visibleTasks.filter(
                task =>
                    task.completed &&
                    task.taskDay === today
            );

        /*
         * النوايا القديمة غير المكتملة
         * تظهر مع نوايا اليوم.
         */
        const carried =
            active.filter(
                task =>
                    task.taskDay !== today
            );

        const todayActive =
            active.filter(
                task =>
                    task.taskDay === today
            );

        if (todayActive.length) {

            appendSection(
                settings.language === "en"
                    ? "Today"
                    : "نوايا اليوم"
            );

            todayActive.forEach(
                task => {

                    tasksContainer.appendChild(
                        createTaskElement(task)
                    );

                }
            );

        }

        if (carried.length) {

            appendSection(
                settings.language === "en"
                    ? "From earlier days"
                    : "من أيام سابقة"
            );

            carried.forEach(
                task => {

                    tasksContainer.appendChild(
                        createTaskElement(
                            task,
                            true
                        )
                    );

                }
            );

        }

        if (completed.length) {

            appendSection(
                settings.language === "en"
                    ? "Completed today"
                    : "النوايا المحققة اليوم"
            );

            completed.forEach(
                task => {

                    tasksContainer.appendChild(
                        createTaskElement(task)
                    );

                }
            );

        }

    } else if (currentView === "all") {

        const active =
            visibleTasks.filter(
                task =>
                    !task.completed
            );

        const completed =
            visibleTasks.filter(
                task =>
                    task.completed
            );

        if (active.length) {

            appendSection(
                settings.language === "en"
                    ? "All intentions"
                    : "كل النوايا"
            );

            active.forEach(
                task => {

                    const carried =
                        task.taskDay !== today;

                    tasksContainer.appendChild(
                        createTaskElement(
                            task,
                            carried
                        )
                    );

                }
            );

        }

        if (completed.length) {

            appendSection(
                settings.language === "en"
                    ? "Completed"
                    : "النوايا المحققة"
            );

            completed.forEach(
                task => {

                    tasksContainer.appendChild(
                        createTaskElement(task)
                    );

                }
            );

        }

    } else {

        appendSection(
            settings.language === "en"
                ? "Completed"
                : "النوايا المحققة"
        );

        visibleTasks.forEach(
            task => {

                tasksContainer.appendChild(
                    createTaskElement(task)
                );

            }
        );

    }

    updateMenuState();

}

/* =========================================================
   TASK EVENTS
========================================================= */

tasksContainer.addEventListener(
    "click",
    event => {

        if (longPressTriggered) {

            longPressTriggered =
                false;

            return;

        }

        const target =
            event.target;

        const taskElement =
            target.closest(".task");

        if (!taskElement) {
            return;
        }

        const id =
            taskElement.dataset.taskId;

        const actionElement =
            target.closest("[data-action]");

        if (!actionElement) {
            return;
        }

        const action =
            actionElement.dataset.action;

        if (action === "complete") {

            completeTask(id);
            return;

        }

        if (action === "star") {

            toggleStar(id);
            return;

        }

        if (action === "menu") {

            openAction(id);

        }

    }
);

/* =========================================================
   LONG PRESS
========================================================= */

tasksContainer.addEventListener(
    "pointerdown",
    event => {

        const main =
            event.target.closest(
                ".task-main"
            );

        if (!main) {
            return;
        }

        if (
            event.pointerType ===
            "mouse"
        ) {
            return;
        }

        const task =
            main.closest(".task");

        if (!task) {
            return;
        }

        const id =
            task.dataset.taskId;

        longPressTriggered =
            false;

        clearTimeout(
            longPressTimer
        );

        longPressTimer =
            setTimeout(() => {

                longPressTriggered =
                    true;

                openAction(id);

            }, 550);

    }
);

[
    "pointerup",
    "pointercancel",
    "pointerleave"
].forEach(type => {

    tasksContainer.addEventListener(
        type,
        () => {

            clearTimeout(
                longPressTimer
            );

        }
    );

});

   RIGHT CLICK
========================================================= */

tasksContainer.addEventListener(

    event => {

        const taskElement =

        if (!taskElement) {

   INPUT
========================================================= */

function resizeInput() {

    taskInput.style.height =
        "auto";

    taskInput.style.height =
        `${Math.min(
            taskInput.scrollHeight,
            115
        )}px`;

}

function updateSubmitButton() {

    const hasText =
        taskInput.value
            .trim()
            .length > 0;

    submitBtn.disabled =
        !hasText;

    submitBtn.classList.toggle(
        "active",
        hasText
    );

}

taskInput.addEventListener(
    "input",
    () => {

        resizeInput();
        updateSubmitButton();

        /*
         * صوت الكتابة مسموع عادي.
         */
        if (
            taskInput.value.length > 0
        ) {

            playTypingSound();

        }

    }
);

function handleSend() {

    const text =
        taskInput.value.trim();

    if (!text) {
        return;
    }

    if (
        addTask(text)
    ) {

        taskInput.value =
            "";

        taskInput.style.height =
            "42px";

        updateSubmitButton();

        taskInput.focus();

        tasksContainer.scrollTop =
            0;

    }

}

submitBtn.addEventListener(
    "click",
    handleSend
);

taskInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            handleSend();

        }

    }
);

/* =========================================================
   PROGRESS
========================================================= */

function updateProgress() {

    const today =
        getDateKey();

    /*
     * نسبة الإنجاز تخص نوايا اليوم فقط.
     * النوايا القديمة لا تغيّر نسبة اليوم.
     */
    const todayTasks =
        tasks.filter(
            task =>
                task.taskDay === today
        );

    const total =
        todayTasks.length;

    const done =
        todayTasks.filter(
            task =>
                task.completed
        ).length;

    if (!total) {

        progressFill.style.width =
            "0%";

        progressText.textContent =
            settings.language === "en"
                ? "Start your first task"
                : "ابدأ أول نية";

        progressBar.setAttribute(
            "aria-valuenow",
            "0"
        );

        return;

    }

    const percentage =
        Math.round(
            done / total * 100
        );

    progressFill.style.width =
        `${percentage}%`;

    progressBar.setAttribute(
        "aria-valuenow",
        String(percentage)
    );

    progressText.textContent =
        settings.language === "en"
            ? `${done} of ${total} · ${percentage}%`
            : `${done} من ${total} · ${percentage}%`;

}

/* =========================================================
   APPLY SETTINGS
========================================================= */

function applySettings() {

    const en =
        settings.language === "en";

    document.documentElement.lang =
        settings.language;

    document.documentElement.dir =
        en
            ? "ltr"
            : "rtl";

    document.body.dataset.accent =
        settings.accent;

    document.body.classList.toggle(
        "light",
        settings.theme === "light"
    );

    brandName.textContent =
        en
            ? "NAWY"
            : "ناوي";

    document.title =
        en
            ? "NAWY — What are you up to today?"
            : "ناوي — على إيه النهارده؟";

    document.querySelector(
        'meta[name="apple-mobile-web-app-title"]'
    ).setAttribute(
        "content",
        en ? "NAWY" : "ناوي"
    );

    document.querySelector(
        'meta[name="description"]'
    ).setAttribute(
        "content",
        en
            ? "NAWY — Write your intention. Get it done."
            : "ناوي — اكتب نيتك وأنجزها."
    );

    menuBtn.setAttribute(
        "aria-label",
        en
            ? "Menu"
            : "القائمة"
    );

    document.querySelectorAll(
        "[data-language]"
    ).forEach(
        button => {

            button.classList.toggle(
                "active",
                button.dataset.language ===
                settings.language
            );

        }
    );

    document.querySelectorAll(
        "[data-theme]"
    ).forEach(
        button => {

            button.classList.toggle(
                "active",
                button.dataset.theme ===
                settings.theme
            );

        }
    );

    document.querySelectorAll(
        "[data-accent-choice]"
    ).forEach(
        button => {

            button.classList.toggle(
                "active",
                button.dataset.accentChoice ===
                settings.accent
            );

        }
    );

    updateStaticText();

    updateDate();

    render();

}

            ? "Settings"

    languageLabel.textContent =

            ? "Appearance"

    accentLabel.textContent =
        en
            ? "Accent"
            : "اللون";

    trashLabel.textContent =
        en
            ? "Trash"
            : "سلة المحذوفات";

    trashTitle.textContent =
        en
            ? "Trash"
            : "سلة المحذوفات";

    completeLabel.textContent =

            ? "Complete"

    editLabel.textContent =

    deleteLabel.textContent =

/* =========================================================
   TRASH
========================================================= */

function openTrashPanel() {

    closeSettings();

    renderTrash();

    trashPanel.classList.add(
        "show"
    );

    trashPanel.setAttribute(
        "aria-hidden",
        "false"
    );

}

function closeTrashPanel() {

    trashPanel.classList.remove(
        "show"
    );

    trashPanel.setAttribute(
        "aria-hidden",
        "true"
    );

}

openTrash.addEventListener(
    "click",
    openTrashPanel
);

trashClose.addEventListener(
    "click",
    closeTrashPanel
);

trashPanel.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            trashPanel
        ) {

            closeTrashPanel();

        }

    }
);

/* =========================================================
   RENDER TRASH
========================================================= */

function renderTrash() {

    trashContainer.innerHTML =
        "";

    if (!trash.length) {

        trashContainer.innerHTML = `

            <div class="trash-empty">
                ${
                    settings.language === "en"
                        ? "Trash is empty."
                        : "سلة المحذوفات فارغة."
                }
            </div>

        `;

        return;

    }

    trash.forEach(
        item => {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "trash-item";

            const text =
                document.createElement(
                    "div"
                );

            text.className =
                "trash-text";

            text.textContent =
                item.text;

            const actions =
                document.createElement(
                    "div"
                );

            actions.className =
                "trash-actions";

            const restore =
                document.createElement(
                    "button"
                );

            restore.type =
                "button";

            restore.textContent =
                settings.language === "en"
                    ? "Restore"
                    : "استعادة";

            restore.addEventListener(
                "click",
                () => {

                    restoreTrashItem(
                        item.id
                    );

                }
            );

            const permanent =
                document.createElement(
                    "button"
                );

            permanent.type =
                "button";

            permanent.className =
                "permanent";

            permanent.textContent =
                settings.language === "en"
                    ? "Delete forever"
                    : "حذف نهائي";

            permanent.addEventListener(
                "click",
                () => {

                    permanentlyDelete(
                        item.id
                    );

                }
            );

            actions.append(
                restore,
                permanent
            );

            row.append(
                text,
                actions
            );

            trashContainer.appendChild(
                row
            );

        }
    );

}

/* =========================================================
   RESTORE
========================================================= */

function restoreTrashItem(id) {

    const index =
        trash.findIndex(
            item =>
                String(item.id) ===
                String(id)
        );

    if (index === -1) {
        return;
    }

    const task =
        trash[index];

    delete task.deletedAt;

    tasks.unshift(
        task
    );

    trash.splice(
        index,
        1
    );

    saveJSON(
        STORAGE_KEY,
        tasks
    );

    saveJSON(
        TRASH_KEY,
        trash
    );

    analytics(
        "restore_task"
    );

    renderTrash();

    render();

}

/* =========================================================
   PERMANENT DELETE
========================================================= */

function permanentlyDelete(id) {

    trash =
        trash.filter(
            item =>
                String(item.id) !==
                String(id)
        );

    saveJSON(
        TRASH_KEY,
        trash
    );

    analytics(
        "permanent_delete_task"
    );

    renderTrash();

}

/* =========================================================
   EDIT EVENTS
========================================================= */

editSave.addEventListener(
    "click",
    saveEdit
);

editCancel.addEventListener(
    "click",
    closeEdit
);

editOverlay.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            editOverlay
        ) {

            closeEdit();

        }

    }
);

/* =========================================================
   ESC
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key !== "Escape"
        ) {
            return;
        }

        closeMenu();
        closeAction();
        closeEdit();
        closeSettings();
        closeTrashPanel();

    }
);

/* =========================================================
   VISIBILITY
========================================================= */

document.addEventListener(
    "visibilitychange",
    () => {

        if (!document.hidden) {

            /*
             * عند الرجوع للتطبيق:
             * لا نحذف أي شيء.
             * فقط نراجع اليوم الحالي ونعيد الرسم.
             */

            checkForNewDay();

            updateDate();

            render();

        }

    }
);

/* =========================================================
   PAGE FOCUS
========================================================= */

window.addEventListener(
    "focus",
    () => {

        checkForNewDay();

    }
);

/* =========================================================
   SERVICE WORKER
========================================================= */

if (
    "serviceWorker" in navigator
) {

    window.addEventListener(
        "load",
        () => {

            navigator.serviceWorker
                .register(
                    "./sw.js",
                    {
                        scope: "./"
                    }
                )
                .catch(
                    error => {

                        console.warn(
                            "NAWY SW:",
                            error
                        );

                    }
                );

        }
    );

}

/* =========================================================
   START
========================================================= */

applySettings();

updateSubmitButton();

checkForNewDay();

})();

</script>
