           NAWY — ONE FILE APP
           Clean / Modern / Dark / Arabic
        ===================================================== */

        :root {
            --bg: #0d0d0d;
            --surface: #191919;
            --surface-hover: #1d1d1d;

            --text: #f4f4f4;
            --text-soft: #e5e5e5;

            --muted: #888;

            --green: #19c58b;

        }


        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;

            -webkit-tap-highlight-color: transparent;
        }

        html {
            width: 100%;
            min-height: 100%;

            background: var(--bg);

            color-scheme: dark;
        }

        body {

            background: var(--bg);

                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                "Noto Sans Arabic",
                "Noto Kufi Arabic",
                Tahoma,
                Arial,
                sans-serif;

            overflow: hidden;

            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        button,
        textarea {
            font: inherit;
        }

        button {
            border: 0;
            outline: 0;

            cursor: pointer;

            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }


        /* =====================================================
           APP
        ===================================================== */

        .app {
            position: relative;

            width: 100%;
            height: 100dvh;
            min-height: 100dvh;

            display: flex;
            flex-direction: column;

            background:
                radial-gradient(

           HEADER
        ===================================================== */

        .header {
            width: 100%;

        .section-label {

            content: "";

            height: 1px;

            flex: 1;

            background: var(--line);

        .section-label span {
            white-space: nowrap;

        /* =====================================================
           TASK
        ===================================================== */

        .task {
            width: 100%;

            min-height: 63px;

            display: flex;
            align-items: center;

            gap: 13px;

            padding: 9px 2px;

            border-bottom:
                1px solid var(--line);

            cursor: pointer;

            transition:
                opacity 0.2s ease,
                transform 0.15s ease;
        }

        .task:last-child {
            border-bottom-color: transparent;
        }

        .task:active {
            transform: scale(.995);
        }


        /* =====================================================
           CHECK
        ===================================================== */

        .check {
            position: relative;

            width: 24px;
            height: 24px;

            flex: 0 0 24px;

            display: grid;
            place-items: center;

            border:
                1.8px solid #68716d;

            border-radius: 50%;

            background: transparent;

            transition:
                background .18s ease,
                border-color .18s ease,
                transform .18s cubic-bezier(.18, .9, .3, 1.3),
                box-shadow .18s ease;
        }

        .check::after {
            content: "✓";

            position: absolute;

            color: var(--green);

            font-size: 14px;
            font-weight: 900;

            line-height: 1;

            opacity: 0;

            transform: scale(.5);

            transition:
                opacity .16s ease,
                transform .18s cubic-bezier(.18, .9, .3, 1.3);
        }


        /* Preview before click */

        .task:not(.completed):hover .check {
            background:
                var(--green-soft);

            border-color:
                var(--green);

            transform:
                scale(1.07);

            box-shadow:
                0 0 0 4px
                rgba(25, 197, 139, .055);
        }

        .task:not(.completed):hover .check::after {
            opacity: .9;

            transform:
                scale(1);
        }


        /* Completed */

        .task.completed .check {
            background:
                var(--green);

            border-color:
                var(--green);
        }

        .task.completed .check::after {
            opacity: 1;

            color: #07130f;

            transform:
                scale(1);
        }


        /* =====================================================
           COMPLETION ANIMATION
        ===================================================== */

        .task.just-completed .check {
            animation:
                check-pop
                .5s
                cubic-bezier(.18, .9, .3, 1.3);
        }

        @keyframes check-pop {
            0% {
                transform: scale(1);
                box-shadow:
                    0 0 0 0
                    rgba(25, 197, 139, .0);
            }

            40% {
                transform: scale(1.28);
                box-shadow:
                    0 0 0 8px
                    rgba(25, 197, 139, .11);
            }

            72% {
                transform: scale(.94);
            }

            100% {
                transform: scale(1);
                box-shadow:
                    0 0 0 0
                    rgba(25, 197, 139, .0);
            }
        }

           TASK TEXT

        .icon-btn.starred {
            color: var(--yellow);

        .icon-btn.delete:hover {
            color: var(--danger);
        }

        .empty {

        .empty span {
            color: var(--muted);

        }


        /* =====================================================
           COMPOSER
        ===================================================== */

        .composer-area {
            position: absolute;

            left: 0;
            right: 0;

                18px

        .composer-shell {
            width: 100%;

        }

        .composer {

                7px

        /* =====================================================

        .submit {

        .submit.active {

        .submit.active:hover {

        .submit.active:active {

        }

        .submit:disabled {

        }

        .send-arrow {

        }

        .hint {

        .toast {

            visibility: visible;

            pointer-events: auto;

                translate(-50%, 0);
        }

        .toast-message {
            color: #e7e7e7;

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

        }
    </style>
</head>

<script>
/* =========================================================
   NAWY — APPLICATION LOGIC
========================================================= */

(() => {

    "use strict";


    /* =====================================================
       CONSTANTS
    ===================================================== */

    const STORAGE_KEY =
        "nawy_tasks_v6";

    const OLD_KEYS = [
        "nawy_tasks_v5",
        "nawy_tasks_v4",
        "nawy_tasks_v3"
    ];

    const DELETED_TTL =
        5000;


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const taskInput =
        document.getElementById("taskInput");

    const submitBtn =
        document.getElementById("submitBtn");

    const tasksContainer =
        document.getElementById("tasksContainer");

    const progressFill =
        document.getElementById("progressFill");

    const progressText =
        document.getElementById("progressText");

    const currentDate =
        document.getElementById("currentDate");

    const toast =
        document.getElementById("toast");

    const toastMessage =
        document.getElementById("toastMessage");

    const toastUndo =
        document.getElementById("toastUndo");

    const installOverlay =
        document.getElementById("installOverlay");

    const installBtn =
        document.getElementById("installBtn");

    const installClose =
        document.getElementById("installClose");

    const installGuide =
        document.getElementById("installGuide");

    const guideClose =
        document.getElementById("guideClose");

    const guideText =
        document.getElementById("guideText");


    /* =====================================================
       STATE
    ===================================================== */

    let tasks =
        loadTasks();

    let deletedTask = null;

    let deleteTimer = null;

    let deferredInstallPrompt = null;

    let audioContext = null;


    /* =====================================================
       DATE HELPERS
    ===================================================== */

    function getDateKey(date = new Date()) {

        const year =
            date.getFullYear();

        const month =
            String(
                date.getMonth() + 1
            ).padStart(2, "0");

        const day =
            String(
                date.getDate()
            ).padStart(2, "0");

        return `${year}-${month}-${day}`;
    }


    const TODAY =
        getDateKey();


    function formatDate(date = new Date()) {

        return new Intl.DateTimeFormat(
            "ar-EG",
            {
                weekday: "long",
                day: "numeric",
                month: "long"
            }
        ).format(date);
    }


    currentDate.textContent =
        formatDate();


    /* =====================================================
       NORMALIZE TASKS
    ===================================================== */

    function normalizeTask(raw) {

        if (
            !raw ||
            typeof raw !== "object"
        ) {
            return null;
        }

        const text =
            String(
                raw.text || ""
            ).trim();

        if (!text) {
            return null;
        }


        const createdAt =
            raw.createdAt ||
            new Date().toISOString();


        return {

            id:
                String(
                    raw.id ||
                    `${Date.now()}-${Math.random()}`
                ),

            text,

            completed:
                Boolean(
                    raw.completed
                ),

            starred:
                Boolean(
                    raw.starred
                ),

            createdAt,

            /*
               taskDay هو يوم إنشاء النية.
               القديم بدون taskDay يأخذ يوم createdAt.
            */

            taskDay:
                raw.taskDay ||
                getDateKey(
                    new Date(createdAt)
                )
        };
    }


    function normalizeTaskList(list) {

        return list
            .map(normalizeTask)
            .filter(Boolean);
    }


    /* =====================================================
       LOAD
    ===================================================== */

    function loadTasks() {

        try {

            const current =
                JSON.parse(
                    localStorage.getItem(
                        STORAGE_KEY
                    )
                );


            if (
                Array.isArray(current)
            ) {

                return normalizeTaskList(
                    current
                );
            }


            for (
                const key
                of OLD_KEYS
            ) {

                const old =
                    JSON.parse(
                        localStorage.getItem(
                            key
                        )
                    );


                if (
                    Array.isArray(old)
                ) {

                    const migrated =
                        normalizeTaskList(
                            old
                        );


                    /*
                       نحفظ النسخة المطورة
                    */

                    localStorage.setItem(
                        STORAGE_KEY,
                        JSON.stringify(
                            migrated
                        )
                    );


                    return migrated;
                }
            }

        } catch (error) {

            console.warn(
                "NAWY storage:",
                error
            );
        }


        return [];
    }


    /* =====================================================
       SAVE
    ===================================================== */

    function save() {

        try {

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(tasks)
            );

        } catch (error) {

            console.warn(
                "NAWY save:",
                error
            );
        }
    }


    /* =====================================================
       AUDIO
       لا صوت عند الإضافة.
       Chime فقط عند الإنجاز.
    ===================================================== */

    function getAudioContext() {

        try {

            const AudioContext =
                window.AudioContext ||
                window.webkitAudioContext;


            if (!AudioContext) {
                return null;
            }


            if (!audioContext) {

                audioContext =
                    new AudioContext();

            }


            if (
                audioContext.state ===
                "suspended"
            ) {

                audioContext
                    .resume()
                    .catch(() => {});
            }


            return audioContext;

        } catch {

            return null;
        }
    }


    function playCompletionChime() {

        const ctx =
            getAudioContext();

        if (!ctx) {
            return;
        }


        try {

            const now =
                ctx.currentTime;


            /*
               Chime قصير وناعم.
            */

            const notes = [
                {
                    frequency: 783.99,
                    offset: 0,
                    duration: 0.16,
                    volume: 0.035
                },
                {
                    frequency: 987.77,
                    offset: 0.065,
                    duration: 0.24,
                    volume: 0.042
                }
            ];


            notes.forEach(
                note => {

                    const osc =
                        ctx.createOscillator();

                    const gain =
                        ctx.createGain();


                    const start =
                        now +
                        note.offset;

                    const end =
                        start +
                        note.duration;


                    osc.type =
                        "sine";


                    osc.frequency.setValueAtTime(
                        note.frequency,
                        start
                    );


                    gain.gain.setValueAtTime(
                        0.0001,
                        start
                    );


                    gain.gain.exponentialRampToValueAtTime(
                        note.volume,
                        start + 0.012
                    );


                    gain.gain.exponentialRampToValueAtTime(
                        0.0001,
                        end
                    );


                    osc.connect(gain);

                    gain.connect(
                        ctx.destination
                    );


                    osc.start(start);

                    osc.stop(
                        end + 0.015
                    );
                }
            );

        } catch (error) {

            console.warn(
                "NAWY audio:",
                error
            );
        }
    }


    /* =====================================================
       ADD TASK
       اسم الدالة محفوظ كما هو
    ===================================================== */

    function addTask(text) {

        const clean =
            String(text || "")
                .trim();


        if (!clean) {
            return false;
        }


        const task = {

            id:
                `${Date.now()}-${Math.random()
                    .toString(36)
                    .slice(2, 7)}`,

            text:
                clean.slice(0, 500),

            completed:
                false,

            starred:
                false,

            createdAt:
                new Date().toISOString(),

            taskDay:
                getDateKey()
        };


        tasks.unshift(task);

        save();

        render();

        return true;
    }


    /* =====================================================
       TOGGLE TASK
    ===================================================== */

    function toggleTask(id) {

        const task =
            tasks.find(
                item =>
                    String(item.id) ===
                    String(id)
            );


        if (!task) {
            return;
        }


        task.completed =
            !task.completed;


        save();

        render();


        if (
            task.completed
        ) {

            /*
               الصوت + التأثير بعد الرسم
            */

            playCompletionChime();

            requestAnimationFrame(
                () => {

                    showCompletionFeedback(
                        task.id
                    );

                }
            );
        }
    }


    /* =====================================================
       STAR
    ===================================================== */

    function toggleStar(id) {

        const task =
            tasks.find(
                item =>
                    String(item.id) ===
                    String(id)
            );


        if (!task) {
            return;
        }


        task.starred =
            !task.starred;


        save();

        render();
    }


    /* =====================================================
       DELETE + UNDO
    ===================================================== */

    function deleteTask(id) {

        const index =
            tasks.findIndex(
                item =>
                    String(item.id) ===
                    String(id)
            );


        if (index === -1) {
            return;
        }


        deletedTask = {
            task:
                tasks[index],

            index
        };


        tasks.splice(
            index,
            1
        );


        save();

        render();

        showToast(
            "تم حذف النية"
        );


        clearTimeout(
            deleteTimer
        );


        deleteTimer =
            setTimeout(
                () => {

                    deletedTask =
                        null;

                    hideToast();

                },
                DELETED_TTL
            );
    }


    function undoDelete() {

        if (!deletedTask) {
            return;
        }


        const {
            task,
            index
        } = deletedTask;


        tasks.splice(
            Math.min(
                index,
                tasks.length
            ),
            0,
            task
        );


        deletedTask =
            null;


        clearTimeout(
            deleteTimer
        );


        save();

        render();

        hideToast();
    }


    /* =====================================================
       TOAST
    ===================================================== */

    function showToast(message) {

        toastMessage.textContent =
            message;

        toast.classList.add(
            "show"
        );
    }


    function hideToast() {

        toast.classList.remove(
            "show"
        );
    }


    toastUndo.addEventListener(
        "click",
        undoDelete
    );


    /* =====================================================
       DAILY PROGRESS
       فقط مهام اليوم تدخل في النسبة.
       المهام القديمة خارج النسبة.
    ===================================================== */

    function updateProgress() {

        const todayTasks =
            tasks.filter(
                task =>
                    task.taskDay ===
                    TODAY
            );


        const total =
            todayTasks.length;


        const done =
            todayTasks.filter(
                task =>
                    task.completed
            ).length;


        if (!total) {

            progressFill.style.width =
                "0%";

            progressText.textContent =
                "ابدأ أول نية";

            return;
        }


        const percentage =
            Math.round(
                (done / total) * 100
            );


        progressFill.style.width =
            `${percentage}%`;


        if (
            percentage === 100
        ) {

            progressText.textContent =
                `${done} من ${total} · 100%`;

        } else {

            progressText.textContent =
                `${done} من ${total} · ${percentage}%`;
        }
    }


    /* =====================================================
       SORT
    ===================================================== */

    function sortActive(a, b) {

        if (
            a.starred !==
            b.starred
        ) {

            return (
                Number(b.starred) -
                Number(a.starred)
            );
        }


        return (
            new Date(b.createdAt) -
            new Date(a.createdAt)
        );
    }


    function sortCompleted(a, b) {

        return (
            new Date(b.createdAt) -
            new Date(a.createdAt)
        );
    }


    /* =====================================================
       RENDER
    ===================================================== */

    function render() {

        updateProgress();

        tasksContainer.innerHTML =
            "";


        const todayActive =
            tasks
                .filter(
                    task =>
                        !task.completed &&
                        task.taskDay === TODAY
                )
                .sort(sortActive);


        const carriedActive =
            tasks
                .filter(
                    task =>
                        !task.completed &&
                        task.taskDay !== TODAY
                )
                .sort(sortActive);


        const completed =
            tasks
                .filter(
                    task =>
                        task.completed
                )
                .sort(sortCompleted);


        let renderedSomething =
            false;


        /*
           نوايا اليوم
        */

        if (
            todayActive.length
        ) {

            appendSectionTitle(
                "نوايا اليوم"
            );

            todayActive.forEach(
                task => {

                    tasksContainer.appendChild(
                        createTaskElement(task)
                    );

                }
            );

            renderedSomething =
                true;
        }


        /*
           النوايا المستمرة من أيام سابقة
           لا تدخل في النسبة.
        */

        if (
            carriedActive.length
        ) {

            appendSectionTitle(
                "مستمرة من قبل"
            );


            carriedActive.forEach(
                task => {

                    tasksContainer.appendChild(
                        createTaskElement(
                            task,
                            true
                        )
                    );

                }
            );

            renderedSomething =
                true;
        }


        /*
           النوايا المحققة
        */

        if (
            completed.length
        ) {

            appendSectionTitle(
                "النوايا المحققة"
            );


            completed.forEach(
                task => {

                    tasksContainer.appendChild(
                        createTaskElement(task)
                    );

                }
            );


            renderedSomething =
                true;
        }


        if (
            !renderedSomething
        ) {

            tasksContainer.innerHTML = `
                <div class="empty">
                    <div class="empty-icon">
                        🌱
                    </div>

                    <strong>
                        مفيش نوايا هنا
                    </strong>

                    <span>
                        اكتب أول حاجة ناوي تعملها النهارده.
                    </span>
                </div>
            `;
        }
    }


    /* =====================================================
       SECTION TITLE
    ===================================================== */

    function appendSectionTitle(label) {

        const divider =
            document.createElement(
                "div"
            );

        divider.className =
            "section-label";

        divider.innerHTML =
            `<span>${label}</span>`;

        tasksContainer.appendChild(
            divider
        );
    }


    /* =====================================================
       TASK ELEMENT
    ===================================================== */

    function createTaskElement(
        task,
        isCarried = false
    ) {

        const element =
            document.createElement(
                "article"
            );


        element.className =
            `task ${
                task.completed
                    ? "completed"
                    : ""
            }`;


        element.dataset.taskId =
            task.id;


        const check =
            document.createElement(
                "div"
            );

        check.className =
            "check";

        check.setAttribute(
            "aria-hidden",
            "true"
        );


        const main =
            document.createElement(
                "div"
            );

        main.className =
            "task-main";


        const title =
            document.createElement(
                "div"
            );

        title.className =
            "task-title";

        title.textContent =
            task.text;


        main.appendChild(
            title
        );


        if (
            isCarried &&
            !task.completed
        ) {

            const carried =
                document.createElement(
                    "div"
                );

            carried.className =
                "task-carried";

            carried.textContent =
                "من يوم سابق";

            main.appendChild(
                carried
            );
        }


        const actions =
            document.createElement(
                "div"
            );

        actions.className =
            "task-actions";


        const star =
            document.createElement(
                "button"
            );

        star.type =
            "button";

        star.className =
            `icon-btn ${
                task.starred
                    ? "starred"
                    : ""
            }`;

        star.dataset.action =
            "star";

        star.setAttribute(
            "aria-label",
            task.starred
                ? "إلغاء التمييز"
                : "تمييز النية"
        );

        star.textContent =
            task.starred
                ? "★"
                : "☆";


        const remove =
            document.createElement(
                "button"
            );

        remove.type =
            "button";

        remove.className =
            "icon-btn delete";

        remove.dataset.action =
            "delete";

        remove.setAttribute(
            "aria-label",
            "حذف النية"
        );

        remove.textContent =
            "×";


        actions.append(
            star,
            remove
        );


        element.append(
            check,
            main,
            actions
        );


        return element;
    }


    /* =====================================================
       COMPLETION FEEDBACK
    ===================================================== */

    function showCompletionFeedback(id) {

        const taskElement =
            tasksContainer.querySelector(
                `[data-task-id="${CSS.escape(String(id))}"]`
            );


        if (!taskElement) {
            return;
        }


        taskElement.classList.add(
            "just-completed"
        );


        setTimeout(
            () => {

                taskElement.classList.remove(
                    "just-completed"
                );

            },
            600
        );


        /*
           لا نعرض burst إذا المستخدم يقلل الحركة.
        */

        if (
            window.matchMedia(
                "(prefers-reduced-motion: reduce)"
            ).matches
        ) {
            return;
        }


        const check =
            taskElement.querySelector(
                ".check"
            );


        if (!check) {
            return;
        }


        const rect =
            check.getBoundingClientRect();


        const burst =
            document.createElement(
                "div"
            );


        burst.className =
            "completion-burst";


        burst.style.left =
            `${rect.left + rect.width / 2}px`;


        burst.style.top =
            `${rect.top + rect.height / 2}px`;


        const colors = [
            "#19c58b",
            "#f4c84d",
            "#f4f5f4"
        ];


        for (
            let i = 0;
            i < 10;
            i++
        ) {

            const dot =
                document.createElement(
                    "span"
                );


            dot.style.setProperty(
                "--angle",
                `${i * 36}deg`
            );


            dot.style.setProperty(
                "--distance",
                `${25 + (i % 3) * 7}px`
            );


            dot.style.setProperty(
                "--size",
                `${4 + (i % 2)}px`
            );


            dot.style.setProperty(
                "--color",
                colors[
                    i % colors.length
                ]
            );


            burst.appendChild(
                dot
            );
        }


        document.body.appendChild(
            burst
        );


        setTimeout(
            () => {

                burst.remove();

            },
            600
        );
    }


    /* =====================================================
       INPUT
    ===================================================== */

    function updateInput() {

        taskInput.style.height =
            "auto";


        taskInput.style.height =
            Math.min(
                taskInput.scrollHeight,
                120
            ) + "px";


        const hasText =
            taskInput.value.trim()
                .length > 0;


        submitBtn.disabled =
            !hasText;


        submitBtn.classList.toggle(
            "active",
            hasText
        );
    }


    taskInput.addEventListener(
        "input",
        updateInput
    );


    taskInput.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                handleSend();
            }
        }
    );


    submitBtn.addEventListener(
        "click",
        handleSend
    );


    function handleSend() {

        const text =
            taskInput.value.trim();


        if (!text) {
            return;
        }


        if (
            addTask(text)
        ) {

            taskInput.value =
                "";

            taskInput.style.height =
                "42px";

            updateInput();

            taskInput.focus();

            tasksContainer.scrollTop =
                0;
        }
    }


    /* =====================================================
       TASK CLICK
    ===================================================== */

    tasksContainer.addEventListener(
        "click",
        event => {

            const actionButton =
                event.target.closest(
                    ".icon-btn"
                );


            if (actionButton) {

                const taskElement =
                    actionButton.closest(
                        ".task"
                    );


                if (!taskElement) {
                    return;
                }


                const id =
                    taskElement.dataset.taskId;


                const action =
                    actionButton.dataset.action;


                if (
                    action === "star"
                ) {

                    toggleStar(id);

                    return;
                }


                if (
                    action === "delete"
                ) {

                    deleteTask(id);

                    return;
                }
            }


            const taskElement =
                event.target.closest(
                    ".task"
                );


            if (!taskElement) {
                return;
            }


            const id =
                taskElement.dataset.taskId;


            toggleTask(id);
        }
    );


    /* =====================================================
       INSTALL
    ===================================================== */

    window.addEventListener(
        "beforeinstallprompt",
        event => {

            event.preventDefault();

            deferredInstallPrompt =
                event;


            setTimeout(
                () => {

                    if (
                        deferredInstallPrompt &&
                        !isStandalone()
                    ) {

                        installOverlay.classList.add(
                            "show"
                        );

                        installOverlay.setAttribute(
                            "aria-hidden",
                            "false"
                        );
                    }

                },
                8000
            );
        }
    );


    installBtn.addEventListener(
        "click",
        async () => {

            if (
                deferredInstallPrompt
            ) {

                try {

                    deferredInstallPrompt.prompt();

                    await deferredInstallPrompt.userChoice;

                } catch {}

                deferredInstallPrompt =
                    null;

                installOverlay.classList.remove(
                    "show"
                );

                installOverlay.setAttribute(
                    "aria-hidden",
                    "true"
                );

                return;
            }


            installOverlay.classList.remove(
                "show"
            );

            installGuide.classList.add(
                "show"
            );

            installGuide.setAttribute(
                "aria-hidden",
                "false"
            );


            if (
                /iphone|ipad|ipod/i.test(
                    navigator.userAgent
                )
            ) {

                guideText.textContent =
                    "في Safari اضغط مشاركة ثم اختَر إضافة إلى الشاشة الرئيسية.";

            } else {

                guideText.textContent =
                    "من قائمة المتصفح اختَر تثبيت التطبيق أو إضافة إلى الشاشة الرئيسية.";
            }
        }
    );


    installClose.addEventListener(
        "click",
        () => {

            installOverlay.classList.remove(
                "show"
            );

            installOverlay.setAttribute(
                "aria-hidden",
                "true"
            );
        }
    );


    guideClose.addEventListener(
        "click",
        () => {

            installGuide.classList.remove(
                "show"
            );

            installGuide.setAttribute(
                "aria-hidden",
                "true"
            );
        }
    );


    function isStandalone() {

        return (
            window.matchMedia(
                "(display-mode: standalone)"
            ).matches ||
            window.navigator.standalone === true
        );
    }


    /* =====================================================
       SERVICE WORKER
    ===================================================== */

    if (
        "serviceWorker" in navigator
    ) {

        window.addEventListener(
            "load",
            () => {

                navigator.serviceWorker
                    .register(
                        "./sw.js",
                        {
                            scope: "./"
                        }
                    )
                    .catch(() => {});

            }
        );
    }


    /* =====================================================
       START
    ===================================================== */

    updateInput();

    render();

})();
</script>

</body>
</html>
