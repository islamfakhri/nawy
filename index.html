<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#0d0d0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<title>ناوي — على إيه النهارده؟</title>

<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">

<link rel="stylesheet" href="./css/app.css">
</head>

<body>

<div class="app">

    <header class="header">

        <div class="brand">
            <div class="brand-main">
                <div class="brand-mark">🎯</div>
                <div class="brand-name">ناوي</div>
            </div>
        </div>

        <div class="greeting">
            <h1>ناوي على إيه النهارده؟</h1>
            <p id="currentDate">—</p>
        </div>

        <div class="progress">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <div class="progress-text" id="progressText">
                ابدأ أول نية
            </div>
        </div>

    </header>


    <main class="tasks" id="tasksContainer"></main>


    <div class="composer-wrap">

        <div class="composer">

            <textarea
                id="taskInput"
                rows="1"
                maxlength="500"
                placeholder="اكتب اللي ناوي عليه..."
                enterkeyhint="send"
                autocomplete="off"
                spellcheck="false"
            ></textarea>

            <button
                type="button"
                class="submit"
                id="submitBtn"
                aria-label="إضافة نية"
                title="إضافة نية"
            >
                <span class="send-arrow">↑</span>
            </button>

        </div>

        <div class="hint">
            اضغط Enter لإضافة نية جديدة
        </div>

    </div>

</div>


<!-- INSTALL -->

<div
    class="install-overlay"
    id="installOverlay"
    aria-hidden="true"
>
    <div class="install-sheet">

        <div class="install-icon">📱</div>

        <div class="install-copy">
            <div class="install-title">
                ناوي؟ خليه معاك.
            </div>

            <div class="install-subtitle">
                نزّل ناوي وابدأ يومك بنية.
            </div>
        </div>

        <button
            type="button"
            class="install-btn"
            id="installBtn"
        >
            نزّل ناوي
        </button>

        <button
            type="button"
            class="install-close"
            id="installClose"
            aria-label="إغلاق"
        >
            ×
        </button>

    </div>
</div>


<!-- INSTALL GUIDE -->

<div
    class="install-guide"
    id="installGuide"
    aria-hidden="true"
>

    <div class="guide-box">

        <h2>خلّي ناوي معاك 📱</h2>

        <p id="guideText">
            من قائمة المتصفح اختار
            <strong>إضافة إلى الشاشة الرئيسية</strong>
            عشان تستخدم ناوي كتطبيق.
        </p>

        <button
            type="button"
            class="guide-close"
            id="guideClose"
        >
            تمام
        </button>

    </div>

</div>


<script src="./js/app.js"></script>

</body>
</html>
