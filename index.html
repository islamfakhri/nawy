<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#0d0d0d">
  <meta name="color-scheme" content="dark light">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <meta name="description" content="ناوي — مساحتك الخاصة لنواياك وأهدافك.">

  <title>ناوي</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon-512.png" type="image/png">
  <link rel="apple-touch-icon" href="./icon-512.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-3612TKY0RT"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag("js", new Date());
    gtag("config", "G-3612TKY0RT", { anonymize_ip: true });
  </script>

  <style>
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --surface-2: #f4f5f5;
      --surface-3: #eceeef;
      --text: #1a1c1d;
      --muted: #6b7377;
      --border: rgba(17, 20, 21, .06);
      --border-strong: rgba(17, 20, 21, .10);
      --accent: #19a974;
      --accent-soft: rgba(25, 169, 116, .08);
      --danger: #e5484d;
      --warning: #e8a317;
      --shadow-soft: 0 1px 3px rgba(0,0,0,.03);
      --shadow-card: 0 2px 8px rgba(0,0,0,.04);
      --shadow-sheet: 0 16px 50px rgba(0,0,0,.12);
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --radius-xl: 24px;
      --radius-full: 9999px;
      --header-height: 116px;
      --bottom-space: 80px;
      --focus-ring: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent);
      --tab-indicator-width: 28px;
      --tab-indicator-left: 0px;
      --fw-normal: 400;
      --fw-medium: 500;
      --fw-semibold: 600;
      --fw-bold: 700;
      --fw-extrabold: 800;
      --sp-xs: 4px;
      --sp-sm: 8px;
      --sp-md: 12px;
      --sp-lg: 16px;
      --sp-xl: 24px;
      --sp-xxl: 32px;
      --touch-checkbox: 32px;
      --touch-star: 46px;
      --fab-size: 56px;
    }

    html[data-font="small"] {
      --fs-xs: 10px;
      --fs-sm: 12px;
      --fs-md: 13px;
      --fs-base: 14px;
      --fs-lg: 15px;
      --fs-hero: 19px;
    }

    html[data-font="medium"],
    html:not([data-font]) {
      --fs-xs: 11px;
      --fs-sm: 13px;
      --fs-md: 14px;
      --fs-base: 16px;
      --fs-lg: 18px;
      --fs-hero: 22px;
    }

    html[data-font="large"] {
      --fs-xs: 12px;
      --fs-sm: 14px;
      --fs-md: 16px;
      --fs-base: 18px;
      --fs-lg: 20px;
      --fs-hero: 25px;
    }

    html[data-theme="dark"] {
      --bg: #0e1010;
      --surface: #1a1d1d;
      --surface-2: #222626;
      --surface-3: #2c3131;
      --text: #eef1f1;
      --muted: #8b9494;
      --border: rgba(255,255,255,.05);
      --border-strong: rgba(255,255,255,.08);
      --shadow-soft: 0 1px 4px rgba(0,0,0,.15);
      --shadow-card: 0 4px 12px rgba(0,0,0,.20);
      --shadow-sheet: 0 20px 60px rgba(0,0,0,.40);
    }

    html[data-accent="blue"] {
      --accent: #3b82f6;
      --accent-soft: rgba(59,130,246,.08);
    }

    html[data-accent="purple"] {
      --accent: #8b5cf6;
      --accent-soft: rgba(139,92,246,.08);
    }

    html[data-accent="orange"] {
      --accent: #f59e0b;
      --accent-soft: rgba(245,158,11,.10);
    }

    html[data-accent="pink"] {
      --accent: #ec4899;
      --accent-soft: rgba(236,72,153,.08);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      min-height: 100%;
      background: var(--bg);
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family:
        "Cairo",
        "Segoe UI",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        Tahoma,
        Arial,
        sans-serif;
      transition: background .25s ease, color .25s ease;
      overscroll-behavior-y: none;
      touch-action: pan-y;
      font-size: var(--fs-base);
      line-height: 1.6;
    }

    html[lang="en"] body {
      font-family:
        "Segoe UI",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        Arial,
        sans-serif;
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      color: inherit;
      background: none;
      -webkit-tap-highlight-color: transparent;
    }

    textarea,
    input {
      outline: none;
    }

    ::selection {
      background: var(--accent);
      color: #fff;
    }

    a:focus-visible,
    button:focus-visible,
    textarea:focus-visible,
    input:focus-visible,
    [tabindex]:focus-visible {
      outline: none;
      box-shadow: var(--focus-ring);
      border-radius: var(--radius-sm);
    }

    .app {
      width: min(100%, 760px);
      min-height: 100vh;
      margin: 0 auto;
      padding:
        env(safe-area-inset-top)
        var(--sp-lg)
        calc(var(--bottom-space) + env(safe-area-inset-bottom))
        var(--sp-lg);
      touch-action: pan-y;
    }

    .header {
      min-height: var(--header-height);
      position: sticky;
      top: 0;
      z-index: 20;
      padding-top: var(--sp-sm);
      background: linear-gradient(to bottom, var(--bg) 82%, rgba(0,0,0,0));
      display: flex;
      flex-direction: column;
      touch-action: pan-y;
    }

    .header-main {
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-md);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: var(--sp-sm);
      min-width: 0;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: var(--radius-md);
    }

    .brand-mark-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .brand-mark-fallback {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      font-size: 18px;
      font-weight: 800;
      color: var(--accent);
    }

    .brand-name {
      font-size: var(--fs-lg);
      font-weight: var(--fw-extrabold);
      letter-spacing: -.3px;
    }

    .menu-btn {
      width: 44px;
      height: 44px;
      flex: 0 0 auto;
      border-radius: var(--radius-full);
      background: var(--surface);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      font-size: 26px;
      line-height: 1;
      color: var(--muted);
      box-shadow: var(--shadow-soft);
      transition:
        transform .14s ease,
        color .18s ease,
        background .18s ease;
    }

    .menu-btn:active {
      transform: scale(.93);
      background: var(--surface-2);
      color: var(--text);
    }

    .header-nav {
      width: 100%;
      position: relative;
      margin-top: var(--sp-xs);
      padding: 0;
      display: flex;
      align-items: stretch;
      gap: 0;
      background: transparent;
      border: 0;
      border-radius: 0;
      touch-action: pan-y;
    }

    .header-tab {
      position: relative;
      z-index: 2;
      min-height: 52px;
      flex: 1 1 0;
      padding: 0 var(--sp-sm) 6px;
      border-radius: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      background: transparent;
      color: var(--muted);
      white-space: nowrap;
      font-size: var(--fs-base);
      font-weight: var(--fw-semibold);
      transition:
        color .18s ease,
        transform .12s ease;
    }

    .header-tab:active {
      transform: scale(.97);
    }

    .header-tab.active {
      background: transparent;
      color: var(--accent);
      box-shadow: none;
    }

    .header-tab-star {
      font-size: 20px;
      line-height: 1;
      transform: translateY(-1px);
    }

    .header-tab-indicator {
      position: absolute;
      z-index: 3;
      left: var(--tab-indicator-left);
      bottom: 0;
      width: var(--tab-indicator-width);
      height: 3px;
      border-radius: var(--radius-full);
      background: var(--accent);
      pointer-events: none;
      transition:
        left .28s cubic-bezier(.22,.75,.25,1),
        width .28s cubic-bezier(.22,.75,.25,1);
    }

    .hero {
      padding: var(--sp-lg) 2px var(--sp-md);
      touch-action: pan-y;
    }

    .hero-title {
      margin: 0;
      font-size: var(--fs-hero);
      line-height: 1.25;
      letter-spacing: -.3px;
      font-weight: var(--fw-bold);
    }

    .hero-date {
      margin-top: var(--sp-xs);
      color: var(--muted);
      font-size: var(--fs-sm);
      font-weight: var(--fw-medium);
    }

    .progress-wrap {
      margin-top: var(--sp-md);
      padding: var(--sp-sm) 0;
      border-radius: 0;
      background: transparent;
      border: 0;
      transition: opacity .2s ease;
    }

    .progress-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-sm);
      margin-bottom: var(--sp-sm);
    }

    .progress-label {
      color: var(--muted);
      font-size: var(--fs-sm);
      font-weight: var(--fw-medium);
    }

    .progress-value {
      color: var(--accent);
      font-size: var(--fs-sm);
      font-weight: var(--fw-bold);
    }

    .progress-track {
      height: 5px;
      overflow: hidden;
      border-radius: var(--radius-full);
      background: var(--surface-3);
    }

    .progress-bar {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
      transition: width .45s cubic-bezier(.2,.8,.2,1);
    }

    .content {
      margin-top: var(--sp-md);
      touch-action: pan-y;
      overscroll-behavior-x: contain;
      will-change: transform, opacity;
    }

    .content.view-transition-next {
      animation: viewSlideNext .24s cubic-bezier(.22,.75,.25,1);
    }

    .content.view-transition-previous {
      animation: viewSlidePrevious .24s cubic-bezier(.22,.75,.25,1);
    }

    @keyframes viewSlideNext {
      0% {
        opacity: .7;
        transform: translateX(12px);
      }

      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes viewSlidePrevious {
      0% {
        opacity: .7;
        transform: translateX(-12px);
      }

      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .section {
      margin-top: var(--sp-lg);
    }

    .section:first-child {
      margin-top: 0;
    }

    .section-head {
      display: flex;
      align-items: center;
      gap: var(--sp-sm);
      padding: 0 2px;
      margin-bottom: var(--sp-sm);
    }

    .section-title {
      color: var(--muted);
      font-size: var(--fs-sm);
      font-weight: var(--fw-semibold);
      letter-spacing: .2px;
    }

    .section-count {
      min-width: 22px;
      height: 22px;
      padding: 0 5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-full);
      background: var(--surface-2);
      color: var(--muted);
      font-size: var(--fs-xs);
      font-weight: var(--fw-bold);
    }

    .task-list {
      display: flex;
      flex-direction: column;
      overflow: visible;
      border-radius: 0;
      background: transparent;
      border: 0;
    }

    .task {
      position: relative;
      display: flex;
      align-items: center;
      gap: var(--sp-md);
      min-height: 56px;
      padding: var(--sp-sm) 0;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--border);
      border-radius: 0;
      box-shadow: none;
      transition:
        background .15s ease,
        opacity .18s ease;
      cursor: pointer;
      touch-action: none;
    }

    .task:last-child {
      border-bottom: 0;
    }

    .task.just-completed {
      animation: completeRow .5s ease;
    }

    @keyframes completeRow {
      0% {
        background: transparent;
      }

      42% {
        background: var(--accent-soft);
      }

      100% {
        background: transparent;
      }
    }

    .task.completed {
      opacity: .55;
    }

    .task.drag-source {
      visibility: hidden;
      pointer-events: none;
    }

    .task-placeholder {
      flex: 0 0 auto;
      min-height: 56px;
      border-radius: var(--radius-md);
      background: var(--accent-soft);
      border: 1px dashed color-mix(in srgb, var(--accent) 35%, transparent);
      opacity: .75;
      transition:
        height .12s ease,
        margin .12s ease,
        opacity .12s ease;
    }

    .drag-ghost {
      position: fixed !important;
      z-index: 9999 !important;
      margin: 0 !important;
      pointer-events: none !important;
      opacity: .97 !important;
      background: var(--surface) !important;
      border: 1px solid var(--border-strong) !important;
      border-radius: var(--radius-md) !important;
      box-shadow: 0 14px 34px rgba(0,0,0,.16) !important;
      will-change: left, top, transform;
      transition: none !important;
      cursor: grabbing !important;
    }

    html.nawy-drag-active,
    body.nawy-drag-active {
      overscroll-behavior: none;
    }

    .task-checkbox {
      width: var(--touch-checkbox);
      height: var(--touch-checkbox);
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: var(--radius-full);
      border: 1.5px solid var(--muted);
      background: transparent;
      transition:
        background .18s ease,
        border-color .18s ease,
        transform .14s ease;
    }

    .task-checkbox:active {
      transform: scale(.9);
    }

    .task.completed .task-checkbox {
      background: var(--accent);
      border-color: var(--accent);
    }

    .check-icon {
      width: 12px;
      height: 12px;
      opacity: 0;
      transform: scale(.5);
      transition:
        opacity .16s ease,
        transform .16s ease;
    }

    .task.completed .check-icon {
      opacity: 1;
      transform: scale(1);
    }

    .task-main {
      min-width: 0;
      flex: 1;
      padding: var(--sp-xs) 0;
      cursor: pointer;
    }

    .task-text {
      margin: 0;
      color: var(--text);
      font-size: var(--fs-base);
      line-height: 1.5;
      font-weight: var(--fw-medium);
      overflow-wrap: anywhere;
    }

    .task.completed .task-text {
      color: var(--muted);
      text-decoration: line-through;
      text-decoration-thickness: 1.2px;
    }

    .task-star {
      width: var(--touch-star);
      height: var(--touch-star);
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: var(--radius-full);
      background: transparent;
      color: #b8bdbd;
      font-size: 26px;
      transition:
        color .16s ease,
        background .16s ease,
        transform .14s ease;
    }

    .task-star:active {
      transform: scale(.9);
    }

    .task-star.active {
      color: var(--warning);
      background: transparent;
    }

    .completed-section {
      margin-top: var(--sp-md);
      padding: 0;
      border-radius: 0;
      background: transparent;
      border: 0;
      box-shadow: none;
    }

    .completed-toggle {
      width: 100%;
      min-height: 48px;
      padding: 0 2px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: var(--sp-sm);
      border-radius: var(--radius-sm);
      background: transparent;
      text-align: start;
      transition:
        color .15s ease,
        background .15s ease,
        transform .12s ease;
    }

    .completed-toggle:active {
      transform: scale(.99);
    }

    .completed-toggle-title {
      color: var(--muted);
      font-size: var(--fs-sm);
      line-height: 1;
      font-weight: var(--fw-medium);
    }

    .completed-toggle-count {
      min-width: 22px;
      height: 22px;
      padding: 0 5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-full);
      background: transparent;
      color: var(--muted);
      font-size: var(--fs-xs);
      line-height: 1;
      font-weight: var(--fw-semibold);
    }

    .completed-toggle-chevron {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border-radius: var(--radius-full);
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      font-weight: var(--fw-bold);
      line-height: 1;
      transition:
        transform .25s cubic-bezier(.2,.8,.2,1),
        color .18s ease;
    }

    .completed-toggle.open .completed-toggle-chevron {
      transform: rotate(180deg);
      color: var(--accent);
    }

    .completed-toggle.open .completed-toggle-title {
      color: var(--text);
    }

    .completed-list-wrap {
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transform: translateY(-2px);
      transition:
        max-height .30s cubic-bezier(.2,.8,.2,1),
        opacity .20s ease,
        transform .22s ease,
        margin-top .20s ease;
    }

    .completed-list-wrap.open {
      max-height: 4000px;
      opacity: 1;
      transform: translateY(0);
      margin-top: var(--sp-xs);
    }

    .completed-list-wrap .task-list {
      border-radius: 0;
      border: 0;
    }

    .task-empty {
      padding: 36px var(--sp-xl);
      text-align: center;
      border-radius: var(--radius-lg);
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .empty-symbol {
      width: 44px;
      height: 44px;
      margin: 0 auto var(--sp-md);
      display: grid;
      place-items: center;
      border-radius: var(--radius-md);
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 18px;
      font-weight: var(--fw-extrabold);
    }

    .empty-title {
      color: var(--text);
      font-size: var(--fs-md);
      font-weight: var(--fw-bold);
    }

    .empty-text {
      margin-top: var(--sp-xs);
      color: var(--muted);
      font-size: var(--fs-sm);
      line-height: 1.7;
    }

    /* ============ FAB & BOTTOM SHEET ============ */

    .composer-wrap {
      position: fixed;
      z-index: 30;
      left: 50%;
      bottom: 0;
      width: min(760px, 100%);
      transform: translateX(-50%);
      padding:
        0
        var(--sp-lg)
        calc(var(--sp-md) + env(safe-area-inset-bottom));
      pointer-events: none;
      display: flex;
      justify-content: flex-end;
      align-items: flex-end;
    }

    .composer-fab {
      pointer-events: auto;
      width: var(--fab-size);
      height: var(--fab-size);
      border-radius: var(--radius-full);
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 300;
      line-height: 1;
      padding: 0;
      margin: 0;
      box-shadow: 0 4px 16px rgba(0,0,0,.18);
      transition:
        transform .15s ease,
        box-shadow .15s ease;
    }

    .composer-fab:active {
      transform: scale(.93);
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
    }

    .composer-fab.hidden {
      display: none;
    }

    .composer-panel {
      pointer-events: auto;
      position: fixed;
      z-index: 31;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%) translateY(100%);
      width: min(100%, 760px);
      background: var(--surface);
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      box-shadow: var(--shadow-sheet);
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      transition: transform .28s cubic-bezier(.2,.8,.2,1);
      padding:
        var(--sp-lg)
        var(--sp-lg)
        calc(var(--sp-md) + env(safe-area-inset-bottom));
    }

    .composer-panel.open {
      transform: translateX(-50%) translateY(0);
    }

    .composer-input-row {
      display: flex;
      align-items: center;
      gap: var(--sp-sm);
    }

    .composer-input-row textarea,
    .composer-input-row textarea:focus,
    .composer-input-row textarea:focus-visible {
      flex: 1;
      min-height: 52px;
      max-height: 110px;
      resize: none;
      overflow-y: auto;
      padding: var(--sp-md);
      border: none;
      outline: none;
      box-shadow: none;
      background: transparent;
      color: var(--text);
      font-size: var(--fs-base);
      line-height: 1.5;
      -webkit-appearance: none;
      appearance: none;
    }

    .composer-input-row textarea::placeholder {
      color: var(--muted);
      opacity: .6;
    }

    .composer-input-row .send-btn {
      width: 46px;
      height: 46px;
      flex: 0 0 auto;
      border-radius: var(--radius-full);
      background: var(--accent);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 20px;
      font-weight: var(--fw-bold);
      transition:
        transform .14s ease,
        opacity .18s ease;
    }

    .composer-input-row .send-btn:active {
      transform: scale(.93);
    }

    .composer-input-row .send-btn.disabled {
      opacity: .4;
    }

    /* ============ OVERLAYS & SHEETS ============ */

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: var(--sp-lg);
      background: rgba(0,0,0,.40);
      opacity: 0;
      visibility: hidden;
      transition:
        opacity .20s ease,
        visibility .20s ease;
      touch-action: auto;
    }

    .overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .sheet {
      width: min(100%, 520px);
      max-height: min(82vh, 680px);
      overflow-y: auto;
      padding: var(--sp-lg);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-sheet);
      transform: translateY(18px);
      transition: transform .24s cubic-bezier(.2,.8,.2,1);
      position: relative;
    }

    .overlay.show .sheet {
      transform: translateY(0);
    }

    .sheet-handle {
      width: 36px;
      height: 5px;
      margin: 2px auto 14px;
      border-radius: var(--radius-full);
      background: var(--surface-3);
    }

    .sheet-close-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 40px;
      height: 40px;
      border-radius: var(--radius-full);
      background: var(--surface-2);
      display: grid;
      place-items: center;
      font-size: 18px;
      color: var(--muted);
      transition:
        background .15s ease,
        color .15s ease,
        transform .1s ease;
      cursor: pointer;
      z-index: 2;
    }

    .sheet-close-btn:active {
      transform: scale(.92);
      background: var(--surface-3);
      color: var(--text);
    }

    .sheet-title {
      padding: 4px 4px 12px;
      font-size: var(--fs-lg);
      font-weight: var(--fw-bold);
    }

    .sheet-subtitle {
      padding: 0 4px 12px;
      color: var(--muted);
      font-size: var(--fs-sm);
      line-height: 1.6;
    }

    .menu-item {
      width: 100%;
      min-height: 52px;
      padding: 0 var(--sp-md);
      display: flex;
      align-items: center;
      gap: var(--sp-md);
      border-radius: var(--radius-md);
      background: transparent;
      text-align: start;
      transition: background .15s ease;
    }

    .menu-item:hover,
    .menu-item:active {
      background: var(--surface-2);
    }

    .menu-icon {
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      border-radius: var(--radius-sm);
      display: grid;
      place-items: center;
      background: var(--surface-2);
      font-size: 16px;
    }

    .menu-text {
      flex: 1;
      font-size: var(--fs-base);
      font-weight: var(--fw-medium);
    }

    .action-task-preview {
      margin: 4px 4px 8px;
      padding: var(--sp-md);
      border-radius: var(--radius-md);
      background: var(--surface-2);
      font-size: var(--fs-md);
      line-height: 1.6;
    }

    .action-item {
      width: 100%;
      min-height: 52px;
      padding: 0 var(--sp-md);
      display: flex;
      align-items: center;
      gap: var(--sp-md);
      border-radius: var(--radius-md);
      background: transparent;
      text-align: start;
      font-size: var(--fs-base);
      transition: background .15s ease;
    }

    .action-item:hover {
      background: var(--surface-2);
    }

    .action-item.danger {
      color: var(--danger);
    }

    .action-item .action-icon {
      width: 32px;
      height: 32px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      font-size: 20px;
      color: var(--muted);
    }

    .action-item .action-text {
      flex: 1;
      font-weight: var(--fw-medium);
    }

    .edit-input {
      width: 100%;
      min-height: 100px;
      padding: var(--sp-md);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      resize: vertical;
      font-size: var(--fs-base);
      line-height: 1.65;
    }

    .edit-input:focus {
      border-color: var(--accent);
    }

    .date-input {
      width: 100%;
      min-height: 52px;
      padding: 0 var(--sp-md);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: var(--fs-base);
    }

    .date-input:focus {
      border-color: var(--accent);
    }

    .modal-actions {
      display: flex;
      gap: var(--sp-sm);
      margin-top: var(--sp-sm);
    }

    .modal-btn {
      flex: 1;
      min-height: 48px;
      border-radius: var(--radius-md);
      font-size: var(--fs-base);
      font-weight: var(--fw-semibold);
    }

    .modal-btn.primary {
      background: var(--accent);
      color: #fff;
    }

    .modal-btn.secondary {
      background: var(--surface-2);
    }

    .modal-btn.danger {
      background: rgba(229,72,77,.08);
      color: var(--danger);
    }

    .setting-group {
      margin-bottom: var(--sp-md);
    }

    .setting-label {
      padding: 0 var(--sp-sm) var(--sp-sm);
      color: var(--muted);
      font-size: var(--fs-xs);
      font-weight: var(--fw-bold);
      letter-spacing: .3px;
    }

    .setting-box {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
    }

    .setting-row {
      min-height: 54px;
      padding: 0 var(--sp-md);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-sm);
      border-bottom: 1px solid var(--border);
    }

    .setting-row:last-child {
      border-bottom: 0;
    }

    .setting-name {
      font-size: var(--fs-base);
      font-weight: var(--fw-medium);
    }

    .segmented {
      display: flex;
      gap: 2px;
      padding: 3px;
      border-radius: var(--radius-sm);
      background: var(--surface-2);
    }

    .segment {
      min-height: 32px;
      padding: 0 var(--sp-md);
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      font-size: var(--fs-sm);
      font-weight: var(--fw-semibold);
      transition:
        background .16s ease,
        color .16s ease;
    }

    .segment.active {
      background: var(--accent);
      color: #fff;
    }

    .colors {
      display: flex;
      align-items: center;
      gap: var(--sp-sm);
    }

    .color-btn {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-full);
      border: 2px solid var(--surface);
      outline: 1px solid var(--border);
      position: relative;
    }

    .color-btn.active::after {
      content: "✓";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 11px;
      font-weight: var(--fw-bold);
    }

    .green {
      background: #19a974;
    }

    .blue {
      background: #3b82f6;
    }

    .purple {
      background: #8b5cf6;
    }

    .orange {
      background: #f59e0b;
    }

    .pink {
      background: #ec4899;
    }

    .trash-list {
      display: flex;
      flex-direction: column;
      gap: var(--sp-sm);
    }

    .trash-item {
      padding: var(--sp-md);
      border-radius: var(--radius-md);
      background: var(--surface-2);
      display: flex;
      align-items: center;
      gap: var(--sp-sm);
    }

    .trash-text {
      flex: 1;
      min-width: 0;
      font-size: var(--fs-md);
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .small-btn {
      min-height: 36px;
      padding: 0 var(--sp-md);
      border-radius: var(--radius-sm);
      background: var(--surface);
      font-size: var(--fs-sm);
      font-weight: var(--fw-semibold);
    }

    .small-btn.danger {
      color: var(--danger);
    }

    .toast {
      position: fixed;
      z-index: 200;
      left: 50%;
      bottom: calc(84px + env(safe-area-inset-bottom));
      width: min(calc(100% - 32px), 440px);
      transform: translate(-50%, 16px) scale(.97);
      opacity: 0;
      visibility: hidden;
      padding: var(--sp-md) var(--sp-lg);
      display: flex;
      align-items: center;
      gap: var(--sp-sm);
      border-radius: var(--radius-md);
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-soft);
      transition:
        opacity .2s ease,
        transform .2s ease,
        visibility .2s ease;
    }

    .toast.show {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, 0) scale(1);
    }

    .toast-message {
      flex: 1;
      font-size: var(--fs-md);
      font-weight: var(--fw-medium);
    }

    .toast-undo,
    .toast-update {
      padding: 5px 10px;
      border-radius: var(--radius-sm);
      background: var(--accent-soft);
      color: var(--accent);
      font-size: var(--fs-sm);
      font-weight: var(--fw-bold);
      white-space: nowrap;
    }

    .install-banner {
      position: fixed;
      z-index: 180;
      left: 50%;
      bottom: calc(12px + env(safe-area-inset-bottom));
      width: min(calc(100% - 28px), 560px);
      transform: translate(-50%, 20px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: var(--sp-md);
      padding: var(--sp-md);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      transition:
        opacity .22s ease,
        transform .22s ease,
        visibility .22s ease;
    }

    .install-banner.show {
      transform: translate(-50%, 0);
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .install-icon {
      width: 40px;
      height: 40px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: var(--radius-md);
    }

    .install-icon-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .install-copy {
      min-width: 0;
      flex: 1;
    }

    .install-title {
      font-size: var(--fs-md);
      font-weight: var(--fw-bold);
    }

      margin-top: 1px;
      color: var(--muted);
      font-size: var(--fs-xs);
      line-height: 1.45
