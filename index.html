<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

```
<meta name="theme-color" content="#0d0f0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="mobile-web-app-capable" content="yes">

<title>ناوي — على إيه النهارده؟</title>

<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">

<link rel="stylesheet" href="./css/app.css">
```

</head>

<body>

<div class="app">

```
<header class="header">

    <div class="brand">
        <div class="brand-main">
            <div class="brand-mark">🎯</div>
            <div class="brand-name">ناوي</div>
        </div>
    </div>

    <div class="greeting">
        <h1>ناوي على إيه النهارده؟</h1>
        <p id="currentDate">—</p>
    </div>

    <div class="progress">
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="progress-text" id="progressText">
            ابدأ أول نية
        </div>
    </div>

</header>


<main class="tasks" id="tasksContainer"></main>


<div class="composer-wrap">

    <div class="composer">

        <textarea
            id="taskInput"
            rows="1"
            maxlength="500"
            placeholder="اكتب اللي ناوي عليه..."
            enterkeyhint="send"
            aria-label="اكتب نية جديدة"
        ></textarea>

        <button
            type="button"
            class="submit"
            id="submitBtn"
            aria-label="إضافة نية"
        >
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 19V5"></path>
                <path d="M6.5 11.5 12 5l5.5 6.5"></path>
            </svg>
        </button>

    </div>

    <div class="hint">
        اضغط Enter لإضافة نية جديدة
    </div>

</div>
```

</div>

<!-- INSTALL FLOAT -->

<div
    class="install-overlay"
    id="installOverlay"
    aria-hidden="true"
>
    <div class="install-sheet">

```
    <div class="install-icon">📱</div>

    <div class="install-copy">
        <div class="install-title">
            ناوي؟ خليه معاك.
        </div>

        <div class="install-subtitle">
            نزّل ناوي وابدأ يومك بنية.
        </div>
    </div>

    <button
        type="button"
        class="install-btn"
        id="installBtn"
    >
        نزّل ناوي
    </button>

    <button
        type="button"
        class="install-close"
        id="installClose"
        aria-label="إغلاق"
    >
        ×
    </button>

</div>
```

</div>

<!-- INSTALL GUIDE -->

<div
    class="install-guide"
    id="installGuide"
    aria-hidden="true"
>
    <div class="guide-box">

```
    <h2>خلّي ناوي معاك 📱</h2>

    <p id="guideText">
        من قائمة المتصفح اختار
        <strong>إضافة إلى الشاشة الرئيسية</strong>
        عشان تستخدم ناوي كتطبيق.
    </p>

    <button
        type="button"
        class="guide-close"
        id="guideClose"
    >
        تمام
    </button>

</div>
```

</div>

<script src="./js/app.js"></script>

</body>
</html>
