<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#0d0d0d"
>

<meta
    name="color-scheme"
    content="dark"
>

<meta
    name="mobile-web-app-capable"
    content="yes"
>

<meta
    name="apple-mobile-web-app-capable"
    content="yes"
>

<meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
>

<meta
    name="apple-mobile-web-app-title"
    content="ناوي"
>

<meta
    name="description"
    content="ناوي — اكتب نيتك وأنجزها."
>

<title>ناوي — على إيه النهارده؟</title>

<link rel="manifest" href="./manifest.json">

<link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="./icon-192.png"
>

<link
    rel="apple-touch-icon"
    href="./icon-192.png"
>


<style>

/* =========================================================
   NAWY
   Clean Arabic To-Do
   ========================================================= */

:root {

    --bg: #0d0d0d;

    --surface: #181818;
    --surface-2: #202020;

    --text: #f3f3f3;
    --text-soft: #e6e6e6;

    --muted: #898989;
    --muted-dark: #626262;

    --green: #19c58b;
    --green-soft: rgba(25,197,139,.10);

    --yellow: #e8bf48;
    --danger: #ff6666;

    --border: rgba(255,255,255,.075);

    --content-width: 760px;

}


/* =========================================================
   RESET
   ========================================================= */

* {

    box-sizing: border-box;

    margin: 0;
    padding: 0;

    -webkit-tap-highlight-color: transparent;

}


html {

    width: 100%;
    min-height: 100%;

    background: var(--bg);

    color-scheme: dark;

}


body {

    width: 100%;
    min-height: 100dvh;

    margin: 0;

    background: var(--bg);

    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        "Noto Sans Arabic",
        Tahoma,
        Arial,
        sans-serif;

    overflow: hidden;

    -webkit-font-smoothing: antialiased;

    text-rendering: optimizeLegibility;

}


button,
textarea {

    font: inherit;

}


button {

    border: 0;
    outline: 0;

    cursor: pointer;

    touch-action: manipulation;

    user-select: none;

}


/* =========================================================
   APP
   ========================================================= */

.app {

    width: 100%;
    height: 100dvh;

    min-height: 100dvh;

    display: flex;
    flex-direction: column;

    position: relative;

    background:
        radial-gradient(
            circle at 84% -12%,
            rgba(25,197,139,.065),
            transparent 28%
        ),
        var(--bg);

}


/* =========================================================
   HEADER
   ========================================================= */

.header {

    width: 100%;
    max-width: var(--content-width);

    margin: 0 auto;

    padding:
        calc(24px + env(safe-area-inset-top))
        22px
        11px;

    flex-shrink: 0;

}


.brand {

    display: flex;
    align-items: center;

}


.brand-name {

    font-size: 24px;

    line-height: 1;

    font-weight: 800;

    letter-spacing: -.8px;

}


.greeting {

    margin-top: 20px;

}


.greeting h1 {

    font-size:
        clamp(24px, 5vw, 29px);

    line-height: 1.25;

    font-weight: 800;

    letter-spacing: -.9px;

}


.greeting p {

    margin-top: 6px;

    color: var(--muted);

    font-size: 13px;

}


/* =========================================================
   PROGRESS
   ========================================================= */

.progress {

    margin-top: 17px;

    display: flex;
    align-items: center;

    gap: 10px;

}


.progress-bar {

    flex: 1;

    height: 5px;

    overflow: hidden;

    border-radius: 999px;

    background:
        rgba(255,255,255,.065);

}


.progress-fill {

    width: 0;

    height: 100%;

    background: var(--green);

    border-radius: inherit;

    transition:
        width .35s cubic-bezier(.2,.8,.2,1);

}


.progress-text {

    min-width: max-content;

    color: var(--muted);

    font-size: 11px;

    white-space: nowrap;

}


/* =========================================================
   TASK LIST
   ========================================================= */

.tasks {

    width: 100%;
    max-width: var(--content-width);

    margin: 0 auto;

    flex: 1;

    min-height: 0;

    overflow-y: auto;

    padding:
        7px
        22px
        175px;

    scrollbar-width: none;

    overscroll-behavior: contain;

}


.tasks::-webkit-scrollbar {

    display: none;

}


/* =========================================================
   SECTION LABEL
   ========================================================= */

.section-label {

    display: flex;

    align-items: center;

    gap: 10px;

    margin:
        20px
        0
        4px;

    color: var(--muted);

    font-size: 11px;

    font-weight: 700;

}


.section-label:first-child {

    margin-top: 5px;

}


.section-label::before,
.section-label::after {

    content: "";

    height: 1px;

    flex: 1;

    background: var(--border);

}


.section-label span {

    white-space: nowrap;

}


/* =========================================================
   TASK
   ========================================================= */

.task {

    width: 100%;

    min-height: 64px;

    display: flex;

    align-items: center;

    gap: 13px;

    padding:
        10px
        2px;

    border-bottom:
        1px solid var(--border);

    cursor: pointer;

    transition:
        opacity .2s ease,
        transform .15s ease;

}


.task:last-child {

    border-bottom-color:
        transparent;

}


.task:active {

    transform:
        scale(.995);

}


/* =========================================================
   CHECK
   ========================================================= */

.check {

    width: 24px;
    height: 24px;

    flex: 0 0 24px;

    display: grid;
    place-items: center;

    padding: 0;

    border:
        1.8px solid #68716d;

    border-radius: 50%;

    background: transparent;

    color: var(--green);

    transition:
        background .18s ease,
        border-color .18s ease,
        transform .18s cubic-bezier(.18,.9,.3,1.3),
        box-shadow .18s ease;

}


/* SVG check */

.check svg {

    width: 14px;
    height: 14px;

    fill: none;

    stroke: currentColor;

    stroke-width: 2.7;

    stroke-linecap: round;
    stroke-linejoin: round;

    opacity: 0;

    transform:
        scale(.5);

    transition:
        opacity .16s ease,
        transform .18s cubic-bezier(.18,.9,.3,1.3);

}


/* Hover preview */

.task:not(.completed):hover .check {

    background:
        var(--green-soft);

    border-color:
        var(--green);

    transform:
        scale(1.07);

    box-shadow:
        0 0 0 4px
        rgba(25,197,139,.055);

}


.task:not(.completed):hover .check svg {

    opacity: .9;

    transform:
        scale(1);

}


/* Keyboard focus */

.check:focus-visible {

    border-color:
        var(--green);

    box-shadow:
        0 0 0 4px
        rgba(25,197,139,.12);

}


/* Completed */

.task.completed .check {

    background:
        var(--green);

    border-color:
        var(--green);

    color:
        #06130e;

}


.task.completed .check svg {

    opacity: 1;

    transform:
        scale(1);

}


/* =========================================================
   COMPLETION ANIMATION
   ========================================================= */

.task.just-completed .check {

    animation:
        check-pop
        .5s
        cubic-bezier(.18,.9,.3,1.3);

}


@keyframes check-pop {

    0% {

        transform: scale(1);

        box-shadow:
            0 0 0 0
            rgba(25,197,139,0);

    }

    40% {

        transform: scale(1.28);

        box-shadow:
            0 0 0 8px
            rgba(25,197,139,.12);

    }

    70% {

        transform: scale(.94);

    }

    100% {

        transform: scale(1);

        box-shadow:
            0 0 0 0
            rgba(25,197,139,0);

    }

}


/* =========================================================
   TASK CONTENT
   ========================================================= */

.task-main {

    min-width: 0;

    flex: 1;

}


.task-title {

    color: #ededed;

    font-size: 16px;

    line-height: 1.5;

    overflow-wrap: anywhere;

    transition:
        color .2s ease;

}


.task.completed .task-title {

    color:
        var(--muted-dark);

    text-decoration:
        line-through;

    text-decoration-thickness:
        1px;

}


.task-carried {

    margin-top: 3px;

    color: #555d59;

    font-size: 10px;

}


/* =========================================================
   TASK ACTIONS
   ========================================================= */

.task-actions {

    display: flex;

    align-items: center;

    gap: 2px;

    flex-shrink: 0;

    opacity: .62;

    transition:
        opacity .15s ease;

}


.task:hover .task-actions {

    opacity: 1;

}


.icon-btn {

    width: 34px;
    height: 34px;

    display: grid;
    place-items: center;

    border-radius: 10px;

    background: transparent;

    color: #737d78;

    font-size: 18px;

    transition:
        background .15s ease,
        color .15s ease,
        transform .15s ease;

}


.icon-btn:hover {

    background:
        rgba(255,255,255,.05);

    color: #afb7b3;

}


.icon-btn:active {

    transform:
        scale(.92);

}


.icon-btn.starred {

    color:
        var(--yellow);

}


.icon-btn.delete:hover {

    color:
        var(--danger);

}


/* =========================================================
   EMPTY
   ========================================================= */

.empty {

    padding:
        86px 20px;

    text-align: center;

}


.empty-icon {

    margin-bottom: 14px;

    font-size: 29px;

}


.empty strong {

    display: block;

    color:
        var(--text-soft);

    font-size: 16px;

    margin-bottom: 5px;

}


.empty span {

    color:
        var(--muted);

    font-size: 13px;

}


/* =========================================================
   COMPOSER
   ========================================================= */

.composer-wrap {

    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    z-index: 50;

    padding:
        15px
        18px
        calc(11px + env(safe-area-inset-bottom));

    pointer-events: none;

    background:
        linear-gradient(
            to top,
            var(--bg) 34%,
            rgba(13,13,13,.93) 70%,
            transparent 100%
        );

}


.composer-inner {

    width: 100%;

    max-width:
        var(--content-width);

    margin: 0 auto;

    pointer-events: auto;

}


.composer {

    width: 100%;

    min-height: 56px;

    display: flex;

    align-items: flex-end;

    gap: 8px;

    padding:
        7px
        7px
        7px
        15px;

    background:
        #1a1a1a;

    border:
        1px solid
        rgba(255,255,255,.085);

    border-radius:
        28px;

    box-shadow:
        0 9px 32px
        rgba(0,0,0,.28);

    transition:
        border-color .18s ease,
        box-shadow .18s ease;

}


.composer:focus-within {

    border-color:
        rgba(255,255,255,.12);

    box-shadow:
        0 10px 35px
        rgba(0,0,0,.34);

}


/* =========================================================
   TEXT INPUT
   ========================================================= */

#taskInput {

    flex: 1;

    min-width: 0;

    width: 100%;

    min-height: 42px;

    max-height: 120px;

    margin: 0;

    padding:
        10px
        0;

    resize: none;

    overflow-y: auto;

    border: 0 !important;

    outline: 0 !important;

    background:
        transparent !important;

    color:
        var(--text);

    font-size: 16px;

    line-height: 1.45;

    box-shadow:
        none !important;

    scrollbar-width: none;

}


#taskInput::-webkit-scrollbar {

    display: none;

}


#taskInput::placeholder {

    color:
        #747a77;

}


/* =========================================================
   SEND BUTTON
   ========================================================= */

.submit {

    width: 42px;
    height: 42px;

    flex: 0 0 42px;

    display: grid;
    place-items: center;

    border-radius: 50%;

    background:
        #2d302f;

    color:
        #737977;

    transition:
        background .18s ease,
        color .18s ease,
        transform .15s ease,
        box-shadow .18s ease;

}


.submit.active {

    background:
        #f2f2f2;

    color:
        #111;

    box-shadow:
        0 4px 15px
        rgba(0,0,0,.2);

}


.submit:active {

    transform:
        scale(.92);

}


.submit:focus-visible {

    box-shadow:
        0 0 0 4px
        rgba(25,197,139,.13);

}


.send-arrow {

    display: block;

    font-size: 22px;

    line-height: 1;

    font-weight: 700;

    transform:
        translateY(-1px);

    pointer-events: none;

}


/* =========================================================
   HINT
   ========================================================= */

.hint {

    margin-top: 6px;

    text-align: center;

    color:
        #515956;

    font-size: 10px;

}


/* =========================================================
   TOAST
   ========================================================= */

.toast {

    position: fixed;

    left: 50%;

    bottom:
        calc(
            88px +
            env(safe-area-inset-bottom)
        );

    z-index: 400;

    min-width: 235px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 14px;

    padding:
        10px
        12px
        10px
        14px;

    background:
        #191919;

    border:
        1px solid
        var(--border);

    border-radius:
        14px;

    box-shadow:
        0 18px 48px
        rgba(0,0,0,.38);

    transform:
        translate(-50%, 15px);

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transition:
        opacity .2s ease,
        transform .2s ease,
        visibility .2s ease;

}


.toast.show {

    opacity: 1;

    visibility: visible;

    pointer-events: auto;

    transform:
        translate(-50%, 0);

}


.toast-message {

    color:
        #e9e9e9;

    font-size: 12px;

}


.toast-undo {

    padding:
        5px
        8px;

    border-radius: 8px;

    background:
        rgba(25,197,139,.10);

    color:
        var(--green);

    font-size: 11px;

    font-weight: 800;

}


/* =========================================================
   INSTALL
   ========================================================= */

.install-overlay,
.install-guide {

    position: fixed;

    inset: 0;

    z-index: 1000;

    display: flex;

    align-items: flex-end;

    justify-content: center;

    padding: 16px;

    background:
        rgba(0,0,0,.28);

    backdrop-filter:
        blur(4px);

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transition:
        opacity .22s ease,
        visibility .22s ease;

}


.install-overlay.show,
.install-guide.show {

    opacity: 1;

    visibility: visible;

    pointer-events: auto;

}


.install-guide {

    align-items: center;

}


.install-sheet {

    width: 100%;

    max-width: 620px;

    display: flex;

    align-items: center;

    gap: 11px;

    padding: 13px;

    background:
        #181818;

    border:
        1px solid var(--border);

    border-radius: 19px;

    box-shadow:
        0 22px 60px
        rgba(0,0,0,.42);

}


.install-icon {

    width: 43px;
    height: 43px;

    flex: 0 0 43px;

    display: grid;
    place-items: center;

    border-radius: 13px;

    background:
        rgba(25,197,139,.10);

}


.install-copy {

    min-width: 0;

    flex: 1;

}


.install-title {

    font-size: 14px;

    font-weight: 800;

}


.install-subtitle {

    margin-top: 3px;

    color:
        var(--muted);

    font-size: 10px;

}


.install-btn {

    flex-shrink: 0;

    padding:
        9px
        13px;

    border-radius: 11px;

    background:
        var(--green);

    color:
        #06130e;

    font-size: 11px;

    font-weight: 900;

}


.install-close {

    width: 30px;
    height: 30px;

    flex: 0 0 30px;

    display: grid;
    place-items: center;

    border-radius: 50%;

    background:
        rgba(255,255,255,.05);

    color:
        #777;

    font-size: 18px;

}


.guide-box {

    width: 100%;

    max-width: 380px;

    padding: 23px;

    background:
        #181818;

    border:
        1px solid var(--border);

    border-radius: 21px;

    text-align: center;

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.45);

}


.guide-box h2 {

    font-size: 19px;

    margin-bottom: 9px;

}


.guide-box p {

    color:
        var(--muted);

    font-size: 13px;

    line-height: 1.7;

}


.guide-close {

    width: 100%;

    margin-top: 18px;

    padding: 11px;

    border-radius: 13px;

    background:
        rgba(255,255,255,.06);

    color:
        var(--text);

    font-size: 13px;

}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {

    .header {

        padding-left: 17px;
        padding-right: 17px;

    }

    .tasks {

        padding-left: 17px;
        padding-right: 17px;

    }

    .greeting h1 {

        font-size: 23px;

    }

    .task-title {

        font-size: 15px;

    }

    .composer-wrap {

        padding-left: 12px;
        padding-right: 12px;

    }

    .hint {

        display: none;

    }

}


/* =========================================================
   SMALL PHONES
   ========================================================= */

@media (max-width: 380px) {

    .header {

        padding-left: 14px;
        padding-right: 14px;

    }

    .tasks {

        padding-left: 14px;
        padding-right: 14px;

    }

    .brand-name {

        font-size: 22px;

    }

    .greeting h1 {

        font-size: 22px;

    }

    .task {

        gap: 10px;

    }

    .task-title {

        font-size: 14px;

    }

    .icon-btn {

        width: 31px;
        height: 31px;

    }

    .composer-wrap {

        padding-left: 9px;
        padding-right: 9px;

    }

}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        animation-duration:
            .01ms !important;

        animation-iteration-count:
            1 !important;

        transition-duration:
            .01ms !important;

    }

}

</style>
</head>


<body>

<div class="app">


    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

        <div class="brand">

            <div class="brand-name">
                ناوي
            </div>

        </div>


        <div class="greeting">

            <h1>
                ناوي على إيه النهارده؟
            </h1>

            <p id="currentDate">
                —
            </p>

        </div>


        <div
            class="progress"
            aria-label="نسبة إنجاز نوايا اليوم"
        >

            <div
                class="progress-bar"
                role="progressbar"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="0"
                aria-label="نسبة الإنجاز"
            >

                <div
                    class="progress-fill"
                    id="progressFill"
                ></div>

            </div>


            <div
                class="progress-text"
                id="progressText"
            >
                ابدأ أول نية
            </div>

        </div>

    </header>


    <!-- =========================
         TASKS
    ========================== -->

    <main
        class="tasks"
        id="tasksContainer"
        aria-live="polite"
        aria-label="قائمة النوايا"
    ></main>


    <!-- =========================
         COMPOSER
    ========================== -->

    <div class="composer-wrap">

        <div class="composer-inner">

            <div class="composer">

                <textarea
                    id="taskInput"
                    rows="1"
                    maxlength="500"
                    placeholder="اكتب اللي ناوي عليه..."
                    enterkeyhint="send"
                    autocomplete="off"
                    aria-label="نية جديدة"
                ></textarea>


                <button
                    type="button"
                    class="submit"
                    id="submitBtn"
                    aria-label="إضافة نية"
                    disabled
                >
                    <span
                        class="send-arrow"
                        aria-hidden="true"
                    >
                        ↑
                    </span>
                </button>

            </div>


            <div class="hint">
                اضغط Enter لإضافة نية جديدة
            </div>

        </div>

    </div>

</div>


<!-- =========================
     DELETE TOAST
========================== -->

<div
    class="toast"
    id="toast"
    role="status"
    aria-live="polite"
>
    <span
        class="toast-message"
        id="toastMessage"
    >
        تم حذف النية
    </span>

    <button
        type="button"
        class="toast-undo"
        id="toastUndo"
    >
        تراجع
    </button>
</div>


<!-- =========================
     INSTALL PROMPT
========================== -->

<div
    class="install-overlay"
    id="installOverlay"
    aria-hidden="true"
>

    <div class="install-sheet">

        <div class="install-icon">
            📱
        </div>

        <div class="install-copy">

            <div class="install-title">
                خلّي ناوي معاك
            </div>

            <div class="install-subtitle">
                ثبّت ناوي ووصل لنواياك بسرعة.
            </div>

        </div>


        <button
            type="button"
            class="install-btn"
            id="installBtn"
        >
            تثبيت
        </button>


        <button
            type="button"
            class="install-close"
            id="installClose"
            aria-label="إغلاق"
        >
            ×
        </button>

    </div>

</div>


<!-- =========================
     INSTALL GUIDE
========================== -->

<div
    class="install-guide"
    id="installGuide"
    aria-hidden="true"
>

    <div class="guide-box">

        <h2>
            خلّي ناوي معاك 📱
        </h2>

        <p id="guideText">
            من قائمة المتصفح اختَر
            إضافة إلى الشاشة الرئيسية
            لاستخدام ناوي كتطبيق.
        </p>


        <button
            type="button"
            class="guide-close"
            id="guideClose"
        >
            تمام
        </button>

    </div>

</div>


<script>

/* =========================================================
   NAWY — CORE
   ========================================================= */

(() => {

    "use strict";


    /* =====================================================
       STORAGE
    ===================================================== */

    const STORAGE_KEY =
        "nawy_tasks_v7";

    const LEGACY_KEYS = [
        "nawy_tasks_v6",
        "nawy_tasks_v5",
        "nawy_tasks_v4",
        "nawy_tasks_v3"
    ];


    /* =====================================================
       DOM
    ===================================================== */

    const taskInput =
        document.getElementById(
            "taskInput"
        );

    const submitBtn =
        document.getElementById(
            "submitBtn"
        );

    const tasksContainer =
        document.getElementById(
            "tasksContainer"
        );

    const progressFill =
        document.getElementById(
            "progressFill"
        );

    const progressText =
        document.getElementById(
            "progressText"
        );

    const progressBar =
        document.querySelector(
            ".progress-bar"
        );

    const currentDate =
        document.getElementById(
            "currentDate"
        );

    const toast =
        document.getElementById(
            "toast"
        );

    const toastMessage =
        document.getElementById(
            "toastMessage"
        );

    const toastUndo =
        document.getElementById(
            "toastUndo"
        );

    const installOverlay =
        document.getElementById(
            "installOverlay"
        );

    const installBtn =
        document.getElementById(
            "installBtn"
        );

    const installClose =
        document.getElementById(
            "installClose"
        );

    const installGuide =
        document.getElementById(
            "installGuide"
        );

    const guideClose =
        document.getElementById(
            "guideClose"
        );

    const guideText =
        document.getElementById(
            "guideText"
        );


    /* =====================================================
       STATE
    ===================================================== */

    let tasks =
        loadTasks();

    let deletedTask =
        null;

    let deleteTimer =
        null;

    let deferredInstallPrompt =
        null;

    let audioContext =
        null;


    /* =====================================================
       DATE
    ===================================================== */

    function getDateKey(
        date = new Date()
    ) {

        const year =
            date.getFullYear();

        const month =
            String(
                date.getMonth() + 1
            ).padStart(2, "0");

        const day =
            String(
                date.getDate()
            ).padStart(2, "0");

        return (
            `${year}-${month}-${day}`
        );
    }


    function formatDate(
        date = new Date()
    ) {

        return new Intl.DateTimeFormat(
            "ar-EG",
            {
                weekday: "long",
                day: "numeric",
                month: "long"
            }
        ).format(date);
    }


    function updateDate() {

        currentDate.textContent =
            formatDate();

    }


    updateDate();


    /* =====================================================
       STORAGE
    ===================================================== */

    function normalizeTask(
        raw
    ) {

        if (
            !raw ||
            typeof raw !== "object"
        ) {

            return null;

        }


        const text =
            String(
                raw.text || ""
            ).trim();


        if (!text) {
            return null;
        }


        const createdAt =
            raw.createdAt ||
            new Date().toISOString();


        return {

            id:
                String(
                    raw.id ||
                    `${Date.now()}-${Math.random()}`
                ),

            text:
                text.slice(0, 500),

            completed:
                Boolean(
                    raw.completed
                ),

            starred:
                Boolean(
                    raw.starred
                ),

            createdAt,

            taskDay:
                raw.taskDay ||
                getDateKey(
                    new Date(createdAt)
                ),

            completedAt:
                raw.completedAt || null

        };

    }


    function normalizeTasks(
        list
    ) {

        return list
            .map(normalizeTask)
            .filter(Boolean);

    }


    function readTasks(
        key
    ) {

        try {

            const value =
                JSON.parse(
                    localStorage.getItem(key)
                );

            return Array.isArray(value)
                ? normalizeTasks(value)
                : null;

        } catch {

            return null;

        }
    }


    function loadTasks() {

        const current =
            readTasks(
                STORAGE_KEY
            );


        if (current) {
            return current;
        }


        for (
            const key of LEGACY_KEYS
        ) {

            const old =
                readTasks(key);


            if (old) {

                /*
                   حفظ نسخة مطورة
                   بدون حذف القديمة.
                */

                try {

                    localStorage.setItem(
                        STORAGE_KEY,
                        JSON.stringify(old)
                    );

                } catch {}

                return old;
            }
        }


        return [];

    }


    function saveTasks() {

        try {

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(tasks)
            );

        } catch (error) {

            console.warn(
                "NAWY storage error:",
                error
            );

        }

    }


    /* =====================================================
       AUDIO
       لا صوت عند الإضافة.
       Chime فقط عند الإنجاز.
    ===================================================== */

    function getAudioContext() {

        try {

            const AudioContext =
                window.AudioContext ||
                window.webkitAudioContext;


            if (!AudioContext) {
                return null;
            }


            if (!audioContext) {

                audioContext =
                    new AudioContext();

            }


            if (
                audioContext.state ===
                "suspended"
            ) {

                audioContext
                    .resume()
                    .catch(() => {});

            }


            return audioContext;

        } catch {

            return null;
        }

    }


    function playCompletionChime() {

        const ctx =
            getAudioContext();


        if (!ctx) {
            return;
        }


        try {

            const now =
                ctx.currentTime;


            /*
               Chime قصير:
               نغمة أساسية ثم نغمة أعلى.
            */

            const notes = [

                {
                    frequency: 783.99,
                    start: 0,
                    duration: .16,
                    volume: .035
                },

                {
                    frequency: 987.77,
                    start: .06,
                    duration: .24,
                    volume: .042
                }

            ];


            notes.forEach(
                note => {

                    const oscillator =
                        ctx.createOscillator();

                    const gain =
                        ctx.createGain();


                    const start =
                        now + note.start;

                    const end =
                        start + note.duration;


                    oscillator.type =
                        "sine";


                    oscillator.frequency.setValueAtTime(
                        note.frequency,
                        start
                    );


                    gain.gain.setValueAtTime(
                        0.0001,
                        start
                    );


                    gain.gain.exponentialRampToValueAtTime(
                        note.volume,
                        start + .012
                    );


                    gain.gain.exponentialRampToValueAtTime(
                        0.0001,
                        end
                    );


                    oscillator.connect(
                        gain
                    );

                    gain.connect(
                        ctx.destination
                    );


                    oscillator.start(
                        start
                    );

                    oscillator.stop(
                        end + .015
                    );

                }
            );

        } catch {

            /*
               الصوت اختياري ولا يعطل التطبيق.
            */

        }

    }


    /* =====================================================
       ADD TASK
    ===================================================== */

    function addTask(text) {

        const clean =
            String(text || "")
                .trim();


        if (!clean) {
            return false;
        }


        const task = {

            id:
                `${Date.now()}-${Math.random()
                    .toString(36)
                    .slice(2, 8)}`,

            text:
                clean.slice(0, 500),

            completed:
                false,

            starred:
                false,

            createdAt:
                new Date().toISOString(),

            taskDay:
                getDateKey(),

            completedAt:
                null

        };


        tasks.unshift(task);

        saveTasks();

        render();


        return true;

    }


    /* =====================================================
       TOGGLE TASK
    ===================================================== */

    function toggleTask(id) {

        const task =
            tasks.find(
                item =>
                    String(item.id) ===
                    String(id)
            );


        if (!task) {
            return;
        }


        task.completed =
            !task.completed;


        if (
            task.completed
        ) {

            task.completedAt =
                new Date().toISOString();

            saveTasks();

            render();


            /*
               المستخدم ضغط بنفسه على المهمة،
               لذلك تشغيل الصوت هنا منطقي.
            */

            playCompletionChime();


            requestAnimationFrame(
                () => {

                    showCompletionFeedback(
                        task.id
                    );

                }
            );


            return;
        }


        task.completedAt =
            null;


        saveTasks();

        render();

    }


    /* =====================================================
       STAR
    ===================================================== */

    function toggleStar(id) {

        const task =
            tasks.find(
                item =>
                    String(item.id) ===
                    String(id)
            );


        if (!task) {
            return;
        }


        task.starred =
            !task.starred;


        saveTasks();

        render();

    }


    /* =====================================================
       DELETE
    ===================================================== */

    function deleteTask(id) {

        const index =
            tasks.findIndex(
                item =>
                    String(item.id) ===
                    String(id)
            );


        if (index === -1) {
            return;
        }


        deletedTask = {

            task:
                tasks[index],

            index

        };


        tasks.splice(
            index,
            1
        );


        saveTasks();

        render();

        showToast(
            "تم حذف النية"
        );


        clearTimeout(
            deleteTimer
        );


        deleteTimer =
            setTimeout(
                () => {

                    deletedTask =
                        null;

                    hideToast();

                },
                5000
            );

    }


    function undoDelete() {

        if (!deletedTask) {
            return;
        }


        const {
            task,
            index
        } = deletedTask;


        tasks.splice(
            Math.min(
                index,
                tasks.length
            ),
            0,
            task
        );


        deletedTask =
            null;


        clearTimeout(
            deleteTimer
        );


        saveTasks();

        render();

        hideToast();

    }


    /* =====================================================
       TOAST
    ===================================================== */

    function showToast(
        message
    ) {

        toastMessage.textContent =
            message;


        toast.classList.add(
            "show"
        );

    }


    function hideToast() {

        toast.classList.remove(
            "show"
        );

    }


    toastUndo.addEventListener(
        "click",
        undoDelete
    );


    /* =====================================================
       DAILY PROGRESS
       مهم:
       فقط نوايا اليوم تدخل النسبة.
    ===================================================== */

    function updateProgress() {

        const today =
            getDateKey();


        const todayTasks =
            tasks.filter(
                task =>
                    task.taskDay ===
                    today
            );


        const total =
            todayTasks.length;


        const done =
            todayTasks.filter(
                task =>
                    task.completed
            ).length;


        if (!total) {

            progressFill.style.width =
                "0%";


            progressText.textContent =
                "ابدأ أول نية";


            progressBar.setAttribute(
                "aria-valuenow",
                "0"
            );


            return;
        }


        const percentage =
            Math.round(
                (done / total) * 100
            );


        progressFill.style.width =
            `${percentage}%`;


        progressBar.setAttribute(
            "aria-valuenow",
            String(percentage)
        );


        progressText.textContent =
            `${done} من ${total} · ${percentage}%`;

    }


    /* =====================================================
       SORT
    ===================================================== */

    function sortActive(
        a,
        b
    ) {

        if (
            a.starred !==
            b.starred
        ) {

            return (
                Number(b.starred) -
                Number(a.starred)
            );

        }


        return (
            new Date(b.createdAt) -
            new Date(a.createdAt)
        );

    }


    function sortCompleted(
        a,
        b
    ) {

        return (
            new Date(
                b.completedAt ||
                b.createdAt
            ) -
            new Date(
                a.completedAt ||
                a.createdAt
            )
        );

    }


    /* =====================================================
       RENDER
    ===================================================== */

    function render() {

        updateProgress();


        tasksContainer.innerHTML =
            "";


        const today =
            getDateKey();


        const todayTasks =
            tasks
                .filter(
                    task =>
                        !task.completed &&
                        task.taskDay === today
                )
                .sort(sortActive);


        const carriedTasks =
            tasks
                .filter(
                    task =>
                        !task.completed &&
                        task.taskDay !== today
                )
                .sort(sortActive);


        const completedTasks =
            tasks
                .filter(
                    task =>
                        task.completed
                )
                .sort(sortCompleted);


        let hasContent =
            false;


        /* -------------------------
           TODAY
        -------------------------- */

        if (
            todayTasks.length
        ) {

            appendSection(
                "نوايا اليوم"
            );


            todayTasks.forEach(
                task => {

                    tasksContainer.appendChild(
                        createTaskElement(
                            task
                        )
                    );

                }
            );


            hasContent = true;

        }


        /* -------------------------
           CARRIED TASKS
        -------------------------- */

        if (
            carriedTasks.length
        ) {

            appendSection(
                "مستمرة من قبل"
            );


            carriedTasks.forEach(
                task => {

                    tasksContainer.appendChild(
                        createTaskElement(
                            task,
                            true
                        )
                    );

                }
            );


            hasContent = true;

        }


        /* -------------------------
           COMPLETED
        -------------------------- */

        if (
            completedTasks.length
        ) {

            appendSection(
                "النوايا المحققة"
            );


            completedTasks.forEach(
                task => {

                    tasksContainer.appendChild(
                        createTaskElement(
                            task
                        )
                    );

                }
            );


            hasContent = true;

        }


        if (!hasContent) {

            tasksContainer.innerHTML = `

                <div class="empty">

                    <div
                        class="empty-icon"
                        aria-hidden="true"
                    >
                        🌱
                    </div>

                    <strong>
                        مفيش نوايا هنا
                    </strong>

                    <span>
                        اكتب أول حاجة ناوي تعملها النهارده.
                    </span>

                </div>

            `;

        }

    }


    /* =====================================================
       SECTION
    ===================================================== */

    function appendSection(
        label
    ) {

        const section =
            document.createElement(
                "div"
            );


        section.className =
            "section-label";


        section.innerHTML =
            `<span>${label}</span>`;


        tasksContainer.appendChild(
            section
        );

    }


    /* =====================================================
       TASK ELEMENT
    ===================================================== */

    function createTaskElement(
        task,
        carried = false
    ) {

        const article =
            document.createElement(
                "article"
            );


        article.className =
            `task ${
                task.completed
                    ? "completed"
                    : ""
            }`;


        article.dataset.taskId =
            task.id;


        /* CHECK BUTTON */

        const check =
            document.createElement(
                "button"
            );


        check.type =
            "button";


        check.className =
            "check";


        check.dataset.action =
            "toggle";


        check.setAttribute(
            "aria-label",
            task.completed
                ? "إلغاء إنجاز النية"
                : "إنجاز النية"
        );


        check.innerHTML = `
            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <path d="M5 12.5l4.2 4.2L19 7"></path>
            </svg>
        `;


        /* MAIN */

        const main =
            document.createElement(
                "div"
            );


        main.className =
            "task-main";


        const title =
            document.createElement(
                "div"
            );


        title.className =
            "task-title";


        title.textContent =
            task.text;


        main.appendChild(
            title
        );


        if (
            carried &&
            !task.completed
        ) {

            const label =
                document.createElement(
                    "div"
                );


            label.className =
                "task-carried";


            label.textContent =
                "من يوم سابق";


            main.appendChild(
                label
            );

        }


        /* ACTIONS */

        const actions =
            document.createElement(
                "div"
            );


        actions.className =
            "task-actions";


        const star =
            document.createElement(
                "button"
            );


        star.type =
            "button";


        star.className =
            `icon-btn ${
                task.starred
                    ? "starred"
                    : ""
            }`;


        star.dataset.action =
            "star";


        star.setAttribute(
            "aria-label",
            task.starred
                ? "إلغاء تمييز النية"
                : "تمييز النية"
        );


        star.setAttribute(
            "aria-pressed",
            String(
                task.starred
            )
        );


        star.textContent =
            task.starred
                ? "★"
                : "☆";


        const remove =
            document.createElement(
                "button"
            );


        remove.type =
            "button";


        remove.className =
            "icon-btn delete";


        remove.dataset.action =
            "delete";


        remove.setAttribute(
            "aria-label",
            "حذف النية"
        );


        remove.textContent =
            "×";


        actions.append(
            star,
            remove
        );


        article.append(
            check,
            main,
            actions
        );


        return article;

    }


    /* =====================================================
       TASK CLICK
    ===================================================== */

    tasksContainer.addEventListener(
        "click",
        event => {

            const actionButton =
                event.target.closest(
                    "[data-action]"
                );


            const taskElement =
                event.target.closest(
                    ".task"
                );


            if (!taskElement) {
                return;
            }


            const id =
                taskElement.dataset.taskId;


            if (!id) {
                return;
            }


            if (
                actionButton
            ) {

                const action =
                    actionButton.dataset.action;


                if (
                    action ===
                    "toggle"
                ) {

                    toggleTask(id);

                    return;
                }


                if (
                    action ===
                    "star"
                ) {

                    toggleStar(id);

                    return;
                }


                if (
                    action ===
                    "delete"
                ) {

                    deleteTask(id);

                    return;
                }

            }


            /*
               الضغط على النص أو أي مساحة
               من المهمة = إنجاز.
            */

            toggleTask(id);

        }
    );


    /* =====================================================
       KEYBOARD SUPPORT
    ===================================================== */

    tasksContainer.addEventListener(
        "keydown",
        event => {

            if (
                event.key !==
                "Enter" &&
                event.key !==
                " "
            ) {

                return;
            }


            const button =
                event.target.closest(
                    ".check"
                );


            if (!button) {
                return;
            }


            event.preventDefault();

            const taskElement =
                button.closest(
                    ".task"
                );


            if (!taskElement) {
                return;
            }


            toggleTask(
                taskElement.dataset.taskId
            );

        }
    );


    /* =====================================================
       INPUT
    ===================================================== */

    function resizeInput() {

        taskInput.style.height =
            "auto";


        taskInput.style.height =
            `${Math.min(
                taskInput.scrollHeight,
                120
            )}px`;

    }


    function updateSubmitButton() {

        const hasText =
            taskInput.value
                .trim()
                .length > 0;


        submitBtn.disabled =
            !hasText;


        submitBtn.classList.toggle(
            "active",
            hasText
        );

    }


    taskInput.addEventListener(
        "input",
        () => {

            resizeInput();

            updateSubmitButton();

        }
    );


    /* =====================================================
       SEND
    ===================================================== */

    function handleSend() {

        const text =
            taskInput.value.trim();


        if (!text) {
            return;
        }


        if (
            addTask(text)
        ) {

            taskInput.value =
                "";


            taskInput.style.height =
                "42px";


            updateSubmitButton();


            taskInput.focus();


            tasksContainer.scrollTop =
                0;
        }

    }


    submitBtn.addEventListener(
        "click",
        handleSend
    );


    taskInput.addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                    "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                handleSend();

            }

        }
    );


    /* =====================================================
       PWA INSTALL
    ===================================================== */

    window.addEventListener(
        "beforeinstallprompt",
        event => {

            event.preventDefault();

            deferredInstallPrompt =
                event;


            setTimeout(
                () => {

                    if (
                        deferredInstallPrompt &&
                        !isStandalone()
                    ) {

                        installOverlay.classList.add(
                            "show"
                        );

                        installOverlay.setAttribute(
                            "aria-hidden",
                            "false"
                        );

                    }

                },
                8000
            );

        }
    );


    installBtn.addEventListener(
        "click",
        async () => {

            if (
                deferredInstallPrompt
            ) {

                try {

                    deferredInstallPrompt.prompt();

                    await deferredInstallPrompt.userChoice;

                } catch {}

                deferredInstallPrompt =
                    null;

                closeInstall();

                return;

            }


            closeInstall();

            installGuide.classList.add(
                "show"
            );

            installGuide.setAttribute(
                "aria-hidden",
                "false"
            );


            if (
                /iphone|ipad|ipod/i.test(
                    navigator.userAgent
                )
            ) {

                guideText.textContent =
                    "في Safari اضغط مشاركة ثم اختَر إضافة إلى الشاشة الرئيسية.";

            } else {

                guideText.textContent =
                    "من قائمة المتصفح اختَر تثبيت التطبيق أو إضافة إلى الشاشة الرئيسية.";

            }

        }
    );


    function closeInstall() {

        installOverlay.classList.remove(
            "show"
        );

        installOverlay.setAttribute(
            "aria-hidden",
            "true"
        );

    }


    installClose.addEventListener(
        "click",
        closeInstall
    );


    guideClose.addEventListener(
        "click",
        () => {

            installGuide.classList.remove(
                "show"
            );

            installGuide.setAttribute(
                "aria-hidden",
                "true"
            );

        }
    );


    installGuide.addEventListener(
        "click",
        event => {

            if (
                event.target ===
                installGuide
            ) {

                installGuide.classList.remove(
                    "show"
                );

            }

        }
    );


    /* =====================================================
       STANDALONE
    ===================================================== */

    function isStandalone() {

        return (
            window.matchMedia(
                "(display-mode: standalone)"
            ).matches ||

            window.navigator.standalone === true
        );

    }


    /* =====================================================
       MIDNIGHT REFRESH
       لو التطبيق ظل مفتوحًا حتى يوم جديد
    ===================================================== */

    document.addEventListener(
        "visibilitychange",
        () => {

            if (
                !document.hidden
            ) {

                updateDate();

                render();

            }

        }
    );


    /* =====================================================
       SERVICE WORKER
    ===================================================== */

    if (
        "serviceWorker" in navigator
    ) {

        window.addEventListener(
            "load",
            () => {

                navigator.serviceWorker
                    .register(
                        "./sw.js",
                        {
                            scope: "./"
                        }
                    )
                    .catch(
                        () => {}
                    );

            }
        );

    }


    /* =====================================================
       START
    ===================================================== */

    updateSubmitButton();

    render();

})();

</script>

</body>
</html>
