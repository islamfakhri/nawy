<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="تطبيق بسيط لتدوين النوايا والأهداف">
    <meta name="theme-color" content="#10b981">
    
    <!-- ربط الملفات بصيغة مطلقة لضمان التعرف عليها على GitHub Pages -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>ناوي | دوّن اللي ناوي عليه</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            min-height: 100vh;
            padding: 15px;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 25px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 2.2em;
            margin-bottom: 5px;
        }

        header p {
            font-size: 0.95em;
            opacity: 0.9;
        }

        /* شريط التثبيت على شاشة الجوال */
        .install-banner {
            display: flex; /* إظهاره افتراضياً بدلاً من none */
            background: #ecfdf5;
            border: 2px dashed #10b981;
            padding: 12px 15px;
            margin: 15px 15px 0 15px;
            border-radius: 12px;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .install-banner span {
            font-size: 0.88em;
            font-weight: 600;
            color: #065f46;
        }

        .btn-install {
            background: #10b981;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.85em;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
            white-space: nowrap;
        }

        .btn-install:active {
            background: #059669;
        }

        .content {
            padding: 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
            background: #f0fdf4;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-number {
            font-size: 1.5em;
            font-weight: bold;
            color: #10b981;
        }

        .stat-label {
            font-size: 0.75em;
            color: #6b7280;
            margin-top: 3px;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #10b981;
        }

        .btn-add {
            padding: 12px 20px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-add:active {
            background: #059669;
        }

        .goals-list {
            list-style: none;
            max-height: 45vh;
            overflow-y: auto;
        }

        .goal-item {
            background: #f9fafb;
            border: 1px solid #f3f4f6;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            word-break: break-word;
        }

        .goal-item.completed {
            background: #d1fae5;
            text-decoration: line-through;
            opacity: 0.75;
        }

        .goal-text {
            flex: 1;
            cursor: pointer;
            font-size: 0.95em;
        }

        .goal-actions {
            display: flex;
            gap: 6px;
        }

        .btn-small {
            padding: 6px 10px;
            font-size: 0.8em;
            background: #f59e0b;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
        }

        .btn-delete {
            background: #ef4444;
        }

        .empty-state {
            text-align: center;
            padding: 30px 10px;
            color: #9ca3af;
        }

        .empty-state span {
            font-size: 2.5em;
            display: block;
            margin-bottom: 8px;
        }

        footer {
            background: #f9fafb;
            padding: 15px;
            text-align: center;
            color: #6b7280;
            font-size: 0.85em;
            border-top: 1px solid #e5e7eb;
        }

        @media (max-width: 360px) {
            body { padding: 5px; }
            .content { padding: 15px 10px; }
            header h1 { font-size: 1.8em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>ناوي 🎯</h1>
            <p>دوّن اللي ناوي عليه وحقق أهدافك</p>
        </header>

        <!-- بنر التثبيت بوضع الظهور المباشر -->
        <div class="install-banner" id="installBanner">
            <span>📱 ثبّت التطبيق على جوالك</span>
            <button class="btn-install" id="installBtn">ثبّت الآن</button>
        </div>

        <div class="content">
            <div class="stats">
                <div class="stat">
                    <div class="stat-number" id="totalGoals">0</div>
                    <div class="stat-label">إجمالي النوايا</div>
                </div>
                <div class="stat">
                    <div class="stat-number" id="completedGoals">0</div>
                    <div class="stat-label">المنجزة</div>
                </div>
                <div class="stat">
                    <div class="stat-number" id="remainingGoals">0</div>
                    <div class="stat-label">المتبقية</div>
                </div>
            </div>

            <div class="input-group">
                <input 
                    type="text" 
                    id="goalInput" 
                    placeholder="أكتب نيتك هنا..." 
                    autocomplete="off"
                >
                <button class="btn-add" onclick="addGoal()">أضف</button>
            </div>

            <ul class="goals-list" id="goalsList"></ul>

            <div class="empty-state" id="emptyState">
                <span>📝</span>
                <p>لا توجد نوايا حالياً<br>ابدأ بإضافة نيتك الأولى!</p>
            </div>
        </div>

        <footer>
            <p>✨ ناوي - حقق أحلامك خطوة بخطوة</p>
            <p style="font-size: 0.8em; margin-top: 4px;">يعمل بدون إنترنت 📱</p>
        </footer>
    </div>

    <script>
        // --- 1. إدارة التثبيت المفروض والذكي ---
        let deferredPrompt;
        const installBanner = document.getElementById('installBanner');
        const installBtn = document.getElementById('installBtn');

        // إذا كان التطبيق مفعل كـ PWA مثبت بالفعل، يتم إخفاء الشريط
        if (window.matchMedia('(display-mode: standalone)').matches) {
            installBanner.style.display = 'none';
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBanner.style.display = 'flex';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installBanner.style.display = 'none';
                }
                deferredPrompt = null;
            } else {
                // حل احتياطي في حال عدم إطلاق حدث التثبيت من المتصفح
                alert('لتثبيت التطبيق على جوالك:\n\n1. اضغط على نقط القائمة (⋮) بأعلى المتصفح.\n2. اختر "التثبيت" أو "الإضافة إلى الشاشة الرئيسية".');
            }
        });

        window.addEventListener('appinstalled', () => {
            installBanner.style.display = 'none';
        });

        // --- 2. تسجيل الـ Service Worker ---
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(() => console.log('Service Worker Registered'))
                .catch(err => console.log('Service Worker Failed:', err));
        }

        // --- 3. الوظائف التشغيلية ---
        let goals = JSON.parse(localStorage.getItem('nawyGoals')) || [];

        document.addEventListener('DOMContentLoaded', () => {
            renderGoals();
            document.getElementById('goalInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') addGoal();
            });
        });

        function addGoal() {
            const input = document.getElementById('goalInput');
            const goalText = input.value.trim();

            if (goalText === '') return;

            const newGoal = {
                id: Date.now(),
                text: goalText,
                completed: false
            };

            goals.push(newGoal);
            saveGoals();
            renderGoals();
            input.value = '';
        }

        function deleteGoal(id) {
            goals = goals.filter(goal => goal.id !== id);
            saveGoals();
            renderGoals();
        }

        function toggleGoal(id) {
            const goal = goals.find(g => g.id === id);
            if (goal) {
                goal.completed = !goal.completed;
                saveGoals();
                renderGoals();
            }
        }

        function editGoal(id) {
            const goal = goals.find(g => g.id === id);
            if (!goal) return;

            const newText = prompt('عدّل النية:', goal.text);
            if (newText && newText.trim() !== '') {
                goal.text = newText.trim();
                saveGoals();
                renderGoals();
            }
        }

        function saveGoals() {
            localStorage.setItem('nawyGoals', JSON.stringify(goals));
        }

        function renderGoals() {
            const goalsList = document.getElementById('goalsList');
            const emptyState = document.getElementById('emptyState');

            if (goals.length === 0) {
                goalsList.innerHTML = '';
                emptyState.style.display = 'block';
                updateStats(0, 0);
                return;
            }

            emptyState.style.display = 'none';
            const completedCount = goals.filter(g => g.completed).length;
            updateStats(goals.length, completedCount);

            goalsList.innerHTML = goals.map(goal => `
                <li class="goal-item ${goal.completed ? 'completed' : ''}">
                    <span class="goal-text" onclick="toggleGoal(${goal.id})">
                        ${goal.completed ? '✓ ' : ''}${escapeHtml(goal.text)}
                    </span>
                    <div class="goal-actions">
                        <button class="btn-small" onclick="editGoal(${goal.id})">تعديل</button>
                        <button class="btn-small btn-delete" onclick="deleteGoal(${goal.id})">حذف</button>
                    </div>
                </li>
            `).join('');
        }

        function updateStats(total, completed) {
            document.getElementById('totalGoals').textContent = total;
            document.getElementById('completedGoals').textContent = completed;
            document.getElementById('remainingGoals').textContent = total - completed;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
