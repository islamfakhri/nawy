.tasks {

/* =========================
   CHECK

.check {

.task:not(.completed):hover .check {
    border-color: var(--green);
    background: rgba(25,197,139,.10);

}

.check::after {
    content: "✓";

    transition: opacity .15s ease, transform .15s ease;
}

.task:not(.completed):hover .check::after {
    opacity: .9;
    transform: scale(1);
}

.task.completed .check {
    background: var(--green);
    border-color: var(--green);
    color: #07130e;
}

.task.completed .check::after {
    opacity: 1;

<script>

/* =========================================================
   NAWY
   نسخة بسيطة: كل المنطق هنا داخل index.html
========================================================= */

const STORAGE_KEY = "nawy_tasks_v5";

const taskInput = document.getElementById("taskInput");
const submitBtn = document.getElementById("submitBtn");
const tasksContainer = document.getElementById("tasksContainer");
const progressFill = document.getElementById("progressFill");
const progressText = document.getElementById("progressText");
const currentDate = document.getElementById("currentDate");

const installOverlay = document.getElementById("installOverlay");
const installBtn = document.getElementById("installBtn");
const installClose = document.getElementById("installClose");

const installGuide = document.getElementById("installGuide");
const guideClose = document.getElementById("guideClose");

let tasks = loadTasks();
let deferredInstallPrompt = null;
let audioContext = null;


/* =========================================================
   DATE
========================================================= */

currentDate.textContent =
    new Intl.DateTimeFormat("ar-EG", {
        weekday: "long",
        day: "numeric",
        month: "long"
    }).format(new Date());


/* =========================================================
   STORAGE
========================================================= */

function loadTasks() {

    try {

        const current =
            JSON.parse(localStorage.getItem(STORAGE_KEY));

        if (Array.isArray(current)) {
            return current;
        }

        const old =
            JSON.parse(localStorage.getItem("nawy_tasks_v4"));

        if (Array.isArray(old)) {
            return old;
        }

        const older =
            JSON.parse(localStorage.getItem("nawy_tasks_v3"));

        return Array.isArray(older) ? older : [];

    } catch {

        return [];
    }
}

function saveTasks() {

    try {
        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(tasks)
        );
    } catch (error) {
        console.warn("Nawy storage error:", error);
    }
}


/* =========================================================
   AUDIO
   صوت خفيف فقط
========================================================= */

function getAudioContext() {

    try {

        if (!audioContext) {

            const AudioContext =
                window.AudioContext ||
                window.webkitAudioContext;

            if (!AudioContext) {
                return null;
            }

            audioContext = new AudioContext();
        }

        if (audioContext.state === "suspended") {
            audioContext.resume();
        }

        return audioContext;

    } catch {

        return null;
    }
}


/* صوت إضافة النية */

function playAddSound() {

    const ctx = getAudioContext();

    if (!ctx) return;

    try {

        const now = ctx.currentTime;

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = "sine";

        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(
            650,
            now + .07
        );

        gain.gain.setValueAtTime(.0001, now);
        gain.gain.exponentialRampToValueAtTime(
            .025,
            now + .01
        );

        gain.gain.exponentialRampToValueAtTime(
            .0001,
            now + .09
        );

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + .1);

    } catch {}
}


/* صوت إنجاز — Chime خفيف */

function playCompletionSound() {

    const ctx = getAudioContext();

    if (!ctx) return;

    try {

        const now = ctx.currentTime;

        const notes = [
            { freq: 784, time: 0, volume: .045 },
            { freq: 988, time: .075, volume: .038 },
            { freq: 1175, time: .15, volume: .028 }
        ];

        notes.forEach(note => {

            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type = "sine";

            osc.frequency.setValueAtTime(
                note.freq,
                now + note.time
            );

            gain.gain.setValueAtTime(
                .0001,
                now + note.time
            );

            gain.gain.exponentialRampToValueAtTime(
                note.volume,
                now + note.time + .008
            );

            gain.gain.exponentialRampToValueAtTime(
                .0001,
                now + note.time + .24
            );

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start(now + note.time);
            osc.stop(now + note.time + .25);

        });

    } catch {}
}


/* =========================================================
   TASKS
========================================================= */

function addTask(text) {

    const clean = text.trim();

    if (!clean) return;

    const task = {

        id:
            Date.now().toString() +
            Math.random().toString(36).slice(2, 7),

        text: clean,

        completed: false,

        starred: false,

        createdAt: new Date().toISOString()
    };

    tasks.unshift(task);

    saveTasks();

    playAddSound();

    render();
}


function toggleTask(id) {

    const task =
        tasks.find(item => item.id === id);

    if (!task) return;

    task.completed = !task.completed;

    if (task.completed) {

        playCompletionSound();

        render();

        showCompletionFeedback(id);

    } else {

        render();
    }

    saveTasks();
}


function toggleStar(id) {

    const task =
        tasks.find(item => item.id === id);

    if (!task) return;

    task.starred = !task.starred;

    saveTasks();

    render();
}


function deleteTask(id) {

    tasks =
        tasks.filter(item => item.id !== id);

    saveTasks();

    render();
}


/* =========================================================
   PROGRESS
========================================================= */

function updateProgress() {

    const total = tasks.length;

    const done =
        tasks.filter(task => task.completed).length;

    if (!total) {

        progressFill.style.width = "0%";

        progressText.textContent =
            "ابدأ أول نية";

        return;
    }

    const percentage =
        Math.round((done / total) * 100);

    progressFill.style.width =
        percentage + "%";

    if (percentage === 100) {

        progressText.textContent =
            "ما شاء الله! كملت كل نواياك 🎉";

    } else {

        progressText.textContent =
            `${done} من ${total} أُنجزت`;
    }
}


/* =========================================================
   RENDER
========================================================= */

function render() {

    updateProgress();

    tasksContainer.innerHTML = "";

    if (!tasks.length) {

        tasksContainer.innerHTML = `
            <div class="empty">
                <div class="empty-icon">🌱</div>
                <strong>مفيش نوايا هنا</strong>
                <span>اكتب أول حاجة ناوي تعملها.</span>
            </div>
        `;

        return;
    }

    const activeTasks =
        tasks
        .filter(task => !task.completed)
        .sort((a, b) =>
            Number(b.starred) - Number(a.starred)
        );

    const completedTasks =
        tasks.filter(task => task.completed);

    activeTasks.forEach(task => {

        tasksContainer.appendChild(
            createTaskElement(task)
        );

    });


    if (completedTasks.length) {

        const divider =
            document.createElement("div");

        divider.className =
            "completed-divider";

        divider.innerHTML =
            `<span>النوايا المحققة (${completedTasks.length})</span>`;

        tasksContainer.appendChild(divider);


        completedTasks.forEach(task => {

            tasksContainer.appendChild(
                createTaskElement(task)
            );

        });
    }
}


/* =========================================================
   CREATE TASK
========================================================= */

function createTaskElement(task) {

    const element =
        document.createElement("div");

    element.className =
        "task" +
        (task.completed ? " completed" : "");

    element.dataset.taskId =
        task.id;

    element.innerHTML = `

        <div class="check" aria-hidden="true"></div>

        <div class="task-main">
            <div class="task-title">
                ${escapeHtml(task.text)}
            </div>
        </div>

        <div class="task-actions">

            <button
                type="button"
                class="icon-btn ${task.starred ? "starred" : ""}"
                data-action="star"
                aria-label="تمييز"
            >
                ${task.starred ? "★" : "☆"}
            </button>

            <button
                type="button"
                class="icon-btn delete"
                data-action="delete"
                aria-label="حذف"
            >
                ×
            </button>

        </div>
    `;

    return element;
}


/* =========================================================
   SECURITY
========================================================= */

function escapeHtml(value) {

    return String(value).replace(
        /[&<>"']/g,
        character => ({

            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"

        })[character]
    );
}


/* =========================================================
   COMPLETION ANIMATION
========================================================= */

function showCompletionFeedback(id) {

    if (
        window.matchMedia(
            "(prefers-reduced-motion: reduce)"
        ).matches
    ) {
        return;
    }

    const taskElement =
        document.querySelector(
            `[data-task-id="${CSS.escape(id)}"]`
        );

    if (!taskElement) return;

    taskElement.classList.add("just-completed");

    setTimeout(() => {

        taskElement.classList.remove(
            "just-completed"
        );

    }, 500);

    const check =
        taskElement.querySelector(".check");

    if (!check) return;

    const rect =
        check.getBoundingClientRect();

    const burst =
        document.createElement("div");

    burst.className =
        "completion-burst";

    burst.style.left =
        (rect.left + rect.width / 2) + "px";

    burst.style.top =
        (rect.top + rect.height / 2) + "px";

    const particles = 10;

    const fragment =
        document.createDocumentFragment();

    const colors = [
        "#19c58b",
        "#f3c84b",
        "#f3f5f4"
    ];

    for (let i = 0; i < particles; i++) {

        const particle =
            document.createElement("i");

        particle.style.setProperty(
            "--angle",
            `${i * (360 / particles)}deg`
        );

        particle.style.setProperty(
            "--distance",
            `${28 + (i % 3) * 7}px`
        );

        particle.style.setProperty(
            "--size",
            `${4 + (i % 2)}px`
        );

        particle.style.setProperty(
            "--color",
            colors[i % colors.length]
        );

        fragment.appendChild(particle);
    }

    burst.appendChild(fragment);

    document.body.appendChild(burst);

    setTimeout(() => {
        burst.remove();
    }, 600);
}


/* =========================================================
   TASK EVENTS
========================================================= */

tasksContainer.addEventListener(
    "click",
    event => {

        const button =
            event.target.closest(".icon-btn");

        if (button) {

            const taskElement =
                button.closest(".task");

            if (!taskElement) return;

            const id =
                taskElement.dataset.taskId;

            const action =
                button.dataset.action;

            if (action === "star") {

                toggleStar(id);

            }

            if (action === "delete") {

                if (
                    confirm(
                        "هل أنت متأكد من حذف هذه النية؟"
                    )
                ) {

                    deleteTask(id);
                }
            }

            return;
        }


        const taskElement =
            event.target.closest(".task");

        if (!taskElement) return;

        toggleTask(
            taskElement.dataset.taskId
        );
    }
);


/* =========================================================
   COMPOSER
========================================================= */

function resizeInput() {

    taskInput.style.height = "auto";

    taskInput.style.height =
        Math.min(
            taskInput.scrollHeight,
            120
        ) + "px";
}


function updateSendButton() {

    submitBtn.classList.toggle(
        "active",
        taskInput.value.trim().length > 0
    );
}


taskInput.addEventListener(
    "input",
    () => {

        resizeInput();

        updateSendButton();
    }
);


taskInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            handleSend();
        }
    }
);


submitBtn.addEventListener(
    "click",
    handleSend
);


function handleSend() {

    const text =
        taskInput.value.trim();

    if (!text) {

        taskInput.focus();

        return;
    }

    addTask(text);

    taskInput.value = "";

    taskInput.style.height = "42px";

    updateSendButton();

    taskInput.focus();
}


/* =========================================================
   PWA INSTALL
========================================================= */

window.addEventListener(
    "beforeinstallprompt",
    event => {

        event.preventDefault();

        deferredInstallPrompt = event;

        installOverlay.classList.add("show");

        installOverlay.setAttribute(
            "aria-hidden",
            "false"
        );
    }
);


installBtn.addEventListener(
    "click",
    async () => {

        if (!deferredInstallPrompt) {

            installOverlay.classList.remove("show");

            installGuide.classList.add("show");

            return;
        }

        deferredInstallPrompt.prompt();

        try {

            await deferredInstallPrompt.userChoice;

        } catch {}

        deferredInstallPrompt = null;

        installOverlay.classList.remove("show");
    }
);


installClose.addEventListener(
    "click",
    () => {

        installOverlay.classList.remove("show");

        installOverlay.setAttribute(
            "aria-hidden",
            "true"
        );
    }
);


guideClose.addEventListener(
    "click",
    () => {

        installGuide.classList.remove("show");

        installGuide.setAttribute(
            "aria-hidden",
            "true"
        );
    }
);
