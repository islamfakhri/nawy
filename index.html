<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#0d1210">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="black-translucent">

<title>ناوي — على إيه النهارده؟</title>

<link rel="manifest" href="./manifest.json">

<link rel="icon"
      type="image/png"
      href="./icon-192.png">

<link rel="apple-touch-icon"
      href="./icon-192.png">


<style>

    :root {

        --bg: #0d1210;
        --surface: #151b18;
        --text: #f4f7f5;
        --muted: #87948d;
        --muted-dark: #65716b;
        --green: #19c58b;
        --yellow: #f4c84d;
        --danger: #ff6262;
        --border: rgba(255,255,255,.07);

    }


    * {

        margin: 0;
        padding: 0;
        box-sizing: border-box;

        -webkit-tap-highlight-color: transparent;

    }


    html,
    body {

        width: 100%;
        min-height: 100%;

        background:
            var(--bg);

    }


    body {

        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Roboto,
            "Noto Sans Arabic",
            Tahoma,
            Arial,
            sans-serif;

        color:
            var(--text);

        overflow:
            hidden;

    }


    button,
    textarea {

        font-family:
            inherit;

    }


    button {

        border:
            none;

        outline:
            none;

        cursor:
            pointer;

        -webkit-user-select:
            none;

        user-select:
            none;

        touch-action:
            manipulation;

    }


    /* =========================
       APP
    ========================= */

    .app {

        width:
            100%;

        max-width:
            620px;

        height:
            100dvh;

        margin:
            auto;

        display:
            flex;

        flex-direction:
            column;

        position:
            relative;

        background:

            radial-gradient(
                circle at 85% -10%,
                rgba(25,197,139,.13),
                transparent 30%
            ),

            var(--bg);

    }


    /* =========================
       HEADER
    ========================= */

    .header {

        padding:
            28px
            20px
            15px;

        flex-shrink:
            0;

    }


    .brand {

        display:
            flex;

        align-items:
            center;

        gap:
            10px;

    }


    .brand-mark {

        width:
            40px;

        height:
            40px;

        display:
            grid;

        place-items:
            center;

        border-radius:
            13px;

        background:
            rgba(25,197,139,.12);

        color:
            var(--green);

        font-size:
            20px;

    }


    .brand-name {

        font-size:
            24px;

        font-weight:
            800;

        letter-spacing:
            -.8px;

    }


    /* =========================
       GREETING
    ========================= */

    .greeting {

        margin-top:
            17px;

    }


    .greeting h1 {

        font-size:
            27px;

        line-height:
            1.25;

        font-weight:
            800;

        letter-spacing:
            -.8px;

    }


    .greeting p {

        margin-top:
            6px;

        color:
            var(--muted);

        font-size:
            14px;

    }


    /* =========================
       PROGRESS
    ========================= */

    .progress {

        margin-top:
            18px;

        display:
            flex;

        align-items:
            center;

        gap:
            10px;

    }


    .progress-bar {

        height:
            5px;

        flex:
            1;

        background:
            rgba(255,255,255,.07);

        border-radius:
            99px;

        overflow:
            hidden;

    }


    .progress-fill {

        height:
            100%;

        width:
            0%;

        background:
            var(--green);

        border-radius:
            99px;

        transition:
            width .3s ease;

    }


    .progress-text {

        color:
            var(--muted);

        font-size:
            12px;

        white-space:
            nowrap;

    }


    /* =========================
       TASKS
    ========================= */

    .tasks {

        flex:
            1;

        overflow-y:
            auto;

        padding:
            8px
            20px
            160px;

        scrollbar-width:
            none;

    }


    .tasks::-webkit-scrollbar {

        display:
            none;

    }


    .task {

        min-height:
            64px;

        display:
            flex;

        align-items:
            center;

        gap:
            13px;

        padding:
            11px 3px;

        border-bottom:
            1px solid var(--border);

        transition:
            opacity .2s ease,
            transform .15s ease;

    }


    .task:last-child {

        border-bottom:
            none;

    }


    .task:active {

        transform:
            scale(.99);

    }


    /* =========================
       CHECK
    ========================= */

    .check {

        width:
            23px;

        height:
            23px;

        flex:
            0 0 23px;

        border:
            1.8px solid #66736c;

        border-radius:
            50%;

        display:
            grid;

        place-items:
            center;

        transition:
            all .2s ease;

    }


    .task.completed .check {

        background:
            var(--green);

        border-color:
            var(--green);

    }


    .check::after {

        content:
            "✓";

        color:
            #07120e;

        font-size:
            14px;

        font-weight:
            900;

        opacity:
            0;

        transform:
            scale(.5);

        transition:
            all .2s ease;

    }


    .task.completed .check::after {

        opacity:
            1;

        transform:
            scale(1);

    }


    /* =========================
       TASK TEXT
    ========================= */

    .task-main {

        min-width:
            0;

        flex:
            1;

    }


    .task-title {

        font-size:
            16px;

        line-height:
            1.45;

        color:
            #eef3f0;

        overflow-wrap:
            anywhere;

        transition:
            all .2s ease;

    }


    .task.completed .task-title {

        color:
            var(--muted-dark);

        text-decoration:
            line-through;

    }


    /* =========================
       ACTIONS
    ========================= */

    .task-actions {

        display:
            flex;

        align-items:
            center;

        gap:
            2px;

        opacity:
            .65;

    }


    .icon-btn {

        width:
            34px;

        height:
            34px;

        display:
            grid;

        place-items:
            center;

        border-radius:
            10px;

        background:
            transparent;

        color:
            #718078;

        font-size:
            19px;

        transition:
            all .2s ease;

    }


    .icon-btn:active {

        background:
            rgba(255,255,255,.07);

    }


    .icon-btn.starred {

        color:
            var(--yellow);

    }


    .icon-btn.delete:active {

        color:
            var(--danger);

    }


    /* =========================
       EMPTY
    ========================= */

    .empty {

        text-align:
            center;

        padding:
            80px 25px;

    }


    .empty-icon {

        width:
            58px;

        height:
            58px;

        margin:
            0 auto 15px;

        display:
            grid;

        place-items:
            center;

        border-radius:
            18px;

        background:
            rgba(25,197,139,.09);

        color:
            var(--green);

        font-size:
            25px;

    }


    .empty strong {

        display:
            block;

        color:
            #dfe7e3;

        font-size:
            16px;

        margin-bottom:
            5px;

    }


    .empty span {

        color:
            var(--muted);

        font-size:
            13px;

    }


    /* =========================
       INSTALL CARD
    ========================= */

    .install-card {

        display:
            none;

        margin:
            0 16px 10px;

        padding:
            13px 14px;

        align-items:
            center;

        gap:
            12px;

        background:
            rgba(21,27,24,.97);

        border:
            1px solid var(--border);

        border-radius:
            17px;

        box-shadow:
            0 14px 35px rgba(0,0,0,.25);

        backdrop-filter:
            blur(16px);

    }


    .install-card.show {

        display:
            flex;

        animation:
            installIn .28s ease both;

    }


    @keyframes installIn {

        from {

            opacity:
                0;

            transform:
                translateY(8px);

        }

        to {

            opacity:
                1;

            transform:
                translateY(0);

        }

    }


    .install-icon {

        width:
            38px;

        height:
            38px;

        flex:
            0 0 38px;

        display:
            grid;

        place-items:
            center;

        border-radius:
            12px;

        background:
            rgba(25,197,139,.11);

        font-size:
            18px;

    }


    .install-copy {

        min-width:
            0;

        flex:
            1;

    }


    .install-title {

        font-size:
            14px;

        font-weight:
            800;

        color:
            var(--text);

    }


    .install-subtitle {

        margin-top:
            2px;

        color:
            var(--muted);

        font-size:
            11px;

    }


    .install-btn {

        padding:
            9px 12px;

        border-radius:
            11px;

        background:
            var(--green);

        color:
            #06140f;

        font-size:
            12px;

        font-weight:
            800;

        white-space:
            nowrap;

    }


    .install-close {

        width:
            28px;

        height:
            28px;

        display:
            grid;

        place-items:
            center;

        background:
            transparent;

        color:
            #64716b;

        font-size:
            18px;

    }


    /* =========================
       COMPOSER
    ========================= */

    .composer-wrap {

        position:
            absolute;

        left:
            0;

        right:
            0;

        bottom:
            0;

        padding:
            12px
            16px
            calc(12px + env(safe-area-inset-bottom));

        background:
            linear-gradient(
                to top,
                var(--bg) 70%,
                transparent
            );

        pointer-events:
            none;

    }


    .composer {

        pointer-events:
            auto;

        display:
            flex;

        align-items:
            flex-end;

        gap:
            8px;

        padding:
            7px
            8px
            7px
            7px;

        background:
            rgba(25,32,29,.96);

        border:
            1px solid var(--border);

        border-radius:
            20px;

        box-shadow:
            0 18px 45px rgba(0,0,0,.28);

        backdrop-filter:
            blur(18px);

    }


    /* =========================
       INPUT
    ========================= */

    textarea {

        flex:
            1;

        min-width:
            0;

        min-height:
            42px;

        max-height:
            110px;

        resize:
            none;

        border:
            none;

        outline:
            none;

        background:
            transparent;

        color:
            var(--text);

        padding:
            10px;

        line-height:
            1.45;

        font-size:
            15px;

    }


    textarea::placeholder {

        color:
            #718078;

    }


    /* =========================
       ADD
    ========================= */

    .submit {

        width:
            42px;

        height:
            42px;

        flex:
            0 0 42px;

        display:
            grid;

        place-items:
            center;

        border-radius:
            14px;

        background:
            #29332e;

        color:
            #718078;

        font-size:
            20px;

        transition:
            all .2s ease;

    }


    .submit.active {

        background:
            var(--green);

        color:
            #06140f;

        box-shadow:
            0 7px 20px
            rgba(25,197,139,.22);

    }


    .submit:active {

        transform:
            scale(.94);

    }


    .submit:disabled {

        cursor:
            default;

        pointer-events:
            none;

    }


    .hint {

        text-align:
            center;

        color:
            #56635c;

        font-size:
            10px;

        margin-top:
            7px;

    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width:380px) {

        .header {

            padding:
                22px
                16px
                12px;

        }

        .tasks {

            padding-left:
                16px;

            padding-right:
                16px;

        }

        .greeting h1 {

            font-size:
                24px;

        }

        .task-title {

            font-size:
                15px;

        }

        .install-card {

            margin-left:
                12px;

            margin-right:
                12px;

        }

    }

</style>

</head><body><div class="app"><!-- HEADER -->

<header class="header">

    <div class="brand">

        <div class="brand-mark">
            🎯
        </div>

        <div class="brand-name">
            ناوي
        </div>

    </div>


    <div class="greeting">

        <h1>
            ناوي على إيه النهارده؟
        </h1>

        <p id="currentDate">
            —
        </p>

    </div>


    <div class="progress">

        <div class="progress-bar">

            <div
                class="progress-fill"
                id="progressFill">
            </div>

        </div>


        <div
            class="progress-text"
            id="progressText">

            ابدأ أول نية

        </div>

    </div>

</header>


<!-- TASKS -->

<main
    class="tasks"
    id="tasksContainer">
</main>


<!-- INSTALL -->

<div
    class="install-card"
    id="installCard">

    <div class="install-icon">
        📱
    </div>


    <div class="install-copy">

        <div class="install-title">
            ناوي؟ خليه معاك.
        </div>

        <div class="install-subtitle">
            ثبّت التطبيق وابدأ يومك بنية.
        </div>

    </div>


    <button
        type="button"
        class="install-btn"
        id="installBtn">

        ثبّت ناوي

    </button>


    <button
        type="button"
        class="install-close"
        id="installClose"
        aria-label="إغلاق">

        ×

    </button>

</div>


<!-- COMPOSER -->

<div class="composer-wrap">

    <div class="composer">

        <textarea
            id="taskInput"
            rows="1"
            maxlength="500"
            placeholder="اكتب اللي ناوي عليه..."
            enterkeyhint="send">
        </textarea>


        <button
            type="button"
            class="submit"
            id="submitBtn"
            aria-label="إضافة نية">

            ↑

        </button>

    </div>


    <div class="hint">
        اضغط Enter لإضافة نية جديدة
    </div>

</div>

</div><script>

    /* =====================================================
       NAWY
    ===================================================== */

    const STORAGE_KEY =
        "nawy_tasks_v4";


    const taskInput =
        document.getElementById(
            "taskInput"
        );


    const submitBtn =
        document.getElementById(
            "submitBtn"
        );


    const tasksContainer =
        document.getElementById(
            "tasksContainer"
        );


    const progressFill =
        document.getElementById(
            "progressFill"
        );


    const progressText =
        document.getElementById(
            "progressText"
        );


    const currentDate =
        document.getElementById(
            "currentDate"
        );


    const installCard =
        document.getElementById(
            "installCard"
        );


    const installBtn =
        document.getElementById(
            "installBtn"
        );


    const installClose =
        document.getElementById(
            "installClose"
        );


    let tasks =
        loadTasks();


    let isAddingTask =
        false;


    /* =====================================================
       SOFT TODO SOUND
       ===================================================== */

    let audioContext =
        null;


    function playAddSound() {

        try {

            const AudioContext =
                window.AudioContext ||
                window.webkitAudioContext;


            if (!AudioContext) {

                return;

            }


            if (!audioContext) {

                audioContext =
                    new AudioContext();

            }


            if (
                audioContext.state ===
                "suspended"
            ) {

                audioContext.resume();

            }


            const now =
                audioContext.currentTime;


            /*
             * Pop قصير جدًا:
             * نغمة ناعمة تبدأ منخفضة
             * وتنتهي بسرعة.
             */

            const oscillator =
                audioContext.createOscillator();


            const gain =
                audioContext.createGain();


            oscillator.type =
                "sine";


            oscillator.frequency.setValueAtTime(
                430,
                now
            );


            oscillator.frequency.exponentialRampToValueAtTime(
                680,
                now + 0.055
            );


            oscillator.frequency.exponentialRampToValueAtTime(
                540,
                now + 0.10
            );


            gain.gain.setValueAtTime(
                0.0001,
                now
            );


            gain.gain.exponentialRampToValueAtTime(
                0.055,
                now + 0.008
            );


            gain.gain.exponentialRampToValueAtTime(
                0.018,
                now + 0.045
            );


            gain.gain.exponentialRampToValueAtTime(
                0.0001,
                now + 0.12
            );


            oscillator.connect(
                gain
            );


            gain.connect(
                audioContext.destination
            );


            oscillator.start(
                now
            );


            oscillator.stop(
                now + 0.125
            );

        } catch (error) {

            console.log(
                "Nawy sound:",
                error
            );

        }

    }


    /* =========================
       DATE
    ========================= */

    currentDate.textContent =
        new Intl.DateTimeFormat(
            "ar-EG",
            {
                weekday:
                    "long",

                day:
                    "numeric",

                month:
                    "long"
            }
        ).format(
            new Date()
        );


    /* =========================
       STORAGE
    ========================= */

    function loadTasks() {

        try {

            const saved =
                JSON.parse(
                    localStorage.getItem(
                        STORAGE_KEY
                    )
                );


            if (
                Array.isArray(saved)
            ) {

                return saved;

            }


            const old =
                JSON.parse(
                    localStorage.getItem(
                        "nawy_tasks_v3"
                    )
                );


            return Array.isArray(old)
                ? old
                : [];


        } catch {

            return [];

        }

    }


    function save() {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(
                tasks
            )
        );

    }


    /* =========================
       INPUT
    ========================= */

    taskInput.addEventListener(
        "input",
        () => {

            autoResize();

            updateSubmitButton();

        }
    );


    /*
     * Enter = addTask
     */
    taskInput.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                addTask();

            }

        }
    );


    /*
     * Arrow = addTask
     */
    submitBtn.addEventListener(
        "click",
        () => {

            addTask();

        }
    );


    function autoResize() {

        taskInput.style.height =
            "auto";


        taskInput.style.height =
            Math.min(
                taskInput.scrollHeight,
                110
            ) + "px";

    }


    function updateSubmitButton() {

        const hasText =
            taskInput.value
                .trim()
                .length > 0;


        submitBtn.classList.toggle(
            "active",
            hasText
        );


        submitBtn.disabled =
            !hasText ||
            isAddingTask;

    }


    /* =========================
       ADD TASK
    ========================= */

    function addTask() {

        if (
            isAddingTask
        ) {

            return;

        }


        const text =
            taskInput.value.trim();


        if (!text) {

            updateSubmitButton();

            return;

        }


        isAddingTask =
            true;


        updateSubmitButton();


        const now =
            Date.now();


        tasks.unshift({

            id:
                now,

            text:
                text,

            completed:
                false,

            starred:
                false,

            createdAt:
                now

        });


        save();

        render();


        /*
         * صوت الإضافة
         */
        playAddSound();


        taskInput.value =
            "";


        taskInput.style.height =
            "42px";


        isAddingTask =
            false;


        updateSubmitButton();


        /*
         * إبقاء المؤشر جاهزًا
         */
        taskInput.focus();

    }


    /* =========================
       COMPLETE
    ========================= */

    function toggleTask(id) {

        const task =
            tasks.find(
                item =>
                    item.id === id
            );


        if (!task) {

            return;

        }


        task.completed =
            !task.completed;


        save();

        render();

    }


    /* =========================
       STAR
    ========================= */

    function toggleStar(
        id,
        event
    ) {

        event.stopPropagation();


        const task =
            tasks.find(
                item =>
                    item.id === id
            );


        if (!task) {

            return;

        }


        task.starred =
            !task.starred;


        tasks.sort(
            (a, b) =>
                Number(b.starred) -
                Number(a.starred)
        );


        save();

        render();

    }


    /* =========================
       DELETE
    ========================= */

    function deleteTask(
        id,
        event
    ) {

        event.stopPropagation();


        tasks =
            tasks.filter(
                task =>
                    task.id !== id
            );


        save();

        render();

    }


    /* =========================
       RENDER
    ========================= */

    function render() {

        updateProgress();


        if (!tasks.length) {

            tasksContainer.innerHTML = `

                <div class="empty">

                    <div class="empty-icon">
                        ✨
                    </div>

                    <strong>
                        لسه مفيش نوايا
                    </strong>

                    <span>
                        اكتب أول حاجة ناوي تعملها النهارده
                    </span>

                </div>

            `;

            return;

        }


        tasksContainer.innerHTML =
            tasks.map(
                task => `

                <article
                    class="task ${
                        task.completed
                            ? "completed"
                            : ""
                    }"
                    onclick="toggleTask(${task.id})"
                >

                    <div
                        class="check"
                        aria-hidden="true">
                    </div>


                    <div class="task-main">

                        <div class="task-title">

                            ${escapeHtml(
                                task.text
                            )}

                        </div>

                    </div>


                    <div class="task-actions">

                        <button
                            type="button"
                            class="icon-btn ${
                                task.starred
                                    ? "starred"
                                    : ""
                            }"
                            aria-label="تمييز"
                            onclick="toggleStar(
                                ${task.id},
                                event
                            )"
                        >

                            ${
                                task.starred
                                    ? "★"
                                    : "☆"
                            }

                        </button>


                        <button
                            type="button"
                            class="icon-btn delete"
                            aria-label="حذف"
                            onclick="deleteTask(
                                ${task.id},
                                event
                            )"
                        >

                            ×

                        </button>

                    </div>

                </article>

            `
            ).join("");

    }


    /* =========================
       PROGRESS
    ========================= */

    function updateProgress() {

        const total =
            tasks.length;


        const completed =
            tasks.filter(
                task =>
                    task.completed
            ).length;


        if (!total) {

            progressFill.style.width =
                "0%";


            progressText.textContent =
                "ابدأ أول نية";


            return;

        }


        const percent =
            Math.round(
                completed /
                total *
                100
            );


        progressFill.style.width =
            percent + "%";


        if (
            completed === total
        ) {

            progressText.textContent =
                "خلصت كل نواياك 🎉";

        }

        else if (
            completed === 0
        ) {

            progressText.textContent =
                `${total} ${
                    total === 1
                        ? "نية"
                        : "نوايا"
                }`;

        }

        else {

            progressText.textContent =
                `${completed} من ${total} منجزة`;

        }

    }


    /* =========================
       ESCAPE HTML
    ========================= */

    function escapeHtml(
        text
    ) {

        const div =
            document.createElement(
                "div"
            );


        div.textContent =
            text;


        return div.innerHTML;

    }


    /* =====================================================
       PWA INSTALL
       ===================================================== */

    let deferredInstallPrompt =
        null;


    function showInstallCard() {

        if (
            window.matchMedia(
                "(display-mode: standalone)"
            ).matches
        ) {

            return;

        }


        if (
            window.navigator.standalone ===
            true
        ) {

            return;

        }


        installCard.classList.add(
            "show"
        );

    }


    window.addEventListener(
        "beforeinstallprompt",
        event => {

            event.preventDefault();

            deferredInstallPrompt =
                event;

            showInstallCard();

        }
    );


    installBtn.addEventListener(
        "click",
        async () => {

            if (
                !deferredInstallPrompt
            ) {

                return;

            }


            deferredInstallPrompt.prompt();


            try {

                await deferredInstallPrompt.userChoice;

            } catch {}


            deferredInstallPrompt =
                null;


            installCard.classList.remove(
                "show"
            );

        }
    );


    installClose.addEventListener(
        "click",
        () => {

            installCard.classList.remove(
                "show"
            );

        }
    );


    window.addEventListener(
        "appinstalled",
        () => {

            deferredInstallPrompt =
                null;

            installCard.classList.remove(
                "show"
            );

        }
    );


    /* =====================================================
       SERVICE WORKER — AUTO UPDATE
    ===================================================== */

    if (
        "serviceWorker" in navigator
    ) {

        window.addEventListener(
            "load",
            async () => {

                try {

                    const registration =
                        await navigator
                            .serviceWorker
                            .register(
                                "./sw.js",
                                {
                                    updateViaCache:
                                        "none"
                                }
                            );


                    await registration.update();


                    registration.addEventListener(
                        "updatefound",
                        () => {

                            const newWorker =
                                registration.installing;


                            if (!newWorker) {

                                return;

                            }


                            newWorker.addEventListener(
                                "statechange",
                                () => {

                                    if (
                                        newWorker.state ===
                                        "installed" &&
                                        navigator
                                            .serviceWorker
                                            .controller
                                    ) {

                                        newWorker.postMessage(
                                            {
                                                type:
                                                    "SKIP_WAITING"
                                            }
                                        );

                                    }

                                }
                            );

                        }
                    );


                    navigator
                        .serviceWorker
                        .addEventListener(
                            "controllerchange",
                            () => {

                                if (
                                    window.__nawyReloaded
                                ) {

                                    return;

                                }


                                window.__nawyReloaded =
                                    true;


                                window.location.reload();

                            }
                        );


                } catch (error) {

                    console.log(
                        "Nawy SW:",
                        error
                    );

                }

            }
        );


        document.addEventListener(
            "visibilitychange",
            async () => {

                if (
                    document.visibilityState ===
                    "visible"
                ) {

                    try {

                        const registrations =
                            await navigator
                                .serviceWorker
                                .getRegistrations();


                        for (
                            const registration
                            of registrations
                        ) {

                            await registration.update();

                        }

                    } catch {}

                }

            }
        );

    }


    /* =========================
       START
    ========================= */

    render();

    updateSubmitButton();

</script></body></html>
